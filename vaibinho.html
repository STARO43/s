<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}

:root{
  --paper:#e8ecd8;
  --ink:#3d4a2a;
  --ink-soft:rgba(61,74,42,.35);
  --line:#3d4a2a;
  --slide-shade:rgba(40,50,25,.22);
  --slide-edge-c:rgba(61,74,42,.10);
  --cell:64px;
}
html,body{background:var(--paper);transition:background 1.6s ease}

#slide-stage{position:fixed;inset:0;z-index:5;overflow:hidden}
#slide-stage canvas{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  touch-action:none;
  will-change:transform;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
}
#slide-stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 55%,var(--slide-shade) 100%);
  transition:opacity .25s ease;z-index:6;
}
#slide-stage.dragging::after{opacity:1}

#slide-seam{
  position:fixed;top:0;bottom:0;width:160px;
  pointer-events:none;opacity:0;
  transform:translate3d(-9999px,0,0);
  will-change:transform,opacity;z-index:6;
  background:linear-gradient(to right,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,.05) 30%,
    rgba(0,0,0,.14) 50%,
    rgba(0,0,0,.05) 70%,
    rgba(0,0,0,0) 100%);
  mix-blend-mode:multiply;
}

#slide-edge{
  position:fixed;inset:0;pointer-events:none;opacity:0;
  transition:opacity .35s cubic-bezier(.25,.1,.25,1);z-index:6;
  background:linear-gradient(to right,
    var(--slide-edge-c) 0%,
    rgba(0,0,0,0) 14%,
    rgba(0,0,0,0) 86%,
    var(--slide-edge-c) 100%);
  mix-blend-mode:multiply;
}
#slide-edge.on{opacity:1}

#mode-btn{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  left:50%;
  width:var(--cell);height:var(--cell);
  margin-left:calc(var(--cell) / -2);
  border:none;background:transparent;padding:0;font-family:inherit;
  cursor:default;
  display:flex;align-items:center;justify-content:center;
  color:var(--line);z-index:10;
  overflow:visible;
  -webkit-user-select:none;user-select:none;
}
#mode-btn.hidden{display:none}
#mode-btn img{
  width:calc(var(--cell) * .94);
  height:calc(var(--cell) * .94);
  display:block;
  transform-origin:center center;
  opacity:0;
  filter:saturate(.6) brightness(.98) contrast(.92);
  -webkit-user-drag:none;
  user-select:none;
  will-change:transform,opacity;
}

#clear-btn{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  left:50%;
  width:var(--cell);height:var(--cell);
  margin-left:calc(var(--cell) / -2);
  border:none;background:transparent;padding:0;font-family:inherit;
  cursor:default;
  display:flex;align-items:center;justify-content:center;
  color:var(--line);z-index:11;
  opacity:0;pointer-events:none;
  -webkit-user-select:none;user-select:none;
  overflow:visible;
}
#clear-btn.hidden{display:none}
#clear-btn svg{
  width:100%;height:100%;display:block;overflow:visible;
  transform-origin:center center;
  will-change:transform,opacity;
}
#clear-btn svg path{
  fill:none;stroke:currentColor;
  stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8;
  vector-effect:non-scaling-stroke;opacity:.5;
  transform-origin:center;transform-box:fill-box;
  animation:spiralRotate 32s linear infinite;
}
@keyframes spiralRotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}

#end{
  position:fixed;inset:0;z-index:100;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:32px;opacity:0;pointer-events:none;
  transition:opacity 1.6s cubic-bezier(.25,.1,.25,1),background 1.6s ease;
}
#end.visible{opacity:1;pointer-events:auto}
#end-row{display:flex;align-items:center;gap:18px}
#end-icon{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
#end-icon img{
  width:48px;height:48px;display:block;
  filter:saturate(.6) brightness(.98) contrast(.92);
  opacity:.8;
}
#end-time{
  font-size:56px;font-weight:200;letter-spacing:-2px;
  color:var(--ink);font-variant-numeric:tabular-nums;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Georgia,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
#end-platform{font-size:26px;line-height:1;opacity:.55;filter:saturate(.55) brightness(.95)}

#end-stats{
  display:flex;align-items:center;gap:28px;margin-top:-6px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Georgia,sans-serif;
}
.stat{
  display:flex;align-items:center;gap:8px;
  color:var(--ink-soft);
  font-size:18px;font-weight:300;letter-spacing:.5px;opacity:.75;
}
.stat svg{
  width:20px;height:20px;display:block;
  color:var(--ink-soft);stroke:currentColor;stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85;
}
.stat .spin{animation:statSpin 8s linear infinite}
@keyframes statSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.stat .count{font-variant-numeric:tabular-nums;color:var(--ink);opacity:.8;font-weight:400}

#end-restart{
  margin-top:20px;border:none;background:transparent;
  color:var(--ink-soft);padding:12px;border-radius:100px;cursor:pointer;
  border:1px solid var(--ink-soft);opacity:.5;
  transition:opacity .8s ease,transform .3s ease;
  display:flex;align-items:center;justify-content:center;
  width:48px;height:48px;
}
#end-restart:active{opacity:1;transform:scale(.92)}
#end-restart svg{width:20px;height:20px}

@media(max-width:500px){
  #end-time{font-size:44px;letter-spacing:-1px}
  #end-icon{width:44px;height:44px}
  #end-icon img{width:38px;height:38px}
  #end-platform{font-size:22px}
  #end-stats{gap:18px}
  .stat{font-size:16px}
  .stat svg{width:18px;height:18px}
}
</style>

<script>
'use strict';

const OPENMOJI_BASE = 'emoji/';
const imgCache = new Map();

function getEmojiUrl(hex){
  return OPENMOJI_BASE + hex.toUpperCase() + '.png';
}

function getEmojiImage(hex){
  let img = imgCache.get(hex);
  if(img) return img;
  img = new Image();
  img.src = getEmojiUrl(hex);
  imgCache.set(hex, img);
  return img;
}

const FULL_POOL = {
  meadow: [
    '1F331','1F340','1F33E','1F338','1F33C','1F337','1F33B',
    '1F33A','1F339','1F98B','1F41E','1F997','1F426','1F33F'
  ],
  forest: [
    '1F332','1F333','1F344','1F341','1F41C','1FAB2','1F98C','1F986','1F994',
    '1F43F','1F407','1F9A8','1F9A1','1F9A2','1F40D','1F40C','1F401','1F9AB'
  ],
  sea: [
    '1F433','1F42C','1F420','1F9AD','1F419','1F980','1F990','1FABC',
    '1F422','1F988'
  ],
  faces: [
    '1F98A','1F43A','1F43B','1F43C','1F439','1F430','1F431','1F436',
    '1F437','1F42E','1F42D','1F438'
  ],
  fruits: [
    '1F34E','1F34F','1F350','1F34A','1F34B','1F34C','1F349','1F347',
    '1F353','1F352','1FAD1'
  ],
  poop: ['1F4A9','1F9FB']
};

const REQUIRED = {
  meadow: ['1F338','1F33C','1F337','1F33B','1F33A','1F339'],
  forest: ['1F332','1F333','1F344','1F341']
};

const CATS = {
  meadow: [],
  forest: [],
  sea:    [],
  faces:  [],
  fruits: []
};

let poopMode = false;

const POOL_SIZE = 10;

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function pickRandomPool(cat){
  const full = FULL_POOL[cat] || [];
  const required = REQUIRED[cat] || [];
  const selected = new Set(required);

  const rest = full.filter(hex => !selected.has(hex));
  const shuffledRest = shuffle(rest);

  for(const hex of shuffledRest){
    if(selected.size >= POOL_SIZE) break;
    selected.add(hex);
  }

  CATS[cat] = Array.from(selected);
  return CATS[cat];
}

function activePool(){
  if(poopMode) return FULL_POOL.poop;
  return CATS[currentCat];
}

function preloadAllEmoji(){
  Object.values(FULL_POOL).forEach(pool => {
    pool.forEach(hex => getEmojiImage(hex));
  });
}

function makeSpiralPath(cx, cy, a, b, turns){
  const steps = 300;
  const maxTheta = turns * 2 * Math.PI;
  let d = '';
  for(let i = 0; i <= steps; i++){
    const theta = (i / steps) * maxTheta;
    const r = a + b * theta;
    const x = cx + r * Math.cos(theta);
    const y = cy + r * Math.sin(theta);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2);
    if(i < steps) d += ' ';
  }
  return d;
}

const ORDER = ['meadow', 'forest', 'sea', 'faces', 'fruits'];

const MODE_ICON_HEX = {
  meadow: '1F33F',
  forest: '1F332',
  sea:    '1F420',
  faces:  '1F431',
  fruits: '1F34E'
};

const END_ICON_HEX = {
  meadow: '1F33F',
  forest: '1F344',
  sea:    '1F433',
  faces:  '1F431',
  fruits: '1F34E'
};

const THEMES = {
  meadow: {
    base:'#e6ecd2', horizon:'#f0eed8', sky:'#f8f4dc', ground:'#b8c99a',
    bloom:'rgba(255,240,200,0.35)', vignette:'rgba(90,120,60,0.14)',
    ink:'#3e4a2c', inkSoft:'rgba(62,74,44,.38)', grain:[110,140,80]
  },
  forest: {
    base:'#e5d4bb', horizon:'#efe0c5', sky:'#f5ead0', ground:'#a8895f',
    bloom:'rgba(255,215,160,0.32)', vignette:'rgba(90,60,30,0.16)',
    ink:'#4a3826', inkSoft:'rgba(74,56,38,.38)', grain:[120,90,55]
  },
  sea: {
    base:'#d6e4ea', horizon:'#e6eef2', sky:'#f0f6f8', ground:'#8fb2c4',
    bloom:'rgba(210,235,245,0.4)', vignette:'rgba(60,90,110,0.16)',
    ink:'#2d3f4a', inkSoft:'rgba(45,63,74,.38)', grain:[80,110,130]
  },
  faces: {
    base:'#f5e8a8', horizon:'#fbf1c2', sky:'#fdf7d6', ground:'#ddc072',
    bloom:'rgba(255,250,175,0.5)', vignette:'rgba(170,150,60,0.14)',
    ink:'#4a3f18', inkSoft:'rgba(74,63,24,.38)', grain:[170,148,65]
  },
  fruits: {
    base:'#f0e4c4', horizon:'#f6e8c8', sky:'#fbf2d6', ground:'#d4b578',
    bloom:'rgba(255,240,190,0.45)', vignette:'rgba(150,120,70,0.15)',
    ink:'#4a3c1c', inkSoft:'rgba(74,60,28,.38)', grain:[150,120,70]
  },
  poop: {
    base:'#1a1814', horizon:'#1e1c18', sky:'#252220', ground:'#0f0d0a',
    bloom:'rgba(70,60,45,0.25)', vignette:'rgba(0,0,0,0.5)',
    ink:'#e8e0d0', inkSoft:'rgba(232,224,208,.3)', grain:[190,180,165]
  }
};

function currentThemeKey(){
  if(poopMode) return 'poop';
  return currentCat;
}

function applyThemeVars(){
  const t = THEMES[currentThemeKey()] || THEMES.meadow;
  const root = document.documentElement;

  root.style.setProperty('--paper',    t.base);
  root.style.setProperty('--ink',      t.ink);
  root.style.setProperty('--ink-soft', t.inkSoft);
  root.style.setProperty('--line',     t.ink);
  root.style.setProperty('--slide-shade',
    currentThemeKey() === 'poop' ? 'rgba(0,0,0,.55)' : 'rgba(40,50,25,.22)');
  root.style.setProperty('--slide-edge-c',
    currentThemeKey() === 'poop' ? 'rgba(0,0,0,.55)' : hexToRgba(t.ink, .10));

  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t.base);
}

let noiseTileCache = new Map();

function makeNoiseTile(grainRGB, isDark){
  const size = 96;
  const tile = document.createElement('canvas');
  tile.width = tile.height = size;
  const tctx = tile.getContext('2d');
  const img = tctx.createImageData(size, size);
  const d = img.data;
  const [baseR, baseG, baseB] = grainRGB;
  const alpha = isDark ? 12 : 18;
  for(let i = 0; i < d.length; i += 4){
    const shift = (Math.random() * 60) | 0;
    d[i]   = baseR + shift;
    d[i+1] = baseG + shift;
    d[i+2] = baseB + shift;
    d[i+3] = alpha;
  }
  tctx.putImageData(img, 0, 0);
  return tile;
}
function getNoiseTile(grainRGB, isDark){
  const key = grainRGB.join(',') + (isDark ? 'D' : 'L');
  if(!noiseTileCache.has(key)){
    noiseTileCache.set(key, makeNoiseTile(grainRGB, isDark));
  }
  return noiseTileCache.get(key);
}

let canvas, ctx, paperCanvas, paperCtx;
let W, H, CELL, OX, OY, GRID_X, GRID_Y;
let grid, currentCat = 'meadow';
let audioCtx = null, locked = false, animating = false;
let animPhase = null, needsDraw = true;
let startTime = 0, gameActive = false;
let popAnims = new Map();
let lastHover = -1;
let swapCount = 0;
let manualCount = 0;
let lastRemovedCount = 0;
let DPR = Math.min(devicePixelRatio || 1, 2);
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || matchMedia('(pointer:coarse)').matches;

const EMOJI_ALPHA = 0.62;

const POP_DURATION = (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || matchMedia('(pointer:coarse)').matches) ? 700 : 2000;
const POP_EASE_OUT = t => 1 - Math.pow(1 - t, 3);
const POP_SCALE_FROM = 0.6;
const POP_BLEED = 0.8;

let clearBtn = null;
let clearBtnBusy = false;

let isPointerDown = false;
let lastPaintedIdx = -1;
const paintedDuringSwipe = new Set();

let rafRunning = false;
function startRaf(){
  if(rafRunning) return;
  rafRunning = true;
  requestAnimationFrame(raf);
}

const SLIDE = {
  minDist: 70,
  maxVert: 38,
  edgeSafe: 24,
  rubber: 0.42,
  fireRatio: 0.22,
  dur: 460
};

let slideStage, slideEdge, slideSeam;
let slideState = null;
let slideAnimating = false;
let touchIdSlide = null;
let mouseDownSlide = false;
let incomingPreview = null;
let modeOutPromise = null;

function slideInit(){
  slideStage = document.getElementById('slide-stage');
  slideEdge  = document.getElementById('slide-edge');
  slideSeam  = document.getElementById('slide-seam');
  ensureSlideLayers();
}

function getCanvasMain(){
  return document.getElementById('field');
}

function ensureSlideLayers(){
  let next = slideStage.querySelector('#slide-next');
  if(!next){
    next = document.createElement('canvas');
    next.id = 'slide-next';
    next.style.opacity = '0';
    next.style.transform = 'translate3d(100%,0,0)';
    next.style.zIndex = '1';
    slideStage.appendChild(next);
    const c = getCanvasMain();
    if(c) c.style.zIndex = '2';
  }
  return next;
}

function getCanvasNext(){
  return ensureSlideLayers();
}

function buildIncomingPreview(dir){
  const i = ORDER.indexOf(currentCat);
  const nextCat = ORDER[(i + dir + ORDER.length) % ORDER.length];

  const next = getCanvasNext();
  next.width  = Math.floor(W * DPR);
  next.height = Math.floor(H * DPR);
  next.style.width = W + 'px';
  next.style.height = H + 'px';
  const nctx = next.getContext('2d', {alpha:false});
  nctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  paintPaper(nctx, nextCat, true);

  incomingPreview = { cat: nextCat, dir };
  return incomingPreview;
}

function isFreeZone(x, y){
  if(x < OX - 4) return true;
  if(x > OX + CELL*GRID_X + 4) return true;
  if(y < OY - 4) return true;
  if(y > OY + CELL*GRID_Y + 4) return true;
  return false;
}

function slideCanStart(x, y){
  if(!gameActive || animating || slideAnimating) return false;
  if(!isFreeZone(x, y)) return false;
  if(x < SLIDE.edgeSafe) return false;
  if(x > W - SLIDE.edgeSafe) return false;
  return true;
}

function slideBegin(x, y){
  slideState = {
    startX: x, startY: y,
    dx: 0, dy: 0,
    axis: null,
    from: currentCat,
    previewReady: false,
    dir: 1
  };
}

function updateSeam(seamX){
  if(!slideSeam) return;
  const half = slideSeam.offsetWidth / 2 || 80;
  slideSeam.style.transform = `translate3d(${seamX - half}px,0,0)`;
  slideSeam.style.opacity = '1';
}

function hideSeam(){
  if(!slideSeam) return;
  slideSeam.style.opacity = '0';
}

/* ==========================================================
   АНИМАЦИИ КНОПКИ РЕЖИМОВ — Web Animations API
   ========================================================== */

let modeSwayAnim = null;

function stopModeSway(){
  if(modeSwayAnim){
    try{ modeSwayAnim.cancel(); }catch(e){}
    modeSwayAnim = null;
  }
}

function startModeSway(){
  const img = document.getElementById('mode-icon');
  if(!img) return;
  stopModeSway();
  try{
    modeSwayAnim = img.animate([
      {transform:'rotate(-3deg)'},
      {transform:'rotate(3deg)'},
      {transform:'rotate(-3deg)'}
    ], {
      duration: 5000,
      iterations: Infinity,
      easing: 'ease-in-out'
    });
  }catch(e){}
}

function flyOutModeIcon(){
  const img = document.getElementById('mode-icon');
  if(!img) return Promise.resolve();

  if(img.getAnimations) img.getAnimations().forEach(a => { try{ a.cancel(); }catch(e){} });
  stopModeSway();

  img.style.transform = 'translate3d(0,0,0) scale(1) rotate(0deg)';
  img.style.opacity = '.62';

  try{
    const anim = img.animate([
      {transform:'translate3d(0,0,0) scale(1) rotate(0deg)',        opacity:.62, offset:0},
      {transform:'translate3d(0,-16%,0) scale(1.05) rotate(-4deg)', opacity:.62, offset:.3},
      {transform:'translate3d(0,-180%,0) scale(.5) rotate(-26deg)', opacity:0,   offset:1}
    ], {
      duration: 10000,
      easing: 'cubic-bezier(.55,0,.7,.4)',
      fill: 'forwards'
    });
    return new Promise(resolve => {
      anim.onfinish = () => {
        img.style.transform = 'translate3d(0,-180%,0) scale(.5) rotate(-26deg)';
        img.style.opacity = '0';
        resolve();
      };
    });
  }catch(e){
    img.style.transform = 'translate3d(0,-180%,0) scale(.5) rotate(-26deg)';
    img.style.opacity = '0';
    return Promise.resolve();
  }
}

function flyInModeIcon(){
  const img = document.getElementById('mode-icon');
  if(!img) return;

  if(img.getAnimations) img.getAnimations().forEach(a => { try{ a.cancel(); }catch(e){} });
  stopModeSway();

  img.style.transform = 'translate3d(0,-180%,0) scale(.5) rotate(26deg)';
  img.style.opacity = '0';

  try{
    const anim = img.animate([
      {transform:'translate3d(0,-180%,0) scale(.5) rotate(26deg)',  opacity:0,   offset:0},
      {transform:'translate3d(0,5%,0) scale(1.06) rotate(-4deg)',   opacity:.6,  offset:.45},
      {transform:'translate3d(0,-1.5%,0) scale(.98) rotate(2deg)',  opacity:.6,  offset:.7},
      {transform:'translate3d(0,.4%,0) scale(1.005) rotate(-.8deg)',opacity:.62, offset:.88},
      {transform:'translate3d(0,0,0) scale(1) rotate(0deg)',        opacity:.62, offset:1}
    ], {
      duration: 10000,
      easing: 'cubic-bezier(.22,1.05,.32,1)',
      fill: 'forwards'
    });
    anim.onfinish = () => {
      img.style.transform = 'translate3d(0,0,0) scale(1) rotate(0deg)';
      img.style.opacity = '.62';
      startModeSway();
    };
  }catch(e){
    img.style.transform = 'translate3d(0,0,0) scale(1) rotate(0deg)';
    img.style.opacity = '.62';
    startModeSway();
  }
}

let clearSvgAnim = null;

function hideClearBtn(){
  const clr = document.getElementById('clear-btn');
  if(!clr) return;
  if(clearSvgAnim){ try{ clearSvgAnim.cancel(); }catch(e){} clearSvgAnim = null; }
  clr.classList.add('hidden');
  clr.style.opacity = '0';
  clr.style.pointerEvents = 'none';
}

function showClearBtn(){
  const btn = document.getElementById('mode-btn');
  const clr = document.getElementById('clear-btn');
  if(!clr) return;

  if(btn) btn.classList.add('hidden');
  clr.classList.remove('hidden');

  clr.style.opacity = '1';
  clr.style.pointerEvents = 'auto';

  const svg = clr.querySelector('svg');
  if(!svg) return;

  if(svg.getAnimations) svg.getAnimations().forEach(a => { try{ a.cancel(); }catch(e){} });

  svg.style.transform = 'scale(.4) rotate(-90deg)';
  svg.style.opacity = '0';

  try{
    clearSvgAnim = svg.animate([
      {transform:'scale(.4) rotate(-90deg)',  opacity:0,   offset:0},
      {transform:'scale(1.06) rotate(12deg)', opacity:.6,  offset:.45},
      {transform:'scale(.98) rotate(-3deg)',  opacity:.55, offset:.7},
      {transform:'scale(1.01) rotate(1.2deg)',opacity:.52, offset:.88},
      {transform:'scale(1) rotate(0deg)',     opacity:1,   offset:1}
    ], {
      duration: 320,
      easing: 'cubic-bezier(.2,1.05,.3,1)',
      fill: 'forwards'
    });
    clearSvgAnim.onfinish = () => {
      svg.style.transform = 'scale(1) rotate(0deg)';
      svg.style.opacity = '1';
    };
  }catch(e){
    svg.style.transform = 'scale(1) rotate(0deg)';

function slideMove(x, y){
  if(!slideState) return false;
  const dx = x - slideState.startX;
  const dy = y - slideState.startY;
  slideState.dx = dx; slideState.dy = dy;

  if(!slideState.axis){
    if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.4){
      slideState.axis = 'h';
    } else if(Math.abs(dy) > 10){
      slideState.axis = 'v';
      slideState = null;
      return false;
    } else {
      return false;
    }
  }
  if(slideState.axis !== 'h') return false;

  const wantDir = dx > 0 ? -1 : 1;
  if(!slideState.previewReady || wantDir !== slideState.dir){
    buildIncomingPreview(wantDir);
    slideState.dir = wantDir;
    slideState.previewReady = true;
    slideEdge && slideEdge.classList.add('on');
    slideStage.classList.add('dragging');
    hideClearBtn();
    modeOutPromise = flyOutModeIcon();
  }

  const raw = dx * SLIDE.rubber;
  const max = W * 0.9;
  const clamped = Math.max(-max, Math.min(max, raw));

  const cur = getCanvasMain();
  cur.style.transform = `translate3d(${clamped}px,0,0)`;

  const next = getCanvasNext();
  const from = slideState.dir === 1 ? W : -W;
  const nextX = from + clamped;
  next.style.opacity = '1';
  next.style.transform = `translate3d(${nextX}px,0,0)`;

  const seamPos = clamped + (slideState.dir === 1 ? W : 0);
  updateSeam(seamPos);

  return true;
}

function slideEnd(){
  if(!slideState){ return false; }
  const st = slideState;
  slideState = null;

  if(!st.previewReady){
    return false;
  }

  const threshold = W * SLIDE.fireRatio;
  const shouldFire = Math.abs(st.dx) >= Math.min(threshold, SLIDE.minDist * 4);
  const wasFlick = Math.abs(st.dx) > SLIDE.minDist && Math.abs(st.dy) < SLIDE.maxVert;

  const fire = shouldFire || wasFlick;

  if(fire){
    slideFinish(st.dir);
  } else {
    slideCancel(st.dir);
  }
  return true;
}

function slideFinish(dir){
  slideAnimating = true;
  const cur = getCanvasMain();
  const next = getCanvasNext();

  const targetCurX = dir === 1 ? -W : W;

  const t0 = performance.now();
  const dur = SLIDE.dur;
  const ease = t => 1 - Math.pow(1 - t, 4);

  function frame(){
    const t = Math.min((performance.now() - t0) / dur, 1);
    const e = ease(t);

    const curX = targetCurX * e;
    const nextX = (1 - e) * (dir === 1 ? W : -W);

    cur.style.transform = `translate3d(${curX}px,0,0)`;
    next.style.transform = `translate3d(${nextX}px,0,0)`;
    next.style.opacity = '1';

    const seamPos = curX + (dir === 1 ? W : 0);
    updateSeam(seamPos);

    if(t < 1){
      requestAnimationFrame(frame);
    } else {
          hideSeam();
      modeOutPromise = null;
      document.getElementById('mode-btn').classList.remove('hidden');
      commitSlide(dir);
    }
  }
  requestAnimationFrame(frame);
}

function slideCancel(dir){
  slideAnimating = true;
  const cur = getCanvasMain();
  const next = getCanvasNext();

  const fromCur = parseTranslateX(cur.style.transform);
  const fromNext = parseTranslateX(next.style.transform);

  const t0 = performance.now();
  const dur = 280;
  const ease = t => 1 - Math.pow(1 - t, 3);

  function frame(){
    const t = Math.min((performance.now() - t0) / dur, 1);
    const e = ease(t);
    const curX = fromCur * (1 - e);
    const nextX = fromNext * (1 - e);

    cur.style.transform = `translate3d(${curX}px,0,0)`;
    next.style.transform = `translate3d(${nextX}px,0,0)`;

    const seamPos = curX + (dir === 1 ? W : 0);
    updateSeam(seamPos);

    if(t < 1) requestAnimationFrame(frame);
    else {
      cur.style.transform = 'translate3d(0,0,0)';
      next.style.opacity = '0';
      next.style.transform = `translate3d(${dir === 1 ? W : -W}px,0,0)`;
      slideStage.classList.remove('dragging');
      slideEdge && slideEdge.classList.remove('on');
      hideSeam();
      slideAnimating = false;
      incomingPreview = null;
      modeOutPromise = null;
      flyInModeIcon();
      needsDraw = true;
      startRaf();
    }
  }
  requestAnimationFrame(frame);
}

function commitSlide(dir){
  const preview = incomingPreview;
  if(!preview){ slideCancel(dir); return; }

  if(poopMode){ poopMode = false; }
  currentCat = preview.cat;
  pickRandomPool(currentCat);

  buildPaper();
  applyThemeVars();
  updateModeIcon();
  resetGameState();
  hideClearBtn();
  updateModeIcon();

  const cur = getCanvasMain();
  const next = getCanvasNext();

  cur.style.transform = 'translate3d(0,0,0)';
  renderStaticNow();

  next.style.opacity = '0';
  next.style.transform = `translate3d(${dir === 1 ? W : -W}px,0,0)`;

  slideStage.classList.remove('dragging');
  slideEdge && slideEdge.classList.remove('on');
  hideSeam();

  incomingPreview = null;
  slideAnimating = false;
  needsDraw = false;
  modeOutPromise = null;

  flyInModeIcon();
}

function parseTranslateX(tr){
  const m = /translate3d\(\s*(-?[\d.]+)px/.exec(tr || '');
  return m ? parseFloat(m[1]) : 0;
}

function slideTouchStart(e){
  if(slideAnimating) return;
  const t = e.touches[0];
  if(!t) return;
  if(!slideCanStart(t.clientX, t.clientY)) return;
  touchIdSlide = t.identifier;
  slideBegin(t.clientX, t.clientY);
}

function slideTouchMove(e){
  if(!slideState) return;
  let t = null;
  for(let i = 0; i < e.touches.length; i++){
    if(e.touches[i].identifier === touchIdSlide){ t = e.touches[i]; break; }
  }
  if(!t){ slideEnd(); return; }
  const consumed = slideMove(t.clientX, t.clientY);
  if(consumed) e.preventDefault();
}

function slideTouchEnd(e){
  if(!slideState) return;
  slideEnd();
  touchIdSlide = null;
}

function slideMouseDown(e){
  if(slideAnimating) return;
  if(e.button !== 0) return;
  if(!slideCanStart(e.clientX, e.clientY)) return;
  mouseDownSlide = true;
  slideBegin(e.clientX, e.clientY);
}

function slideMouseMove(e){
  if(!mouseDownSlide || !slideState) return;
  slideMove(e.clientX, e.clientY);
}

function slideMouseUp(e){
  if(!mouseDownSlide) return;
  mouseDownSlide = false;
  slideEnd();
}

function programmaticSlide(dir){
  if(slideAnimating || slideState || animating) return;
  slideAnimating = true;

  const cur = getCanvasMain();
  const next = getCanvasNext();

  let targetCat;
  let fromPoop = false;
  if(poopMode){
    targetCat = 'meadow';
    fromPoop = true;
  } else {
    const i = ORDER.indexOf(currentCat);
    targetCat = ORDER[(i + dir + ORDER.length) % ORDER.length];
  }

  next.width  = Math.floor(W * DPR);
  next.height = Math.floor(H * DPR);
  next.style.width = W + 'px';
  next.style.height = H + 'px';
  const nctx = next.getContext('2d', {alpha:false});
  nctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintPaper(nctx, targetCat, true);

  slideEdge && slideEdge.classList.add('on');
  slideStage.classList.add('dragging');
  hideClearBtn();

  modeOutPromise = flyOutModeIcon();

  const targetCurX = dir === 1 ? -W : W;
  const startNextX = dir === 1 ? W : -W;

  const t0 = performance.now();
  const dur = SLIDE.dur;
  const ease = t => 1 - Math.pow(1 - t, 4);

  next.style.opacity = '1';
  next.style.transform = `translate3d(${startNextX}px,0,0)`;

  function frame(){
    const t = Math.min((performance.now() - t0) / dur, 1);
    const e = ease(t);

    const curX = targetCurX * e;
    const nextX = (1 - e) * startNextX;

    cur.style.transform = `translate3d(${curX}px,0,0)`;
    next.style.transform = `translate3d(${nextX}px,0,0)`;

    const seamPos = curX + (dir === 1 ? W : 0);
    updateSeam(seamPos);

    if(t < 1){
      requestAnimationFrame(frame);
    } else {
      hideSeam();

      if(fromPoop){
        poopMode = false;
        currentCat = 'meadow';
      } else {
        currentCat = targetCat;
      }
      pickRandomPool(currentCat);
      buildPaper();
      applyThemeVars();
      resetGameState();
      hideClearBtn();

      updateModeIcon();

      cur.style.transform = 'translate3d(0,0,0)';
      renderStaticNow();

      next.style.opacity = '0';
      next.style.transform = `translate3d(${startNextX}px,0,0)`;

      slideStage.classList.remove('dragging');
      slideEdge && slideEdge.classList.remove('on');

       slideAnimating = false;
      needsDraw = false;

      modeOutPromise = null;
      document.getElementById('mode-btn').classList.remove('hidden');
      flyInModeIcon();
    }
  }
  requestAnimationFrame(frame);
}

function init(){
  canvas = document.getElementById('field');
  ctx = canvas.getContext('2d', {alpha:false});
  clearBtn = document.getElementById('clear-btn');

  const spiral = document.getElementById('spiral-path');
  if(spiral) spiral.setAttribute('d', makeSpiralPath(50, 50, 1, 1.02, 6));

  const plat = document.getElementById('end-platform');
  if(plat) plat.textContent = IS_MOBILE ? '📱' : '🖥️';

  slideInit();
  preloadAllEmoji();
  pickRandomPool(currentCat);
  resize();
  buildPaper();
  bindEvents();
  updateModeIcon();
  applyThemeVars();
  resetGameState();
  hideClearBtn();
  document.getElementById('mode-btn').classList.remove('hidden');
  flyInModeIcon();
  startRaf();

  setTimeout(() => {
    slideEdge.classList.add('on');
    setTimeout(() => slideEdge.classList.remove('on'), 1400);
  }, 900);
}

function resize(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if(IS_MOBILE){
    GRID_X = 5;
    GRID_Y = 7;
  } else {
    GRID_X = 12;
    GRID_Y = 7;
  }

  const padTop = IS_MOBILE ? 92 : 118;
  const padBot = IS_MOBILE ? 12 : 28;
  const padSide = IS_MOBILE ? 8 : 28;

  const availH = H - padTop - padBot;
  const availW = W - padSide * 2;
  CELL = Math.min(availW / GRID_X, availH / GRID_Y);
  OX = (W - CELL * GRID_X) / 2;
  OY = padTop + (availH - CELL * GRID_Y) / 2;

  grid = Array.from({length:GRID_Y}, () => Array(GRID_X).fill(null));

  document.documentElement.style.setProperty('--cell', CELL + 'px');
}

function paintPaper(p, key, preview){
  const t = THEMES[key] || THEMES.meadow;
  const isDark = key === 'poop';

  p.fillStyle = t.base;
  p.fillRect(0, 0, W, H);

  if(t.sky){
    const sky = p.createRadialGradient(
      W * 0.5, -H * 0.2, 0,
      W * 0.5, -H * 0.2, Math.max(W, H) * 1.0
    );
    sky.addColorStop(0, t.sky);
    sky.addColorStop(0.5, hexToRgba(t.sky, isDark ? 0.4 : 0.5));
    sky.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = sky;
    p.fillRect(0, 0, W, H);
  }

  if(t.horizon){
    const horizon = p.createLinearGradient(0, H * 0.25, 0, H * 0.75);
    horizon.addColorStop(0, hexToRgba(t.horizon, 0));
    horizon.addColorStop(0.5, hexToRgba(t.horizon, isDark ? 0.15 : 0.22));
    horizon.addColorStop(1, hexToRgba(t.horizon, 0));
    p.fillStyle = horizon;
    p.fillRect(0, 0, W, H);
  }

  if(t.ground){
    const ground = p.createRadialGradient(
      W * 0.5, H * 1.15, 0,
      W * 0.5, H * 1.15, Math.max(W, H) * 0.8
    );
    ground.addColorStop(0, hexToRgba(t.ground, isDark ? 0.7 : 0.55));
    ground.addColorStop(0.55, hexToRgba(t.ground, isDark ? 0.3 : 0.22));
    ground.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = ground;
    p.fillRect(0, 0, W, H);
  }

  if(t.bloom){
    const bloom = p.createRadialGradient(
      -W * 0.1, H * 0.9, 0,
      -W * 0.1, H * 0.9, Math.max(W, H) * 0.85
    );
    bloom.addColorStop(0, t.bloom);
    bloom.addColorStop(0.6, hexToRgba(t.bloom, 0.08));
    bloom.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = bloom;
    p.fillRect(0, 0, W, H);
  }

  const grainRGB = t.grain || [130, 100, 65];
  const tile = getNoiseTile(grainRGB, isDark);
  const pattern = p.createPattern(tile, 'repeat');
  if(pattern){
    p.fillStyle = pattern;
    p.fillRect(0, 0, W, H);
  }

  if(!preview){
    const grainCount = IS_MOBILE ? 70 : 300;
    for(let i = 0; i < grainCount; i++){
      const x = Math.random() * W;
      const y = Math.random() * H;
      const a = Math.random() * 0.045;
      p.fillStyle = isDark
        ? `rgba(232,224,208,${a})`
        : `rgba(${grainRGB[0]},${grainRGB[1]},${grainRGB[2]},${a})`;
      p.fillRect(x, y, 1.5, 1.5);
    }
  }

  if(t.vignette){
    const vignette = p.createRadialGradient(
      W * 0.5, H * 0.5, Math.min(W, H) * 0.5,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.85
    );
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, t.vignette);
    p.fillStyle = vignette;
    p.fillRect(0, 0, W, H);
  }
}

function buildPaper(){
  if(!paperCanvas){
    paperCanvas = document.createElement('canvas');
    paperCtx = paperCanvas.getContext('2d', {alpha:false});
  }
  paperCanvas.width = Math.floor(W * DPR);
  paperCanvas.height = Math.floor(H * DPR);
  paperCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintPaper(paperCtx, currentThemeKey(), false);
}

function hexToRgba(hex, alpha){
  if(!hex) return 'rgba(0,0,0,0)';
  if(hex.startsWith('rgba') || hex.startsWith('rgb')) return hex;
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function bindEvents(){
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('mouseleave', onUp);

  canvas.addEventListener('touchstart', onTouchStart, {passive:false});
  canvas.addEventListener('touchmove',  onTouchMove,  {passive:false});
  canvas.addEventListener('touchend',   onTouchEnd,   {passive:false});
  canvas.addEventListener('touchcancel',onTouchEnd,   {passive:false});

  canvas.addEventListener('touchstart', slideTouchStart, {passive:false});
  canvas.addEventListener('touchmove',  slideTouchMove,  {passive:false});
  canvas.addEventListener('touchend',   slideTouchEnd,   {passive:false});
  canvas.addEventListener('touchcancel',slideTouchEnd,   {passive:false});

  canvas.addEventListener('mousedown',  slideMouseDown);
  addEventListener('mousemove', slideMouseMove);
  addEventListener('mouseup',   slideMouseUp);

  clearBtn.addEventListener('click', onClearClick);
  document.getElementById('mode-btn').addEventListener('click', cycleMode);
  document.getElementById('end-restart').addEventListener('click', closeEnd);

  const timeEl = document.getElementById('end-time');
  timeEl.addEventListener('dblclick', onEndTimeDoubleClick);
  let lastTapEnd = 0;
  timeEl.addEventListener('touchend', (e) => {
    const now = performance.now();
    if(now - lastTapEnd < 350){
      e.preventDefault();
      onEndTimeDoubleClick(e);
      lastTapEnd = 0;
    } else {
      lastTapEnd = now;
    }
  }, {passive:false});

  addEventListener('resize', () => {
    resize();
    buildPaper();
    needsDraw = true;
    startRaf();
  });

  ['gesturestart','gesturechange','gestureend'].forEach(e =>
    document.addEventListener(e, ev => ev.preventDefault())
  );
  document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
  document.addEventListener('contextmenu', e => e.preventDefault());
}

function onEndTimeDoubleClick(e){
  e.preventDefault();
  poopMode = true;
  document.getElementById('end').classList.remove('visible');
  buildPaper();
  applyThemeVars();
  resetGameState();
  hideClearBtn();
  updateModeIcon();
  flyInModeIcon();
}

function resetGameState(){
  for(let r = 0; r < GRID_Y; r++)
    for(let c = 0; c < GRID_X; c++)
      grid[r][c] = null;
  popAnims.clear();
  locked = false;
  animating = false;
  animPhase = null;
  startTime = performance.now();
  gameActive = true;
  lastHover = -1;
  swapCount = 0;
  manualCount = 0;
  lastRemovedCount = 0;
  clearBtnBusy = false;
  isPointerDown = false;
  lastPaintedIdx = -1;
  paintedDuringSwipe.clear();
  needsDraw = true;
  startRaf();
}

function pointToCell(cx, cy){
  const col = Math.floor((cx - OX) / CELL);
  const row = Math.floor((cy - OY) / CELL);
  if(col < 0 || col >= GRID_X || row < 0 || row >= GRID_Y) return null;
  return {row, col, idx: row * GRID_X + col};
}

function pickHex(){
  const pool = activePool();
  if(!pool || pool.length === 0) return null;
  return pool[(Math.random() * pool.length) | 0];
}

function pickNeighborHex(cell){
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  const candidates = [];
  for(let i = 0; i < 4; i++){
    const nr = cell.row + dirs[i][0];
    const nc = cell.col + dirs[i][1];
    if(nr < 0 || nr >= GRID_Y || nc < 0 || nc >= GRID_X) continue;
    const h = grid[nr][nc];
    if(h) candidates.push(h);
  }
  if(candidates.length === 0) return null;
  return candidates[(Math.random() * candidates.length) | 0];
}

function paintCell(cell){
  if(!cell) return;
  if(grid[cell.row][cell.col]) return;
  if(paintedDuringSwipe.has(cell.idx)) return;

  if(!audioCtx) initAudio();
  let hex = pickHex();
  if(!hex) return;

  if(lastRemovedCount > 0){
    const forced = pickNeighborHex(cell);
    if(forced) hex = forced;
    lastRemovedCount--;
  }

  grid[cell.row][cell.col] = hex;
  popAnims.set(cell.idx, {t: performance.now(), dur: POP_DURATION});
  paintedDuringSwipe.add(cell.idx);
  swapCount++;
  playNote(hex);
  checkFull();
  needsDraw = true;
  startRaf();
}

function replaceCell(cell){
  if(!cell) return;
  if(!grid[cell.row][cell.col]) return;
  if(!audioCtx) initAudio();
  const hex = pickHex();
  if(!hex) return;
  grid[cell.row][cell.col] = hex;
  popAnims.set(cell.idx, {t: performance.now(), dur: POP_DURATION});
  swapCount++;
  manualCount++;
  playNote(hex);
  needsDraw = true;
  startRaf();
}

function onDown(e){
  if(!gameActive || animating) return;
  if(slideState || slideAnimating) return;
  isPointerDown = true;
  paintedDuringSwipe.clear();
  const cell = pointToCell(e.clientX, e.clientY);
  if(!cell) return;
  if(grid[cell.row][cell.col]) replaceCell(cell);
  else paintCell(cell);
}

function onMove(e){
  if(!gameActive || animating) return;
  if(slideState || slideAnimating) return;
  const cell = pointToCell(e.clientX, e.clientY);
  if(!cell){ lastHover = -1; return; }

  if(!isPointerDown){
    if(cell.idx === lastHover) return;
    lastHover = cell.idx;
    if(grid[cell.row][cell.col]) return;
    paintCell(cell);
  } else {
    paintCell(cell);
  }
}

function onUp(){
  isPointerDown = false;
  paintedDuringSwipe.clear();
}

function onTouchStart(e){
  if(!gameActive || animating) return;
  if(slideState || slideAnimating) return;
  e.preventDefault();
  isPointerDown = true;
  paintedDuringSwipe.clear();

  const t = e.touches[0];
  if(!t) return;
  const cell = pointToCell(t.clientX, t.clientY);
  if(!cell) return;

  if(grid[cell.row][cell.col]) replaceCell(cell);
  else paintCell(cell);
  lastPaintedIdx = cell.idx;
}

function onTouchMove(e){
  if(!gameActive || animating) return;
  if(slideState || slideAnimating) return;
  e.preventDefault();
  if(!isPointerDown) return;

  const t = e.touches[0];
  if(!t) return;
  const cell = pointToCell(t.clientX, t.clientY);
  if(!cell) return;

  if(cell.idx === lastPaintedIdx) return;
  lastPaintedIdx = cell.idx;
  paintCell(cell);
}

function onTouchEnd(e){
  if(slideState || slideAnimating) return;
  e.preventDefault();
  isPointerDown = false;
  lastPaintedIdx = -1;
  paintedDuringSwipe.clear();
}

function cycleMode(){
  if(animating || slideAnimating || slideState) return;
  programmaticSlide(1);
}

function updateModeIcon(){
  const img = document.getElementById('mode-icon');
  if(!img) return;
  let hex;
  if(poopMode) hex = '1F4A9';
  else hex = MODE_ICON_HEX[currentCat];
  img.src = getEmojiUrl(hex);
}

function checkFull(){
  let full = true;
  outer:
  for(let r = 0; r < GRID_Y; r++){
    for(let c = 0; c < GRID_X; c++){
      if(!grid[r][c]){ full = false; break outer; }
    }
  }
  if(full){
    locked = true;
    showClearBtn();
  }
}

function onClearClick(e){
  e.preventDefault();
  if(!gameActive || !locked || animating) return;
  if(clearBtnBusy) return;
  clearBtnBusy = true;
  hideClearBtn();
  applyClear();
}

function isBeautifulGrid(){
  for(let r = 0; r < GRID_Y; r++)
    for(let c = 0; c < GRID_X; c++)
      if(!grid[r][c]) return false;

  let ok = true;
  for(let r = 0; r < GRID_Y && ok; r++){
    const v = grid[r][0];
    for(let c = 1; c < GRID_X; c++){
      if(grid[r][c] !== v){ ok = false; break; }
    }
  }
  if(ok) return true;

  ok = true;
  for(let c = 0; c < GRID_X && ok; c++){
    const v = grid[0][c];
    for(let r = 1; r < GRID_Y; r++){
      if(grid[r][c] !== v){ ok = false; break; }
    }
  }
  if(ok) return true;

  ok = true;
  for(let r = 1; r < GRID_Y && ok; r++){
    for(let c = 1; c < GRID_X; c++){
      if(grid[r][c] !== grid[r-1][c-1]){ ok = false; break; }
    }
  }
  if(ok) return true;

  ok = true;
  for(let r = 1; r < GRID_Y && ok; r++){
    for(let c = 0; c < GRID_X - 1; c++){
      if(grid[r][c] !== grid[r-1][c+1]){ ok = false; break; }
    }
  }
  return ok;
}

function applyClear(){
  if(!gameActive || !locked || animating) return;

  if(isBeautifulGrid()){
    locked = false;
    clearBtnBusy = false;
    showEnd();
    return;
  }

  const toRemove = new Set();

  for(let c = 0; c < GRID_X; c++){
    let s = 0;
    while(s < GRID_Y){
      const v = grid[s][c];
      if(!v){ s++; continue; }
      let e = s + 1;
      while(e < GRID_Y && grid[e][c] === v) e++;
      if(e - s >= 2) for(let r = s; r < e; r++) toRemove.add(r * GRID_X + c);
      s = e;
    }
  }

  for(let r = 0; r < GRID_Y; r++){
    let s = 0;
    while(s < GRID_X){
      const v = grid[r][s];
      if(!v){ s++; continue; }
      let e = s + 1;
      while(e < GRID_X && grid[r][e] === v) e++;
      if(e - s >= 2) for(let c = s; c < e; c++) toRemove.add(r * GRID_X + c);
      s = e;
    }
  }

  if(toRemove.size === 0){
    locked = false;
    clearBtnBusy = false;
    setTimeout(() => {
      document.getElementById('mode-btn').classList.remove('hidden');
      flyInModeIcon();
    }, 2000);
    showEnd();
    return;
  }

  lastRemovedCount = toRemove.size < 6 ? toRemove.size : 0;

  animating = true;
  const now = performance.now();
  const removed = [];
  toRemove.forEach(idx => {
    const r = Math.floor(idx / GRID_X), c = idx % GRID_X;
    removed.push({row:r, col:c, hex:grid[r][c], idx});
    grid[r][c] = null;
    popAnims.delete(idx);
  });

  const finalGrid = Array.from({length:GRID_Y}, () => Array(GRID_X).fill(null));
  for(let c = 0; c < GRID_X; c++){
    const existing = [];
    for(let r = 0; r < GRID_Y; r++) if(grid[r][c]) existing.push(grid[r][c]);
    for(let i = 0; i < existing.length; i++)
      finalGrid[GRID_Y - existing.length + i][c] = existing[i];
  }

  const fallers = [];
  for(let c = 0; c < GRID_X; c++){
    const existing = [];
    for(let r = 0; r < GRID_Y; r++)
      if(grid[r][c]) existing.push({row:r, hex:grid[r][c]});
    const n = existing.length;
    for(let i = 0; i < n; i++){
      const fromRow = existing[i].row;
      const toRow = GRID_Y - n + i;
      if(fromRow !== toRow)
        fallers.push({fromRow, toRow, col:c, hex:existing[i].hex});
    }
  }

  for(let r = 0; r < GRID_Y; r++)
    for(let c = 0; c < GRID_X; c++)
      grid[r][c] = finalGrid[r][c];

  playDissolve();

  const fallingSet = new Set();
  fallers.forEach(f => fallingSet.add(f.toRow * GRID_X + f.col));

  locked = false;
  clearBtnBusy = false;

  document.getElementById('mode-btn').classList.remove('hidden');
  flyInModeIcon();

  animPhase = {start: now, removed, fallers, fallingSet, fadeDur: 1100, fallDur: 1300, delay: 500};
  startRaf();
}

function renderStaticNow(){
  ctx.drawImage(paperCanvas, 0, 0, W, H);

  const now = performance.now();

  for(let r = 0; r < GRID_Y; r++){
    for(let c = 0; c < GRID_X; c++){
      if(!grid[r][c]) continue;
      const key = r * GRID_X + c;
      const x = OX + c * CELL + CELL / 2;
      const y = OY + r * CELL + CELL / 2;

      const pop = popAnims.get(key);
      if(pop){
        const t = Math.min((now - pop.t) / pop.dur, 1);
        if(t < 1){
          const e = POP_EASE_OUT(t);
          const scale = POP_SCALE_FROM + (1 - POP_SCALE_FROM) * e;
          const alpha = e * EMOJI_ALPHA;
          const bleed = (1 - t) * POP_BLEED;
          drawEmojiOn(ctx, grid[r][c], x, y, scale, alpha, bleed);
          continue;
        }
        popAnims.delete(key);
      }
      drawEmojiOn(ctx, grid[r][c], x, y, 1, EMOJI_ALPHA, 0);
    }
  }
}

function renderFrame(elapsed){
  ctx.drawImage(paperCanvas, 0, 0, W, H);

  const fadeT = Math.min(elapsed / animPhase.fadeDur, 1);
  const fadeE = 1 - Math.pow(1 - fadeT, 2);
  const fadeScale = 1 - fadeE * 0.7;
  const fadeAlphaBase = (1 - fadeE) * EMOJI_ALPHA;
  const fadeBleed = fadeE * 1.5;

  if(fadeAlphaBase > 0.01){
    for(let i = 0; i < animPhase.removed.length; i++){
      const cell = animPhase.removed[i];
      const x = OX + cell.col * CELL + CELL / 2;
      const y = OY + cell.row * CELL + CELL / 2;
      drawEmojiOn(ctx, cell.hex, x, y, Math.max(fadeScale, 0.01), fadeAlphaBase, fadeBleed);
    }
  }

  for(let r = 0; r < GRID_Y; r++){
    for(let c = 0; c < GRID_X; c++){
      const key = r * GRID_X + c;
      if(animPhase.fallingSet.has(key)) continue;
      if(!grid[r][c]) continue;
      const x = OX + c * CELL + CELL / 2;
      const y = OY + r * CELL + CELL / 2;
      drawEmojiOn(ctx, grid[r][c], x, y, 1, EMOJI_ALPHA, 0);
    }
  }

  const fallEased = elapsed < animPhase.delay ? 0 : (() => {
    const fallT = Math.max(0, Math.min((elapsed - animPhase.delay) / animPhase.fallDur, 1));
    return fallT < 0.5
      ? 8 * fallT * fallT * fallT * fallT
      : 1 - Math.pow(-2 * fallT + 2, 4) / 2;
  })();

  for(let i = 0; i < animPhase.fallers.length; i++){
    const f = animPhase.fallers[i];
    const y = f.fromRow * CELL + (f.toRow - f.fromRow) * CELL * fallEased;
    const x = OX + f.col * CELL + CELL / 2;
    drawEmojiOn(ctx, f.hex, x, OY + y + CELL / 2, 1, EMOJI_ALPHA, 0);
  }
}

function raf(){
  if(slideAnimating || slideState){
    requestAnimationFrame(raf);
    return;
  }

  if(animating && animPhase){
    const elapsed = performance.now() - animPhase.start;
    renderFrame(elapsed);

    if(elapsed > animPhase.delay + animPhase.fallDur + 120){
      animating = false;
      animPhase = null;
      popAnims.clear();
      checkFull();
      needsDraw = true;
      renderStaticNow();
      rafRunning = false;
      return;
    }
    requestAnimationFrame(raf);
    return;
  }

  let anyPop = false;
  const now = performance.now();
  popAnims.forEach(a => { if(now - a.t < a.dur) anyPop = true; });
  if(!anyPop) popAnims.clear();

  if(anyPop || needsDraw){
    renderStaticNow();
    needsDraw = false;
    if(anyPop){
      requestAnimationFrame(raf);
      return;
    }
    rafRunning = false;
    return;
  }

  rafRunning = false;
}

function drawEmojiOn(g, hex, x, y, scale, alpha, bleed){
  const img = getEmojiImage(hex);
  const size = CELL * 0.94 * scale;
  const half = size / 2;

  if(!img.complete || !img.naturalWidth){
    g.globalAlpha = alpha * 0.12;
    g.fillStyle = '#3d3529';
    g.beginPath();
    g.arc(x, y, size * 0.3, 0, Math.PI * 2);
    g.fill();
    g.globalAlpha = 1;
    return;
  }

  g.globalAlpha = alpha;

  if(bleed > 0 && !IS_MOBILE){
    g.globalAlpha = alpha * bleed * 0.22;
    const bSize = size * (1 + bleed * 0.35);
    g.drawImage(img, x - bSize/2, y - bSize/2, bSize, bSize);
  }

  g.globalAlpha = alpha;
  g.drawImage(img, x - half, y - half, size, size);
  g.globalAlpha = 1;
}

function showEnd(){
  gameActive = false;
  hideClearBtn();
  const btn = document.getElementById('mode-btn');
  if(btn) btn.classList.remove('hidden');
  const elapsed = performance.now() - startTime;
  const sec = Math.floor(elapsed / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  document.getElementById('end-time').textContent = `${m}:${String(s).padStart(2,'0')}`;

  let hex;
  if(poopMode) hex = '1F4A9';
  else hex = END_ICON_HEX[currentCat] || '1F33F';
  const img = document.getElementById('end-icon-img');
  if(img) img.src = getEmojiUrl(hex);

  document.getElementById('end-swaps-count').textContent = swapCount;
  document.getElementById('end-manual-count').textContent = manualCount;
  document.getElementById('end').classList.add('visible');
}

function closeEnd(){
  document.getElementById('end').classList.remove('visible');
  poopMode = false;
  currentCat = 'meadow';
  pickRandomPool(currentCat);
  buildPaper();
  applyThemeVars();
  resetGameState();
  hideClearBtn();
  updateModeIcon();
  document.getElementById('mode-btn').classList.remove('hidden');
  flyInModeIcon();
}

const PENTA = [130.81,146.83,164.81,196.00,220.00,261.63,293.66,329.63,392.00,440.00];

function initAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }catch(e){}
}

function playNote(hex){
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();

  let hash = 0;
  for(let i = 0; i < hex.length; i++)
    hash = (hash * 31 + hex.charCodeAt(i)) | 0;

  const freq = PENTA[Math.abs(hash) % PENTA.length];

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;

  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.025, now + 0.06);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);

  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 2.2);
}

function playDissolve(){
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();

  const c = audioCtx, now = c.currentTime;

  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180, now);
  o.frequency.exponentialRampToValueAtTime(90, now + 1.0);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.018, now + 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
  o.connect(g).connect(c.destination);
  o.start(now); o.stop(now + 1.5);

  const o2 = c.createOscillator(), g2 = c.createGain();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(520, now);
  o2.frequency.exponentialRampToValueAtTime(780, now + 0.6);
  g2.gain.setValueAtTime(0, now);
  g2.gain.linearRampToValueAtTime(0.012, now + 0.15);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
  o2.connect(g2).connect(c.destination);
  o2.start(now); o2.stop(now + 1.1);
}

addEventListener('DOMContentLoaded', init);
