<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8ecd8">
<title>Вайбиньо</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}

:root{
  --paper:#e8ecd8;
  --ink:#3d4a2a;
  --ink-soft:rgba(61,74,42,.35);
  --line:#3d4a2a;
}
html,body{background:var(--paper);transition:background 1.6s ease}

canvas{
  display:block;position:fixed;inset:0;width:100%;height:100%;
  touch-action:none;cursor:default;
}

#mode-btn{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  left:50%;
  width:84px;height:84px;
  margin-left:-42px;
  border:none;
  background:transparent;
  padding:0;font-family:inherit;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--line);
  z-index:10;
  transition:transform .4s cubic-bezier(.25,.1,.25,1), opacity .5s ease;
  -webkit-user-select:none;user-select:none;
}
#mode-btn:active{transform:scale(.9)}
#mode-btn img{
  width:63px;height:63px;
  display:block;
  animation:modeSway 5s ease-in-out infinite;
  transform-origin:center bottom;
  opacity:.78;
  filter:saturate(.6) brightness(.98) contrast(.92);
  -webkit-user-drag:none;
  user-select:none;
}
@keyframes modeSway{
  0%,100%{transform:rotate(-3deg)}
  50%{transform:rotate(3deg)}
}
#mode-btn.hidden{opacity:0;pointer-events:none;transform:scale(.7)}

#clear-btn{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  left:50%;
  width:84px;height:84px;
  margin-left:-42px;
  border:none;
  background:transparent;
  padding:0;font-family:inherit;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--line);
  opacity:0;pointer-events:none;
  transform:scale(.7);
  transition:
    opacity .7s cubic-bezier(.25,.1,.25,1),
    transform .7s cubic-bezier(.34,1.2,.64,1),
    color 1.6s ease;
  -webkit-user-select:none;user-select:none;
  z-index:14;
}
#clear-btn.visible{opacity:1;pointer-events:auto;transform:scale(1)}
#clear-btn:active{transform:scale(.9)}
#clear-btn svg{width:100%;height:100%;display:block;overflow:visible}
#clear-btn svg path{
  fill:none;
  stroke:currentColor;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-width:1.8;
  vector-effect:non-scaling-stroke;
  opacity:.5;
  transform-origin:center;
  transform-box:fill-box;
  animation:spiralRotate 32s linear infinite;
}
@keyframes spiralRotate{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}
#clear-btn.press svg path{
  animation:spiralWhip 1s cubic-bezier(.5,0,.3,1) forwards;
}
@keyframes spiralWhip{
  0%{transform:rotate(0);opacity:.5}
  60%{opacity:.75}
  100%{transform:rotate(540deg);opacity:0}
}

#end{
  position:fixed;inset:0;z-index:100;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:32px;opacity:0;pointer-events:none;
  transition:opacity 1.6s cubic-bezier(.25,.1,.25,1),background 1.6s ease;
}
#end.visible{opacity:1;pointer-events:auto}
#end-row{display:flex;align-items:center;gap:18px}
#end-icon{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
#end-icon img{
  width:48px;height:48px;display:block;
  filter:saturate(.6) brightness(.98) contrast(.92);
  opacity:.8;
}
#end-time{
  font-size:56px;font-weight:200;letter-spacing:-2px;
  color:var(--ink);font-variant-numeric:tabular-nums;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Georgia,sans-serif;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#end-platform{font-size:26px;line-height:1;opacity:.55;filter:saturate(.55) brightness(.95)}

#end-stats{
  display:flex;
  align-items:center;
  gap:28px;
  margin-top:-6px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Georgia,sans-serif;
}

.stat{
  display:flex;align-items:center;gap:8px;
  color:var(--ink-soft);
  font-size:18px;font-weight:300;letter-spacing:.5px;
  opacity:.75;
}
.stat svg{
  width:20px;height:20px;display:block;
  color:var(--ink-soft);stroke:currentColor;stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85;
}
.stat .spin{animation:statSpin 8s linear infinite}
@keyframes statSpin{
  0%{transform:rotate(0)}
  100%{transform:rotate(360deg)}
}
.stat .count{
  font-variant-numeric:tabular-nums;
  color:var(--ink);opacity:.8;font-weight:400;
}

#end-restart{
  margin-top:20px;border:none;background:transparent;
  color:var(--ink-soft);padding:12px;border-radius:100px;cursor:pointer;
  border:1px solid var(--ink-soft);opacity:.5;
  transition:opacity .8s ease, transform .3s ease;
  display:flex;align-items:center;justify-content:center;
  width:48px;height:48px;
}
#end-restart:active{opacity:1;transform:scale(.92)}
#end-restart svg{width:20px;height:20px}

@media(max-width:500px){
  #mode-btn{
    width:104px;height:104px;
    margin-left:-52px;
  }
  #mode-btn img{
    width:80px;height:80px;
  }
  #clear-btn{
    width:104px;height:104px;
    margin-left:-52px;
  }

  #end-time{font-size:44px;letter-spacing:-1px}
  #end-icon{width:44px;height:44px}
  #end-icon img{width:38px;height:38px}
  #end-platform{font-size:22px}
  #end-stats{gap:18px}
  .stat{font-size:16px}
  .stat svg{width:18px;height:18px}
}
</style>
</head>
<body>
<canvas id="field"></canvas>

<button id="mode-btn" aria-label="Сменить раздел">
  <img id="mode-icon" src="" alt="">
</button>

<button id="clear-btn" aria-label="Очистить дубли">
  <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <path id="spiral-path" d=""/>
  </svg>
</button>

<div id="end">
  <div id="end-row">
    <div id="end-icon"><img id="end-icon-img" src="" alt=""></div>
    <div id="end-time">0:00</div>
    <div id="end-platform">🖥️</div>
  </div>

  <div id="end-stats">
    <div class="stat" title="Автоматические замены">
      <svg class="spin" viewBox="0 0 24 24">
        <path d="M4 12 A 8 8 0 0 1 12 4 L14 4"/>
        <path d="M14 4 L11 1 M14 4 L11 7"/>
        <path d="M20 12 A 8 8 0 0 1 12 20 L10 20"/>
        <path d="M10 20 L13 23 M10 20 L13 17"/>
      </svg>
      <span class="count" id="end-swaps-count">0</span>
    </div>

    <div class="stat" title="Ручные замены">
      <svg viewBox="0 0 24 24">
        <path d="M15 4 L19 8 L9 18 L5 19 L6 15 Z"/>
        <path d="M13 6 L17 10"/>
      </svg>
      <span class="count" id="end-manual-count">0</span>
    </div>
  </div>

  <button id="end-restart" aria-label="Начать заново">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M18 6L6 18M6 6l12 12"/>
    </svg>
  </button>
</div>

<script>
'use strict';

const OPENMOJI_BASE = 'emoji/';
const imgCache = new Map();

function getEmojiUrl(hex){
  return OPENMOJI_BASE + hex.toUpperCase() + '.png';
}

function getEmojiImage(hex){
  let img = imgCache.get(hex);
  if(img) return img;
  img = new Image();
  img.src = getEmojiUrl(hex);
  imgCache.set(hex, img);
  return img;
}

const FULL_POOL = {
  home: [
    '1F331','1F340','1F33E','1F338','1F33C','1F337','1F33B',
    '1F33A','1F339','1F341','1F98B','1F41E','1F997','1F426'
  ],
  wild: [
    '1F332','1F333','1F344','1F33F','1F41C','1FAB2','1F98C','1F986','1F994',
    '1F43F','1F407','1F9A8','1F9A1','1F9A2','1F40D','1F40C','1F401','1F9AB'
  ],
  sea: [
    '1F433','1F42C','1F420','1F9AD','1F419','1F980','1F990','1FABC',
    '1F422','1F988'
  ],
  faces: [
    '1F98A','1F43A','1F43B','1F43C','1F439','1F430','1F431','1F436',
    '1F437','1F42E','1F42D','1F438'
  ],
  food: [
    '1F34E','1F34F','1F350','1F34A','1F34B','1F34C','1F349','1F347',
    '1F353','1F352','1FAD1'
  ],
  poop: ['1F4A9','1F9FB']
};

const ALWAYS = {
  home: ['1F338','1F33C','1F337','1F33B','1F33A','1F339'],
  wild: ['1F332','1F333','1F344','1F33F']
};

const CATS = {
  home: [],
  wild: [],
  sea:  [],
  faces: [],
  food: []
};

let easterMode = null;

const POOL_SIZE = 10;

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function pickRandomPool(cat){
  const full = FULL_POOL[cat] || [];
  const always = ALWAYS[cat] || [];
  const selected = new Set(always);

  const rest = full.filter(hex => !selected.has(hex));
  const shuffledRest = shuffle(rest);

  for(const hex of shuffledRest){
    if(selected.size >= POOL_SIZE) break;
    selected.add(hex);
  }

  CATS[cat] = Array.from(selected);
  return CATS[cat];
}

function activePool(){
  if(easterMode) return FULL_POOL[easterMode];
  return CATS[currentCat];
}

function preloadAllEmoji(){
  Object.values(FULL_POOL).forEach(pool => {
    pool.forEach(hex => getEmojiImage(hex));
  });
}

function makeSpiralPath(cx, cy, a, b, turns){
  const steps = 360;
  const maxTheta = turns * 2 * Math.PI;
  let d = '';
  for(let i = 0; i <= steps; i++){
    const theta = (i / steps) * maxTheta;
    const r = a + b * theta;
    const x = cx + r * Math.cos(theta);
    const y = cy + r * Math.sin(theta);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2);
    if(i < steps) d += ' ';
  }
  return d;
}

const ORDER = ['home', 'wild', 'sea', 'faces', 'food'];

const MODE_ICON_HEX = {
  home:  '1F33F',
  wild:  '1F332',
  sea:   '1F420',
  faces: '1F431',
  food:  '1F34E'
};

const END_ICON_HEX = {
  home:  '1F33F',
  wild:  '1F344',
  sea:   '1F433',
  faces: '1F431',
  food:  '1F34E'
};

const THEMES = {
  home: {
    base:         '#e6ecd2',
    horizon:      '#f0eed8',
    sky:          '#f8f4dc',
    ground:       '#b8c99a',
    bloom:        'rgba(255,240,200,0.35)',
    vignette:     'rgba(90,120,60,0.14)',
    ink:          '#3e4a2c',
    inkSoft:      'rgba(62,74,44,.38)',
    grain:        [110,140,80]
  },
  wild: {
    base:         '#e5d4bb',
    horizon:      '#efe0c5',
    sky:          '#f5ead0',
    ground:       '#a8895f',
    bloom:        'rgba(255,215,160,0.32)',
    vignette:     'rgba(90,60,30,0.16)',
    ink:          '#4a3826',
    inkSoft:      'rgba(74,56,38,.38)',
    grain:        [120,90,55]
  },
  sea: {
    base:         '#d6e4ea',
    horizon:      '#e6eef2',
    sky:          '#f0f6f8',
    ground:       '#8fb2c4',
    bloom:        'rgba(210,235,245,0.4)',
    vignette:     'rgba(60,90,110,0.16)',
    ink:          '#2d3f4a',
    inkSoft:      'rgba(45,63,74,.38)',
    grain:        [80,110,130]
  },
  faces: {
    base:         '#ecdde0',
    horizon:      '#f4e6e6',
    sky:          '#f9f0ee',
    ground:       '#cca8ad',
    bloom:        'rgba(255,225,225,0.4)',
    vignette:     'rgba(140,100,110,0.15)',
    ink:          '#4a3238',
    inkSoft:      'rgba(74,50,56,.38)',
    grain:        [150,110,120]
  },
  food: {
    base:         '#f0e4c4',
    horizon:      '#f6e8c8',
    sky:          '#fbf2d6',
    ground:       '#d4b578',
    bloom:        'rgba(255,240,190,0.45)',
    vignette:     'rgba(150,120,70,0.15)',
    ink:          '#4a3c1c',
    inkSoft:      'rgba(74,60,28,.38)',
    grain:        [150,120,70]
  },
  poop: {
    base:         '#1a1814',
    horizon:      '#1e1c18',
    sky:          '#252220',
    ground:       '#0f0d0a',
    bloom:        'rgba(70,60,45,0.25)',
    vignette:     'rgba(0,0,0,0.5)',
    ink:          '#e8e0d0',
    inkSoft:      'rgba(232,224,208,.3)',
    grain:        [190,180,165]
  }
};

function currentThemeKey(){
  if(easterMode) return 'poop';
  return currentCat;
}

function applyTheme(){
  const t = THEMES[currentThemeKey()] || THEMES.home;
  const root = document.documentElement;

  root.style.setProperty('--paper',     t.base);
  root.style.setProperty('--ink',       t.ink);
  root.style.setProperty('--ink-soft',  t.inkSoft);
  root.style.setProperty('--line',      t.ink);

  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t.base);

  buildPaper();
  needsDraw = true;
}

let noiseTileCache = new Map();

function makeNoiseTile(grainRGB, isDark){
  const size = 96;
  const tile = document.createElement('canvas');
  tile.width = tile.height = size;
  const tctx = tile.getContext('2d');
  const img = tctx.createImageData(size, size);
  const d = img.data;
  const [baseR, baseG, baseB] = grainRGB;
  const alpha = isDark ? 12 : 18;
  for(let i = 0; i < d.length; i += 4){
    const shift = (Math.random() * 60) | 0;
    d[i]   = baseR + shift;
    d[i+1] = baseG + shift;
    d[i+2] = baseB + shift;
    d[i+3] = alpha;
  }
  tctx.putImageData(img, 0, 0);
  return tile;
}
function getNoiseTile(grainRGB, isDark){
  const key = grainRGB.join(',') + (isDark ? 'D' : 'L');
  if(!noiseTileCache.has(key)){
    noiseTileCache.set(key, makeNoiseTile(grainRGB, isDark));
  }
  return noiseTileCache.get(key);
}

let canvas, ctx, paperCanvas;
let W, H, CELL, OX, OY, GRID_X, GRID_Y;
let grid, currentCat = 'home';
let audioCtx = null, locked = false, animating = false;
let animPhase = null, needsDraw = true;
let startTime = 0, gameActive = false;
let popAnims = new Map();
let lastHover = -1;
let swapCount = 0;
let manualCount = 0;
let DPR = Math.min(devicePixelRatio || 1, 2);
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || matchMedia('(pointer:coarse)').matches;

const EMOJI_ALPHA = 0.62;

const POP_DURATION = IS_MOBILE ? 380 : 900;
const POP_EASE_OUT = IS_MOBILE
  ? (t => 1 - Math.pow(1 - t, 4))
  : (t => 1 - Math.pow(1 - t, 3));
const POP_SCALE_FROM = IS_MOBILE ? 0.82 : 0.6;
const POP_BLEED = IS_MOBILE ? 0.4 : 0.8;

let clearBtn = null;
let clearBtnBusy = false;

let isPointerDown = false;
let lastPaintedIdx = -1;
const paintedDuringSwipe = new Set();

function init(){
  canvas = document.getElementById('field');
  ctx = canvas.getContext('2d', {alpha:false});
  clearBtn = document.getElementById('clear-btn');

  const spiral = document.getElementById('spiral-path');
  if(spiral) spiral.setAttribute('d', makeSpiralPath(50, 50, 1, 1.02, 6));

  const plat = document.getElementById('end-platform');
  if(plat) plat.textContent = IS_MOBILE ? '📱' : '🖥️';

  preloadAllEmoji();
  pickRandomPool(currentCat);
  resize();
  buildPaper();
  bindEvents();
  updateModeIcon();
  applyTheme();
  startGame();
  raf();
}

function resize(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, IS_MOBILE ? 1.5 : 2);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if(IS_MOBILE){
    GRID_X = 5;
    GRID_Y = 7;
  } else {
    GRID_X = 12;
    GRID_Y = 7;
  }

  const padTop = IS_MOBILE ? 108 : 118;
  const padBot = IS_MOBILE ? 12 : 28;
  const padSide = IS_MOBILE ? 8 : 28;

  const availH = H - padTop - padBot;
  const availW = W - padSide * 2;
  CELL = Math.min(availW / GRID_X, availH / GRID_Y);
  OX = (W - CELL * GRID_X) / 2;
  OY = padTop + (availH - CELL * GRID_Y) / 2;

  grid = Array.from({length:GRID_Y}, () => Array(GRID_X).fill(null));
}

function buildPaper(){
  paperCanvas = document.createElement('canvas');
  paperCanvas.width = Math.floor(W * DPR);
  paperCanvas.height = Math.floor(H * DPR);
  const p = paperCanvas.getContext('2d', {alpha:false});
  p.setTransform(DPR, 0, 0, DPR, 0, 0);

  const key = currentThemeKey();
  const t = THEMES[key] || THEMES.home;
  const isDark = key === 'poop';

  p.fillStyle = t.base;
  p.fillRect(0, 0, W, H);

  if(t.sky){
    const sky = p.createRadialGradient(
      W * 0.5, -H * 0.2, 0,
      W * 0.5, -H * 0.2, Math.max(W, H) * 1.0
    );
    sky.addColorStop(0, t.sky);
    sky.addColorStop(0.5, hexToRgba(t.sky, isDark ? 0.4 : 0.5));
    sky.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = sky;
    p.fillRect(0, 0, W, H);
  }

  if(t.horizon){
    const horizon = p.createLinearGradient(0, H * 0.25, 0, H * 0.75);
    horizon.addColorStop(0, hexToRgba(t.horizon, 0));
    horizon.addColorStop(0.5, hexToRgba(t.horizon, isDark ? 0.15 : 0.22));
    horizon.addColorStop(1, hexToRgba(t.horizon, 0));
    p.fillStyle = horizon;
    p.fillRect(0, 0, W, H);
  }

  if(t.ground){
    const ground = p.createRadialGradient(
      W * 0.5, H * 1.15, 0,
      W * 0.5, H * 1.15, Math.max(W, H) * 0.8
    );
    ground.addColorStop(0, hexToRgba(t.ground, isDark ? 0.7 : 0.55));
    ground.addColorStop(0.55, hexToRgba(t.ground, isDark ? 0.3 : 0.22));
    ground.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = ground;
    p.fillRect(0, 0, W, H);
  }

  if(t.bloom){
    const bloom = p.createRadialGradient(
      -W * 0.1, H * 0.9, 0,
      -W * 0.1, H * 0.9, Math.max(W, H) * 0.85
    );
    bloom.addColorStop(0, t.bloom);
    bloom.addColorStop(0.6, hexToRgba(t.bloom, 0.08));
    bloom.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = bloom;
    p.fillRect(0, 0, W, H);
  }

  const grainRGB = t.grain || [130, 100, 65];
  const tile = getNoiseTile(grainRGB, isDark);
  const pattern = p.createPattern(tile, 'repeat');
  if(pattern){
    p.fillStyle = pattern;
    p.fillRect(0, 0, W, H);
  }

  const grainCount = IS_MOBILE ? 280 : 640;
  for(let i = 0; i < grainCount; i++){
    const x = Math.random() * W;
    const y = Math.random() * H;
    const a = Math.random() * 0.045;
    p.fillStyle = isDark
      ? `rgba(232,224,208,${a})`
      : `rgba(${grainRGB[0]},${grainRGB[1]},${grainRGB[2]},${a})`;
    p.fillRect(x, y, 1.5, 1.5);
  }

  if(t.vignette){
    const vignette = p.createRadialGradient(
      W * 0.5, H * 0.5, Math.min(W, H) * 0.5,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.85
    );
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, t.vignette);
    p.fillStyle = vignette;
    p.fillRect(0, 0, W, H);
  }
}

function hexToRgba(hex, alpha){
  if(!hex) return 'rgba(0,0,0,0)';
  if(hex.startsWith('rgba') || hex.startsWith('rgb')){
    return hex;
  }
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function bindEvents(){
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('mouseleave', onUp);

  canvas.addEventListener('touchstart', onTouchStart, {passive:false});
  canvas.addEventListener('touchmove',  onTouchMove,  {passive:false});
  canvas.addEventListener('touchend',   onTouchEnd,   {passive:false});
  canvas.addEventListener('touchcancel',onTouchEnd,   {passive:false});

  clearBtn.addEventListener('click', onClearClick);
  document.getElementById('mode-btn').addEventListener('click', cycleMode);
  document.getElementById('end-restart').addEventListener('click', closeEnd);

  const timeEl = document.getElementById('end-time');
  timeEl.addEventListener('dblclick', onEndTimeDoubleClick);
  let lastTapEnd = 0;
  timeEl.addEventListener('touchend', (e) => {
    const now = performance.now();
    if(now - lastTapEnd < 350){
      e.preventDefault();
      onEndTimeDoubleClick(e);
      lastTapEnd = 0;
    } else {
      lastTapEnd = now;
    }
  }, {passive:false});

  addEventListener('resize', () => { resize(); buildPaper(); needsDraw = true; });

  ['gesturestart','gesturechange','gestureend'].forEach(e =>
    document.addEventListener(e, ev => ev.preventDefault())
  );
  document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
  document.addEventListener('contextmenu', e => e.preventDefault());
}

function onEndTimeDoubleClick(e){
  e.preventDefault();
  easterMode = 'poop';
  document.getElementById('end').classList.remove('visible');
  applyTheme();
  startGame();
  updateModeIcon();
}

function startGame(){
  for(let r = 0; r < GRID_Y; r++)
    for(let c = 0; c < GRID_X; c++)
      grid[r][c] = null;
  popAnims.clear();
  locked = false;
  animating = false;
  animPhase = null;
  startTime = performance.now();
  gameActive = true;
  lastHover = -1;
  swapCount = 0;
  manualCount = 0;
  clearBtnBusy = false;
  clearBtn.classList.remove('visible', 'press');
  document.getElementById('mode-btn').classList.remove('hidden');
  isPointerDown = false;
  lastPaintedIdx = -1;
  paintedDuringSwipe.clear();
  updateUI();
  needsDraw = true;
}

function pointToCell(cx, cy){
  const col = Math.floor((cx - OX) / CELL);
  const row = Math.floor((cy - OY) / CELL);
  if(col < 0 || col >= GRID_X || row < 0 || row >= GRID_Y) return null;
  return {row, col, idx: row * GRID_X + col};
}

function pickHex(){
  const pool = activePool();
  if(!pool || pool.length === 0) return null;
  return pool[(Math.random() * pool.length) | 0];
}

function paintCell(cell){
  if(!cell) return;
  if(grid[cell.row][cell.col]) return;
  if(paintedDuringSwipe.has(cell.idx)) return;

  if(!audioCtx) initAudio();
  const hex = pickHex();
  if(!hex) return;
  grid[cell.row][cell.col] = hex;
  popAnims.set(cell.idx, {t: performance.now(), dur: POP_DURATION});
  paintedDuringSwipe.add(cell.idx);
  swapCount++;
  playNote(hex);
  checkFull();
  if(!animating) needsDraw = true;
}

function replaceCell(cell){
  if(!cell) return;
  if(!grid[cell.row][cell.col]) return;
  if(!audioCtx) initAudio();
  const hex = pickHex();
  if(!hex) return;
  grid[cell.row][cell.col] = hex;
  popAnims.set(cell.idx, {t: performance.now(), dur: POP_DURATION});
  swapCount++;
  manualCount++;
  playNote(hex);
  needsDraw = true;
}

function onDown(e){
  if(!gameActive || locked || animating) return;
  isPointerDown = true;
  paintedDuringSwipe.clear();
  const cell = pointToCell(e.clientX, e.clientY);
  if(!cell) return;
  if(grid[cell.row][cell.col]){
    replaceCell(cell);
  } else {
    paintCell(cell);
  }
}

function onMove(e){
  if(!gameActive || locked || animating) return;
  const cell = pointToCell(e.clientX, e.clientY);
  if(!cell) return;

  if(!isPointerDown){
    if(cell.idx === lastHover) return;
    lastHover = cell.idx;
    if(grid[cell.row][cell.col]) return;
    paintCell(cell);
  } else {
    paintCell(cell);
  }
}

function onUp(){
  isPointerDown = false;
  paintedDuringSwipe.clear();
}

function onTouchStart(e){
  e.preventDefault();
  if(!gameActive || locked || animating) return;
  isPointerDown = true;
  paintedDuringSwipe.clear();

  const t = e.touches[0];
  if(!t) return;
  const cell = pointToCell(t.clientX, t.clientY);
  if(!cell) return;

  if(grid[cell.row][cell.col]){
    replaceCell(cell);
  } else {
    paintCell(cell);
  }
  lastPaintedIdx = cell.idx;
}

function onTouchMove(e){
  e.preventDefault();
  if(!gameActive || locked || animating) return;
  if(!isPointerDown) return;

  const t = e.touches[0];
  if(!t) return;
  const cell = pointToCell(t.clientX, t.clientY);
  if(!cell) return;

  if(cell.idx === lastPaintedIdx) return;
  lastPaintedIdx = cell.idx;
  paintCell(cell);
}

function onTouchEnd(e){
  e.preventDefault();
  isPointerDown = false;
  lastPaintedIdx = -1;
  paintedDuringSwipe.clear();
}

function cycleMode(){
  if(animating) return;

  if(easterMode){
    easterMode = null;
    currentCat = 'home';
  } else {
    const i = ORDER.indexOf(currentCat);
    currentCat = ORDER[(i + 1) % ORDER.length];
  }

  pickRandomPool(currentCat);
  updateModeIcon();
  applyTheme();
  startGame();
}

function updateModeIcon(){
  const img = document.getElementById('mode-icon');
  if(!img) return;
  let hex;
  if(easterMode === 'poop'){
    hex = '1F4A9';
  } else {
    hex = MODE_ICON_HEX[currentCat];
  }
  img.src = getEmojiUrl(hex);
}

function checkFull(){
  for(let r = 0; r < GRID_Y; r++)
    for(let c = 0; c < GRID_X; c++)
      if(!grid[r][c]) return;
  locked = true;
  updateUI();
}

function updateUI(){
  const modeBtn = document.getElementById('mode-btn');
  if(locked && gameActive){
    clearBtn.classList.add('visible');
    modeBtn.classList.add('hidden');
  } else {
    clearBtn.classList.remove('visible');
    modeBtn.classList.remove('hidden');
  }
}

function onClearClick(e){
  e.preventDefault();
  if(!gameActive || !locked || animating) return;
  if(clearBtnBusy) return;
  clearBtnBusy = true;

  clearBtn.classList.add('press');
  setTimeout(() => {
    clearBtn.classList.remove('press');
    clearBtnBusy = false;
  }, 1100);

  applyClear();
}

function applyClear(){
  if(!gameActive || !locked || animating) return;

  const toRemove = new Set();

  for(let c = 0; c < GRID_X; c++){
    let s = 0;
    while(s < GRID_Y){
      const v = grid[s][c];
      if(!v){ s++; continue; }
      let e = s + 1;
      while(e < GRID_Y && grid[e][c] === v) e++;
      if(e - s >= 2) for(let r = s; r < e; r++) toRemove.add(r * GRID_X + c);
      s = e;
    }
  }

  for(let r = 0; r < GRID_Y; r++){
    let s = 0;
    while(s < GRID_X){
      const v = grid[r][s];
      if(!v){ s++; continue; }
      let e = s + 1;
      while(e < GRID_X && grid[r][e] === v) e++;
      if(e - s >= 2) for(let c = s; c < e; c++) toRemove.add(r * GRID_X + c);
      s = e;
    }
  }

  if(toRemove.size === 0){
    locked = false;
    updateUI();
    showEnd();
    return;
  }

  animating = true;
  const now = performance.now();
  const removed = [];
  toRemove.forEach(idx => {
    const r = Math.floor(idx / GRID_X), c = idx % GRID_X;
    removed.push({row:r, col:c, hex:grid[r][c], idx});
    grid[r][c] = null;
    popAnims.delete(idx);
  });

  const finalGrid = Array.from({length:GRID_Y}, () => Array(GRID_X).fill(null));
  for(let c = 0; c < GRID_X; c++){
    const existing = [];
    for(let r = 0; r < GRID_Y; r++) if(grid[r][c]) existing.push(grid[r][c]);
    for(let i = 0; i < existing.length; i++)
      finalGrid[GRID_Y - existing.length + i][c] = existing[i];
  }

  const fallers = [];
  for(let c = 0; c < GRID_X; c++){
    const existing = [];
    for(let r = 0; r < GRID_Y; r++)
      if(grid[r][c]) existing.push({row:r, hex:grid[r][c]});
    const n = existing.length;
    for(let i = 0; i < n; i++){
      const fromRow = existing[i].row;
      const toRow = GRID_Y - n + i;
      if(fromRow !== toRow)
        fallers.push({fromRow, toRow, col:c, hex:existing[i].hex});
    }
  }

  for(let r = 0; r < GRID_Y; r++)
    for(let c = 0; c < GRID_X; c++)
      grid[r][c] = finalGrid[r][c];

  playDissolve();
  animPhase = {start: now, removed, fallers, fadeDur: 1100, fallDur: 1300, delay: 500};
}

function raf(){
  if(animating && animPhase){
    const elapsed = performance.now() - animPhase.start;
    const fallT = Math.max(0, Math.min((elapsed - animPhase.delay) / animPhase.fallDur, 1));
    const fe = fallT < 0.5
      ? 8 * fallT * fallT * fallT * fallT
      : 1 - Math.pow(-2 * fallT + 2, 4) / 2;
    drawFrame(fe, elapsed);

    if(elapsed > animPhase.delay + animPhase.fallDur + 120){
      animating = false;
      animPhase = null;
      popAnims.clear();
      checkFull();
      const empty = grid.some(row => row.some(cell => !cell));
      if(empty) locked = false;
      updateUI();
      needsDraw = true;
    }
  } else {
    let anyPop = false;
    const now = performance.now();
    popAnims.forEach(a => { if(now - a.t < a.dur) anyPop = true; });
    if(anyPop || needsDraw){
      renderStatic(now);
      needsDraw = false;
      if(!anyPop) popAnims.clear();
    }
  }
  requestAnimationFrame(raf);
}

function drawEmoji(hex, x, y, scale, alpha, bleed){
  const img = getEmojiImage(hex);
  const size = CELL * 0.94 * scale;
  const half = size / 2;

  if(!img.complete || !img.naturalWidth){
    ctx.globalAlpha = alpha * 0.12;
    ctx.fillStyle = '#3d3529';
    ctx.beginPath();
    ctx.arc(x, y, size * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    return;
  }

  ctx.globalAlpha = alpha;

  if(bleed > 0){
    ctx.globalAlpha = alpha * bleed * 0.22;
    const bSize = size * (1 + bleed * 0.35);
    ctx.drawImage(img, x - bSize/2, y - bSize/2, bSize, bSize);
  }

  ctx.globalAlpha = alpha;
  ctx.drawImage(img, x - half, y - half, size, size);
  ctx.globalAlpha = 1;
}

function renderStatic(now){
  ctx.drawImage(paperCanvas, 0, 0, W, H);

  for(let r = 0; r < GRID_Y; r++){
    for(let c = 0; c < GRID_X; c++){
      if(!grid[r][c]) continue;
      const key = r * GRID_X + c;
      const x = OX + c * CELL + CELL / 2;
      const y = OY + r * CELL + CELL / 2;
      const pop = popAnims.get(key);

      if(pop){
        const t = Math.min((now - pop.t) / pop.dur, 1);
        if(t < 1){
          const e = POP_EASE_OUT(t);
          const scale = POP_SCALE_FROM + (1 - POP_SCALE_FROM) * e;
          const alpha = e * EMOJI_ALPHA;
          const bleed = (1 - t) * POP_BLEED;
          drawEmoji(grid[r][c], x, y, scale, alpha, bleed);
          continue;
        }
        popAnims.delete(key);
      }
      drawEmoji(grid[r][c], x, y, 1, EMOJI_ALPHA, 0);
    }
  }
}

function drawFrame(fallEased, elapsed){
  ctx.drawImage(paperCanvas, 0, 0, W, H);

  const fallingSet = new Set();
  animPhase.fallers.forEach(f => fallingSet.add(f.toRow * GRID_X + f.col));

  animPhase.removed.forEach(cell => {
    const t = Math.min(elapsed / animPhase.fadeDur, 1);
    const e = 1 - Math.pow(1 - t, 2);
    const scale = 1 - e * 0.7;
    const alpha = (1 - e) * EMOJI_ALPHA;
    const bleed = e * 1.5;
    if(alpha <= 0.01) return;
    const x = OX + cell.col * CELL + CELL / 2;
    const y = OY + cell.row * CELL + CELL / 2;
    drawEmoji(cell.hex, x, y, Math.max(scale, 0.01), alpha, bleed);
  });

  for(let r = 0; r < GRID_Y; r++){
    for(let c = 0; c < GRID_X; c++){
      if(fallingSet.has(r * GRID_X + c)) continue;
      if(grid[r][c])
        drawEmoji(grid[r][c], OX + c * CELL + CELL/2, OY + r * CELL + CELL/2, 1, EMOJI_ALPHA, 0);
    }
  }

  animPhase.fallers.forEach(f => {
    const y = f.fromRow * CELL + (f.toRow - f.fromRow) * CELL * fallEased;
    drawEmoji(f.hex, OX + f.col * CELL + CELL/2, OY + y + CELL/2, 1, EMOJI_ALPHA, 0);
  });
}

function showEnd(){
  gameActive = false;
  clearBtn.classList.remove('visible', 'press');
  document.getElementById('mode-btn').classList.remove('hidden');
  const elapsed = performance.now() - startTime;
  const sec = Math.floor(elapsed / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  document.getElementById('end-time').textContent = `${m}:${String(s).padStart(2,'0')}`;

  let hex;
  if(easterMode === 'poop') hex = '1F4A9';
  else hex = END_ICON_HEX[currentCat] || '1F33F';
  const img = document.getElementById('end-icon-img');
  if(img) img.src = getEmojiUrl(hex);

  document.getElementById('end-swaps-count').textContent = swapCount;
  document.getElementById('end-manual-count').textContent = manualCount;
  document.getElementById('end').classList.add('visible');
}

function closeEnd(){
  document.getElementById('end').classList.remove('visible');
  easterMode = null;
  currentCat = 'home';
  pickRandomPool(currentCat);
  updateModeIcon();
  applyTheme();
  startGame();
}

const PENTA = [130.81,146.83,164.81,196.00,220.00,261.63,293.66,329.63,392.00,440.00];

function initAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }catch(e){}
}

function playNote(hex){
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();

  let hash = 0;
  for(let i = 0; i < hex.length; i++)
    hash = (hash * 31 + hex.charCodeAt(i)) | 0;

  let freq = PENTA[Math.abs(hash) % PENTA.length];

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;

  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.025, now + 0.06);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);

  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 2.2);
}

function playDissolve(){
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();

  const c = audioCtx, now = c.currentTime;

  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180, now);
  o.frequency.exponentialRampToValueAtTime(90, now + 1.0);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.018, now + 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
  o.connect(g).connect(c.destination);
  o.start(now); o.stop(now + 1.5);

  const o2 = c.createOscillator(), g2 = c.createGain();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(520, now);
  o2.frequency.exponentialRampToValueAtTime(780, now + 0.6);
  g2.gain.setValueAtTime(0, now);
  g2.gain.linearRampToValueAtTime(0.012, now + 0.15);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
  o2.connect(g2).connect(c.destination);
  o2.start(now); o2.stop(now + 1.1);
}

addEventListener('DOMContentLoaded', init);
</script>
</body>
