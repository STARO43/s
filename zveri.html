<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Сынка-косынка</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);transition:background .4s ease;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{
--bg:#000;
--fg:#fff;
--ui-bg:rgba(28,28,30,.72);
--ui-border:rgba(255,255,255,.08);
--ui-active:rgba(255,255,255,.12);
}
:root.light{
--bg:#f2f2f7;
--fg:#000;
--ui-bg:rgba(255,255,255,.78);
--ui-border:rgba(0,0,0,.06);
--ui-active:rgba(0,0,0,.08);
}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
canvas.locked{cursor:default}
#top-bar{
position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
display:flex;gap:4px;padding:4px;border-radius:100px;
background:var(--ui-bg);
border:.5px solid var(--ui-border);
backdrop-filter:blur(30px) saturate(180%);
-webkit-backdrop-filter:blur(30px) saturate(180%);
z-index:10;
box-shadow:0 2px 20px rgba(0,0,0,.25);
}
.tab{
border:none;background:transparent;color:var(--fg);
font-size:22px;width:48px;height:40px;border-radius:100px;
display:flex;align-items:center;justify-content:center;
cursor:pointer;padding:0;line-height:1;
opacity:.35;
transition:opacity .2s ease,background .2s ease,transform .15s ease;
font-family:inherit;
}
.tab:active{transform:scale(.92)}
.tab.active{opacity:1;background:var(--ui-active)}
#theme-btn{
position:fixed;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));
width:44px;height:44px;border-radius:100px;
background:var(--ui-bg);border:.5px solid var(--ui-border);
backdrop-filter:blur(30px) saturate(180%);
-webkit-backdrop-filter:blur(30px) saturate(180%);
color:var(--fg);font-size:18px;
display:flex;align-items:center;justify-content:center;
cursor:pointer;z-index:10;
box-shadow:0 2px 20px rgba(0,0,0,.25);
padding:0;font-family:inherit;line-height:1;
transition:transform .18s ease;
}
#theme-btn:active{transform:scale(.9)}
#down-btn{
position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:50%;
transform:translateX(-50%) translateY(100px) scale(.85);
width:56px;height:56px;border-radius:100px;
background:var(--ui-bg);border:.5px solid var(--ui-border);
backdrop-filter:blur(30px) saturate(180%);
-webkit-backdrop-filter:blur(30px) saturate(180%);
color:var(--fg);
display:flex;align-items:center;justify-content:center;
cursor:pointer;z-index:10;opacity:0;pointer-events:none;
transition:opacity .35s cubic-bezier(.32,.72,0,1),transform .35s cubic-bezier(.32,.72,0,1);
box-shadow:0 8px 40px rgba(0,0,0,.35);
padding:0;font-family:inherit;line-height:1;
}
#down-btn.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
#down-btn:active{transform:translateX(-50%) translateY(0) scale(.92)}

#win-screen{
position:fixed;inset:0;z-index:100;
background:var(--bg);
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:28px;padding:24px;
opacity:0;pointer-events:none;
transition:opacity .4s ease;
}
#win-screen.visible{opacity:1;pointer-events:auto}
.win-mode{
font-size:64px;line-height:1;
filter:drop-shadow(0 4px 24px rgba(120,180,255,.25));
}
.win-time{
font-size:64px;font-weight:200;letter-spacing:-2px;
font-variant-numeric:tabular-nums;
color:var(--fg);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
}
.win-label{
font-size:13px;letter-spacing:1.5px;text-transform:uppercase;
color:var(--fg);opacity:.4;font-weight:500;
margin-bottom:-18px;
}
.win-shoot{
border:none;
background:var(--ui-bg);
border:.5px solid var(--ui-border);
backdrop-filter:blur(30px) saturate(180%);
-webkit-backdrop-filter:blur(30px) saturate(180%);
color:var(--fg);
font-family:inherit;
font-size:15px;
font-weight:500;
padding:12px 22px;
border-radius:100px;
cursor:pointer;
transition:transform .18s ease,opacity .2s;
display:flex;align-items:center;gap:8px;
}
.win-shoot:active{transform:scale(.95)}
#win-close{
position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:50%;
transform:translateX(-50%);
width:56px;height:56px;border-radius:100px;
background:var(--ui-bg);border:.5px solid var(--ui-border);
backdrop-filter:blur(30px) saturate(180%);
-webkit-backdrop-filter:blur(30px) saturate(180%);
color:var(--fg);
display:flex;align-items:center;justify-content:center;
cursor:pointer;z-index:110;
box-shadow:0 8px 40px rgba(0,0,0,.35);
padding:0;
transition:transform .18s ease;
}
#win-close:active{transform:translateX(-50%) scale(.92)}
#flash{
position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200;
transition:opacity .15s ease;
}
#flash.on{opacity:.85;transition:none}
#toast{
position:fixed;bottom:calc(max(28px,env(safe-area-inset-bottom)) + 80px);left:50%;
transform:translateX(-50%) translateY(20px);
background:var(--ui-bg);
border:.5px solid var(--ui-border);
backdrop-filter:blur(30px) saturate(180%);
-webkit-backdrop-filter:blur(30px) saturate(180%);
color:var(--fg);
font-size:13px;
padding:8px 16px;
border-radius:100px;
opacity:0;
pointer-events:none;
transition:opacity .3s ease,transform .3s ease;
z-index:150;
white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="top-bar">
<button class="tab active" data-cat="home">🐱</button>
<button class="tab" data-cat="wild">🐻</button>
<button class="tab" data-cat="sea">🐬</button>
<button class="tab" data-cat="food">🍎</button>
</div>
<button id="theme-btn">🌙</button>
<button id="down-btn">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 5v14M5 12l7 7 7-7"/>
</svg>
</button>

<div id="win-screen">
<div class="win-mode" id="win-mode">🐱</div>
<div class="win-label">Время</div>
<div class="win-time" id="win-time">0:00</div>
<button class="win-shoot" id="win-shoot">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
<circle cx="12" cy="13" r="4"/>
</svg>
Скриншот
</button>
<button id="win-close">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M18 6L6 18M6 6l12 12"/>
</svg>
</button>
</div>

<div id="flash"></div>
<div id="toast"></div>

<script>
// === Запрет зума жестами и двойным тапом ===
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

const CATS={
home:['🐱','🐶','🐷','🐮','🐰','🐔','🐴','🦃','🐤','🦆','🐂','🦜','🐝','🐟','🐓'],
wild:['🐻','🦊','🐺','🐗','🦌','🦔','🐸','🐍','🦉','🦅','🐼','🐯','🦁','🐵','🦇','🐀'],
sea:['🐙','🦑','🦐','🦞','🦀','🐡','🐠','🐬','🐳','🐋','🦈','🐊','🦭','🐚','🪼','🐢'],
food:['🍎','🍌','🍇','🍓','🍒','🍑','🍍','🥝','🍉','🍊','🍋','🥭','🍐','🍅','🥥','🍈','🍕','🥕','🥒','🥐','☕','🧀','🍚','🍩'],
poop:['💩']
};
const MODE_ICON={home:'🐱',wild:'🐻',sea:'🐳',food:'🍌',poop:'💩'};

const DPR=Math.min(window.devicePixelRatio||1,2);
const PENT=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99,880.00];
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||window.matchMedia('(pointer:coarse)').matches;
const GRID=IS_MOBILE?5:10;

let canvas,ctx,bgCanvas;
let W=0,H=0,CELL=0,OX=0,OY=0;
let grid=[];
let currentCat='home',currentTheme='dark';
let audioCtx=null,isLocked=false,isAnimating=false;
const popAnims=new Map();
let animPhase=null;
let needsRender=true;
let startTime=0;
let gameActive=false;
let lastTapTime=0;
let lastHoverCell=-1;

const EMOJI_CACHE=new Map();
const EMOJI_SIZE=128;

function getEmojiSprite(animal){
let c=EMOJI_CACHE.get(animal);
if(c)return c;
c=document.createElement('canvas');
c.width=EMOJI_SIZE;
c.height=EMOJI_SIZE;
const cx=c.getContext('2d');
cx.font=`${Math.floor(EMOJI_SIZE*.82)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
cx.textAlign='center';
cx.textBaseline='middle';
cx.fillText(animal,EMOJI_SIZE/2,EMOJI_SIZE/2+2);
EMOJI_CACHE.set(animal,c);
return c;
}

function init(){
canvas=document.getElementById('field');
ctx=canvas.getContext('2d',{alpha:false});
resize();
rebuildBg();
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('touchstart',onTouch,{passive:false});

document.getElementById('down-btn').addEventListener('click',applyDown);
document.getElementById('theme-btn').addEventListener('click',onThemeClick);
document.getElementById('win-shoot').addEventListener('click',takeScreenshot);
document.getElementById('win-close').addEventListener('click',closeWin);
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchCat(t.dataset.cat)));
window.addEventListener('resize',()=>{resize();rebuildBg();requestStaticRender()});
startGame();
rafLoop();
}

function startGame(){
for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++)grid[r][c]=null;
popAnims.clear();
isLocked=false;
isAnimating=false;
animPhase=null;
startTime=performance.now();
gameActive=true;
lastHoverCell=-1;
updateUI();
requestStaticRender();
}

function resize(){
W=window.innerWidth;H=window.innerHeight;
canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
canvas.style.width=W+'px';canvas.style.height=H+'px';
ctx.setTransform(DPR,0,0,DPR,0,0);
const padTop=Math.max(84,window.innerHeight*0.13);
const padBottom=Math.max(96,window.innerHeight*0.15);
const availH=H-padTop-padBottom;
const availW=W-32;
CELL=Math.min(availW/GRID,availH/GRID);
OX=(W-CELL*GRID)/2;
OY=padTop+(availH-CELL*GRID)/2;
grid=Array(GRID).fill(null).map(()=>Array(GRID).fill(null));
}

function rebuildBg(){
bgCanvas=document.createElement('canvas');
bgCanvas.width=Math.floor(W*DPR);bgCanvas.height=Math.floor(H*DPR);
const b=bgCanvas.getContext('2d',{alpha:false});
b.setTransform(DPR,0,0,DPR,0,0);
b.fillStyle=currentTheme==='dark'?'#000':'#f2f2f7';
b.fillRect(0,0,W,H);
}

function onThemeClick(){
const now=performance.now();
if(now-lastTapTime<350){
lastTapTime=0;
if(currentCat!=='poop'){
switchCat('poop');
showToast('💩');
}
return;
}
lastTapTime=now;
setTimeout(()=>{
if(performance.now()-lastTapTime>=340){
toggleTheme();
}
},360);
}

function toggleTheme(){
currentTheme=currentTheme==='dark'?'light':'dark';
document.documentElement.classList.toggle('light',currentTheme==='light');
document.getElementById('theme-btn').textContent=currentTheme==='dark'?'🌙':'☀️';
const meta=document.querySelector('meta[name="theme-color"]');
if(meta)meta.setAttribute('content',currentTheme==='dark'?'#000000':'#f2f2f7');
rebuildBg();
requestStaticRender();
}

let toastTimer=null;
function showToast(text){
const t=document.getElementById('toast');
t.textContent=text;
t.classList.add('show');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove('show'),1200);
}

function onTouch(e){
e.preventDefault();
const t=e.touches[0];
if(!t)return;
tapAt(t.clientX,t.clientY);
}

function onDown(e){
tapAt(e.clientX,e.clientY);
}

function onMove(e){
if(IS_MOBILE)return;
if(!gameActive)return;
if(isLocked||isAnimating)return;
const col=Math.floor((e.clientX-OX)/CELL);
const row=Math.floor((e.clientY-OY)/CELL);
if(col<0||col>=GRID||row<0||row>=GRID)return;
const idx=row*GRID+col;
if(idx===lastHoverCell)return;
lastHoverCell=idx;
if(grid[row][col])return;
if(!audioCtx)initAudio();
const all=CATS[currentCat];
const animal=all[(Math.random()*all.length)|0];
grid[row][col]=animal;
popAnims.set(idx,{start:performance.now(),duration:520});
playNote(animal);
checkFull();
if(!isAnimating)requestStaticRender();
}

function tapAt(cx,cy){
if(!gameActive)return;
if(isLocked||isAnimating)return;
const col=Math.floor((cx-OX)/CELL);
const row=Math.floor((cy-OY)/CELL);
if(col<0||col>=GRID||row<0||row>=GRID)return;
if(!audioCtx)initAudio();
const all=CATS[currentCat];
const animal=all[(Math.random()*all.length)|0];
const idx=row*GRID+col;

if(IS_MOBILE){
grid[row][col]=animal;
popAnims.set(idx,{start:performance.now(),duration:520});
playNote(animal);
checkFull();
if(!isAnimating)requestStaticRender();
}else{
if(!grid[row][col])return;
grid[row][col]=animal;
popAnims.set(idx,{start:performance.now(),duration:520});
playNote(animal);
requestStaticRender();
}
}

function switchCat(cat){
if(!CATS[cat])return;
if(isAnimating)return;
if(cat===currentCat&&cat!=='poop')return;
currentCat=cat;
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.cat===cat));
startGame();
}

function checkFull(){
for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++)if(!grid[r][c])return;
isLocked=true;updateUI();
}

function updateUI(){
const btn=document.getElementById('down-btn');
if(isLocked&&gameActive){btn.classList.add('visible');canvas.classList.add('locked')}
else{btn.classList.remove('visible');canvas.classList.remove('locked')}
}

function applyDown(){
if(!gameActive)return;
if(!isLocked||isAnimating)return;
const toRemove=new Set();
for(let c=0;c<GRID;c++){
let s=0;
while(s<GRID){
const v=grid[s][c];
if(!v){s++;continue}
let e=s+1;
while(e<GRID&&grid[e][c]===v)e++;
if(e-s>=2)for(let r=s;r<e;r++)toRemove.add(r*GRID+c);
s=e;
}
}
for(let r=0;r<GRID;r++){
let s=0;
while(s<GRID){
const v=grid[r][s];
if(!v){s++;continue}
let e=s+1;
while(e<GRID&&grid[r][e]===v)e++;
if(e-s>=2)for(let c=s;c<e;c++)toRemove.add(r*GRID+c);
s=e;
}
}

if(toRemove.size===0){
isLocked=false;
updateUI();
showWin();
return;
}

isAnimating=true;
const now=performance.now();
const removed=[];
toRemove.forEach(idx=>{
const r=Math.floor(idx/GRID);const c=idx%GRID;
removed.push({row:r,col:c,animal:grid[r][c],idx});
grid[r][c]=null;popAnims.delete(idx);
});
const finalGrid=Array(GRID).fill(null).map(()=>Array(GRID).fill(null));
for(let c=0;c<GRID;c++){
const existing=[];
for(let r=0;r<GRID;r++)if(grid[r][c])existing.push(grid[r][c]);
for(let i=0;i<existing.length;i++)finalGrid[GRID-existing.length+i][c]=existing[i];
}
const fallers=[];
for(let c=0;c<GRID;c++){
const existing=[];
for(let r=0;r<GRID;r++)if(grid[r][c])existing.push({row:r,animal:grid[r][c]});
const n=existing.length;
for(let i=0;i<n;i++){
const fromRow=existing[i].row;const toRow=GRID-n+i;
if(fromRow!==toRow)fallers.push({fromRow,toRow,col:c,animal:existing[i].animal,startY:fromRow*CELL,endY:toRow*CELL});
}
}
for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++)grid[r][c]=finalGrid[r][c];
playRemoveSound();
animPhase={start:now,removed,fallers,elasticD:380,fallD:400,fallDelay:200};
}

function elasticOut(t){
if(t<=0)return 0;
if(t>=1)return 1;
const c=1.70158;
const t1=t-1;
return 1+(c+1)*t1*t1*t1+c*t1*t1;
}

function rafLoop(){
if(isAnimating&&animPhase){
const elapsed=performance.now()-animPhase.start;
const fallT=Math.max(0,Math.min((elapsed-animPhase.fallDelay)/animPhase.fallD,1));
const fallEased=1-Math.pow(1-fallT,3);
drawAnimFrame(fallEased,elapsed);
if(elapsed>animPhase.fallD+animPhase.fallDelay+60){
isAnimating=false;animPhase=null;popAnims.clear();
checkFull();
const hasEmpty=grid.some(row=>row.some(cell=>!cell));
if(hasEmpty)isLocked=false;
updateUI();
requestStaticRender();
}
}else{
if(popAnims.size>0){
const now=performance.now();
let anyActive=false;
popAnims.forEach(a=>{if(now-a.start<a.duration)anyActive=true;});
if(anyActive){renderStatic();}
else{popAnims.clear();renderStatic();}
}else if(needsRender){
renderStatic();
needsRender=false;
}
}
requestAnimationFrame(rafLoop);
}

function requestStaticRender(){needsRender=true}

function drawSprite(animal,x,y,scale,alpha,glow){
const sp=getEmojiSprite(animal);
const size=CELL*.86*scale;
const half=size/2;
ctx.globalAlpha=alpha;
if(glow>0){
ctx.shadowColor='rgba(120,180,255,.9)';
ctx.shadowBlur=glow;
}
ctx.drawImage(sp,x-half,y-half,size,size);
ctx.shadowBlur=0;
ctx.globalAlpha=1;
}

function renderStatic(){
ctx.drawImage(bgCanvas,0,0,W,H);
const now=performance.now();
let anyPop=false;
for(let r=0;r<GRID;r++){
for(let c=0;c<GRID;c++){
if(!grid[r][c])continue;
const key=r*GRID+c;
const x=OX+c*CELL+CELL/2;
const y=OY+r*CELL+CELL/2;
const pop=popAnims.get(key);
if(pop){
const t=Math.min((now-pop.start)/pop.duration,1);
if(t<1){
anyPop=true;
const eased=elasticOut(t);
const scale=eased;
const alpha=Math.min(1,t*2.5);
const glow=14*(1-t);
drawSprite(grid[r][c],x,y,scale,alpha,glow);
continue;
}else{
popAnims.delete(key);
}
}
drawSprite(grid[r][c],x,y,1,1,0);
}
}
if(!anyPop&&popAnims.size>0)popAnims.clear();
}

function drawAnimFrame(fallEased,elapsed){
ctx.drawImage(bgCanvas,0,0,W,H);
const fallingSet=new Set();
for(let i=0;i<animPhase.fallers.length;i++)fallingSet.add(animPhase.fallers[i].toRow*GRID+animPhase.fallers[i].col);

if(animPhase.removed.length){
for(let i=0;i<animPhase.removed.length;i++){
const cell=animPhase.removed[i];
const t=Math.min(elapsed/animPhase.elasticD,1);
const eased=elasticOut(t);
const scale=t<.5?(1+eased*.3):(1-eased)*2;
const alpha=Math.max(0,1-t*1.3);
if(alpha<=0||scale<=0)continue;
const x=OX+cell.col*CELL+CELL/2;
const y=OY+cell.row*CELL+CELL/2;
drawSprite(cell.animal,x,y,Math.max(scale,.01),alpha,0);
}
}

for(let r=0;r<GRID;r++){
for(let c=0;c<GRID;c++){
const idx=r*GRID+c;
if(fallingSet.has(idx))continue;
if(grid[r][c])drawSprite(grid[r][c],OX+c*CELL+CELL/2,OY+r*CELL+CELL/2,1,1,0);
}
}

if(animPhase.fallers.length){
for(let i=0;i<animPhase.fallers.length;i++){
const f=animPhase.fallers[i];
const y=f.startY+(f.endY-f.startY)*fallEased;
drawSprite(f.animal,OX+f.col*CELL+CELL/2,OY+y+CELL/2,1,1,0);
}
}
}

function showWin(){
gameActive=false;
const elapsed=performance.now()-startTime;
const sec=Math.floor(elapsed/1000);
const m=Math.floor(sec/60);
const s=sec%60;
document.getElementById('win-time').textContent=`${m}:${String(s).padStart(2,'0')}`;
document.getElementById('win-mode').textContent=MODE_ICON[currentCat]||'🐱';
document.getElementById('win-screen').classList.add('visible');
document.getElementById('down-btn').classList.remove('visible');
}

function closeWin(){
document.getElementById('win-screen').classList.remove('visible');
currentCat='home';
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.cat==='home'));
startGame();
}

function takeScreenshot(){
const flash=document.getElementById('flash');
flash.classList.add('on');
setTimeout(()=>flash.classList.remove('on'),80);

const w=W,h=H;
const c=document.createElement('canvas');
c.width=w*DPR;c.height=h*DPR;
const cx=c.getContext('2d');
cx.setTransform(DPR,0,0,DPR,0,0);
cx.fillStyle=currentTheme==='dark'?'#000':'#f2f2f7';
cx.fillRect(0,0,w,h);

const cardW=Math.min(w-48,360);
const cardH=Math.min(h*0.7,480);
const cardX=(w-cardW)/2;
const cardY=(h-cardH)/2;

cx.fillStyle=currentTheme==='dark'?'#1c1c1e':'#ffffff';
cx.shadowColor='rgba(0,0,0,.35)';
cx.shadowBlur=40;
cx.shadowOffsetY=10;
roundRect(cx,cardX,cardY,cardW,cardH,28);
cx.fill();
cx.shadowBlur=0;cx.shadowOffsetY=0;

cx.textAlign='center';
cx.textBaseline='middle';

const icon=document.getElementById('win-mode').textContent;
cx.font=`72px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
cx.fillText(icon,w/2,cardY+cardH*0.22);

cx.fillStyle=currentTheme==='dark'?'rgba(255,255,255,.4)':'rgba(0,0,0,.4)';
cx.font=`500 12px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif`;
cx.fillText('В Р Е М Я',w/2,cardY+cardH*0.42);

cx.fillStyle=currentTheme==='dark'?'#fff':'#000';
cx.font=`200 64px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif`;
cx.fillText(document.getElementById('win-time').textContent,w/2,cardY+cardH*0.58);

cx.font=`400 13px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif`;
cx.fillStyle=currentTheme==='dark'?'rgba(255,255,255,.35)':'rgba(0,0,0,.35)';
cx.fillText('Сынка-косынка',w/2,cardY+cardH*0.82);

c.toBlob(blob=>{
if(!blob)return;
const file=new File([blob],'headscarf-win.png',{type:'image/png'});
if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
navigator.share({files:[file],title:'Сынка-косынка'}).catch(()=>download(blob));
}else{
download(blob);
}
},'image/png');
}

function download(blob){
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='headscarf-win.png';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),2000);
showToast('Сохранено');
}

function roundRect(c,x,y,w,h,r){
c.beginPath();
c.moveTo(x+r,y);
c.arcTo(x+w,y,x+w,y+h,r);
c.arcTo(x+w,y+h,x,y+h,r);
c.arcTo(x,y+h,x,y,r);
c.arcTo(x,y,x+w,y,r);
c.closePath();
}

function initAudio(){
try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}catch(e){}
}

function playNote(animal){
if(!audioCtx)return;
if(audioCtx.state==='suspended')audioCtx.resume();
let hash=0;
for(let i=0;i<animal.length;i++)hash=(hash*31+animal.charCodeAt(i))|0;
const freq=PENT[Math.abs(hash)%PENT.length];
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='sine';osc.frequency.value=freq;
const now=audioCtx.currentTime;
gain.gain.setValueAtTime(.05,now);
gain.gain.exponentialRampToValueAtTime(.001,now+.45);
osc.connect(gain).connect(audioCtx.destination);
osc.start(now);osc.stop(now+.45);
}

function playRemoveSound(){
if(!audioCtx)return;
if(audioCtx.state==='suspended')audioCtx.resume();
const c=audioCtx,now=c.currentTime;
const dur=0.45;
const len=Math.max(1,Math.floor(c.sampleRate*dur));
const buf=c.createBuffer(1,len,c.sampleRate);
const d=buf.getChannelData(0);
for(let i=0;i<len;i++){
const env=Math.sin(Math.PI*i/len);
const e2=Math.pow(env,1.4);
d[i]=(Math.random()*2-1)*e2;
}
const src=c.createBufferSource();src.buffer=buf;
const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;lp.Q.value=0.5;
const g=c.createGain();g.gain.value=0.055;
src.connect(lp).connect(g).connect(c.destination);
src.start(now);src.stop(now+dur);
const o=c.createOscillator(),og=c.createGain();
o.type='sine';
o.frequency.setValueAtTime(220,now);
o.frequency.exponentialRampToValueAtTime(110,now+0.4);
og.gain.setValueAtTime(0,now);
og.gain.linearRampToValueAtTime(0.03,now+0.05);
og.gain.exponentialRampToValueAtTime(0.0001,now+0.42);
o.connect(og).connect(c.destination);
o.start(now);o.stop(now+0.45);
const o2=c.createOscillator(),og2=c.createGain();
o2.type='sine';
o2.frequency.setValueAtTime(180,now);
o2.frequency.exponentialRampToValueAtTime(320,now+0.35);
og2.gain.setValueAtTime(0,now);
og2.gain.linearRampToValueAtTime(0.025,now+0.08);
og2.gain.exponentialRampToValueAtTime(0.0001,now+0.4);
o2.connect(og2).connect(c.destination);
o2.start(now);o2.stop(now+0.45);
}

window.addEventListener('DOMContentLoaded',init);
