<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Солнечная система</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            background: #03040a; height: 100%; width: 100%;
            font-family: 'Orbitron', 'Segoe UI', 'Arial', sans-serif;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        canvas { display: block; touch-action: none; }

        #clock {
            position: fixed;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            width: 150px; height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
            touch-action: none;
            opacity: 0.75;
        }
        #clock svg { position: absolute; inset: 0; width: 100%; height: 100%; }

        .min-tick { stroke: rgba(255,255,255,0.2); stroke-width: 0.5; stroke-linecap: round; }
        .hour-tick { stroke: rgba(255,255,255,0.5); stroke-width: 0.9; stroke-linecap: round; }
        .hour-tick.qtr { stroke: rgba(255,255,255,0.7); stroke-width: 1.2; }
        .numeral { fill: rgba(255,255,255,0.65); font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
        .hand { stroke-linecap: round; }
        #hourHand { stroke: rgba(255,255,255,0.85); stroke-width: 2.8; }
        #minuteHand { stroke: rgba(255,255,255,0.7); stroke-width: 1.5; }
        .center-ring { fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 0.8; }
        .center-dot { fill: rgba(255,255,255,0.8); }
        .brand { fill: rgba(255,255,255,0.4); font-family: 'Orbitron', sans-serif; font-size: 3.5px; font-weight: 600; text-anchor: middle; letter-spacing: 2px; }

        #datePlate {
            position: fixed; top: 10px; right: 10px;
            padding: 5px 10px 7px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            z-index: 50; opacity: 0.85;
            text-align: center; line-height: 1.15;
            pointer-events: none; white-space: nowrap;
        }
        #dpDate { font-size: 9px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.6); text-transform: lowercase; }
        #dpYear { margin-top: 3px; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.85); }

        #scaleInfo {
            position: fixed; bottom: 14px; left: 14px;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 9px; letter-spacing: 1px;
            color: rgba(255,255,255,0.5);
            z-index: 50; pointer-events: none;
            font-family: 'Orbitron', sans-serif;
            line-height: 1.4;
        }

        #homeBtn {
            position: fixed; top: 10px; left: 10px;
            padding: 6px 12px;
            border-radius: 10px;
            background: rgba(255, 200, 80, 0.12);
            border: 1px solid rgba(255, 200, 100, 0.35);
            color: #ffdd88;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            z-index: 60;
            cursor: pointer;
            opacity: 0.85;
        }
        #homeBtn:active { background: rgba(255, 200, 80, 0.3); }

        #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; font-size: 14px; text-align: center; padding: 20px; z-index: 100; }
    </style>
</head>
<body>

    <div id="clock">
        <svg viewBox="0 0 130 130">
            <g id="ticks"></g>
            <g id="numerals"></g>
            <line id="hourHand" class="hand" x1="65" y1="65" x2="65" y2="36" />
            <line id="minuteHand" class="hand" x1="65" y1="65" x2="65" y2="18" />
            <g id="secondHandGroup">
                <line x1="65" y1="65" x2="65" y2="74" stroke="#e63946" stroke-width="1.4" stroke-linecap="round" />
                <line x1="65" y1="65" x2="65" y2="22" stroke="#e63946" stroke-width="0.9" stroke-linecap="round" />
                <circle cx="65" cy="65" r="2" fill="#e63946" />
                <circle cx="65" cy="65" r="0.7" fill="#ffffff" />
            </g>
            <circle class="center-ring" cx="65" cy="65" r="2.6" />
            <circle class="center-dot" cx="65" cy="65" r="1.1" />
            <text class="brand" x="65" y="44">КОСМОС</text>
        </svg>
    </div>

    <div id="datePlate">
        <div id="dpDate">—</div>
        <div id="dpYear">—</div>
    </div>

    <div id="scaleInfo">—</div>

    <button id="homeBtn">◉ ЗЕМЛЯ</button>

    <div id="err">Не удалось запустить 3D-графику.<br>Проверьте, что WebGL включён.</div>

    <script src="https://unpkg.com/three@0.126.0/build/three.min.js"></script>

    <script>
    (function () {
        'use strict';

        if (typeof THREE === 'undefined') {
            document.getElementById('err').style.display = 'flex';
            document.getElementById('err').innerHTML = 'Не удалось загрузить Three.js.<br>Проверьте интернет.';
            return;
        }
        try {
            var testCanvas = document.createElement('canvas');
            var gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
            if (!gl) throw new Error('no webgl');
        } catch (e) {
            document.getElementById('err').style.display = 'flex';
            return;
        }

        // ===== Константы =====
        var SUN_RADIUS = 69.6;
        var DEG = Math.PI / 180;
        var AU = 14960;
        var TIME_SMOOTH = 0.08;

        // ===== Сцена =====
        var scene = new THREE.Scene();
        scene.background = new THREE.Color(0x03040a);

        var camera = new THREE.PerspectiveCamera(
            50, window.innerWidth / window.innerHeight, 0.5, 2000000
        );

        var renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: 'high-performance',
            logarithmicDepthBuffer: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.sortObjects = true;
        document.body.appendChild(renderer.domElement);

        var labelCanvas = document.createElement('canvas');
        labelCanvas.style.position = 'fixed';
        labelCanvas.style.inset = '0';
        labelCanvas.style.pointerEvents = 'none';
        labelCanvas.style.zIndex = '40';
        document.body.appendChild(labelCanvas);
        var labelCtx = labelCanvas.getContext('2d');

        // ===== Якорь =====
        var anchorObject = null;
        var anchorName = 'ВСЯ СИСТЕМА';
        var userOffset = new THREE.Vector3(0, AU * 0.8, AU * 2);

        // ===== Управление =====
        var isRotating = false, lastRotX = 0, lastRotY = 0;

        function onPointerDown(e) {
            if (e.target && e.target.classList && e.target.classList.contains('label')) return;
            var p = e.touches ? e.touches[0] : e;
            isRotating = true;
            lastRotX = p.clientX;
            lastRotY = p.clientY;
        }
        function onPointerMove(e) {
            if (!isRotating) return;
            var p = e.touches ? e.touches[0] : e;
            var dx = p.clientX - lastRotX;
            var dy = p.clientY - lastRotY;
            lastRotX = p.clientX;
            lastRotY = p.clientY;

            var sph = new THREE.Spherical().setFromVector3(userOffset);
            var speed = Math.min(0.008, 1.5 / Math.max(sph.radius, 1));
            sph.theta -= dx * speed;
            sph.phi -= dy * speed;
            sph.phi = Math.max(0.05, Math.min(Math.PI - 0.05, sph.phi));
            userOffset.setFromSpherical(sph);
        }
        function onPointerUp() { isRotating = false; }

        function onWheel(e) {
            e.preventDefault();
            var dist = userOffset.length();
            dist *= (1 + Math.sign(e.deltaY) * 0.15);
            dist = Math.max(0.5, Math.min(1500000, dist));
            userOffset.normalize().multiplyScalar(dist);
        }

        var pinchDist = 0;
        function onTouchStartPinch(e) {
            if (e.touches.length === 2) {
                var dx = e.touches[0].clientX - e.touches[1].clientX;
                var dy = e.touches[0].clientY - e.touches[1].clientY;
                pinchDist = Math.hypot(dx, dy);
                isRotating = false;
            }
        }
        function onTouchMovePinch(e) {
            if (e.touches.length === 2 && pinchDist > 0) {
                e.preventDefault();
                var dx = e.touches[0].clientX - e.touches[1].clientX;
                var dy = e.touches[0].clientY - e.touches[1].clientY;
                var newDist = Math.hypot(dx, dy);
                var scale = pinchDist / newDist;
                pinchDist = newDist;
                var dist = userOffset.length() * scale;
                dist = Math.max(0.5, Math.min(1500000, dist));
                userOffset.normalize().multiplyScalar(dist);
            }
        }
        function onTouchEndPinch(e) {
            if (e.touches.length < 2) pinchDist = 0;
        }

        renderer.domElement.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        renderer.domElement.addEventListener('wheel', onWheel, { passive: false });
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });
        renderer.domElement.addEventListener('touchmove', onPointerMove, { passive: true });
        renderer.domElement.addEventListener('touchend', onPointerUp);
        renderer.domElement.addEventListener('touchstart', onTouchStartPinch, { passive: true });
        renderer.domElement.addEventListener('touchmove', onTouchMovePinch, { passive: false });
        renderer.domElement.addEventListener('touchend', onTouchEndPinch);

        // ===== Свет =====
        var sunLight = new THREE.DirectionalLight(0xfff5e0, 1.7);
        scene.add(sunLight);
        scene.add(sunLight.target);
        scene.add(new THREE.AmbientLight(0x101828, 0.12));

        // ===== Солнце =====
        var sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(SUN_RADIUS, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffdd88 })
        );
        scene.add(sunMesh);

        function makeGlowTexture(inner, mid, outer) {
            var c = document.createElement('canvas');
            c.width = c.height = 128;
            var ctx = c.getContext('2d');
            var g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            g.addColorStop(0.0, inner);
            g.addColorStop(0.4, mid);
            g.addColorStop(1.0, outer);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }

        var sunGlow = new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: makeGlowTexture('rgba(255,255,255,1)', 'rgba(255,190,110,0.5)', 'rgba(255,110,40,0)'),
                color: 0xffcc88,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                depthTest: true,
                transparent: true,
                opacity: 0.85
            })
        );
        sunGlow.scale.set(SUN_RADIUS * 6, SUN_RADIUS * 6, 1);
        sunGlow.renderOrder = 1;
        scene.add(sunGlow);

        // ===== Звёзды =====
        (function createStars() {
            var count = 2500;
            var geo = new THREE.BufferGeometry();
            var pos = new Float32Array(count * 3);
            for (var i = 0; i < count; i++) {
                var r = 1000000 + Math.random() * 500000;
                var t = Math.random() * Math.PI * 2;
                var p = Math.acos(Math.random() * 2 - 1);
                pos[i * 3]     = r * Math.sin(p) * Math.cos(t);
                pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
                pos[i * 3 + 2] = r * Math.cos(p);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
                size: 900, color: 0xffffff, transparent: true,
                blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            })));
        })();

        // ===== Текстуры =====
        function addRotationMark(ctx, W, H) {
            ctx.fillStyle = 'rgba(255, 100, 50, 0.9)';
            ctx.beginPath();
            ctx.arc(W * 0.3, H * 0.5, Math.min(W, H) * 0.04, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 200, 150, 0.8)';
            ctx.beginPath();
            ctx.arc(W * 0.3, H * 0.5, Math.min(W, H) * 0.02, 0, Math.PI * 2);
            ctx.fill();
        }

        function makeRockyTexture(c1, c2, craterCount) {
            var cv = document.createElement('canvas');
            cv.width = 512; cv.height = 256;
            var ctx = cv.getContext('2d');
            ctx.fillStyle = c1;
            ctx.fillRect(0, 0, 512, 256);
            for (var i = 0; i < craterCount; i++) {
                var x = Math.random() * 512;
                var y = Math.random() * 256;
                var r = 2 + Math.random() * 14;
                ctx.fillStyle = Math.random() > 0.5 ? c2 : 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            addRotationMark(ctx, 512, 256);
            return new THREE.CanvasTexture(cv);
        }

        function makeCloudyTexture(c1, c2, bandCount) {
            var cv = document.createElement('canvas');
            cv.width = 512; cv.height = 256;
            var ctx = cv.getContext('2d');
            var grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, c2);
            grad.addColorStop(0.5, c1);
            grad.addColorStop(1, c2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 256);
            for (var i = 0; i < bandCount; i++) {
                var y = Math.random() * 256;
                var h = 2 + Math.random() * 12;
                ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + Math.random() * 0.15) + ')';
                ctx.fillRect(0, y, 512, h);
            }
            addRotationMark(ctx, 512, 256);
            return new THREE.CanvasTexture(cv);
        }

        // =====================================================================
        // РЕАЛИСТИЧНАЯ ЗЕМЛЯ
        // =====================================================================
        function makeRealisticEarthTexture() {
            var W = 2048, H = 1024;
            var cv = document.createElement('canvas');
            cv.width = W; cv.height = H;
            var ctx = cv.getContext('2d');

            function xy(lon, lat) {
                return { x: (lon + 180) / 360 * W, y: (90 - lat) / 180 * H };
            }

            function poly(points, fillStyle, strokeStyle) {
                ctx.beginPath();
                for (var i = 0; i < points.length; i++) {
                    var p = xy(points[i][0], points[i][1]);
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.closePath();
                if (fillStyle) { ctx.fillStyle = fillStyle; ctx.fill(); }
                if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.lineWidth = 2; ctx.stroke(); }
            }

            var oceanGrad = ctx.createLinearGradient(0, 0, 0, H);
            oceanGrad.addColorStop(0.00, '#08182a');
            oceanGrad.addColorStop(0.10, '#0c2440');
            oceanGrad.addColorStop(0.30, '#144068');
            oceanGrad.addColorStop(0.50, '#1a5080');
            oceanGrad.addColorStop(0.70, '#144068');
            oceanGrad.addColorStop(0.90, '#0c2440');
            oceanGrad.addColorStop(1.00, '#08182a');
            ctx.fillStyle = oceanGrad;
            ctx.fillRect(0, 0, W, H);

            for (var i = 0; i < 300; i++) {
                var x = Math.random() * W;
                var y = Math.random() * H;
                var r = 30 + Math.random() * 150;
                var g2 = ctx.createRadialGradient(x, y, 0, x, y, r);
                g2.addColorStop(0, 'rgba(60, 120, 180, 0.06)');
                g2.addColorStop(1, 'rgba(60, 120, 180, 0)');
                ctx.fillStyle = g2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            var landGreen = '#3d6a3a';
            var landDark = '#2e5a2e';
            var landDry = '#7a8a4a';
            var desert = '#c8b080';
            var desert2 = '#b89a68';
            var ice = '#eef4ff';
            var iceGray = '#d0dce8';
            var coastLine = 'rgba(20, 40, 20, 0.35)';

            var northAmerica = [
                [-168, 65], [-160, 71], [-148, 70], [-135, 70], [-120, 71], [-105, 69],
                [-95, 68], [-85, 70], [-78, 68], [-72, 63], [-65, 60], [-60, 55],
                [-55, 52], [-58, 48], [-63, 46], [-68, 44], [-70, 42], [-74, 40],
                [-76, 36], [-80, 32], [-80, 25], [-83, 29], [-88, 30], [-92, 29],
                [-95, 28], [-97, 26], [-95, 19], [-90, 16], [-85, 13], [-82, 9],
                [-79, 8], [-83, 14], [-88, 17], [-95, 18], [-102, 20], [-108, 24],
                [-113, 29], [-117, 33], [-122, 37], [-124, 41], [-124, 46],
                [-125, 50], [-130, 55], [-140, 59], [-150, 59], [-160, 58], [-166, 60]
            ];
            poly(northAmerica, landGreen, coastLine);

            (function () {
                var p1 = xy(-115, 33);
                var p2 = xy(-100, 26);
                ctx.fillStyle = 'rgba(200, 170, 110, 0.4)';
                ctx.beginPath();
                ctx.ellipse((p1.x + p2.x) / 2, (p1.y + p2.y) / 2,
                            Math.abs(p2.x - p1.x) / 2, Math.abs(p2.y - p1.y) / 2,
                            0, 0, Math.PI * 2);
                ctx.fill();
            })();

            poly([
                [-58, 82], [-40, 83], [-25, 82], [-18, 78], [-20, 72],
                [-30, 68], [-42, 60], [-50, 63], [-55, 70], [-58, 78]
            ], ice, 'rgba(180, 200, 220, 0.5)');

            var southAmerica = [
                [-79, 9], [-76, 11], [-70, 12], [-62, 11], [-55, 6], [-50, 2],
                [-48, -1], [-44, -3], [-35, -6], [-37, -13], [-39, -18],
                [-42, -23], [-48, -28], [-53, -34], [-58, -38], [-63, -42],
                [-66, -47], [-69, -52], [-71, -55], [-74, -52], [-73, -45],
                [-72, -38], [-71, -30], [-70, -23], [-70, -18], [-75, -14],
                [-79, -8], [-81, -2], [-80, 3]
            ];
            poly(southAmerica, landGreen, coastLine);

            (function () {
                var p1 = xy(-70, 2);
                var p2 = xy(-50, -8);
                ctx.fillStyle = 'rgba(30, 80, 30, 0.5)';
                ctx.beginPath();
                ctx.ellipse((p1.x + p2.x) / 2, (p1.y + p2.y) / 2,
                            Math.abs(p2.x - p1.x) / 2, Math.abs(p2.y - p1.y) / 2,
                            0, 0, Math.PI * 2);
                ctx.fill();
            })();

            ctx.strokeStyle = 'rgba(120, 90, 60, 0.55)';
            ctx.lineWidth = 6;
            ctx.beginPath();
            var andes = [[-78, 5], [-77, -5], [-74, -15], [-70, -25], [-70, -35], [-72, -45], [-74, -52]];
            for (var i = 0; i < andes.length; i++) {
                var p = xy(andes[i][0], andes[i][1]);
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();

            var africa = [
                [-17, 14], [-17, 21], [-14, 26], [-9, 31], [-5, 35], [3, 36],
                [11, 37], [18, 32], [25, 32], [32, 31], [35, 28], [43, 12],
                [51, 12], [48, 3], [43, -3], [41, -10], [40, -17], [36, -23],
                [32, -29], [27, -34], [20, -35], [16, -29], [13, -23], [10, -18],
                [8, -8], [5, -3], [0, 2], [-6, 5], [-12, 8], [-16, 12]
            ];
            poly(africa, landGreen, coastLine);

            (function () {
                var p1 = xy(-14, 30);
                var p2 = xy(32, 16);
                ctx.fillStyle = 'rgba(220, 195, 130, 0.75)';
                ctx.beginPath();
                ctx.ellipse((p1.x + p2.x) / 2, (p1.y + p2.y) / 2,
                            Math.abs(p2.x - p1.x) / 2, Math.abs(p2.y - p1.y) / 2,
                            0, 0, Math.PI * 2);
                ctx.fill();
            })();

            (function () {
                var p1 = xy(15, -22);
                var p2 = xy(28, -28);
                ctx.fillStyle = 'rgba(200, 180, 120, 0.5)';
                ctx.beginPath();
                ctx.ellipse((p1.x + p2.x) / 2, (p1.y + p2.y) / 2,
                            Math.abs(p2.x - p1.x) / 2, Math.abs(p2.y - p1.y) / 2,
                            0, 0, Math.PI * 2);
                ctx.fill();
            })();

            poly([
                [43, -13], [50, -15], [50, -22], [45, -25], [43, -20]
            ], landDry);

            var eurasia = [
                [-9, 43], [-9, 38], [-6, 36], [0, 39], [5, 43], [12, 44],
                [15, 42], [19, 40], [24, 41], [28, 41], [32, 42], [38, 45],
                [42, 43], [48, 41], [52, 38], [55, 40], [60, 42], [65, 42],
                [70, 38], [75, 35], [80, 32], [88, 28], [95, 27], [98, 24],
                [102, 22], [108, 22], [113, 22], [120, 24], [122, 30],
                [122, 37], [125, 40], [128, 43], [132, 44], [137, 50],
                [141, 53], [143, 58], [150, 60], [158, 62], [165, 62],
                [172, 65], [180, 66], [180, 70], [170, 71], [158, 71],
                [140, 74], [120, 76], [100, 76], [80, 74], [65, 72],
                [50, 68], [40, 65], [35, 65], [30, 70], [25, 71],
                [20, 70], [15, 68], [10, 63], [6, 58], [4, 53], [0, 50],
                [-4, 48], [-9, 43]
            ];
            poly(eurasia, landGreen, coastLine);

            (function () {
                var p1 = xy(75, 40);
                var p2 = xy(105, 30);
                ctx.fillStyle = 'rgba(200, 170, 130, 0.6)';
                ctx.beginPath();
                ctx.ellipse((p1.x + p2.x) / 2, (p1.y + p2.y) / 2,
                            Math.abs(p2.x - p1.x) / 2, Math.abs(p2.y - p1.y) / 2,
                            0, 0, Math.PI * 2);
                ctx.fill();
            })();

                if (delta < -180) delta += 360;

                if (dragMode === 'minute') {
                    totalMinutes += delta / 6;
                    applyTotal();
                } else {
                    var h = (ang2 - minute * 0.5) / 30;
                    var newHour12 = ((Math.round(h) % 12) + 12) % 12;
                    var curHour12 = ((Math.floor(totalMinutes / 60) % 12) + 12) % 12;
                    var diff = newHour12 - curHour12;
                    if (diff > 6) diff -= 12;
                    if (diff < -6) diff += 12;
                    if (diff !== 0) {
                        totalMinutes += diff * 60;
                        applyTotal();
                    }
                }
                lastAngle = ang2;
                updateClockHands();
            }
        }

        function endGesture() {
            if (!gesture) return;
            gesture = null;
            dragging = false;
            dragMode = null;
            autoAdvance = true;
        }

        clockEl.addEventListener('touchstart', function (e) { if (e.touches.length === 1) startGesture(getPoint(e), 'touch'); }, { passive: true });
        clockEl.addEventListener('touchmove', function (e) { if (gesture && gesture.source === 'touch' && e.touches.length === 1) moveGesture(e, getPoint(e)); }, { passive: false });
        clockEl.addEventListener('touchend', function () { if (gesture && gesture.source === 'touch') endGesture(); }, { passive: true });
        clockEl.addEventListener('mousedown', function (e) { if (e.button === 0) { e.preventDefault(); startGesture(getPoint(e), 'mouse'); } });
        window.addEventListener('mousemove', function (e) { if (gesture && gesture.source === 'mouse') moveGesture(e, getPoint(e)); });
        window.addEventListener('mouseup', function () { if (gesture && gesture.source === 'mouse') endGesture(); });

        // ===== Подписи =====
        var lastLabels = [];
        var tempVec = new THREE.Vector3();
        var projected = new THREE.Vector3();

        function projectToScreen(pos) {
            projected.copy(pos).project(camera);
            return {
                x: (projected.x * 0.5 + 0.5) * window.innerWidth,
                y: (-projected.y * 0.5 + 0.5) * window.innerHeight,
                visible: projected.z > -1 && projected.z < 1
            };
        }

        function drawLabel(name, worldPos, color, isSun) {
            var p = projectToScreen(worldPos);
            if (!p.visible) return null;

            labelCtx.font = '500 11px Orbitron, Arial, sans-serif';
            var textW = labelCtx.measureText(name).width;
            var padX = 9;
            var w = textW + padX * 2;
            var h = 18;
            var x = p.x - w / 2;
            var y = p.y - h - 10;

            labelCtx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            labelCtx.beginPath();
            var r = 8;
            labelCtx.moveTo(x + r, y);
            labelCtx.lineTo(x + w - r, y);
            labelCtx.arcTo(x + w, y, x + w, y + r, r);
            labelCtx.lineTo(x + w, y + h - r);
            labelCtx.arcTo(x + w, y + h, x + w - r, y + h, r);
            labelCtx.lineTo(x + r, y + h);
            labelCtx.arcTo(x, y + h, x, y + h - r, r);
            labelCtx.lineTo(x, y + r);
            labelCtx.arcTo(x, y, x + r, y, r);
            labelCtx.closePath();
            labelCtx.fill();

            labelCtx.strokeStyle = isSun ? 'rgba(255, 200, 100, 0.7)' :
                                   name === 'Земля' ? 'rgba(120, 180, 255, 0.7)' :
                                   'rgba(255, 255, 255, 0.3)';
            labelCtx.lineWidth = 1;
            labelCtx.stroke();

            labelCtx.fillStyle = color;
            labelCtx.textAlign = 'center';
            labelCtx.textBaseline = 'middle';
            labelCtx.fillText(name, p.x, y + h / 2 + 0.5);

            return { x: x, y: y, w: w, h: h, name: name };
        }

        function drawLabels() {
            labelCtx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
            lastLabels.length = 0;

            var sunLb = drawLabel('Солнце', new THREE.Vector3(0, 0, 0), '#ffdd88', true);
            if (sunLb) lastLabels.push(sunLb);

            for (var i = 0; i < planetObjects.length; i++) {
                var po = planetObjects[i];
                po.planetGroup.getWorldPosition(tempVec);
                var col = po.data.name === 'Земля' ? '#88bbff' : '#ffffff';
                var lb = drawLabel(po.data.name, tempVec, col, false);
                if (lb) lastLabels.push(lb);
            }
            // Луна не подписывается и не кликается
        }

        function handleCanvasClick(e) {
            var clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            var clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            for (var i = lastLabels.length - 1; i >= 0; i--) {
                var lb = lastLabels[i];
                if (clientX >= lb.x && clientX <= lb.x + lb.w &&
                    clientY >= lb.y && clientY <= lb.y + lb.h) {
                    setAnchor(lb.name);
                    return;
                }
            }
        }

        renderer.domElement.addEventListener('click', handleCanvasClick);
        renderer.domElement.addEventListener('touchend', function (e) {
            if (e.changedTouches && e.changedTouches.length === 1 && !isRotating) {
                handleCanvasClick(e);
            }
        });

        homeBtn.addEventListener('click', function () {
            setAnchor('Вся система');
        });

        // ===== Главный цикл =====
        var lastTime = performance.now();
        var anchorPos = new THREE.Vector3();

        function tick(now) {
            var dt = (now - lastTime) / 1000;
            lastTime = now;
            if (dt > 0.5) dt = 0.5;

            if (autoAdvance && !dragging) {
                totalMinutes += (dt * 1) / 60;
                applyTotal();
            }

            var diff = totalMinutes - displayMinutes;
            if (Math.abs(diff) < 0.0005) {
                displayMinutes = totalMinutes;
            } else {
                displayMinutes += diff * TIME_SMOOTH;
            }

            updatePlanets();
            updateClockHands();

            if (anchorObject === null) {
                anchorPos.set(0, 0, 0);
            } else {
                anchorObject.getWorldPosition(anchorPos);
            }

            camera.position.copy(anchorPos).add(userOffset);
            camera.lookAt(anchorPos);

            // Свет
            var earthPos = new THREE.Vector3();
            earthObj.planetGroup.getWorldPosition(earthPos);
            var sunDir = earthPos.clone().normalize();
            sunLight.position.copy(earthPos).addScaledVector(sunDir, -SUN_RADIUS * 2);
            sunLight.target.position.copy(earthPos);
            sunLight.target.updateMatrixWorld();

            renderer.render(scene, camera);
            drawLabels();

            updateDatePlate();
            updateScaleInfo();

            if (sunGlow) {
                sunGlow.material.opacity = 0.85 + Math.sin(now * 0.002) * 0.1;
            }

            requestAnimationFrame(tick);
        }

        // ===== Старт =====
        applyTotal();
        displayMinutes = totalMinutes;
        lastDisplayMinutes = displayMinutes;
        updatePlanets();
        updateClockHands();

        // Стартовый фокус — на Земле
        setAnchor('Земля');

        function resizeLabelCanvas() {
            labelCanvas.width = window.innerWidth;
            labelCanvas.height = window.innerHeight;
        }
        resizeLabelCanvas();

        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeLabelCanvas();
        });

        requestAnimationFrame(tick);
    })();
    </script>
</body>
</html>
