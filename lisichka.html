<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Лисичка-истеричка</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0610;
    font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;color:#fff;}

  #room{position:fixed;inset:0;z-index:1;display:block;width:100vw;height:100vh;height:100dvh;}
  #chars{position:fixed;inset:0;z-index:2;pointer-events:none;}
  #props{position:fixed;inset:0;z-index:3;pointer-events:none;}
  #cat{position:fixed;inset:0;z-index:4;pointer-events:none;}
  #fx{position:fixed;inset:0;z-index:5;pointer-events:none;}

  @keyframes screenShake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-4px,3px)}
    40%{transform:translate(4px,-3px)}
    60%{transform:translate(-3px,-4px)}
    80%{transform:translate(3px,4px)}
  }
  body.rage-shake #room,body.rage-shake #chars,body.rage-shake #props,
  body.rage-shake #cat,body.rage-shake #fx{animation:screenShake .14s linear infinite;}

  .character-wrap{
    position:absolute;pointer-events:auto;cursor:pointer;
    filter:drop-shadow(0 12px 20px rgba(0,0,0,.5));
    transform-origin:center bottom;
  }
  .character-wrap svg{display:block;width:100%;height:100%;overflow:visible;}

  .character-wrap .body-lower{transform-origin:200px 660px;transform:scaleX(var(--fatX,1)) scaleY(var(--fatY,1));transition:transform .35s ease;}
  .character-wrap .body-mid{transform-origin:200px 400px;transform:scaleX(var(--fatX,1)) scaleY(var(--fatY,1));transition:transform .35s ease;}
  .character-wrap .head-group{transform-origin:200px 170px;transform:scaleX(var(--headFatX,1)) scaleY(var(--headFatY,1));transition:transform .35s ease;}

  .character-wrap[data-selected="1"]::after{
    content:'';position:absolute;left:50%;bottom:-4px;width:70%;height:14px;
    transform:translateX(-50%);border-radius:50%;
    box-shadow:0 0 22px 8px rgba(255,208,112,.65);
    animation:selPulse 1.6s ease-in-out infinite;pointer-events:none;
  }
  @keyframes selPulse{0%,100%{opacity:.35}50%{opacity:.95}}

  .character-wrap svg .breathing{animation:breathe 3.6s ease-in-out infinite;transform-origin:200px 700px;}
  .character-wrap svg .head-bob{animation:headBob 4.4s ease-in-out infinite;transform-origin:200px 240px;}
  .character-wrap svg .hair-bl{animation:hairDriftL 5.4s ease-in-out infinite;transform-origin:130px 90px;}
  .character-wrap svg .hair-br{animation:hairDriftR 5.6s ease-in-out infinite;transform-origin:270px 90px;}
  @keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.5px) scaleY(1.012)}}
  @keyframes headBob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-2px) rotate(.6deg)}}
  @keyframes hairDriftL{0%,100%{transform:rotate(0) translateX(0)}50%{transform:rotate(.9deg) translateX(2px)}}
  @keyframes hairDriftR{0%,100%{transform:rotate(0) translateX(0)}50%{transform:rotate(-.9deg) translateX(-2px)}}

  .character-wrap svg .blinkable{animation:blink 5.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .character-wrap[data-expr="happy"] .blinkable,
  .character-wrap[data-expr="laugh"] .blinkable,
  .character-wrap[data-expr="bliss"] .blinkable,
  .character-wrap[data-expr="cry"]   .blinkable,
  .character-wrap[data-expr="rage"]  .blinkable,
  .character-wrap[data-expr="scream"] .blinkable{animation:none;}

  .character-wrap[data-shake="1"] .breathing{
    animation:breathe 3.6s ease-in-out infinite,shakeRage .18s linear infinite;
  }
  @keyframes shakeRage{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-2.5px,1.5px)}
    50%{transform:translate(2px,-1px)}
    75%{transform:translate(-1.5px,-1.5px)}
  }

  .character-wrap svg .heart-fx{animation:heartRise 1.8s ease-out infinite;}
  @keyframes heartRise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1)}100%{transform:translateY(-150px) scale(.9);opacity:0}}
  .character-wrap svg .tear-fx{animation:tearFall 1.4s ease-in infinite;}
  @keyframes tearFall{0%{transform:translateY(0) scale(.4);opacity:0}20%{transform:translateY(6px) scale(1);opacity:1}100%{transform:translateY(72px) scale(1);opacity:0}}

  .character-wrap svg .lip-glow{animation:lipPulse 1.2s ease-in-out infinite;}
  @keyframes lipPulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
  .character-wrap svg .face-red{opacity:0;transition:opacity .6s ease;}
  .character-wrap[data-red="1"] svg .face-red{opacity:.45;}

  /* ============ ВИДИМОСТЬ ============ */
  .character-wrap svg .torso-original,
  .character-wrap svg .skirt-original,
  .character-wrap svg .arms-normal,
  .character-wrap svg .hands-normal,
  .character-wrap svg .shoes-original,
  .character-wrap svg .cardigan,
  .character-wrap svg .torso-brat,
  .character-wrap svg .skirt-brat,
  .character-wrap svg .shoes-brat,
  .character-wrap svg .glasses,
  .character-wrap svg .torso-monster,
  .character-wrap svg .skirt-monster,
  .character-wrap svg .arms-monster,
  .character-wrap svg .hands-monster,
  .character-wrap svg .shoes-monster,
  .character-wrap svg .monster-hair,
  .character-wrap svg .monster-m,
  .character-wrap svg .crown,
  .character-wrap svg .lolli-in-hand,
  .character-wrap svg .phone-in-hand,
  .character-wrap svg .arm-holding,
  .character-wrap svg .hands-holding,
  .character-wrap svg .apron-worn,
  .character-wrap svg .lip-color-wide,
  .character-wrap svg .vampire-fangs,
  .character-wrap svg .monster-eye-red,
  .character-wrap svg .monster-pimples,
  .character-wrap svg .monster-piercing,
  .character-wrap svg .eye-neutral,
  .character-wrap svg .eye-happy,
  .character-wrap svg .eye-sad,
  .character-wrap svg .eye-rage,
  .character-wrap svg .eye-demand,
  .character-wrap svg .mouth-neutral,
  .character-wrap svg .mouth-happy,
  .character-wrap svg .mouth-laugh,
  .character-wrap svg .mouth-bliss,
  .character-wrap svg .mouth-sad,
  .character-wrap svg .mouth-cry,
  .character-wrap svg .mouth-scream,
  .character-wrap svg .mouth-rage,
  .character-wrap svg .mouth-demand,
  .character-wrap svg .mouth-displeased,
  .character-wrap svg .fx-anger,
  .character-wrap svg .fx-hearts,
  .character-wrap svg .fx-sparks,
  .character-wrap svg .fx-sweat,
  .character-wrap svg .fx-tears,
  .character-wrap svg .hair-bow{display:none;}

  .character-wrap svg .fox-ears{display:block;}

  .character-wrap[data-outfit="original"] .torso-original,
  .character-wrap[data-outfit="original"] .skirt-original,
  .character-wrap[data-outfit="original"] .arms-normal,
  .character-wrap[data-outfit="original"] .hands-normal,
  .character-wrap[data-outfit="original"] .shoes-original,
  .character-wrap[data-outfit="original"] .cardigan{display:block;}

  .character-wrap[data-outfit="brat"] .torso-brat,
  .character-wrap[data-outfit="brat"] .skirt-brat,
  .character-wrap[data-outfit="brat"] .arms-normal,
  .character-wrap[data-outfit="brat"] .hands-normal,
  .character-wrap[data-outfit="brat"] .shoes-brat,
  .character-wrap[data-outfit="brat"] .glasses{display:block;}

  /* МОНСТР — та же девочка, только волосы зелёные каре и другая одежда.
     Руки — обычные, но НЕ arm-holding/hands-holding. */
  .character-wrap[data-stage="3"] .torso-monster,
  .character-wrap[data-stage="3"] .skirt-monster,
  .character-wrap[data-stage="3"] .arms-monster,
  .character-wrap[data-stage="3"] .hands-monster,
  .character-wrap[data-stage="3"] .shoes-monster,
  .character-wrap[data-stage="3"] .monster-hair,
  .character-wrap[data-stage="3"] .monster-m,
  .character-wrap[data-stage="3"] .monster-eye-red,
  .character-wrap[data-stage="3"] .monster-piercing,
  .character-wrap[data-stage="3"] .mouth-displeased,
  .character-wrap[data-stage="3"] .vampire-fangs{display:block;}

  .character-wrap[data-stage="3"] .torso-original,
  .character-wrap[data-stage="3"] .skirt-original,
  .character-wrap[data-stage="3"] .arms-normal,
  .character-wrap[data-stage="3"] .hands-normal,
  .character-wrap[data-stage="3"] .shoes-original,
  .character-wrap[data-stage="3"] .cardigan,
  .character-wrap[data-stage="3"] .torso-brat,
  .character-wrap[data-stage="3"] .skirt-brat,
  .character-wrap[data-stage="3"] .shoes-brat,
  .character-wrap[data-stage="3"] .glasses,
  .character-wrap[data-stage="3"] .hair-bl,
  .character-wrap[data-stage="3"] .hair-br,
  .character-wrap[data-stage="3"] .hair-sl,
  .character-wrap[data-stage="3"] .hair-sr,
  .character-wrap[data-stage="3"] .hair-front,
  .character-wrap[data-stage="3"] .hair-front-hi,
  .character-wrap[data-stage="3"] .crown,
  .character-wrap[data-stage="3"] .lolli-in-hand,
  .character-wrap[data-stage="3"] .phone-in-hand,
  .character-wrap[data-stage="3"] .arm-holding,
  .character-wrap[data-stage="3"] .hands-holding,
  .character-wrap[data-stage="3"] .hair-bow,
  .character-wrap[data-stage="3"] .fox-ears,
  .character-wrap[data-stage="3"] .apron-worn{display:none;}

  .character-wrap[data-fat="2"] svg .monster-pimples{display:block;}

  .character-wrap[data-boy="0"] .hair-bow{display:block;}
  .character-wrap[data-crown="1"] .crown{display:block;}

  /* Когда леденец/телефон в руке — показываем arm-holding. У монстра — никогда. */
  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .arm-holding,
  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .hands-holding,
  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .lolli-in-hand,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .arm-holding,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .hands-holding,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .phone-in-hand{display:block;}

  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .arms-normal,
  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .hands-normal,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .arms-normal,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .hands-normal{display:none;}

  .character-wrap[data-apron="1"] .apron-worn{display:block;}
  .character-wrap[data-lips="1"] .lip-color-wide{display:block;}

  .character-wrap[data-expr="neutral"] .eye-neutral,
  .character-wrap[data-expr="neutral"] .mouth-neutral{display:block;}

  .character-wrap[data-expr="happy"] .eye-happy,
  .character-wrap[data-expr="happy"] .mouth-happy{display:block;}

  .character-wrap[data-expr="laugh"] .eye-happy,
  .character-wrap[data-expr="laugh"] .mouth-laugh{display:block;}

  .character-wrap[data-expr="bliss"] .eye-happy,
  .character-wrap[data-expr="bliss"] .mouth-bliss{display:block;}

  .character-wrap[data-expr="sad"] .eye-sad,
  .character-wrap[data-expr="sad"] .mouth-sad{display:block;}

  .character-wrap[data-expr="cry"] .eye-sad,
  .character-wrap[data-expr="cry"] .mouth-cry{display:block;}

  .character-wrap[data-expr="demand"] .eye-demand,
  .character-wrap[data-expr="demand"] .mouth-demand{display:block;}

  .character-wrap[data-expr="rage"] .eye-rage,
  .character-wrap[data-expr="rage"] .mouth-rage{display:block;}

  .character-wrap[data-expr="scream"] .eye-rage,
  .character-wrap[data-expr="scream"] .mouth-scream{display:block;}

  /* Монстр — всегда недовольное лицо, без тряски */
  .character-wrap[data-stage="3"] .eye-demand{display:block;}

  .character-wrap[data-expr="happy"] .fx-hearts,
  .character-wrap[data-expr="laugh"] .fx-hearts,
  .character-wrap[data-expr="bliss"] .fx-sparks,
  .character-wrap[data-expr="rage"] .fx-anger,
  .character-wrap[data-expr="cry"] .fx-tears{display:block;}

  .character-wrap svg .blush{opacity:.14;transition:opacity .35s;}
  .character-wrap[data-expr="happy"] .blush,
  .character-wrap[data-expr="laugh"] .blush,
  .character-wrap[data-expr="bliss"] .blush{opacity:.72;}

  #hud{position:fixed;top:0;left:0;z-index:30;pointer-events:none;
    padding:10px;display:flex;flex-direction:column;gap:6px;}
  .statCard{background:rgba(20,10,36,.72);border:1px solid rgba(255,140,200,.28);
    border-radius:10px;padding:6px 10px;backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:8px;}
  .bars{display:flex;flex-direction:column;gap:3px;}
  .bar{width:clamp(100px,26vw,180px);height:7px;background:rgba(0,0,0,.55);
    border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.12);}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .25s;}
  .bar.mood i{background:linear-gradient(180deg,#ff8ab0,#ff3d7f);}
  .bar.fat i{background:linear-gradient(180deg,#ffd070,#ff9a10);}
  .bar.ugly i{background:linear-gradient(180deg,#c8a0ff,#8a4ae0);}
  .modeTag{font-size:10px;font-weight:700;color:#ffd070;letter-spacing:.5px;}

  #cards{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:flex-end;
    gap:clamp(5px,1.4vw,14px);padding:8px clamp(6px,2vw,22px) calc(10px + env(safe-area-inset-bottom));pointer-events:none;}
  .card{pointer-events:auto;position:relative;width:clamp(54px,13.2vw,92px);border-radius:14px;
    background:linear-gradient(180deg,#4a3568,#251838);border:2px solid #7a5aaa;
    box-shadow:0 6px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);
    display:flex;flex-direction:column;align-items:center;padding:6px 4px 5px;cursor:pointer;
    transition:transform .09s,box-shadow .15s,border-color .15s;touch-action:none;overflow:hidden;}
  .card:active{transform:scale(.94);}
  .card.useful{border-color:#5ad0a0;box-shadow:0 6px 14px rgba(0,0,0,.55),0 0 12px rgba(90,208,160,.35) inset;}
  .card img{width:82%;aspect-ratio:1/1;object-fit:contain;pointer-events:none;}
  .card .lbl{margin-top:2px;font-size:clamp(8px,1.9vw,11px);font-weight:700;color:#e8d8ff;
    text-align:center;line-height:1.05;letter-spacing:.3px;pointer-events:none;text-shadow:0 1px 2px #000;}
  .card.locked{filter:grayscale(.85) brightness(.55);cursor:default;}
  .card .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(16px,4vw,26px);font-weight:800;color:#ffd070;background:rgba(10,4,20,.62);
    text-shadow:0 2px 6px #000;border-radius:12px;}
  .card.pop{animation:popIn .32s ease;}
  @keyframes popIn{0%{transform:scale(.6) rotate(-8deg);opacity:.2}60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0)}}

  #dragGhost{position:fixed;z-index:120;pointer-events:none;width:78px;height:78px;transform:translate(-50%,-50%);display:none;}
  #dragGhost img{width:100%;height:100%;object-fit:contain;}

  .floor-toy{position:absolute;pointer-events:none;
    animation:propAppear .5s ease-out;}
  .floor-toy img{width:100%;height:100%;object-fit:contain;}
  @keyframes propAppear{0%{transform:scale(.3) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}

  .floor-item{position:absolute;pointer-events:none;
    animation:propAppear .5s ease-out;}
  .floor-item img{width:100%;height:100%;object-fit:contain;}

  .exit-btn-fox{position:fixed;top:10px;right:10px;z-index:100;font-family:inherit;font-weight:700;font-size:13px;
    padding:9px 16px;background:rgba(255,255,255,.92);color:#120a18;border:none;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.5);letter-spacing:1px;}
  .exit-btn-fox:active{transform:scale(.94);}
  .exit-confirm-fox{position:fixed;inset:0;z-index:200;background:rgba(18,10,24,.85);display:flex;
    align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s;padding:20px;}
  .exit-confirm-fox.show{opacity:1;visibility:visible;transition:opacity .2s,visibility 0s linear 0s;}
  .exit-confirm-fox-inner{background:#1c1430;border:2px solid #ff5a8a;border-radius:16px;padding:30px 38px;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.8);max-width:100%;}
  .exit-confirm-fox-title{font-size:17px;font-weight:700;color:#ff5a8a;margin-bottom:20px;letter-spacing:2px;}
  .exit-confirm-fox-btns{display:flex;gap:14px;justify-content:center;}
  .exit-confirm-fox-btn{font-family:inherit;font-size:15px;font-weight:700;padding:12px 26px;background:transparent;
    color:#fff;border:2px solid #ff5a8a;border-radius:10px;cursor:pointer;letter-spacing:2px;transition:.15s;}
  .exit-confirm-fox-btn:hover{background:#ff5a8a;color:#1c1430;}

  .end-screen{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;padding:24px;}
  .end-screen.show{display:flex;animation:winIn .9s ease;}
  @keyframes winIn{from{opacity:0}to{opacity:1}}
  .end-screen h1{font-size:clamp(20px,5vw,42px);letter-spacing:2px;margin:0 0 20px;
    line-height:1.35;max-width:900px;}
  .end-screen button{font-family:inherit;font-size:15px;font-weight:700;padding:13px 34px;background:transparent;
    border-radius:12px;cursor:pointer;letter-spacing:2px;transition:.18s;}
  #winScreen{background:radial-gradient(circle at 50% 40%,rgba(120,60,180,.85),rgba(8,4,16,.97) 70%);}
  #winScreen h1{color:#ffd070;text-shadow:0 0 24px #ff8ac0,0 4px 10px #000;}
  #winScreen button{color:#ffd070;border:2px solid #ffd070;}
  #winScreen button:hover{background:#ffd070;color:#1c1430;}
  #loseScreen{background:radial-gradient(circle at 50% 40%,rgba(150,20,20,.9),rgba(8,4,4,.98) 70%);}
  #loseScreen h1{color:#ff5050;text-shadow:0 0 24px #ff2020,0 4px 10px #000;}
  #loseScreen button{color:#ff9090;border:2px solid #ff9090;}
  #loseScreen button:hover{background:#ff9090;color:#1c1430;}
</style>
</head>
<body>

<canvas id="room"></canvas>
<div id="chars"></div>
<div id="props"></div>
<canvas id="cat"></canvas>
<canvas id="fx"></canvas>

<div id="hud"></div>
<div id="cards"></div>
<img id="dragGhost" alt="">

<button class="exit-btn-fox" id="exitBtnFox">← МЕНЮ</button>
<div class="exit-confirm-fox" id="exitConfirmFox">
  <div class="exit-confirm-fox-inner">
    <div class="exit-confirm-fox-title">ВЫЙТИ В МЕНЮ?</div>
    <div class="exit-confirm-fox-btns">
      <button class="exit-confirm-fox-btn yes" id="exitFoxYes">ДА</button>
      <button class="exit-confirm-fox-btn no"  id="exitFoxNo">НЕТ</button>
    </div>
  </div>
</div>

<div id="winScreen" class="end-screen">
  <h1>БОЛЬШЕ НЕ ИСТЕРИЧКА<br>И ОБРЕЛА ПОЛЕЗНЫЕ ПРИВЫЧКИ</h1>
  <button id="winBtn">В МЕНЮ</button>
</div>

<div id="loseScreen" class="end-screen">
  <h1>ДАЛЬШЕ СМЫСЛА НЕТ</h1>
  <button id="loseBtn">В МЕНЮ</button>
</div>

<script>
(()=>{
'use strict';
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

/* EXIT */
(function(){
  var b=document.getElementById('exitBtnFox'),o=document.getElementById('exitConfirmFox'),
      y=document.getElementById('exitFoxYes'),n=document.getElementById('exitFoxNo');
  if(b)b.addEventListener('click',()=>o.classList.add('show'));
  if(y)y.addEventListener('click',()=>window.location.href='games.html');
  if(n)n.addEventListener('click',()=>o.classList.remove('show'));
  if(o)o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')o.classList.toggle('show')});
})();
document.getElementById('winBtn').addEventListener('click',()=>window.location.href='games.html');
document.getElementById('loseBtn').addEventListener('click',()=>window.location.href='games.html');

/* SOUND */
let AC=null;
const ac=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;};
function beep(f,d,type='sine',vol=.06,slide=0){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(vol,a.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);
}

  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);

}

const ICON_CACHE={};
function getIcon(sub){
  if(ICON_CACHE[sub])return ICON_CACHE[sub];
  const c=document.createElement('canvas');c.width=c.height=200;
  const g=c.getContext('2d');g.translate(100,100);drawItemIcon(g,sub,190);
  const url=c.toDataURL();ICON_CACHE[sub]=url;return url;
}

function getUsefulPool(){
  const mode=G.girl?G.girl.globalMode:'capricious';
  if(mode==='neutral'||mode==='enlightened')return USEFUL.concat(USEFUL_EXTRA);
  return USEFUL.slice();
}
function getAvailableUseful(){
  const pool=getUsefulPool();
  const used=G.usedUsefulThisBatch;
  const fresh=pool.filter(it=>!used[it.sub]);
  return fresh.length?fresh:pool;
}
function rebuildAllSlots(){
  G.usedUsefulThisBatch={};
  const usefulItem=pick(getAvailableUseful());
  G.usedUsefulThisBatch[usefulItem.sub]=true;
  const usefulIdx=Math.floor(Math.random()*5);
  const otherCategories=[TOYS,FOODS,CLOTHES];
  G.slots=[];
  for(let i=0;i<5;i++){
    if(i===usefulIdx)G.slots.push(usefulItem);
    else G.slots.push(pick(pick(otherCategories)));
  }
}

function positionChars(){
  const W=window.innerWidth,H=window.innerHeight;
  for(const ch of G.chars){
    if(!ch.wrap)continue;
    let charHeightOnScreen,cx,feetY;
    if(ch.isSibling){
      if(ch.siblingStage==='cradle'){ch.wrap.style.display='none';continue;}
      if(ch.siblingStage==='rug'){
        charHeightOnScreen=Math.min(H*0.22,W*0.40);
        cx=W*0.78;feetY=H*0.75;
      } else {
        charHeightOnScreen=Math.min(H*0.38,W*0.60);
        cx=W*0.75;feetY=H*0.85;
      }
    } else {
      charHeightOnScreen=Math.min(H*0.48,W*0.82);
      cx=W*0.40;feetY=H*0.85;
    }
    ch.wrap.style.display='block';
    const scale=charHeightOnScreen/660;
    const svgH=720*scale;
    const svgW=400*scale;
    const boxTop=feetY-700*scale;
    ch.wrap.style.left=(cx-svgW/2)+'px';
    ch.wrap.style.top=boxTop+'px';
    ch.wrap.style.width=svgW+'px';
    ch.wrap.style.height=svgH+'px';
  }
}

function addBubble(text,pos,opts){
  opts=opts||{};
  let x,y;
  if(pos&&typeof pos==='object'){x=pos.x;y=pos.y;}
  else {x=pos;y=(opts.y!==undefined)?opts.y:0;}
  if(!Number.isFinite(x))x=FW*0.5;
  if(!Number.isFinite(y))y=FH*0.28;
  const approxW=Math.min(text.length*(opts.size||20)*0.62+40,FW-20);
  x=Math.max(approxW/2+8,Math.min(FW-approxW/2-8,x));
  y=Math.max(60,Math.min(FH-100,y));
  if(G.bubbles.length>5)G.bubbles.shift();
  G.bubbles.push({text,x,y,
    life:opts.life||2.2,max:opts.life||2.2,
    color:opts.color||'normal',
    size:opts.size||20,
    vy:opts.vy||-16,
    shake:opts.shake||0});
}

      size:rnd(5,12),rot:rnd(0,TAU),vr:rnd(-4,4)});

}
function isInsideSafeZone(x,y){
  if(!G.girl||!G.girl.wrap)return false;
  const r=G.girl.wrap.getBoundingClientRect();
  return x>r.left-10 && x<r.right+10 && y>r.top-10 && y<r.bottom+10;
}
function placeFloorToy(sub){
  const W=window.innerWidth,H=window.innerHeight;
  const cols=8,rows=6;
  const idx=G.toyCounter++;
  if(idx>=TOY_LIMIT){triggerLose();return;}
  let col=idx%cols;
  let row=Math.floor(idx/cols);
  let baseX=W*0.08+(col+0.5)*(W*0.84/cols);
  let baseY=H*0.72+row*(H*0.24/rows)+rnd(-6,6);
  let tries=0;
  while(isInsideSafeZone(baseX,baseY)&&tries<10){
    baseX=W*0.08+Math.random()*(W*0.84);
    baseY=H*0.72+Math.random()*(H*0.24);
    tries++;
  }
  const size=clamp(W*0.05,28,52);
  const el=document.createElement('div');
  el.className='floor-toy';
  el.style.left=(baseX-size/2)+'px';
  el.style.top=(baseY-size/2)+'px';
  el.style.width=size+'px';
  el.style.height=size+'px';
  el.style.transform=`rotate(${rnd(-25,25)}deg)`;
  el.innerHTML=`<img src="${getIcon(sub)}" alt="">`;
  propsEl.appendChild(el);
  G.floorToys.push(el);
}
function placeFloorShoe(){
  const W=window.innerWidth,H=window.innerHeight;
  const size=clamp(W*0.05,28,52);
  const x=W*0.08+Math.random()*(W*0.84);
  const y=H*0.75+Math.random()*(H*0.20);
  const el=document.createElement('div');
  el.className='floor-toy';
  el.style.left=(x-size/2)+'px';
  el.style.top=(y-size/2)+'px';
  el.style.width=size+'px';
  el.style.height=size+'px';
  el.style.transform=`rotate(${rnd(-25,25)}deg)`;
  el.innerHTML=`<img src="${getIcon('shoes')}" alt="">`;
  propsEl.appendChild(el);
  G.floorShoes.push(el);
}
function placeFloorItem(sub,side){
  const W=window.innerWidth,H=window.innerHeight;
  const size=clamp(W*0.14,100,180);
  const el=document.createElement('div');
  el.className='floor-item';
  el.style.width=size+'px';
  el.style.height=size+'px';
  el.style.left=(W*0.03)+'px';
  el.style.top=(H*0.86-size*0.9)+'px';
  if(sub==='bike')el.style.top=(H*0.86-size*1.55)+'px';
  el.innerHTML=`<img src="${getIcon(sub)}" alt="">`;
  propsEl.appendChild(el);
  G.floorItems.push({el,life:60,max:60});
}
function removeOneFloorToy(){
  if(G.floorToys.length===0){
    if(G.floorShoes.length===0)return false;
    const s=G.floorShoes.pop();s.remove();return true;
  }
  const toy=G.floorToys.pop();
  toy.remove();
  G.toyCounter=Math.max(0,G.toyCounter-1);
  return true;
}
function triggerLose(){
  if(G.gameOver)return;
  G.gameOver=true;
  document.body.classList.remove('rage-shake','rage-shake-hard');
  document.getElementById('loseScreen').classList.add('show');
  sndLose();setTimeout(sndLose,300);
}
function headScreenPos(ch){if(!ch.wrap)return{x:0,y:0};const r=ch.wrap.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height*0.24};}

function itemCategory(item){
  if(item.kind==='useful'){
    if(item.sub==='book'||item.sub==='broom'||item.sub==='apron'||
       item.sub==='subbotnik'||item.sub==='grandma')return 'good';
    return 'neutral';
  }
  if(item.sub==='phone'||item.sub==='lipstick'||item.sub==='dress'||item.sub==='shoes'||item.sub==='crown')return 'fashion';
  if(item.kind==='toy')return 'toy';
  if(item.kind==='food')return 'sweet';
  return 'other';
}
function reactFor(mode,cat){
  if(mode==='capricious'){
    if(cat==='sweet'||cat==='toy'||cat==='fashion')return 'love';
    if(cat==='good')return 'hate';
    return 'meh';
  }
  if(mode==='neutral'){
    if(cat==='sweet'||cat==='toy')return 'love';
    return 'meh';
  }
  if(cat==='good')return 'love';
  if(cat==='fashion')return 'hate';
  return 'meh';
}

function applyItem(ch,item){
  if(G.gameOver)return;
  if(ch.isSibling&&ch.siblingStage!=='grown')return;

  const head=headScreenPos(ch);
  const bx=clamp(head.x,140,FW-140);
  const by=Math.max(80,head.y-40);

  const cat=itemCategory(item);

  if(ch.monsterStage>=3){
    sndDemand();
    addBubble(pick(MONSTER_PHRASES),{x:bx,y:by},{color:'yell',life:1.5,size:22,shake:1});
    ch.mood=clamp(ch.mood+8,-100,100);
    /* МОНСТР НЕ БЕРЁТ предметы в руки */
  } else {
    const react=reactFor(ch.globalMode,cat);
    if(react==='love'){
      ch.mood=clamp(ch.mood+18,-100,100);
      ch.happyStreak++;ch.lastBadT=G.t;
      if(Math.random()<0.5){ch.reaction='happy';sndGood();}
      else {ch.reaction='laugh';sndHappy();}
      ch.reactionT=1.4;
      spawnParticles('heart',head.x,head.y+140,10);
      addBubble(pick(HAPPY_PHRASES),{x:bx+rnd(-30,30),y:by},{color:'happy',life:1.6,size:22});
    } else if(react==='meh'){
      addBubble('...',{x:bx,y:by},{color:'normal',life:1.2,size:22});
    } else {
      ch.mood=clamp(ch.mood-18,-100,100);
      ch.happyStreak=0;
      ch.reaction='cry';ch.reactionT=1.6;
      ch.lipT=0;
      sndBad();
      spawnParticles('tear',head.x,head.y+140,10);
      addBubble(pick(USEFUL_PHRASES),{x:bx,y:by},{color:'normal',life:1.8,size:22});
    }
  }

  if(item.kind==='food' && item.sub!=='gum'){
    ch.fat=clamp(ch.fat+FAT_PER_FOOD,0,1);
  }
  if(item.sub==='doll'||item.sub==='bear'||item.sub==='unicorn'){
    placeFloorToy(item.sub);
  }
  if(item.sub==='shoes'){
    ch.shoesCount++;
    placeFloorShoe();
  }
  /* Предметы в руку — только НЕ монстру */
  if(ch.monsterStage<3){
    if(item.sub==='phone'){ch.hold.phone=12;}
    if(item.sub==='lolli'){ch.hold.lolli=12;}
    if(item.sub==='crown'){ch.crownT=9;ch.crownCount++;}
  }
  if(item.sub==='dress'){
    ch.dressCount++;
    setDressColor(ch,pick(DRESS_COLORS));
  }
  if(item.sub==='lipstick'){ch.lipstickCount++;ch.lipT=15;}

  if(cat==='fashion' && ch.globalMode==='capricious'){
    ch.clothesClicks++;
    if(ch.clothesClicks>=MONSTER_CLOTHES_THRESHOLD && ch.monsterStage<3){
      ch.monsterStage=3;
      ch.crownT=0;ch.apronT=0;
      ch.hold.lolli=0;ch.hold.phone=0;ch.hold.bear=0;
      sndMonster();
      addBubble('МОНСТРИЧКА!',{x:bx,y:by},{color:'mon',life:2.4,size:28});
    }
  }

  const fashionScore=ch.lipstickCount+ch.dressCount+ch.shoesCount;
  if(!ch.altOutfit && fashionScore>=15){
    ch.altOutfit=true;
    sndEnlighten();
    addBubble('Крутой образ!',{x:bx,y:by},{color:'happy',life:2.4,size:22});
  }

  if(item.sub==='scooter'||item.sub==='bike'){
    placeFloorItem(item.sub,item.sub==='scooter'?'left':'right');
    ch.fat=clamp(ch.fat-0.15,0,1);
    ch.mood=clamp(ch.mood+15,-100,100);
    addBubble('Круто!',{x:bx,y:by},{color:'happy',life:1.6,size:22});
  }

  if(item.sub==='broom'){removeOneFloorToy();}
  if(item.sub==='apron'){ch.apronT=5;}

  if(ch.globalMode==='neutral'){
    if(cat==='good')ch.neutralGoodClicks++;
    if(cat==='fashion'||cat==='toy')ch.neutralBadClicks++;
  }
  if(ch.globalMode==='enlightened' && cat==='fashion'){
    ch.enlightenedBadClicks++;
  }
  updateMonster(ch);
}
function updateMonster(ch){
  if(ch.globalMode!=='capricious'){ch.monsterStage=0;return;}
  if(ch.clothesClicks>=MONSTER_CLOTHES_THRESHOLD && ch.monsterStage<3){
    ch.monsterStage=3;
    sndMonster();
  } else if(ch.clothesClicks<MONSTER_CLOTHES_THRESHOLD)ch.monsterStage=0;
}

function moodBand(m){
  if(m<=15)return 'rage';
  if(m<=50)return 'demand';
  if(m<=80)return 'calm';
  return 'happy';
}
function setPhase(ch,p){
  if(ch.phase===p)return;
  ch.phase=p;ch.phaseT=0;
  const stg=ch.monsterStage;
  const p2=headScreenPos(ch);
  const cx=clamp(p2.x,140,FW-140),cy=Math.max(70,p2.y-40);
  if(ch.monsterStage>=3){
    sndDemand();
    addBubble(pick(MONSTER_PHRASES),{x:cx,y:cy},{color:'yell',life:1.4,size:22,shake:1});
    return;
  }
  if(p==='demand' && ch===G.girl && ch.globalMode!=='enlightened'){
    sndDemand();
    addBubble(pick(DEMAND_PHRASES),{x:cx,y:cy},{color:'yell',life:1.6,size:22,shake:1.5});
  }
  if(p==='rage' && ch===G.girl && ch.globalMode==='capricious'){
    sndScream(stg);setTimeout(()=>sndScream(stg),150);
    addBubble(pick(RAGE_PHRASES),
      {x:cx,y:cy},
      {color:'rage',life:1.4+stg*0.2,size:30+stg*10,shake:6+stg*2});
  }
}
function updatePhase(ch,dt){
  ch.phaseT+=dt;
  if(ch.globalMode==='enlightened'){if(ch.phase!=='calm')setPhase(ch,'calm');return;}
  if(ch.monsterStage>=3){if(ch.phase!=='demand')setPhase(ch,'demand');return;}
  const band=moodBand(ch.mood);
  if(band==='calm'||band==='happy'){if(ch.phase!=='calm')setPhase(ch,'calm');return;}
  if(band==='demand'){if(ch.phase!=='demand')setPhase(ch,'demand');return;}
  if(ch.phase!=='rage')setPhase(ch,'rage');
}
function shoutLoop(ch,dt){
  if(ch.isSibling&&ch.siblingStage!=='grown'){
    if(ch.siblingStage==='rug' && Math.random()<dt*0.35){
      const p=headScreenPos(ch);
      addBubble(pick(SIBLING_PHRASES),{x:p.x+rnd(-20,20),y:p.y-30},{color:'happy',life:1.8,size:18});
    }
    return;
  }
  if(ch.monsterStage>=3){
    if(ch.time-lastYell>2.8){
      lastYell=ch.time;
      const p=headScreenPos(ch);
      addBubble(pick(MONSTER_PHRASES),{x:p.x+rnd(-60,60),y:Math.max(70,p.y-40)},
        {color:'yell',life:1.5,size:22,shake:1});
    }
    return;
  }
  if(ch.globalMode==='enlightened')return;
  const band=moodBand(ch.mood);
  const interval={calm:4.0,demand:2.5,rage:1.4}[band];
  if(ch.time-lastYell>interval){
    lastYell=ch.time;
    const p=headScreenPos(ch);
    const cx=p.x+rnd(-70,70),cy=Math.max(70,p.y-40);
    const stg=ch.monsterStage;
    if(band==='calm')return;
    if(band==='demand'){
      addBubble(pick(DEMAND_PHRASES),{x:cx,y:cy},{color:'yell',life:1.7,size:22,shake:2});
    } else {
      addBubble(pick(RAGE_PHRASES),{x:cx,y:cy},{color:'rage',life:1.4,size:28+stg*10,shake:6+stg*3});
    }
  }
}
function computeExpr(ch){
  if(ch.monsterStage>=3)return 'demand';
  if(ch.reactionT>0&&ch.reaction)return ch.reaction;
  if(ch.globalMode==='enlightened')return 'happy';
  const band=moodBand(ch.mood);
  if(band==='rage')return 'rage';
  if(band==='demand')return 'demand';
  if(band==='calm')return 'neutral';
  return 'happy';
}

function updateChar(ch,dt){
  ch.time+=dt;

  if(ch.isSibling){
    if(ch.siblingStage==='cradle'){
      ch.siblingStageTimer+=dt;
      if(ch.siblingStageTimer>=SIBLING_STAGE_TIME){
        ch.siblingStage='rug';ch.siblingStageTimer=0;
        positionChars();
      }
    } else if(ch.siblingStage==='rug'){
      ch.siblingStageTimer+=dt;
      if(ch.siblingStageTimer>=SIBLING_STAGE_TIME){
        ch.siblingStage='grown';ch.siblingStageTimer=0;
        positionChars();
      }
    }
    if(ch.siblingStage!=='grown'){
      if(ch.wrap){ch.wrap.style.display=(ch.siblingStage==='cradle')?'none':'block';}
      return;
    }
  }

  if(ch.mood>0)ch.mood=Math.max(0, ch.mood-dt*MOOD_DECAY);
  else ch.mood=Math.min(0, ch.mood+dt*MOOD_RECOVER);

  if(ch.globalMode==='capricious'){
    if(ch.mood<40)ch.capriciousRageTimer+=dt;
    else ch.capriciousRageTimer=Math.max(0,ch.capriciousRageTimer-dt*2);
    if(ch.capriciousRageTimer>=180){
      ch.globalMode='neutral';
      ch.capriciousRageTimer=0;
      ch.neutralGoodClicks=0;ch.neutralBadClicks=0;
      ch.monsterStage=0;
      ch.clothesClicks=0;
      document.body.classList.remove('rage-shake-hard','rage-shake');
      sndEnlighten();
      const p=headScreenPos(ch);
      addBubble('Хм, ладно...',{x:p.x,y:p.y-40},{color:'happy',life:2.6,size:22});
      if(ch===G.girl&&!G.siblingRolled){
        G.siblingRolled=true;
        ch.siblingBornAt=G.t+60;
      }
    }
  } else if(ch.globalMode==='neutral'){
    if(ch.neutralGoodClicks>=30){
      ch.globalMode='enlightened';
      ch.neutralGoodClicks=0;
      ch.enlightenedBadClicks=0;
      ch.altOutfit=false;
      ch.lipstickCount=0;ch.dressCount=0;ch.shoesCount=0;ch.crownCount=0;
      const white=DRESS_COLORS[0];
      setDressColor(ch,white);
      sndEnlighten();
      const p=headScreenPos(ch);
      addBubble('Я всё поняла!',{x:p.x,y:p.y-40},{color:'happy',life:2.8,size:24});
    } else if(ch.neutralBadClicks>=20){
      ch.globalMode='capricious';
      ch.neutralGoodClicks=0;ch.neutralBadClicks=0;
      ch.capriciousRageTimer=0;
      sndBad();
      const p=headScreenPos(ch);
      addBubble('НЕ ХОЧУ!',{x:p.x,y:p.y-40},{color:'yell',life:2.4,size:24});
      updateMonster(ch);
    }
  } else if(ch.globalMode==='enlightened'){
    if(ch.enlightenedBadClicks>=10){
      ch.globalMode='neutral';
      ch.enlightenedBadClicks=0;
      ch.neutralGoodClicks=0;ch.neutralBadClicks=0;
      sndBad();
      const p=headScreenPos(ch);
      addBubble('Ну и ладно.',{x:p.x,y:p.y-40},{color:'normal',life:2.4,size:22});
    }
  }

  updatePhase(ch,dt);
  shoutLoop(ch,dt);
  updateMonster(ch);

  const isRage=ch.globalMode==='capricious'&&ch.phase==='rage'&&ch.monsterStage<3;
  if(isRage)ch.rageTimer+=dt; else ch.rageTimer=Math.max(0,ch.rageTimer-dt*2);

  ch.headTimer-=dt;
  if(ch.headTimer<=0){
    ch.headTimer=rnd(0.9,2.4);
    let range;
    if(ch.globalMode==='enlightened')range=0.35;
    else range=ch.phase==='rage'?0.35:ch.phase==='demand'?0.42:0.55;
    ch.headTarget=rnd(-range,range);
  }
  ch.headAngle=lerp(ch.headAngle,ch.headTarget,dt*6);

  ch.blinkTimer-=dt;
  if(ch.blinkTimer<=0){ch.blinkTimer=rnd(2,5);ch.blink=1;}
  ch.blink=Math.max(0,ch.blink-dt*6);

  if(ch.happyStreak>0&&G.t-ch.lastBadT>2)ch.happyStreak=0;
  if(ch.reactionT>0){ch.reactionT-=dt;if(ch.reactionT<=0)ch.reaction=null;}

  if(ch.crownT>0)ch.crownT-=dt;
  if(ch.apronT>0)ch.apronT-=dt;
  if(ch.lipT>0)ch.lipT-=dt;
  for(const k in ch.hold)if(ch.hold[k]>0)ch.hold[k]-=dt;

  ch.expr=computeExpr(ch);

  if(ch.wrap){
    ch.wrap.dataset.expr=ch.expr;
    ch.wrap.dataset.stage=String(ch.monsterStage);
    /* тряска только при ярости не-монстра */
    ch.wrap.dataset.shake=(ch.monsterStage<3 && ch.phase==='rage')?'1':'0';
    ch.wrap.dataset.red=(ch.rageTimer>3&&ch.monsterStage<3)?'1':'0';
    ch.wrap.dataset.crown=ch.crownT>0?'1':'0';
    ch.wrap.dataset.apron=ch.apronT>0?'1':'0';
    ch.wrap.dataset.lips=ch.lipT>0?'1':'0';
    ch.wrap.dataset.outfit=ch.altOutfit?'brat':'original';

    /* Монстр никогда не держит предметов */
    if(ch.monsterStage>=3){
      ch.wrap.dataset.hold='';
    } else if(ch.hold.phone>0)ch.wrap.dataset.hold='phone';
    else if(ch.hold.lolli>0)ch.wrap.dataset.hold='lolli';
    else ch.wrap.dataset.hold='';

    const fatLevel=ch.fat>0.55?2:(ch.fat>0.20?1:0);
    ch.wrap.dataset.fat=String(fatLevel);

    const fatX=1+ch.fat*0.55;
    const fatY=1+ch.fat*0.10;
    const headFatX=1+ch.fat*0.35;
    const headFatY=1+ch.fat*0.12;

    ch.wrap.style.setProperty('--fatX',String(fatX));
    ch.wrap.style.setProperty('--fatY',String(fatY));
    ch.wrap.style.setProperty('--headFatX',String(headFatX));
    ch.wrap.style.setProperty('--headFatY',String(headFatY));
  }

  if(ch===G.girl&&!G.gameOver){
    if(ch.monsterStage>=3){
      if(ch.phase==='demand' && Math.random()<0.3){
        document.body.classList.add('rage-shake');
      }
      document.body.classList.remove('rage-shake-hard');
    } else if(ch.phase==='rage'){
      document.body.classList.add('rage-shake');
      document.body.classList.remove('rage-shake-hard');
    } else {
      document.body.classList.remove('rage-shake','rage-shake-hard');
    }
  }
}
function spawnSibling(){
  if(G.sibling)return;
  const isBoy=Math.random()<0.5;
  const ch=makeCharState(true,isBoy);
  ch.siblingStage='cradle';ch.siblingStageTimer=0;
  G.chars.push(ch);G.sibling=ch;
  createCharDOM(ch);
  positionChars();
  sndEnlighten();
  const msg=isBoy?'Ого, мой братик!':'Ого, моя сестрёнка!';
  const p=headScreenPos(G.girl);
  addBubble(msg,{x:p.x,y:p.y-60},{color:'happy',life:3.2,size:24});
  updateHUD();
}
function checkWin(){
  const chars=G.chars.filter(c=>!c.isSibling||c.siblingStage==='grown');
  if(chars.length===0)return;
  const allEnlightened=chars.every(c=>c.globalMode==='enlightened');
  if(!allEnlightened){_enlightenTimer=0;return;}
  _enlightenTimer+=0.05;
  if(_enlightenTimer>=120&&!G.gameOver){
    G.gameOver=true;
    document.body.classList.remove('rage-shake','rage-shake-hard');
    document.getElementById('winScreen').classList.add('show');
    sndEnlighten();
  }
}

const hudEl=document.getElementById('hud');
function updateHUD(){
  let html='';
  for(const ch of G.chars){
    if(ch.isSibling&&ch.siblingStage!=='grown')continue;
    const moodPct=clamp((ch.mood+100)/2,0,100);
    const fatPct=clamp(ch.fat*100,0,100);
    const uglyPct=clamp(ch.ugly*100,0,100);
    const modeName={capricious:'КАПРИЗНЫЙ',neutral:'НЕЙТРАЛЬНЫЙ',enlightened:'ПРОСВЕТЛЁННЫЙ'}[ch.globalMode];
    html+=`<div class="statCard">
      <div class="bars">
        <div class="modeTag">${modeName}</div>
        <div class="bar mood"><i style="width:${moodPct}%"></i></div>
        <div class="bar fat"><i style="width:${fatPct}%"></i></div>
        <div class="bar ugly"><i style="width:${uglyPct}%"></i></div>
      </div>
    </div>`;
  }
  hudEl.innerHTML=html;
}
function updateSelectionUI(){
  G.chars.forEach((ch,i)=>{if(ch.wrap)ch.wrap.dataset.selected=(i===G.selected)?'1':'0';});
}

const cardsEl=document.getElementById('cards');
const ghostEl=document.getElementById('dragGhost');
function renderCards(){
  cardsEl.innerHTML='';
  for(let i=0;i<5;i++){
    const it=G.slots[i];if(!it)continue;
    const d=document.createElement('div');
    d.className='card'+(it.kind==='useful'?' useful':'')+(G.slotLock[i]>0?' locked':'');
    d.dataset.slot=i;
    d.innerHTML=`<img src="${getIcon(it.sub)}" alt=""><div class="lbl">${it.label}</div>
      ${G.slotLock[i]>0?`<div class="cd">${Math.ceil(G.slotLock[i])}</div>`:''}`;
    cardsEl.appendChild(d);
  }
}
cardsEl.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const i=+card.dataset.slot;
  if(G.slotLock[i]>0||G.gameOver)return;
  G.cardPointer={slot:i,startX:e.clientX,startY:e.clientY,moved:false,id:e.pointerId};
  card.setPointerCapture&&card.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove',e=>{
  if(!G.cardPointer)return;
  const dx=e.clientX-G.cardPointer.startX,dy=e.clientY-G.cardPointer.startY;
  if(!G.cardPointer.moved&&Math.hypot(dx,dy)>12){
    G.cardPointer.moved=true;
    ghostEl.src=getIcon(G.slots[G.cardPointer.slot].sub);
    ghostEl.style.display='block';
  }
  if(G.cardPointer.moved){ghostEl.style.left=e.clientX+'px';ghostEl.style.top=e.clientY+'px';}
});
window.addEventListener('pointerup',e=>{
  if(!G.cardPointer)return;
  const cp=G.cardPointer;G.cardPointer=null;ghostEl.style.display='none';
  const slot=cp.slot;
  if(G.slotLock[slot]>0||G.gameOver)return;
  let target;
  if(!cp.moved)target=G.chars[G.selected]||G.girl;
  else {
    target=null;let best=1e9;
    for(const ch of G.chars){
      if(ch.isSibling&&ch.siblingStage!=='grown')continue;
      if(!ch.wrap)continue;
      const r=ch.wrap.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      const d=Math.hypot(cx-e.clientX,cy-e.clientY);
      if(d<best){best=d;target=ch;}
    }
    if(best>Math.max(FW,FH)*0.4)target=null;
  }
  if(target)useSlot(slot,target);
});
window.addEventListener('pointercancel',()=>{G.cardPointer=null;ghostEl.style.display='none';});
function useSlot(slot,target){
  const item=G.slots[slot];if(!item||!target)return;
  applyItem(target,item);
  if(G.lastSlot===slot)G.slotLock[slot]=4;
  G.lastSlot=slot;
  rebuildAllSlots();
  sndPop();renderCards();
  const el=cardsEl.querySelector(`.card[data-slot="${slot}"]`);
  if(el){el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),340);}
}

/* ROOM */
const roomCv=document.getElementById('room'),rg=roomCv.getContext('2d');
let RW=0,RH=0;
function resizeRoom(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  RW=window.innerWidth;RH=window.innerHeight;
  roomCv.width=RW*dpr;roomCv.height=RH*dpr;
  roomCv.style.width=RW+'px';roomCv.style.height=RH+'px';
  rg.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resizeRoom);

function drawRoom(){
  if(!RW||!RH)return;
  const floorY=RH*0.68;
  const wall=rg.createLinearGradient(0,0,0,floorY);
  wall.addColorStop(0,G.env.wall.top);wall.addColorStop(1,G.env.wall.bot);
  rg.fillStyle=wall;rg.fillRect(0,0,RW,floorY);

  const floor=rg.createLinearGradient(0,floorY,0,RH);
  floor.addColorStop(0,G.env.floor.top);floor.addColorStop(1,G.env.floor.bot);
  rg.fillStyle=floor;rg.fillRect(0,floorY,RW,RH-floorY);

  if(G.env.floor.tex==='boards'){
    rg.strokeStyle='rgba(80,50,20,0.35)';rg.lineWidth=1.5;
    const boardW=RW/12;
    for(let i=1;i<12;i++){rg.beginPath();rg.moveTo(i*boardW,floorY);rg.lineTo(i*boardW,RH);rg.stroke();}
  } else if(G.env.floor.tex==='tiles'){
    rg.strokeStyle='rgba(80,70,60,0.35)';rg.lineWidth=1.5;
    const tileW=RW/8;
    const tileH=(RH-floorY)/4;
    for(let i=1;i<8;i++){rg.beginPath();rg.moveTo(i*tileW,floorY);rg.lineTo(i*tileW,RH);rg.stroke();}
    for(let i=1;i<4;i++){rg.beginPath();rg.moveTo(0,floorY+i*tileH);rg.lineTo(RW,floorY+i*tileH);rg.stroke();}
  } else if(G.env.floor.tex==='parquet'){
    rg.strokeStyle='rgba(90,60,30,0.4)';rg.lineWidth=1.2;
    for(let i=0;i<8;i++){
      const x=i*(RW/8);
      rg.beginPath();rg.moveTo(x,floorY);rg.lineTo(x,RH);rg.stroke();
    }
  }
  rg.fillStyle='rgba(120,90,60,0.6)';rg.fillRect(0,floorY-3,RW,6);

  drawClock(rg,RW*0.62,RH*0.11,Math.min(RW,RH)*0.055);
  drawChandelier(rg,RW*0.5,0);
  drawTVBench(rg,RW*0.15,floorY-RH*0.14,RW*0.24,RH*0.10);
  drawTV(rg,RW*0.15,floorY-RH*0.32,RW*0.22,RH*0.20);
  drawKallax(rg,RW*0.83,floorY-RH*0.20,RW*0.15,RH*0.20);
  drawFloorLamp(rg,RW*0.78,floorY-RH*0.02,RH*0.32);
  drawChair(rg,RW*0.55,floorY-RH*0.02,RW*0.10,RH*0.14);
  drawLack(rg,RW*0.34,floorY-RH*0.03,RW*0.08,RH*0.08);
  drawRug(rg,RW*0.40,RH*0.78,RW*0.30,RH*0.06);
  drawPlant(rg,RW*G.env.plantX,floorY-RH*0.02,RH*0.20);
  drawFrame(rg,RW*0.35,RH*0.15,RW*0.07,RH*0.13,'#f0e8d8');

  if(G.sibling){
    if(G.sibling.siblingStage==='cradle'){
      drawCradle(rg,RW*0.78,RH*0.66,RW*0.16,RH*0.12);
    } else if(G.sibling.siblingStage==='rug'){
      drawBabyRug(rg,RW*0.78,RH*0.70,RW*0.14,RH*0.05);
    }
  }
}
function drawCradle(g,x,y,w,h){
  g.fillStyle='#c8a880';g.fillRect(x-w/2,y-h/2,w,h);
  g.strokeStyle='#8a6a48';g.lineWidth=2;g.strokeRect(x-w/2,y-h/2,w,h);
  for(let i=1;i<6;i++){g.beginPath();g.moveTo(x-w/2+i*w/6,y-h/2);g.lineTo(x-w/2+i*w/6,y+h/2);g.stroke();}
  g.fillStyle='#fff';g.fillRect(x-w/2+3,y-h/2+3,w-6,h*0.55);
  g.fillStyle='#ffb0d0';g.fillRect(x-w/2+3,y+1,w-6,h*0.30);
  g.fillStyle='#ffe4cc';g.beginPath();g.arc(x,y-h*0.05,h*0.18,0,TAU);g.fill();
}
function drawBabyRug(g,x,y,w,h){
  g.fillStyle='#ffd0e8';g.beginPath();g.ellipse(x,y,w,h,0,0,TAU);g.fill();
  g.fillStyle='#ffe4cc';g.beginPath();g.arc(x,y-h*0.3,h*0.5,0,TAU);g.fill();
}
function drawClock(g,x,y,r){
  g.fillStyle='#f0ece0';g.beginPath();g.arc(x,y,r+4,0,TAU);g.fill();
  g.fillStyle='#e8e2d0';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  g.strokeStyle='#8a7a60';g.lineWidth=3;g.beginPath();g.arc(x,y,r+4,0,TAU);g.stroke();
  for(let i=0;i<12;i++){
    const a=i*TAU/12-Math.PI/2;
    const r1=(i%3===0)?r*0.72:r*0.82;
    g.strokeStyle=(i%3===0)?'#3a2a1a':'#8a7a60';
    g.lineWidth=(i%3===0)?3.5:2;
    g.beginPath();g.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);g.lineTo(x+Math.cos(a)*r*0.92,y+Math.sin(a)*r*0.92);g.stroke();
  }
  const now=new Date();
  const h=now.getHours()%12,m=now.getMinutes(),s=now.getSeconds();
  const hourA=(h+m/60)*TAU/12-Math.PI/2;
  const minA=(m+s/60)*TAU/60-Math.PI/2;
  const secA=s*TAU/60-Math.PI/2;
  g.strokeStyle='#1a1a1a';g.lineWidth=5;g.lineCap='round';
  g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(hourA)*r*0.5,y+Math.sin(hourA)*r*0.5);g.stroke();
  g.lineWidth=3.5;
  g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(minA)*r*0.75,y+Math.sin(minA)*r*0.75);g.stroke();
  g.strokeStyle='#d02020';g.lineWidth=2;
  g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(secA)*r*0.85,y+Math.sin(secA)*r*0.85);g.stroke();
  g.fillStyle='#1a1a1a';g.beginPath();g.arc(x,y,5,0,TAU);g.fill();
}
const CAT_SPOTS=[{x:0.72,y:0.86},{x:0.55,y:0.82},{x:0.83,y:0.84},{x:0.20,y:0.88},{x:0.40,y:0.90}];
const CAT_SPOTS_MONSTER=[{x:0.15,y:0.88},{x:0.85,y:0.86},{x:0.50,y:0.82},{x:0.25,y:0.85},{x:0.75,y:0.83}];
function updateCatState(){
  const dt=0.016;
  G.cat.timer-=dt;
  const monster=G.girl&&G.girl.monsterStage>=3;
  G.cat.fat=monster;
  if(G.cat.timer<=0){
    G.cat.timer=monster?6:30;
    const spots=monster?CAT_SPOTS_MONSTER:CAT_SPOTS;
    G.cat.spot=(G.cat.spot+1+Math.floor(Math.random()*4))%spots.length;
    if(G.cat.spot===G.cat.lastSpot)G.cat.spot=(G.cat.spot+1)%spots.length;
    G.cat.lastSpot=G.cat.spot;
  }
  const spots=monster?CAT_SPOTS_MONSTER:CAT_SPOTS;
  let spot=spots[G.cat.spot%spots.length];
  let targetX=RW*spot.x, targetY=RH*spot.y;
  G.cat.x=lerp(G.cat.x||targetX,targetX,dt*3);
  G.cat.y=lerp(G.cat.y||targetY,targetY,dt*3);
}

  catG.beginPath();catG.moveTo(24,-44);catG.lineTo(30,-54);catG.lineTo(32,-42);catG.closePath();catG.fill();
  catG.fillStyle=E.c;

const WEATHERS=['sunny','rain','snow'];
function setWeather(w){G.weather=w;G.weatherT=0;G.weatherDur=rnd(24,40);}
function updateWeather(dt){G.weatherT+=dt;if(G.weatherT>G.weatherDur)setWeather(pick(WEATHERS.filter(w=>w!==G.weather)));}

function drawFX(dt){
  fxG.clearRect(0,0,FW,FH);
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;
    p.life-=dt;p.rot+=p.vr*dt;
    if(p.life<=0){G.particles.splice(i,1);continue;}
    const a=clamp(p.life/p.max,0,1);
    fxG.save();fxG.globalAlpha=a;fxG.translate(p.x,p.y);fxG.rotate(p.rot);
    if(p.type==='heart')drawHeartFX(p.size);
    else if(p.type==='tear')drawTearFX(p.size);
    else if(p.type==='spark')drawSparkFX(p.size);
    fxG.restore();
  }
  for(let i=G.bubbles.length-1;i>=0;i--){
    const b=G.bubbles[i];
    b.life-=dt;b.y+=b.vy*dt;
    if(b.life<=0){G.bubbles.splice(i,1);continue;}
    const a=clamp(b.life/b.max,0,1);
    const fadeIn=clamp((b.max-b.life)*4,0,1);
    const scale=0.6+0.4*fadeIn;
    let bx=b.x,by=b.y;
    if(b.shake){bx+=rnd(-b.shake,b.shake);by+=rnd(-b.shake,b.shake);}
    fxG.save();fxG.globalAlpha=a*0.96;fxG.translate(bx,by);fxG.scale(scale,scale);
    fxG.font=`bold ${b.size}px "Segoe UI",sans-serif`;
    const tw=fxG.measureText(b.text).width;
    const pad=16,w=Math.min(tw+pad*2,FW-40),h=b.size+20;
    let bg,br,fg;
    if(b.color==='happy'){bg='rgba(255,240,250,0.97)';br='#ff5a9a';fg='#c02060';}
    else if(b.color==='sad'){bg='rgba(230,240,255,0.97)';br='#5a8ad0';fg='#2a4a8a';}
    else if(b.color==='yell'){bg='rgba(255,235,215,0.99)';br='#ff8020';fg='#a04000';}
    else if(b.color==='rage'){bg='rgba(180,10,20,1)';br='#ffcf50';fg='#fff';}
    else if(b.color==='mon'){bg='rgba(160,60,200,0.97)';br='#ffd000';fg='#fff';}
    else {bg='rgba(255,255,255,0.97)';br='#ff8ac0';fg='#5a2a5a';}
    fxG.fillStyle=bg;fxG.beginPath();
    fxG.moveTo(-10,h/2);fxG.lineTo(0,h/2+14);fxG.lineTo(10,h/2);fxG.closePath();fxG.fill();
    roundRectOn(fxG,-w/2,-h/2,w,h,14);fxG.fill();
    fxG.strokeStyle=br;fxG.lineWidth=3;roundRectOn(fxG,-w/2,-h/2,w,h,14);fxG.stroke();
    fxG.fillStyle=fg;fxG.textAlign='center';fxG.textBaseline='middle';
    fxG.fillText(b.text,0,1);
    fxG.restore();
  }
}
function drawHeartFX(s){
  const gr=fxG.createRadialGradient(-s*0.3,-s*0.2,0,0,0,s*1.6);
  gr.addColorStop(0,'#ff90b0');gr.addColorStop(1,'#ff2a6a');
  fxG.fillStyle=gr;fxG.beginPath();
  fxG.moveTo(0,s*0.35);
  fxG.bezierCurveTo(s,s-s*0.6,s*1.5,s+s*0.9,0,s*1.5);
  fxG.bezierCurveTo(-s*1.5,s+s*0.9,-s,s-s*0.6,0,s*0.35);
  fxG.fill();
}
function drawTearFX(s){
  const gr=fxG.createRadialGradient(-s*0.3,-s*0.3,0,0,0,s);
  gr.addColorStop(0,'#c0e8ff');gr.addColorStop(1,'#5a9aff');
  fxG.fillStyle=gr;fxG.beginPath();
  fxG.moveTo(0,-s);fxG.quadraticCurveTo(s,s*0.3,0,s);fxG.quadraticCurveTo(-s,s*0.3,0,-s);fxG.fill();
}
function drawSparkFX(s){
  const gr=fxG.createRadialGradient(0,0,0,0,0,s);
  gr.addColorStop(0,'#fff5b0');gr.addColorStop(0.5,'#ffd040');gr.addColorStop(1,'rgba(255,180,0,0)');
  fxG.fillStyle=gr;
  fxG.beginPath();
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2;
    fxG.moveTo(0,0);fxG.lineTo(Math.cos(a)*s*1.6,Math.sin(a)*s*1.6);
    fxG.lineTo(Math.cos(a+Math.PI/4)*s*0.4,Math.sin(a+Math.PI/4)*s*0.4);
  }
  fxG.fill();
}

let lastT=performance.now();
function loop(now){
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;
  G.t+=dt;
  updateWeather(dt);
  let needRender=false;
  for(let i=0;i<5;i++){
    if(G.slotLock[i]>0){G.slotLock[i]=Math.max(0,G.slotLock[i]-dt);needRender=true;}
  }
  if(needRender)renderCards();
  for(let i=G.floorItems.length-1;i>=0;i--){
    const wi=G.floorItems[i];
    wi.life-=dt;
    if(wi.life<2)wi.el.style.opacity=clamp(wi.life/2,0,1);
    if(wi.life<=0){wi.el.remove();G.floorItems.splice(i,1);}
  }
  if(G.girl&&G.girl.siblingBornAt>0&&!G.sibling&&G.t>=G.girl.siblingBornAt){
    G.girl.siblingBornAt=0;
    spawnSibling();
  }
  for(const ch of G.chars)updateChar(ch,dt);
  drawRoom();
  updateCatState();
  drawCatLayer();
  drawFX(dt);
  checkWin();
  if(!loop._hudT||G.t-loop._hudT>0.2){loop._hudT=G.t;updateHUD();}
  requestAnimationFrame(loop);
}

function init(){
  resizeRoom();
  resizeFX();
  const girl=makeCharState(false,false);
  G.girl=girl;G.chars.push(girl);
  createCharDOM(girl);
  positionChars();
  updateSelectionUI();
  rebuildAllSlots();
  renderCards();updateHUD();
  setWeather('sunny');
  G.cat.x=window.innerWidth*0.72;
  G.cat.y=window.innerHeight*0.86;
  G.cat.spot=0;
  G.cat.lastSpot=0;
  requestAnimationFrame(loop);
  window.addEventListener('pointerdown',()=>{const a=ac();if(a&&a.state==='suspended')a.resume();},{once:true});
}
window.addEventListener('load',()=>{resizeRoom();resizeFX();positionChars();});
init();
})();
</script>
