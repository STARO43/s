<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Лисичка-истеричка · Аниме</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a0a;
    font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;color:#fff;}

  #room{position:fixed;inset:0;z-index:1;display:block;width:100vw;height:100vh;height:100dvh;}
  #chars{position:fixed;inset:0;z-index:2;pointer-events:none;}
  #props{position:fixed;inset:0;z-index:3;pointer-events:none;}
  #cat{position:fixed;inset:0;z-index:4;pointer-events:none;}
  #fx{position:fixed;inset:0;z-index:5;pointer-events:none;}

  #halftone{position:fixed;inset:0;z-index:14;pointer-events:none;
    background-image:radial-gradient(circle,rgba(0,0,0,.55) 20%,transparent 26%);
    background-size:7px 7px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 46%,transparent 32%,rgba(0,0,0,.55) 72%,#000 100%);
    mask-image:radial-gradient(ellipse at 50% 46%,transparent 32%,rgba(0,0,0,.55) 72%,#000 100%);
    mix-blend-mode:multiply;opacity:.55;}
  body.mobile #halftone{display:none;}

  #panel{position:fixed;inset:0;z-index:15;pointer-events:none;border:14px solid #0a0a0a;box-sizing:border-box;}
  #panel::before{content:'';position:absolute;inset:6px;border:1.5px solid rgba(10,10,10,.75);}
  #panel .corner{position:absolute;width:34px;height:34px;border:2.5px solid #0a0a0a;}
  #panel .corner.tl{top:-2px;left:-2px;border-right:0;border-bottom:0;}
  #panel .corner.tr{top:-2px;right:-2px;border-left:0;border-bottom:0;}
  #panel .corner.bl{bottom:-2px;left:-2px;border-right:0;border-top:0;}
  #panel .corner.br{bottom:-2px;right:-2px;border-left:0;border-top:0;}

  #tint{position:fixed;inset:0;z-index:6;pointer-events:none;transition:background 2.5s ease;}
  #vignette{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(ellipse 80% 70% at 50% 46%,
      rgba(0,0,0,0) 44%, rgba(0,0,0,.28) 74%, rgba(0,0,0,.65) 100%);}

  @keyframes screenShake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-4px,3px)}
    40%{transform:translate(4px,-3px)}
    60%{transform:translate(-3px,-4px)}
    80%{transform:translate(3px,4px)}
  }
  @keyframes screenShakeHard{
    0%,100%{transform:translate(0,0) rotate(0deg)}
    20%{transform:translate(-11px,8px) rotate(-.7deg)}
    40%{transform:translate(11px,-8px) rotate(.7deg)}
    60%{transform:translate(-9px,-10px) rotate(-.5deg)}
    80%{transform:translate(9px,10px) rotate(.5deg)}
  }
  body.rage-shake #room,body.rage-shake #chars,body.rage-shake #props,
  body.rage-shake #cat,body.rage-shake #fx{animation:screenShake .14s linear infinite;}
  body.rage-shake-hard #room,body.rage-shake-hard #chars,body.rage-shake-hard #props,
  body.rage-shake-hard #cat,body.rage-shake-hard #fx{animation:screenShakeHard .09s linear infinite;}

  .character-wrap{
    position:absolute;pointer-events:auto;cursor:pointer;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.6));
    transform-origin:center bottom;
  }
  .character-wrap svg{display:block;width:100%;height:100%;overflow:visible;}

  .character-wrap .body-lower{transform-origin:200px 660px;transform:scaleX(var(--fatX,1)) scaleY(var(--fatY,1));transition:transform .35s ease;}
  .character-wrap .body-mid{transform-origin:200px 400px;transform:scaleX(var(--fatX,1)) scaleY(var(--fatY,1));transition:transform .35s ease;}
  .character-wrap .head-group{transform-origin:200px 170px;transform:scaleX(var(--headFatX,1)) scaleY(var(--headFatY,1));transition:transform .35s ease;}

  .character-wrap[data-selected="1"]::after{
    content:'';position:absolute;left:50%;bottom:-4px;width:70%;height:14px;
    transform:translateX(-50%);border-radius:50%;
    box-shadow:0 0 22px 8px rgba(255,208,112,.65);
    animation:selPulse 1.6s ease-in-out infinite;pointer-events:none;
  }
  @keyframes selPulse{0%,100%{opacity:.35}50%{opacity:.95}}

  .character-wrap svg .breathing{animation:breathe 3.6s ease-in-out infinite;transform-origin:200px 700px;}
  .character-wrap svg .head-bob{animation:headBob 4.4s ease-in-out infinite;transform-origin:200px 240px;}
  .character-wrap svg .hair-bl{animation:hairDriftL 5.4s ease-in-out infinite;transform-origin:130px 90px;}
  .character-wrap svg .hair-br{animation:hairDriftR 5.6s ease-in-out infinite;transform-origin:270px 90px;}
  .character-wrap svg .ear-l{animation:earWiggleL 4.2s ease-in-out infinite;transform-origin:160px 90px;}
  .character-wrap svg .ear-r{animation:earWiggleR 4.5s ease-in-out infinite;transform-origin:240px 90px;}
  .character-wrap svg .whisker-l{animation:whiskerL 3.2s ease-in-out infinite;transform-origin:150px 210px;}
  .character-wrap svg .whisker-r{animation:whiskerR 3.4s ease-in-out infinite;transform-origin:250px 210px;}
  @keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.5px) scaleY(1.012)}}
  @keyframes headBob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-2px) rotate(.6deg)}}
  @keyframes hairDriftL{0%,100%{transform:rotate(0) translateX(0)}50%{transform:rotate(.9deg) translateX(2px)}}
  @keyframes hairDriftR{0%,100%{transform:rotate(0) translateX(0)}50%{transform:rotate(-.9deg) translateX(-2px)}}
  @keyframes earWiggleL{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}}
  @keyframes earWiggleR{0%,100%{transform:rotate(0deg)}35%{transform:rotate(3deg)}65%{transform:rotate(-2deg)}}
  @keyframes whiskerL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
  @keyframes whiskerR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}

  .character-wrap svg .blinkable{animation:blink 5.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .character-wrap[data-expr="happy"] .blinkable,
  .character-wrap[data-expr="laugh"] .blinkable,
  .character-wrap[data-expr="bliss"] .blinkable,
  .character-wrap[data-expr="cry"]   .blinkable,
  .character-wrap[data-expr="rage"]  .blinkable,
  .character-wrap[data-expr="scream"] .blinkable{animation:none;}

  .character-wrap[data-shake="1"] .breathing{
    animation:breathe 3.6s ease-in-out infinite,shakeRage .18s linear infinite;
  }
  @keyframes shakeRage{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-2.5px,1.5px)}
    50%{transform:translate(2px,-1px)}
    75%{transform:translate(-1.5px,-1.5px)}
  }

  .character-wrap svg .heart-fx{animation:heartRise 1.8s ease-out infinite;}
  @keyframes heartRise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1)}100%{transform:translateY(-150px) scale(.9);opacity:0}}
  .character-wrap svg .tear-fx{animation:tearFall 1.4s ease-in infinite;}
  @keyframes tearFall{0%{transform:translateY(0) scale(.4);opacity:0}20%{transform:translateY(6px) scale(1);opacity:1}100%{transform:translateY(72px) scale(1);opacity:0}}
  .character-wrap svg .onoma{opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none;}
  .character-wrap[data-expr="rage"] svg .onoma-rage,
  .character-wrap[data-expr="demand"] svg .onoma-demand,
  .character-wrap[data-expr="happy"] svg .onoma-happy,
  .character-wrap[data-expr="laugh"] svg .onoma-happy,
  .character-wrap[data-expr="cry"] svg .onoma-cry{animation:onomaZap 1.4s ease-out infinite;}
  @keyframes onomaZap{
    0%{opacity:0;transform:scale(.4) rotate(-15deg)}
    30%{opacity:1;transform:scale(1.15) rotate(-4deg)}
    60%{opacity:1;transform:scale(1) rotate(0deg)}
    100%{opacity:0;transform:scale(.9) rotate(4deg)}
  }

  .character-wrap svg .torso-original,
  .character-wrap svg .skirt-original,
  .character-wrap svg .arms-normal,
  .character-wrap svg .hands-normal,
  .character-wrap svg .arms-brat,
  .character-wrap svg .shoes-original,
  .character-wrap svg .cardigan,
  .character-wrap svg .torso-brat,
  .character-wrap svg .skirt-brat,
  .character-wrap svg .shoes-brat,
  .character-wrap svg .glasses,
  .character-wrap svg .monster-outfit,
  .character-wrap svg .crown,
  .character-wrap svg .lolli-in-hand,
  .character-wrap svg .phone-in-hand,
  .character-wrap svg .arm-holding,
  .character-wrap svg .arm-holding-brat,
  .character-wrap svg .hands-holding,
  .character-wrap svg .apron-worn,
  .character-wrap svg .lip-color-wide,
  .character-wrap svg .vampire-fangs,
  .character-wrap svg .eye-neutral,
  .character-wrap svg .eye-happy,
  .character-wrap svg .eye-sad,
  .character-wrap svg .eye-rage,
  .character-wrap svg .eye-demand,
  .character-wrap svg .mouth-neutral,
  .character-wrap svg .mouth-happy,
  .character-wrap svg .mouth-laugh,
  .character-wrap svg .mouth-bliss,
  .character-wrap svg .mouth-sad,
  .character-wrap svg .mouth-cry,
  .character-wrap svg .mouth-scream,
  .character-wrap svg .mouth-rage,
  .character-wrap svg .mouth-mon-rage,
  .character-wrap svg .mouth-demand,
  .character-wrap svg .fx-anger,
  .character-wrap svg .fx-hearts,
  .character-wrap svg .fx-sparks,
  .character-wrap svg .fx-sweat,
  .character-wrap svg .fx-tears,
  .character-wrap svg .fx-carrots,
  .character-wrap svg .monster-horns,
  .character-wrap svg .hairpins,
  .character-wrap svg .hair-bow,
  .character-wrap svg .bunny-tail{display:none;}

  .character-wrap svg .bunny-ears{display:block;}

  .character-wrap[data-outfit="original"] .torso-original,
  .character-wrap[data-outfit="original"] .skirt-original,
  .character-wrap[data-outfit="original"] .arms-normal,
  .character-wrap[data-outfit="original"] .hands-normal,
  .character-wrap[data-outfit="original"] .shoes-original,
  .character-wrap[data-outfit="original"] .cardigan{display:block;}

  .character-wrap[data-outfit="brat"] .torso-brat,
  .character-wrap[data-outfit="brat"] .skirt-brat,
  .character-wrap[data-outfit="brat"] .arms-brat,
  .character-wrap[data-outfit="brat"] .shoes-brat,
  .character-wrap[data-outfit="brat"] .glasses,
  .character-wrap[data-outfit="brat"] .hairpins{display:block;}
  .character-wrap[data-outfit="brat"] .blush{opacity:.9;}

  .character-wrap[data-stage="3"] .monster-outfit{display:block;}
  .character-wrap[data-stage="3"] .monster-horns{display:block;}
  .character-wrap[data-stage="3"] .arms-brat{display:block;}

  .character-wrap[data-stage="3"] .torso-original,
  .character-wrap[data-stage="3"] .torso-brat,
  .character-wrap[data-stage="3"] .skirt-original,
  .character-wrap[data-stage="3"] .skirt-brat,
  .character-wrap[data-stage="3"] .cardigan,
  .character-wrap[data-stage="3"] .glasses,
  .character-wrap[data-stage="3"] .crown,
  .character-wrap[data-stage="3"] .lolli-in-hand,
  .character-wrap[data-stage="3"] .phone-in-hand,
  .character-wrap[data-stage="3"] .arm-holding,
  .character-wrap[data-stage="3"] .hands-holding,
  .character-wrap[data-stage="3"] .hair-bow,
  .character-wrap[data-stage="3"] .bunny-ears,
  .character-wrap[data-stage="3"] .bunny-tail,
  .character-wrap[data-stage="3"] .apron-worn,
  .character-wrap[data-stage="3"] .vampire-fangs,
  .character-wrap[data-stage="3"] .lip-color-wide,
  .character-wrap[data-stage="3"] .hairpins,
  .character-wrap[data-stage="3"] .whisker-l,
  .character-wrap[data-stage="3"] .whisker-r{display:none;}

  .character-wrap[data-stage="3"] .hair-bl,
  .character-wrap[data-stage="3"] .hair-br,
  .character-wrap[data-stage="3"] .hair-sl,
  .character-wrap[data-stage="3"] .hair-sr,
  .character-wrap[data-stage="3"] .hair-front{fill:url(#hairMon-g) !important;}
  .character-wrap[data-stage="3"] .hair-front-hi{display:none;}

  .character-wrap[data-boy="0"] .hair-bow{display:block;}
  .character-wrap[data-crown="1"] .crown{display:block;}

  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .arm-holding,
  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .hands-holding,
  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .lolli-in-hand,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .arm-holding,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .hands-holding,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .phone-in-hand{display:block;}

  .character-wrap[data-outfit="brat"][data-hold="phone"]:not([data-stage="3"]) .arm-holding-brat,
  .character-wrap[data-outfit="brat"][data-hold="lolli"]:not([data-stage="3"]) .arm-holding-brat{display:block;}
  .character-wrap[data-outfit="brat"][data-hold="phone"]:not([data-stage="3"]) .arm-holding,
  .character-wrap[data-outfit="brat"][data-hold="lolli"]:not([data-stage="3"]) .arm-holding{display:none;}

  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .arms-normal,
  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .hands-normal,
  .character-wrap[data-hold="lolli"]:not([data-stage="3"]) .arms-brat,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .arms-normal,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .hands-normal,
  .character-wrap[data-hold="phone"]:not([data-stage="3"]) .arms-brat{display:none;}

  .character-wrap[data-apron="1"] .apron-worn{display:block;}

  .character-wrap[data-lips="1"] svg .mouth-neutral,
  .character-wrap[data-lips="1"] svg .mouth-happy,
  .character-wrap[data-lips="1"] svg .mouth-bliss,
  .character-wrap[data-lips="1"] svg .mouth-sad,
  .character-wrap[data-lips="1"] svg .mouth-laugh,
  .character-wrap[data-lips="1"] svg .mouth-cry,
  .character-wrap[data-lips="1"] svg .mouth-scream,
  .character-wrap[data-lips="1"] svg .mouth-rage,
  .character-wrap[data-lips="1"] svg .mouth-mon-rage,
  .character-wrap[data-lips="1"] svg .mouth-demand{transform:scaleX(1.6);transform-origin:200px 224px;transform-box:view-box;}
  .character-wrap[data-lips="1"]:not([data-stage="3"]) svg .mouth-neutral path,
  .character-wrap[data-lips="1"]:not([data-stage="3"]) svg .mouth-happy path,
  .character-wrap[data-lips="1"]:not([data-stage="3"]) svg .mouth-bliss path,
  .character-wrap[data-lips="1"]:not([data-stage="3"]) svg .mouth-sad path,
  .character-wrap[data-lips="1"]:not([data-stage="3"]) svg .mouth-demand path{stroke:#ff5a8a;stroke-width:5;}
  .character-wrap[data-lips="1"]:not([data-stage="3"]) svg .mouth-laugh path:first-child,
  .character-wrap[data-lips="1"]:not([data-stage="3"]) svg .mouth-cry ellipse,
  .character-wrap[data-lips="1"]:not([data-stage="3"]) svg .mouth-scream ellipse,
  .character-wrap[data-lips="1"]:not([data-stage="3"]) svg .mouth-rage ellipse{fill:#ff5a8a;}
  .character-wrap svg .lip-color-wide{display:none;}

  .character-wrap[data-expr="neutral"] .eye-neutral,
  .character-wrap[data-expr="neutral"] .mouth-neutral{display:block;}
  .character-wrap[data-expr="happy"] .eye-happy,
  .character-wrap[data-expr="happy"] .mouth-happy{display:block;}
  .character-wrap[data-expr="laugh"] .eye-happy,
  .character-wrap[data-expr="laugh"] .mouth-laugh{display:block;}
  .character-wrap[data-expr="bliss"] .eye-happy,
  .character-wrap[data-expr="bliss"] .mouth-bliss{display:block;}
  .character-wrap[data-expr="sad"] .eye-sad,
  .character-wrap[data-expr="sad"] .mouth-sad{display:block;}
  .character-wrap[data-expr="cry"] .eye-sad,
  .character-wrap[data-expr="cry"] .mouth-cry{display:block;}
  .character-wrap[data-expr="demand"] .eye-demand,
  .character-wrap[data-expr="demand"] .mouth-demand{display:block;}
  .character-wrap[data-expr="rage"] .eye-rage,
  .character-wrap[data-expr="rage"] .mouth-rage{display:block;}
  .character-wrap[data-stage="3"][data-expr="rage"] .eye-rage,
  .character-wrap[data-stage="3"][data-expr="rage"] .mouth-mon-rage{display:block;}
  .character-wrap[data-stage="3"][data-expr="rage"] .mouth-rage{display:none;}

  .character-wrap[data-expr="happy"] .fx-hearts,
  .character-wrap[data-expr="laugh"] .fx-hearts,
  .character-wrap[data-expr="bliss"] .fx-sparks,
  .character-wrap[data-expr="rage"] .fx-anger,
  .character-wrap[data-expr="cry"] .fx-tears{display:block;}

  #hud{position:fixed;top:0;left:0;z-index:30;pointer-events:none;padding:10px;display:flex;flex-direction:column;gap:6px;}

  #cards{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:flex-end;
    gap:clamp(6px,1.6vw,16px);padding:8px clamp(6px,2vw,22px) calc(12px + env(safe-area-inset-bottom));pointer-events:none;}
  .card{
    pointer-events:auto;position:relative;
    width:clamp(54px,13.2vw,92px);aspect-ratio:5/6;border-radius:14px;
    background:linear-gradient(180deg,#ffffff 0%,#f5f5f8 55%,#e8e8ee 100%);
    border:3px solid #0a0a0a;
    box-shadow:5px 5px 0 #0a0a0a;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:8px 6px 6px;cursor:pointer;
    transition:transform .12s cubic-bezier(.2,.9,.3,1.35);
    touch-action:none;overflow:hidden;
  }
  .card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #0a0a0a;}
  .card img{width:80%;aspect-ratio:1/1;object-fit:contain;pointer-events:none;filter:contrast(1.05);}
  .card .lbl{margin-top:auto;font-size:clamp(8px,1.85vw,11px);font-weight:800;color:#0a0a0a;
    text-align:center;line-height:1.05;letter-spacing:.2px;pointer-events:none;padding-bottom:1px;}
  .card.locked{filter:grayscale(.9) brightness(.72);cursor:default;}
  .card .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(16px,4vw,26px);font-weight:900;color:#ffd070;background:rgba(10,4,20,.68);
    text-shadow:0 2px 6px #000;}
  .card.pop{animation:popIn .32s ease;}
  @keyframes popIn{0%{transform:scale(.6) rotate(-8deg);opacity:.2}60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0)}}

  /* ===== МОБИЛЬНАЯ ВЕРСИЯ: почти полностью прозрачные карточки ===== */
  body.mobile .card{
    background:rgba(255,255,255,0.06);
    border-color:rgba(10,10,10,0.22);
    box-shadow:0 0 6px rgba(0,0,0,.28);
    -webkit-backdrop-filter:blur(1px);
    backdrop-filter:blur(1px);
  }
  body.mobile .card:active{box-shadow:0 0 4px rgba(0,0,0,.3);}
  body.mobile .card img{
    filter:drop-shadow(0 0 3px rgba(255,255,255,.95)) contrast(1.1);
  }
  body.mobile .card .lbl{
    color:#0a0a0a;
    text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 10px #fff,0 0 14px #fff;
  }
  body.mobile .card .cd{
    background:rgba(10,4,20,0.45);
    color:#ffe08a;
  }

  #dragGhost{position:fixed;z-index:120;pointer-events:none;width:78px;height:78px;transform:translate(-50%,-50%);display:none;filter:drop-shadow(3px 3px 0 #0a0a0a);}
  #dragGhost img{width:100%;height:100%;object-fit:contain;}

  .floor-toy{position:absolute;pointer-events:none;animation:propAppear .5s ease-out;}
  .floor-toy img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(1.5px 1.5px 0 rgba(10,10,10,.8));}
  @keyframes propAppear{0%{transform:scale(.3) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
  .floor-item{position:absolute;pointer-events:none;animation:propAppear .5s ease-out;}
  .floor-item img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(2px 2px 0 rgba(10,10,10,.7));}

  #babyBtn{position:fixed;left:10px;bottom:calc(122px + env(safe-area-inset-bottom));z-index:60;
    font-family:inherit;font-weight:800;font-size:12px;padding:10px 14px;border-radius:12px;
    border:3px solid #0a0a0a;background:#fff;color:#0a0a0a;
    box-shadow:4px 4px 0 #0a0a0a;cursor:pointer;letter-spacing:.3px;display:none;}
  #babyBtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #0a0a0a;}

  .exit-btn-fox{position:fixed;top:22px;right:22px;z-index:100;font-family:inherit;font-weight:800;font-size:13px;
    padding:9px 16px;background:#fff;color:#0a0a0a;border:3px solid #0a0a0a;border-radius:10px;cursor:pointer;
    box-shadow:4px 4px 0 #0a0a0a;letter-spacing:1px;}
  .exit-btn-fox:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #0a0a0a;}

  .exit-confirm-fox{position:fixed;inset:0;z-index:200;background:rgba(10,10,10,.9);display:flex;
    align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s;padding:20px;}

var ICON_CACHE={};
function getIcon(sub,opts){
  var key=opts?sub+'|'+JSON.stringify(opts):sub;
  if(ICON_CACHE[key])return ICON_CACHE[key];
  var c=document.createElement('canvas');c.width=c.height=200;
  var g=c.getContext('2d');g.translate(100,100);drawItemIcon(g,sub,190,opts);
  var url=c.toDataURL();ICON_CACHE[key]=url;return url;
}
function iconFor(item){
  if(!item)return '';
  if(item.sub==='book')return getIcon('book',{color:item.bookColor,author:item.bookAuthor});
  return getIcon(item.sub);
}

function getUsefulPool(){
  var mode=G.girl?G.girl.globalMode:'capricious';
  if(mode==='neutral'||mode==='enlightened')return USEFUL.concat(USEFUL_EXTRA);
  return USEFUL.slice();
}
function getAvailableUseful(){
  var pool=getUsefulPool();
  var used=G.usedUsefulThisBatch;
  var fresh=pool.filter(function(it){return !used[it.sub];});
  return fresh.length?fresh:pool;
}
function rebuildAllSlots(){
  G.usedUsefulThisBatch={};
  var usefulSrc=pick(getAvailableUseful());
  var usefulItem={kind:usefulSrc.kind,sub:usefulSrc.sub,label:usefulSrc.label};
  if(usefulItem.sub==='book'){
    usefulItem.bookColor=pick(BOOK_COLORS);
    usefulItem.bookAuthor=pick(BOOK_AUTHORS);
  }
  G.usedUsefulThisBatch[usefulItem.sub]=true;
  var usefulIdx=Math.floor(Math.random()*5);
  var otherCategories=[TOYS,FOODS,CLOTHES];
  G.slots=[];
  for(var i=0;i<5;i++){
    if(i===usefulIdx)G.slots.push(usefulItem);
    else {
      var src=pick(pick(otherCategories));
      G.slots.push({kind:src.kind,sub:src.sub,label:src.label});
    }
  }
}

function positionChars(){
  var W=window.innerWidth,H=window.innerHeight;
  for(var ci=0;ci<G.chars.length;ci++){
    var ch=G.chars[ci];
    if(!ch.wrap)continue;
    var charHeightOnScreen,cx,feetY;
    if(ch.isSibling){
      if(ch.siblingStage==='cradle'){ch.wrap.style.display='none';ch._head=null;ch._rect=null;continue;}
      if(ch.siblingStage==='rug'){
        charHeightOnScreen=Math.min(H*0.22,W*0.40);
        cx=W*0.78;feetY=H*0.75;
      } else {
        charHeightOnScreen=Math.min(H*0.38,W*0.60);
        cx=W*0.75;feetY=H*0.85;
      }
    } else {
      charHeightOnScreen=Math.min(H*0.48,W*0.82);
      cx=W*0.40;feetY=H*0.85;
    }
    ch.wrap.style.display='block';
    var scale=charHeightOnScreen/660;
    var svgH=720*scale;
    var svgW=400*scale;
    var boxTop=feetY-700*scale;
    ch.wrap.style.left=(cx-svgW/2)+'px';
    ch.wrap.style.top=boxTop+'px';
    ch.wrap.style.width=svgW+'px';
    ch.wrap.style.height=svgH+'px';
    var r=ch.wrap.getBoundingClientRect();
    ch._rect=r;
    ch._head={x:r.left+r.width/2,y:r.top+r.height*0.24};
    ch._center={x:r.left+r.width/2,y:r.top+r.height/2};
  }
}

var VEHICLE_SLOTS={bike:0,scooter:1};
function repositionVehicles(){
  if(!G.vehicleEls)return;
  var W=window.innerWidth,H=window.innerHeight;
  var size=clamp(W*0.16,110,190);
  var visiblePart=0.30;
  var visibleW=size*visiblePart;
  var floorY=H*0.70;
  var stackStep=size*0.42;
  for(var sub in G.vehicleEls){
    if(!G.vehicleEls.hasOwnProperty(sub))continue;
    var el=G.vehicleEls[sub];
    var slot=VEHICLE_SLOTS[sub]!=null?VEHICLE_SLOTS[sub]:0;
    el.style.width=size+'px';
    el.style.height=size+'px';
    el.style.left=(W-visibleW)+'px';
    el.style.top=(floorY-size*0.05+slot*stackStep)+'px';
  }
}

function addBubble(text,pos,opts){
  opts=opts||{};
  var x,y;
  if(pos&&typeof pos==='object'){x=pos.x;y=pos.y;}
  else {x=pos;y=(opts.y!==undefined)?opts.y:0;}
  if(!isFinite(x))x=FW*0.5;
  if(!isFinite(y))y=FH*0.28;
  var approxW=Math.min(text.length*(opts.size||20)*0.62+40,FW-20);
  x=Math.max(approxW/2+8,Math.min(FW-approxW/2-8,x));
  y=Math.max(60,Math.min(FH-100,y));
  if(G.bubbles.length>5)G.bubbles.shift();
  G.bubbles.push({text:text,x:x,y:y,
    life:opts.life||2.2,max:opts.life||2.2,
    color:opts.color||'normal',
    size:opts.size||20,
    vy:opts.vy||-16,
    shake:opts.shake||0});
}
function spawnParticles(type,x,y,n){
  n=n||12;
  if(LOW_GFX)n=Math.max(4,Math.round(n*0.6));
  for(var i=0;i<n;i++){
    G.particles.push({x:x+rnd(-50,50),y:y+rnd(-24,24),
      vx:rnd(-70,70),vy:rnd(-160,-50),life:rnd(1,1.9),max:1.9,type:type,
      size:rnd(5,12),rot:rnd(0,TAU),vr:rnd(-4,4)});
  }
}
function headScreenPos(ch){
  if(ch._head)return ch._head;
  if(!ch.wrap)return{x:0,y:0};
  var r=ch.wrap.getBoundingClientRect();
  return{x:r.left+r.width/2,y:r.top+r.height*0.24};
}
function isInsideSafeZone(x,y){
  var r=G.girl&&G.girl._rect;
  if(!r)return false;
  return x>r.left-10&&x<r.right+10&&y>r.top-10&&y<r.bottom+10;
}
function placeFloorToy(sub){
  var W=window.innerWidth,H=window.innerHeight;
  var cols=8,rows=6;
  var idx=G.toyCounter++;
  if(idx>=TOY_LIMIT){triggerLose();return;}
  var col=idx%cols;
  var row=Math.floor(idx/cols);
  var baseX=W*0.08+(col+0.5)*(W*0.84/cols);
  var baseY=H*0.72+row*(H*0.24/rows)+rnd(-6,6);
  var tries=0;
  while(isInsideSafeZone(baseX,baseY)&&tries<10){
    baseX=W*0.08+Math.random()*(W*0.84);
    baseY=H*0.72+Math.random()*(H*0.24);
    tries++;
  }
  var size=clamp(W*0.05,28,52);
  var el=document.createElement('div');
  el.className='floor-toy';
  el.style.left=(baseX-size/2)+'px';
  el.style.top=(baseY-size/2)+'px';
  el.style.width=size+'px';
  el.style.height=size+'px';
  el.style.transform='rotate('+rnd(-25,25)+'deg)';
  el.innerHTML='<img src="'+getIcon(sub)+'" alt="">';
  propsEl.appendChild(el);
  G.floorToys.push(el);
}

}
function placeFloorItem(sub){
  if(!G.vehicleEls)G.vehicleEls={};
  if(G.vehicleEls[sub]){
    var el0=G.vehicleEls[sub];
    el0.style.animation='none';
    void el0.offsetWidth;
    el0.style.animation='propAppear .4s ease-out';
    return;
  }
  var W=window.innerWidth,H=window.innerHeight;
  var size=clamp(W*0.16,110,190);
  var slot=VEHICLE_SLOTS[sub]!=null?VEHICLE_SLOTS[sub]:0;
  var visiblePart=0.30;
  var visibleW=size*visiblePart;
  var x=W-visibleW;
  var floorY=H*0.60;
  var stackStep=size*0.42;
  var el=document.createElement('div');
  el.className='floor-item';
  el.style.width=size+'px';

  el.style.left=x+'px';

function removeOneFloorToy(){
  if(G.floorToys.length===0){
    if(G.floorShoes.length===0)return false;
    var s=G.floorShoes.pop();s.remove();return true;
  }
  var toy=G.floorToys.pop();
  toy.remove();
  G.toyCounter=Math.max(0,G.toyCounter-1);
  return true;
}
function triggerLose(){
  if(G.gameOver)return;
  G.gameOver=true;
  document.body.classList.remove('rage-shake');
  document.body.classList.remove('rage-shake-hard');
  document.getElementById('loseScreen').classList.add('show');
  sndLose();setTimeout(sndLose,300);
}
function itemCategory(item){
  if(item.kind==='useful'){
    if(item.sub==='book'||item.sub==='broom'||item.sub==='apron'||item.sub==='subbotnik'||item.sub==='grandma')return 'good';
    return 'neutral';
  }
  if(item.sub==='phone'||item.sub==='lipstick'||item.sub==='dress'||item.sub==='shoes'||item.sub==='crown')return 'fashion';
  if(item.kind==='toy')return 'toy';
  if(item.kind==='food')return 'sweet';
  return 'other';
}
function reactFor(mode,cat){
  if(mode==='capricious'){
    if(cat==='sweet'||cat==='toy'||cat==='fashion')return 'love';
    if(cat==='good')return 'hate';
    return 'meh';
  }
  if(mode==='neutral'){
    if(cat==='sweet'||cat==='toy')return 'love';
    return 'meh';
  }
  if(cat==='good')return 'love';
  if(cat==='fashion')return 'hate';
  return 'meh';
}
function usefulPhrase(ch,sub){
  if(ch.usefulStreak>=3&&Math.random()<0.6)return pick(USEFUL_STREAK_PHRASES);
  var arr=USEFUL_BY_SUB[sub];
  if(arr)return pick(arr);
  return pick(USEFUL_PHRASES);
}
function applyItem(ch,item){
  if(G.gameOver)return;
  if(ch.isSibling&&ch.siblingStage!=='grown')return;
  var head=headScreenPos(ch);
  var bx=clamp(head.x,140,FW-140);
  var by=Math.max(80,head.y-40);
  var cat=itemCategory(item);

  if(ch.monsterStage>=3){
    if(item.sub==='book'){
      ch.monsterBooks=(ch.monsterBooks||0)+1;
      sndGood();
      addBubble('Книга '+ch.monsterBooks+'/'+MONSTER_BOOKS_TO_REVERT,{x:bx,y:by},{color:'happy',life:1.8,size:22});
      spawnParticles('spark',head.x,head.y+140,10);
      if(ch.monsterBooks>=MONSTER_BOOKS_TO_REVERT){
        ch.monsterStage=0;ch.clothesClicks=0;ch.monsterBooks=0;
        sndEnlighten();
        setTimeout(function(){addBubble('Раньше я была другой...',{x:bx,y:by},{color:'happy',life:2.8,size:26});},300);
      }
      updateMonster(ch);
      return;
    }
    if(cat==='sweet'||cat==='toy'||cat==='fashion'){
      ch.mood=clamp(ch.mood+18,-100,100);
      ch.happyStreak++;
      ch.lastBadT=G.t;
      ch.reaction='happy';ch.reactionT=1.2;
      sndHappy();
      spawnParticles('heart',head.x,head.y+140,10);
      addBubble(pick(HAPPY_PHRASES),{x:bx+rnd(-30,30),y:by},{color:'happy',life:1.6,size:22});
    } else {
      ch.mood=clamp(ch.mood-6,-100,100);
      sndDemand();
      addBubble(pick(MONSTER_PHRASES),{x:bx,y:by},{color:'yell',life:1.5,size:22,shake:1});
      ch.screamT=1.0;
    }
  } else {
    var react=reactFor(ch.globalMode,cat);
    if(react==='love'){
      ch.mood=clamp(ch.mood+18,-100,100);
      ch.happyStreak++;
      ch.lastBadT=G.t;
      ch.usefulStreak=0;
      if(Math.random()<0.5){ch.reaction='happy';sndGood();}
      else {ch.reaction='laugh';sndHappy();}
      ch.reactionT=1.4;
      spawnParticles('heart',head.x,head.y+140,10);
      addBubble(pick(HAPPY_PHRASES),{x:bx+rnd(-30,30),y:by},{color:'happy',life:1.6,size:22});
    } else if(react==='meh'){
      addBubble('...',{x:bx,y:by},{color:'normal',life:1.2,size:22});
      ch.usefulStreak=0;
    } else {
      ch.mood=clamp(ch.mood-18,-100,100);
      ch.happyStreak=0;
      ch.reaction='cry';ch.reactionT=1.6;
      ch.lipT=0;
      sndBad();
      spawnParticles('tear',head.x,head.y+140,10);
      ch.usefulStreak=(ch.usefulStreak||0)+1;
      addBubble(usefulPhrase(ch,item.sub),{x:bx,y:by},{color:'normal',life:1.8,size:22});
    }
  }

  if(item.kind==='food'&&item.sub!=='gum'){
    ch.fat=clamp(ch.fat+FAT_PER_FOOD,0,1);
  }
  if(item.sub==='doll'||item.sub==='bear'||item.sub==='unicorn'){
    placeFloorToy(item.sub);
  }
  if(item.sub==='shoes'){
    ch.shoesCount++;
    placeFloorShoe();
  }
  if(ch.monsterStage<3){
    if(item.sub==='phone'){ch.hold.phone=12;}
    if(item.sub==='lolli'){ch.hold.lolli=12;}
    if(item.sub==='crown'){ch.crownT=9;ch.crownCount++;}
  }
  if(item.sub==='dress'){
    ch.dressCount++;
    setDressColor(ch,pick(DRESS_COLORS));
  }
  if(item.sub==='lipstick'){ch.lipstickCount++;ch.lipT=15;}

  if(cat==='fashion'&&ch.globalMode==='capricious'){
    ch.clothesClicks++;
    if(ch.clothesClicks>=MONSTER_CLOTHES_THRESHOLD&&ch.monsterStage<3){
      ch.monsterStage=3;ch.monsterBooks=0;ch.capriciousRageTimer=0;
      ch.crownT=0;ch.apronT=0;
      ch.hold.lolli=0;ch.hold.phone=0;ch.hold.bear=0;
      sndMonster();
      addBubble('МОНСТРИЧКА',{x:bx,y:by},{color:'mon',life:2.4,size:28});
    }
  }
  var fashionScore=ch.lipstickCount+ch.dressCount+ch.shoesCount;
  if(!ch.altOutfit&&fashionScore>=15){
    ch.altOutfit=true;
    sndEnlighten();
    addBubble('Крутой лук!',{x:bx,y:by},{color:'happy',life:2.4,size:22});
  }
  if(item.sub==='scooter'||item.sub==='bike'){
    placeFloorItem(item.sub);
    ch.fat=clamp(ch.fat-0.15,0,1);
    ch.mood=clamp(ch.mood+15,-100,100);
    addBubble('Круто!',{x:bx,y:by},{color:'happy',life:1.6,size:22});
  }
  if(item.sub==='broom'){removeOneFloorToy();}
  if(item.sub==='apron'){ch.apronT=5;}

  if(ch.globalMode==='neutral'){
    if(cat==='good')ch.neutralGoodClicks++;
    if(cat==='fashion'||cat==='toy')ch.neutralBadClicks++;
  }
  if(ch.globalMode==='enlightened'&&cat==='fashion'){
    ch.enlightenedBadClicks++;
  }
  updateMonster(ch);
}
function updateMonster(ch){
  if(ch.globalMode!=='capricious'){ch.monsterStage=0;return;}
  if(ch.clothesClicks>=MONSTER_CLOTHES_THRESHOLD&&ch.monsterStage<3){
    ch.monsterStage=3;ch.monsterBooks=0;sndMonster();
  } else if(ch.clothesClicks<MONSTER_CLOTHES_THRESHOLD&&ch.monsterStage<3){
    ch.monsterStage=0;
  }
}
function moodBand(m){
  if(m<=15)return 'rage';
  if(m<=50)return 'demand';
  if(m<=80)return 'calm';
  return 'happy';
}
function setPhase(ch,p){
  if(ch.phase===p)return;
  ch.phase=p;ch.phaseT=0;
  var stg=ch.monsterStage;
  var p2=headScreenPos(ch);
  var cx=clamp(p2.x,140,FW-140),cy=Math.max(70,p2.y-40);
  if(ch.monsterStage>=3){
    if(p==='rage'){
      ch.screamT=2.2;
      sndScream(3);
      setTimeout(function(){sndScream(3);},180);
      setTimeout(function(){sndScream(2);},360);
      addBubble(pick(MONSTER_RAGE_PHRASES),{x:cx,y:cy},{color:'rage',life:2.4,size:40,shake:10});
      setTimeout(function(){
        if(ch.monsterStage>=3&&ch.phase==='rage'){
          addBubble(pick(MONSTER_RAGE_PHRASES),{x:cx+rnd(-80,80),y:cy+rnd(-30,30)},{color:'rage',life:2.0,size:36,shake:9});
        }
      },400);
    } else {
      sndDemand();
      ch.screamT=1.0;
      addBubble(pick(MONSTER_PHRASES),{x:cx,y:cy},{color:'yell',life:1.4,size:22,shake:1});
    }
    return;
  }
  if(p==='demand'&&ch===G.girl&&ch.globalMode!=='enlightened'){
    sndDemand();
    addBubble(pick(DEMAND_PHRASES),{x:cx,y:cy},{color:'yell',life:1.6,size:22,shake:1.5});
  }
  if(p==='rage'&&ch===G.girl&&ch.globalMode==='capricious'){
    sndScream(stg);setTimeout(function(){sndScream(stg);},150);
    addBubble(pick(RAGE_PHRASES),{x:cx,y:cy},{color:'rage',life:1.4+stg*0.2,size:30+stg*10,shake:6+stg*2});
  }
}
function updatePhase(ch,dt){
  ch.phaseT+=dt;
  if(ch.globalMode==='enlightened'){if(ch.phase!=='calm')setPhase(ch,'calm');return;}
  if(ch.monsterStage>=3){
    var band=moodBand(ch.mood);
    if(band==='rage'){if(ch.phase!=='rage')setPhase(ch,'rage');return;}
    if(ch.phase!=='demand')setPhase(ch,'demand');
    return;
  }
  var band2=moodBand(ch.mood);
  if(band2==='calm'||band2==='happy'){if(ch.phase!=='calm')setPhase(ch,'calm');return;}
  if(band2==='demand'){if(ch.phase!=='demand')setPhase(ch,'demand');return;}
  if(ch.phase!=='rage')setPhase(ch,'rage');
}
function shoutLoop(ch,dt){
  if(ch.isSibling&&ch.siblingStage!=='grown'){
    if(ch.siblingStage==='rug'&&Math.random()<dt*0.35){
      var p=headScreenPos(ch);
      addBubble(pick(SIBLING_PHRASES),{x:p.x+rnd(-20,20),y:p.y-30},{color:'happy',life:1.8,size:18});
    }
    return;
  }
  if(ch.monsterStage>=3){
    var band=moodBand(ch.mood);
    var interval=band==='rage'?1.4:2.8;
    if(ch.time-lastYell>interval){
      lastYell=ch.time;
      var p2=headScreenPos(ch);
      var cx=p2.x+rnd(-70,70),cy=Math.max(70,p2.y-40);
      if(band==='rage'){
        ch.screamT=2.0;
        addBubble(pick(MONSTER_RAGE_PHRASES),{x:cx,y:cy},{color:'rage',life:2.2,size:38,shake:9});
      } else {
        ch.screamT=1.0;
        addBubble(pick(MONSTER_PHRASES),{x:cx,y:cy},{color:'yell',life:1.5,size:22,shake:1});
      }
    }
    return;
  }
  if(ch.globalMode==='enlightened')return;
  var band2=moodBand(ch.mood);
  var interval2={calm:4.0,demand:2.5,rage:1.4}[band2];
  if(ch.time-lastYell>interval2){
    lastYell=ch.time;
    var p3=headScreenPos(ch);
    var cx2=p3.x+rnd(-70,70),cy2=Math.max(70,p3.y-40);
    var stg=ch.monsterStage;
    if(band2==='calm')return;
    if(band2==='demand'){
      addBubble(pick(DEMAND_PHRASES),{x:cx2,y:cy2},{color:'yell',life:1.7,size:22,shake:2});
    } else {
      addBubble(pick(RAGE_PHRASES),{x:cx2,y:cy2},{color:'rage',life:1.4,size:28+stg*10,shake:6+stg*3});
    }
  }
}
function computeExpr(ch){
  if(ch.monsterStage>=3)return moodBand(ch.mood)==='rage'?'rage':'demand';
  if(ch.reactionT>0&&ch.reaction)return ch.reaction;
  if(ch.globalMode==='enlightened')return 'happy';
  var band=moodBand(ch.mood);
  if(band==='rage')return 'rage';
  if(band==='demand')return 'demand';
  if(band==='calm')return 'neutral';
  return 'happy';
}
function petSibling(ch){
  if(!ch||ch.siblingStage!=='grown')return;
  ch.lastPetT=G.t;
  ch.crying=false;
  var g=G.girl;
  if(g){
    g.mood=clamp(g.mood+4,-100,100);
    if(g.globalMode==='neutral')g.neutralGoodClicks+=2;
  }
  sndPet();
  var p=headScreenPos(ch);
  spawnParticles('heart',p.x,p.y+60,7);
  addBubble(pick(SIBLING_PHRASES),{x:p.x+rnd(-20,20),y:Math.max(60,p.y-40)},{color:'happy',life:1.6,size:20});
}
function updateChar(ch,dt){
  ch.time+=dt;
  if(ch.isSibling){
    if(ch.siblingStage==='cradle'){
      ch.siblingStageTimer+=dt;
      if(ch.siblingStageTimer>=SIBLING_STAGE_TIME){ch.siblingStage='rug';ch.siblingStageTimer=0;positionChars();}
    } else if(ch.siblingStage==='rug'){
      ch.siblingStageTimer+=dt;
      if(ch.siblingStageTimer>=SIBLING_STAGE_TIME){
        ch.siblingStage='grown';ch.siblingStageTimer=0;ch.lastPetT=G.t;positionChars();
      }
    }
    if(ch.siblingStage!=='grown'){
      if(ch.wrap){ch.wrap.style.display=(ch.siblingStage==='cradle')?'none':'block';}
      return;
    }
    ch.globalMode='enlightened';
    if(!ch.lastPetT)ch.lastPetT=G.t;
    if(!ch.crying&&G.t-ch.lastPetT>30){
      ch.crying=true;ch.cryT=0;
      if(G.girl)G.girl.mood=clamp(G.girl.mood-5,-100,100);
      sndBad();
    }
    if(ch.crying){
      ch.cryT+=dt;
      if(ch.cryT>2.8){
        ch.cryT=0;
        var p=headScreenPos(ch);
        addBubble(pick(SIBLING_CRY_PHRASES),{x:p.x+rnd(-20,20),y:Math.max(60,p.y-40)},{color:'sad',life:1.6,size:20});
      }
    }
  }
  var decay=(ch.monsterStage>=3?MOOD_DECAY*1.3:MOOD_DECAY);
  if(ch.mood>0)ch.mood=Math.max(0,ch.mood-dt*decay);
  else ch.mood=Math.min(0,ch.mood+dt*MOOD_RECOVER);

  if(ch.globalMode==='capricious'){
    if(ch.mood<40)ch.capriciousRageTimer+=dt;
    else ch.capriciousRageTimer=Math.max(0,ch.capriciousRageTimer-dt*2);
    if(ch.capriciousRageTimer>=180){
      ch.globalMode='neutral';ch.capriciousRageTimer=0;
      ch.neutralGoodClicks=0;ch.neutralBadClicks=0;
      ch.monsterStage=0;ch.clothesClicks=0;ch.monsterBooks=0;
      document.body.classList.remove('rage-shake');
      document.body.classList.remove('rage-shake-hard');
      sndEnlighten();
      var p2=headScreenPos(ch);
      addBubble('Хм, ладно...',{x:p2.x,y:p2.y-40},{color:'happy',life:2.6,size:22});
      if(ch===G.girl&&!G.siblingRolled){G.siblingRolled=true;ch.siblingBornAt=G.t+60;}
    }
  } else if(ch.globalMode==='neutral'){
    if(ch.neutralGoodClicks>=12){
      ch.globalMode='enlightened';
      ch.neutralGoodClicks=0;ch.enlightenedBadClicks=0;
      ch.altOutfit=false;
      ch.lipstickCount=0;ch.dressCount=0;ch.shoesCount=0;ch.crownCount=0;
      setDressColor(ch,DRESS_COLORS[0]);
      sndEnlighten();
      var p3=headScreenPos(ch);
      addBubble('Я всё поняла!',{x:p3.x,y:p3.y-40},{color:'happy',life:2.8,size:24});
    } else if(ch.neutralBadClicks>=20){
      ch.globalMode='capricious';
      ch.neutralGoodClicks=0;ch.neutralBadClicks=0;ch.capriciousRageTimer=0;
      sndBad();
      var p4=headScreenPos(ch);
      addBubble('НЕ ХОЧУ!',{x:p4.x,y:p4.y-40},{color:'yell',life:2.4,size:24});
      updateMonster(ch);
    }
  } else if(ch.globalMode==='enlightened'){
    if(ch.enlightenedBadClicks>=10){
      ch.globalMode='neutral';ch.enlightenedBadClicks=0;
      ch.neutralGoodClicks=0;ch.neutralBadClicks=0;
      sndBad();
      var p5=headScreenPos(ch);
      addBubble('Ну и ладно.',{x:p5.x,y:p5.y-40},{color:'normal',life:2.4,size:22});
    }
  }

  updatePhase(ch,dt);
  shoutLoop(ch,dt);
  updateMonster(ch);

  var isRage=ch.globalMode==='capricious'&&ch.phase==='rage'&&ch.monsterStage<3;
  if(isRage)ch.rageTimer+=dt;else ch.rageTimer=Math.max(0,ch.rageTimer-dt*2);
  if(ch.screamT>0)ch.screamT=Math.max(0,ch.screamT-dt);

  ch.headTimer-=dt;
  if(ch.headTimer<=0){
    ch.headTimer=rnd(0.9,2.4);
    var range;
    if(ch.globalMode==='enlightened')range=0.35;
    else range=ch.phase==='rage'?0.35:ch.phase==='demand'?0.42:0.55;
    ch.headTarget=rnd(-range,range);
  }
  ch.headAngle=lerp(ch.headAngle,ch.headTarget,dt*6);

  ch.blinkTimer-=dt;
  if(ch.blinkTimer<=0){ch.blinkTimer=rnd(2,5);ch.blink=1;}
  ch.blink=Math.max(0,ch.blink-dt*6);

  if(ch.happyStreak>0&&G.t-ch.lastBadT>2)ch.happyStreak=0;
  if(ch.reactionT>0){ch.reactionT-=dt;if(ch.reactionT<=0)ch.reaction=null;}

  if(ch.crownT>0)ch.crownT-=dt;
  if(ch.apronT>0)ch.apronT-=dt;
  if(ch.lipT>0)ch.lipT-=dt;
  for(var k in ch.hold)if(ch.hold.hasOwnProperty(k)&&ch.hold[k]>0)ch.hold[k]-=dt;

  ch.expr=computeExpr(ch);

  if(ch.wrap){
    ch.wrap.dataset.expr=ch.expr;
    ch.wrap.dataset.stage=String(ch.monsterStage);
    var shake=false;
    if(ch.monsterStage<3){shake=(ch.phase==='rage');}
    else {shake=(ch.screamT>0.4);}
    ch.wrap.dataset.shake=shake?'1':'0';
    ch.wrap.dataset.red='0';
    ch.wrap.dataset.crown=ch.crownT>0?'1':'0';
    ch.wrap.dataset.apron=ch.apronT>0?'1':'0';
    ch.wrap.dataset.lips=ch.lipT>0?'1':'0';
    ch.wrap.dataset.outfit=ch.altOutfit?'brat':'original';

    if(ch.monsterStage>=3){ch.wrap.dataset.hold='';}
    else if(ch.hold.phone>0)ch.wrap.dataset.hold='phone';
    else if(ch.hold.lolli>0)ch.wrap.dataset.hold='lolli';
    else ch.wrap.dataset.hold='';

    var fatLevel=ch.fat>0.55?2:(ch.fat>0.20?1:0);
    ch.wrap.dataset.fat=String(fatLevel);

    var fatX=1+ch.fat*0.55;
    var fatY=1+ch.fat*0.10;
    var headFatX=1+ch.fat*0.35;
    var headFatY=1+ch.fat*0.12;

    ch.wrap.style.setProperty('--fatX',String(fatX));
    ch.wrap.style.setProperty('--fatY',String(fatY));
    ch.wrap.style.setProperty('--headFatX',String(headFatX));
    ch.wrap.style.setProperty('--headFatY',String(headFatY));
  }

  if(ch===G.girl&&!G.gameOver){
    if(ch.monsterStage>=3){
      if(ch.phase==='rage'){
        document.body.classList.add('rage-shake-hard');
        document.body.classList.remove('rage-shake');
      } else if(ch.screamT>0.2){
        document.body.classList.add('rage-shake');
        document.body.classList.remove('rage-shake-hard');
      } else {
        document.body.classList.remove('rage-shake','rage-shake-hard');
      }
    } else if(ch.phase==='rage'){
      document.body.classList.add('rage-shake');
      document.body.classList.remove('rage-shake-hard');
    } else {
      document.body.classList.remove('rage-shake','rage-shake-hard');
    }
  }
}

var cardsEl=document.getElementById('cards');
var ghostEl=document.getElementById('dragGhost');
function renderCards(){
  cardsEl.innerHTML='';
  for(var i=0;i<5;i++){
    var it=G.slots[i];if(!it)continue;
    var d=document.createElement('div');
    d.className='card'+(G.slotLock[i]>0?' locked':'');
    d.dataset.slot=i;
    d.innerHTML='<img src="'+iconFor(it)+'" alt=""><div class="lbl">'+it.label+'</div>'+
      (G.slotLock[i]>0?'<div class="cd">'+Math.ceil(G.slotLock[i])+'</div>':'');
    cardsEl.appendChild(d);
  }
}
cardsEl.addEventListener('pointerdown',function(e){
  var card=e.target.closest('.card');if(!card)return;
  var i=+card.dataset.slot;
  if(G.slotLock[i]>0||G.gameOver)return;
  G.cardPointer={slot:i,startX:e.clientX,startY:e.clientY,moved:false,id:e.pointerId};
  if(card.setPointerCapture)card.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove',function(e){
  if(!G.cardPointer)return;
  var dx=e.clientX-G.cardPointer.startX,dy=e.clientY-G.cardPointer.startY;
  if(!G.cardPointer.moved&&Math.sqrt(dx*dx+dy*dy)>12){
    G.cardPointer.moved=true;
    ghostEl.src=iconFor(G.slots[G.cardPointer.slot]);
    ghostEl.style.display='block';
  }
  if(G.cardPointer.moved){ghostEl.style.left=e.clientX+'px';ghostEl.style.top=e.clientY+'px';}
});
window.addEventListener('pointerup',function(e){
  if(!G.cardPointer)return;
  var cp=G.cardPointer;G.cardPointer=null;ghostEl.style.display='none';
  var slot=cp.slot;
  if(G.slotLock[slot]>0||G.gameOver)return;
  var target;
  if(!cp.moved)target=G.chars[G.selected]||G.girl;
  else {
    target=null;var best=1e9;
    for(var ci=0;ci<G.chars.length;ci++){
      var ch=G.chars[ci];
      if(ch.isSibling&&ch.siblingStage!=='grown')continue;
      if(!ch.wrap||!ch._center)continue;
      var d=Math.sqrt(Math.pow(ch._center.x-e.clientX,2)+Math.pow(ch._center.y-e.clientY,2));
      if(d<best){best=d;target=ch;}
    }
    if(best>Math.max(FW,FH)*0.4)target=null;
  }
  if(target)useSlot(slot,target);
});
window.addEventListener('pointercancel',function(){G.cardPointer=null;ghostEl.style.display='none';});
function useSlot(slot,target){
  var item=G.slots[slot];if(!item||!target)return;
  applyItem(target,item);
  if(G.lastSlot===slot)G.slotLock[slot]=4;
  G.lastSlot=slot;
  rebuildAllSlots();
  sndPop();renderCards();
  var el=cardsEl.querySelector('.card[data-slot="'+slot+'"]');
  if(el){el.classList.add('pop');setTimeout(function(){el.classList.remove('pop');},340);}
}

var SLOT_KEYS_NUM={'1':0,'2':1,'3':2,'4':3,'5':4};
var SLOT_KEYS_QWE={'q':0,'w':1,'e':2,'r':3,'t':4};
document.addEventListener('keydown',function(e){
  if(G.gameOver)return;
  if(e.repeat)return;
  var k=e.key.toLowerCase();
  if(k in SLOT_KEYS_NUM){
    var slot=SLOT_KEYS_NUM[k];
    if(G.slotLock[slot]>0||!G.slots[slot])return;
    var target=G.chars[G.selected]||G.girl;
    if(target&&!(target.isSibling&&target.siblingStage!=='grown')){
      useSlot(slot,target);
    }
    e.preventDefault();
  } else if(k in SLOT_KEYS_QWE){
    var slot2=SLOT_KEYS_QWE[k];
    if(G.slotLock[slot2]>0||!G.slots[slot2])return;
    if(G.sibling&&G.sibling.siblingStage==='grown'){
      useSlot(slot2,G.sibling);
    }
    e.preventDefault();
  }
});

/* screentone pattern */
var _stCv=null,_stPat=null;
function getScreentonePattern(){
  if(_stPat)return _stPat;
  _stCv=document.createElement('canvas');
  _stCv.width=_stCv.height=8;
  var c=_stCv.getContext('2d');
  c.fillStyle='#0a0a0a';
  c.beginPath();c.arc(4,4,1.5,0,TAU);c.fill();
  _stPat=rg.createPattern(_stCv,'repeat');
  return _stPat;
}
var _htCv=null,_htPat=null;
function getHalftonePattern(){
  if(_htPat)return _htPat;
  _htCv=document.createElement('canvas');
  _htCv.width=_htCv.height=6;
  var c=_htCv.getContext('2d');
  c.fillStyle='rgba(10,10,10,0.85)';
  c.beginPath();c.arc(3,3,1.1,0,TAU);c.fill();
  _htPat=rg.createPattern(_htCv,'repeat');
  return _htPat;
}
function strokeInk(g,w){
  g.strokeStyle='#0a0a0a';
  g.lineWidth=w||3.5;
  g.lineJoin='round';
  g.lineCap='round';
  g.stroke();
}

function drawCloud(g,cx,cy,w,h,color){
  g.fillStyle=color;
  g.beginPath();
  g.ellipse(cx,cy,w*0.5,h*0.55,0,0,TAU);
  g.ellipse(cx-w*0.32,cy+h*0.14,w*0.34,h*0.42,0,0,TAU);
  g.ellipse(cx+w*0.34,cy+h*0.12,w*0.36,h*0.44,0,0,TAU);
  g.fill();
  g.strokeStyle='#0a0a0a';g.lineWidth=3;
  g.stroke();
}

/* ====== ХРУЩЁВКА (5-этажка) ====== */
function drawKhrushchyovka(g,x,baseY,w,h){
  g.fillStyle='#c8c0b0';
  g.beginPath();g.rect(x,baseY-h,w,h);g.fill();
  g.strokeStyle='#0a0a0a';g.lineWidth=2.5;g.stroke();
  g.fillStyle='rgba(10,10,10,0.10)';
  g.beginPath();g.rect(x+w*0.72,baseY-h,w*0.28,h);g.fill();
  g.fillStyle='#a09888';
  g.beginPath();g.rect(x-2,baseY-h-5,w+4,7);g.fill();
  g.strokeStyle='#0a0a0a';g.lineWidth=2;g.stroke();
  var cols=4,rows=5;
  var cw=w/cols,rh=h/rows;
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var wx=x+cw*c+cw*0.22;
      var wy=baseY-h+rh*r+rh*0.22;
      var ww=cw*0.56,wh=rh*0.52;
      g.fillStyle='#8aa8d0';
      g.beginPath();g.rect(wx,wy,ww,wh);g.fill();
      g.strokeStyle='#0a0a0a';g.lineWidth=1.1;g.stroke();
      g.beginPath();g.moveTo(wx+ww/2,wy);g.lineTo(wx+ww/2,wy+wh);g.stroke();
    }
  }
}

/* ====== ДЕРЕВО ЗА ОКНОМ (с листьями / без) ====== */
function drawWindowTree(g,x,baseY,h,hasLeaves){
  g.strokeStyle='#0a0a0a';g.lineWidth=6;g.lineCap='round';
  g.beginPath();g.moveTo(x,baseY);g.lineTo(x,baseY-h*0.55);g.stroke();
  g.strokeStyle='#7a5530';g.lineWidth=3.5;
  g.beginPath();g.moveTo(x,baseY);g.lineTo(x,baseY-h*0.55);g.stroke();
  g.strokeStyle='#0a0a0a';g.lineWidth=3.5;g.lineCap='round';
  g.beginPath();g.moveTo(x,baseY-h*0.42);g.lineTo(x-h*0.16,baseY-h*0.60);g.stroke();
  g.beginPath();g.moveTo(x,baseY-h*0.50);g.lineTo(x+h*0.16,baseY-h*0.66);g.stroke();
  g.beginPath();g.moveTo(x,baseY-h*0.60);g.lineTo(x-h*0.10,baseY-h*0.78);g.stroke();
  g.beginPath();g.moveTo(x,baseY-h*0.62);g.lineTo(x+h*0.10,baseY-h*0.80);g.stroke();
  g.beginPath();g.moveTo(x,baseY-h*0.72);g.lineTo(x,baseY-h*0.92);g.stroke();

  if(hasLeaves){
    var blobs=[
      [x-h*0.24,baseY-h*0.68,h*0.20],
      [x+h*0.24,baseY-h*0.70,h*0.20],
      [x-h*0.12,baseY-h*0.90,h*0.19],
      [x+h*0.12,baseY-h*0.92,h*0.19],
      [x,baseY-h*0.74,h*0.24],
      [x,baseY-h*1.02,h*0.16]
    ];
    g.fillStyle='#3f8a4e';
    for(var i=0;i<blobs.length;i++){
      g.beginPath();g.arc(blobs[i][0],blobs[i][1],blobs[i][2],0,TAU);g.fill();
    }
    g.fillStyle='rgba(255,255,255,0.20)';
    for(var j=0;j<blobs.length;j++){
      g.beginPath();
      g.arc(blobs[j][0]-blobs[j][2]*0.25,blobs[j][1]-blobs[j][2]*0.30,blobs[j][2]*0.45,0,TAU);
      g.fill();
    }
    g.strokeStyle='#0a0a0a';g.lineWidth=2;
    for(var k=0;k<blobs.length;k++){
      g.beginPath();g.arc(blobs[k][0],blobs[k][1],blobs[k][2],0,TAU);g.stroke();
    }
  } else {
    g.strokeStyle='#0a0a0a';g.lineWidth=2.5;g.lineCap='round';
    var tips=[[-0.32,-0.72],[0.32,-0.74],[-0.20,-0.88],[0.20,-0.90],[0,-1.00],[-0.36,-0.86],[0.36,-0.88]];
    for(var t=0;t<tips.length;t++){
      var tx=x+tips[t][0]*h*0.5;
      var ty=baseY+tips[t][1]*h;
      g.beginPath();g.moveTo(x,baseY-h*0.55);g.lineTo(tx,ty);g.stroke();
    }
  }
}

function drawWindow(g,x,y,w,h){
  g.fillStyle='#eae4da';
  g.beginPath();g.rect(x-w/2-6,y-h/2-6,w+12,h+12);g.fill();strokeInk(g,5);
  var skyTop,skyBot;
  if(G.weather==='sunny'){skyTop='#7fc4ff';skyBot='#e0f0ff';}
  else if(G.weather==='rain'){skyTop='#4a5a72';skyBot='#8894a4';}
  else {skyTop='#a8bcd4';skyBot='#e8f2ff';}
  var sg=g.createLinearGradient(0,y-h/2,0,y+h/2);
  sg.addColorStop(0,skyTop);sg.addColorStop(1,skyBot);
  g.fillStyle=sg;g.beginPath();g.rect(x-w/2,y-h/2,w,h);g.fill();
  g.save();
  g.beginPath();g.rect(x-w/2,y-h/2,w,h);g.clip();

  var baseY=y+h/2;
  var bldW=w*0.46;
  var bldH=Math.min(h*0.62,w*1.10);
  var treeH=Math.min(h*0.85,w*1.60);

  /* солнце — остаётся, а облака убраны (чёрные мотки над домом) */
  if(G.weather==='sunny'){
    var sx=x+w*0.26,sy=y-h*0.30;
    var rg2=g.createRadialGradient(sx,sy,2,sx,sy,h*0.40);
    rg2.addColorStop(0,'#fffce8');
    rg2.addColorStop(0.25,'#ffe884');
    rg2.addColorStop(1,'rgba(255,200,60,0)');
    g.fillStyle=rg2;g.beginPath();g.arc(sx,sy,h*0.40,0,TAU);g.fill();
  }

  /* ХРУЩЁВКА */
  drawKhrushchyovka(g,x-w*0.46,baseY,bldW,bldH);
  /* ДЕРЕВО (зимой без листьев, летом с листьями) */
  drawWindowTree(g,x+w*0.26,baseY,treeH,G.weather!=='snow');

  /* земля */
  g.fillStyle='rgba(120,130,140,0.55)';
  g.beginPath();g.rect(x-w/2,baseY-2,w,4);g.fill();
  g.strokeStyle='#0a0a0a';g.lineWidth=1.6;
  g.beginPath();g.moveTo(x-w/2,baseY);g.lineTo(x+w/2,baseY);g.stroke();

  /* осадки */
  if(G.weather==='rain'||G.weather==='snow'){
    if(G.weather==='rain'){
      g.strokeStyle='#0a0a0a';g.lineWidth=1.6;g.lineCap='round';
      for(var pi=0;pi<G.wparts.length;pi++){
        var p=G.wparts[pi];
        g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+p.vx*0.03,p.y+p.len);g.stroke();
      }
    } else {
      g.fillStyle='#fff';g.strokeStyle='#0a0a0a';g.lineWidth=1.4;
      for(var pi2=0;pi2<G.wparts.length;pi2++){
        var p2=G.wparts[pi2];
        g.beginPath();g.arc(p2.x,p2.y,p2.r,0,TAU);g.fill();g.stroke();
      }
    }
  }
  g.restore();
  /* перемычки */
  g.strokeStyle='#0a0a0a';g.lineWidth=4;
  g.beginPath();g.moveTo(x,y-h/2);g.lineTo(x,y+h/2);g.stroke();
  g.beginPath();g.moveTo(x-w/2,y);g.lineTo(x+w/2,y);g.stroke();
  g.strokeStyle='#0a0a0a';g.lineWidth=5;
  g.beginPath();g.rect(x-w/2,y-h/2,w,h);g.stroke();
  /* подоконник */
  g.fillStyle='#ddd5c8';
  g.beginPath();g.rect(x-w/2-16,y+h/2,w+32,10);g.fill();strokeInk(g,4);

  /* растение — ПЕРЕДВИНУТО В ЛЕВУЮ СТОРОНУ подоконника */
  var px=x-w*0.30,py=y+h/2;
  g.fillStyle='#b87848';
  g.beginPath();g.moveTo(px-9,py-2);g.lineTo(px+9,py-2);g.lineTo(px+7,py+10);g.lineTo(px-7,py+10);g.closePath();g.fill();strokeInk(g,3);
  g.fillStyle='#3f8a4e';
  g.beginPath();g.ellipse(px-7,py-12,7,5,0.5,0,TAU);g.fill();strokeInk(g,2.5);
  g.beginPath();g.ellipse(px+7,py-14,7,5,-0.5,0,TAU);g.fill();strokeInk(g,2.5);
  g.fillStyle='#ff8ac8';
  g.beginPath();g.arc(px,py-20,5,0,TAU);g.fill();strokeInk(g,2.5);
}

/* Радиальные фокус-линии при эмоциях */
function drawFocusLines(g,cx,cy,intensity,col){
  if(intensity<0.03)return;
  if(LOW_GFX)intensity*=0.65;
  g.save();
  g.translate(cx,cy);
  var lineCount=Math.floor((LOW_GFX?14:40)+intensity*(LOW_GFX?18:40));
  for(var i=0;i<lineCount;i++){
    var a=(i/lineCount)*TAU+G.t*0.15+(i%2)*0.04;
    var inner=Math.min(RW,RH)*(0.20+rnd(0,0.06));
    var outer=Math.max(RW,RH)*(0.65+rnd(0,0.5));
    g.strokeStyle=(col||'#0a0a0a');
    g.globalAlpha=intensity*0.55;
    g.lineWidth=(i%4===0)?3:1.4;
    g.beginPath();
    g.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);
    g.lineTo(Math.cos(a)*outer,Math.sin(a)*outer);
    g.stroke();
  }
  g.restore();
}

function drawRoom(){
  if(!RW||!RH)return;
  var floorY=RH*0.70;
  var wallBase=G.env.wall.base||G.env.wall;
  var wall=rg.createLinearGradient(0,0,0,floorY);
  wall.addColorStop(0,wallBase.top);
  wall.addColorStop(0.5,wallBase.top);
  wall.addColorStop(0.5,wallBase.bot);
  wall.addColorStop(1,wallBase.bot);
  rg.fillStyle=wall;rg.fillRect(0,0,RW,floorY);

  if(G.env.wall.pat){
    var pat=G.env.wall.pat;
    var step=G.env.wall.step||40;
    rg.save();
    rg.strokeStyle='#0a0a0a';
    rg.fillStyle='#0a0a0a';
    rg.globalAlpha=0.55;
    rg.lineWidth=2.4;
    if(pat==='stripesV'){
      for(var x=step/2;x<RW;x+=step){rg.beginPath();rg.moveTo(x,0);rg.lineTo(x,floorY);rg.stroke();}
    } else if(pat==='stripesH'){
      for(var y=step/2;y<floorY;y+=step){rg.beginPath();rg.moveTo(0,y);rg.lineTo(RW,y);rg.stroke();}
    } else if(pat==='dots'){
      var r=Math.max(2,step*0.09);
      for(var y2=step/2;y2<floorY;y2+=step){
        var ox=(Math.floor(y2/step)%2)?step/2:0;
        for(var x2=step/2;x2<RW;x2+=step){
          rg.beginPath();rg.arc(x2+ox,y2,r,0,TAU);rg.fill();
        }
      }
    } else if(pat==='flowers'){
      var r2=step*0.18;
      for(var y3=step/2;y3<floorY;y3+=step){
        var ox2=(Math.floor(y3/step)%2)?step/2:0;
        for(var x3=step/2;x3<RW;x3+=step){
          for(var i=0;i<5;i++){
            var a=i*TAU/5-Math.PI/2;
            rg.beginPath();rg.arc(x3+ox2+Math.cos(a)*r2,y3+Math.sin(a)*r2,r2*0.55,0,TAU);rg.fill();
          }
          rg.beginPath();rg.arc(x3+ox2,y3,r2*0.4,0,TAU);rg.fill();
        }
      }
    } else if(pat==='checks'){
      var s=step/2;
      rg.globalAlpha=0.45;
      for(var y4=0;y4<floorY;y4+=step){
        for(var x4=0;x4<RW;x4+=step){
          var dark=((x4/s)+(y4/s))%2===0;
          if(dark){rg.fillRect(x4,y4,s,s);rg.fillRect(x4+s,y4+s,s,s);}
        }
      }
    } else if(pat==='leaves'){
      var r3=step*0.16;
      for(var y5=step/2;y5<floorY;y5+=step){
        var ox3=(Math.floor(y5/step)%2)?step/2:0;
        for(var x5=step/2;x5<RW;x5+=step){
          rg.beginPath();rg.ellipse(x5+ox3,y5,r3,r3*0.5,Math.PI/4,0,TAU);rg.fill();
          rg.beginPath();rg.ellipse(x5+ox3,y5,r3*0.5,r3,-Math.PI/4,0,TAU);rg.fill();
        }
      }
    }
    rg.restore();
  }

  if(!LOW_GFX){
    rg.save();
    rg.fillStyle='#0a0a0a';
    rg.globalAlpha=0.08;
    for(var ip=0;ip<5;ip++){
      var ix=(ip*0.23+0.06)*RW;
      var iy=(ip*0.13+0.12)*floorY;
      var ir=Math.min(RW,RH)*(0.12+ip*0.03);
      rg.beginPath();
      for(var k=0;k<8;k++){
        var ang=k/8*TAU;
        var rr=ir*(0.7+Math.sin(k*1.7+ip)*0.3);
        var xx=ix+Math.cos(ang)*rr,yy=iy+Math.sin(ang)*rr;
        if(k===0)rg.moveTo(xx,yy);else rg.lineTo(xx,yy);
      }
      rg.closePath();rg.fill();
    }
    rg.restore();
  }

  if(G.weather==='sunny'){
    var wg=rg.createRadialGradient(RW*WIN_X,RH*WIN_Y,RH*0.02,RW*WIN_X,RH*WIN_Y,RH*0.42);
    wg.addColorStop(0,'rgba(255,224,160,0.32)');
    wg.addColorStop(1,'rgba(255,224,160,0)');
    rg.fillStyle=wg;rg.fillRect(0,0,RW,floorY);
  }

  var floor=rg.createLinearGradient(0,floorY,0,RH);
  floor.addColorStop(0,G.env.floor.top);
  floor.addColorStop(0.5,G.env.floor.top);
  floor.addColorStop(0.5,G.env.floor.bot);
  floor.addColorStop(1,G.env.floor.bot);
  rg.fillStyle=floor;rg.fillRect(0,floorY,RW,RH-floorY);

  if(G.env.floor.tex==='boards'){
    rg.strokeStyle='#0a0a0a';rg.lineWidth=2.5;rg.globalAlpha=0.55;
    var boardW=RW/12;
    for(var i2=1;i2<12;i2++){rg.beginPath();rg.moveTo(i2*boardW,floorY);rg.lineTo(i2*boardW,RH);rg.stroke();}
    for(var i3=1;i3<4;i3++){
      var y6=floorY+i3*(RH-floorY)/4;
      rg.beginPath();rg.moveTo(0,y6);rg.lineTo(RW,y6);rg.stroke();
    }
    rg.globalAlpha=1;
  } else if(G.env.floor.tex==='tiles'){
    rg.strokeStyle='#0a0a0a';rg.lineWidth=2.5;rg.globalAlpha=0.5;
    var tileW=RW/8,tileH=(RH-floorY)/4;
    for(var i4=1;i4<8;i4++){rg.beginPath();rg.moveTo(i4*tileW,floorY);rg.lineTo(i4*tileW,RH);rg.stroke();}
    for(var i5=1;i5<4;i5++){rg.beginPath();rg.moveTo(0,floorY+i5*tileH);rg.lineTo(RW,floorY+i5*tileH);rg.stroke();}
    rg.globalAlpha=1;
  } else {
    rg.strokeStyle='#0a0a0a';rg.lineWidth=2.2;rg.globalAlpha=0.55;
    for(var i6=0;i6<9;i6++){
      var x6=i6*(RW/8);
      rg.beginPath();rg.moveTo(x6,floorY);rg.lineTo(x6,RH);rg.stroke();
    }
    rg.globalAlpha=1;
  }

  rg.fillStyle='#f0ece4';
  rg.beginPath();rg.rect(0,floorY-8,RW,8);rg.fill();strokeInk(rg,3);

  if(!LOW_GFX){
    rg.save();
    rg.globalAlpha=0.35;
    rg.fillStyle=getScreentonePattern();
    rg.beginPath();rg.rect(0,floorY+8,RW,RH-floorY-8);rg.fill();
    rg.restore();
  }

  if(G.weather==='sunny'){
    rg.save();
    rg.globalAlpha=0.20;
    rg.fillStyle='#ffe2a8';
    rg.beginPath();
    rg.moveTo(RW*0.61,floorY);
    rg.lineTo(RW*0.84,floorY);
    rg.lineTo(RW*0.94,RH);
    rg.lineTo(RW*0.54,RH);
    rg.closePath();rg.fill();
    rg.restore();
  }

  drawWindow(rg,RW*WIN_X,RH*WIN_Y,RW*WIN_W,RH*WIN_H);
  /* часы — ПРАВЕЕ КАРТИНЫ */
  drawClock(rg,RW*0.28,RH*0.165,Math.min(RW,RH)*0.042);
  drawFrame(rg,RW*0.10,RH*0.10,RW*0.10,RH*0.13);
  drawChandelier(rg,RW*0.44,RH*0.12);

  /* ДИВАН вместо телевизора */
  var sofaW=RW*0.32,sofaH=RH*0.16;
  var sofaX=RW*0.30-sofaW/2,sofaTop=floorY-sofaH;
  drawSofa(rg,sofaX,sofaTop,sofaW,sofaH);

  var kw=RW*0.145,kh=RH*0.185;
  drawKallax(rg,RW*0.885-kw/2,floorY-kh,kw,kh);
  drawFloorLamp(rg,RW*0.775,floorY+RH*0.035,RH*0.30);
  drawPlant(rg,RW*0.055,floorY+RH*0.008,RH*0.22);
  drawRug(rg,RW*0.40,RH*0.805,RW*0.26,RH*0.045);

  if(G.sibling){
    if(G.sibling.siblingStage==='cradle'){
      drawCradle(rg,RW*0.78,RH*0.665,RW*0.16,RH*0.12);
    } else if(G.sibling.siblingStage==='rug'){
      drawBabyRug(rg,RW*0.78,RH*0.70,RW*0.14,RH*0.05);
    }
  }

  if(G.girl&&!G.gameOver){
    var intensity=0;
    if(G.girl.monsterStage>=3){
      intensity=(G.girl.phase==='rage')?1.0:0.6;
    } else if(G.girl.phase==='rage'&&G.girl.globalMode==='capricious'){
      intensity=0.7;
    } else if(G.girl.phase==='demand'){
      intensity=0.35;
    }
    if(G.girl.globalMode==='enlightened')intensity=0.3;
    var cx=RW*0.42,cy=RH*0.35;
    if(G.girl._head){cx=G.girl._head.x;cy=G.girl._head.y;}
    drawFocusLines(rg,cx,cy,intensity,'#0a0a0a');
  }
}
function drawCradle(g,x,y,w,h){
  g.fillStyle='#c8a880';
  g.beginPath();g.rect(x-w/2,y-h/2,w,h);g.fill();strokeInk(g,4);
  g.strokeStyle='#0a0a0a';g.lineWidth=2.5;
  for(var i=1;i<6;i++){g.beginPath();g.moveTo(x-w/2+i*w/6,y-h/2);g.lineTo(x-w/2+i*w/6,y+h/2);g.stroke();}
  g.fillStyle='#fff';
  g.beginPath();g.rect(x-w/2+3,y-h/2+3,w-6,h*0.55);g.fill();
  g.fillStyle='#a0e0c0';
  g.beginPath();g.rect(x-w/2+3,y+1,w-6,h*0.30);g.fill();strokeInk(g,2);
  g.fillStyle='#ffe4cc';
  g.beginPath();g.arc(x,y-h*0.05,h*0.18,0,TAU);g.fill();strokeInk(g,3);
}
function drawBabyRug(g,x,y,w,h){
  g.fillStyle='#a0e0c0';
  g.beginPath();g.ellipse(x,y,w,h,0,0,TAU);g.fill();strokeInk(g,3.5);
  g.fillStyle='#ffe4cc';
  g.beginPath();g.arc(x,y-h*0.3,h*0.5,0,TAU);g.fill();strokeInk(g,3);
}
function drawClock(g,x,y,r){
  g.fillStyle='#f0ece0';
  g.beginPath();g.arc(x,y,r+4,0,TAU);g.fill();strokeInk(g,4);
  g.fillStyle='#e8e2d0';
  g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  for(var i=0;i<12;i++){
    var a=i*TAU/12-Math.PI/2;
    var r1=(i%3===0)?r*0.72:r*0.82;
    g.strokeStyle='#0a0a0a';
    g.lineWidth=(i%3===0)?3.5:2;
    g.beginPath();g.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);g.lineTo(x+Math.cos(a)*r*0.92,y+Math.sin(a)*r*0.92);g.stroke();
  }
  var now=new Date();
  var hh=now.getHours()%12,mm=now.getMinutes(),ss=now.getSeconds();
  var hourA=(hh+mm/60)*TAU/12-Math.PI/2;
  var minA=(mm+ss/60)*TAU/60-Math.PI/2;
  var secA=ss*TAU/60-Math.PI/2;
  g.strokeStyle='#0a0a0a';g.lineWidth=5;g.lineCap='round';
  g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(hourA)*r*0.5,y+Math.sin(hourA)*r*0.5);g.stroke();
  g.lineWidth=3.5;
  g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(minA)*r*0.75,y+Math.sin(minA)*r*0.75);g.stroke();
  g.strokeStyle='#d02020';g.lineWidth=2.5;
  g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(secA)*r*0.85,y+Math.sin(secA)*r*0.85);g.stroke();
  g.fillStyle='#0a0a0a';
  g.beginPath();g.arc(x,y,5,0,TAU);g.fill();
}
var CAT_SPOTS=[{x:0.72,y:0.86},{x:0.55,y:0.82},{x:0.83,y:0.84},{x:0.20,y:0.88},{x:0.40,y:0.90}];
var CAT_SPOTS_MONSTER=[{x:0.15,y:0.88},{x:0.85,y:0.86},{x:0.50,y:0.82},{x:0.25,y:0.85},{x:0.75,y:0.83}];
function updateCatState(){
  var dt=0.016;
  G.cat.timer-=dt;
  var monster=G.girl&&G.girl.monsterStage>=3;
  G.cat.fat=monster;
  if(G.cat.timer<=0){
    G.cat.timer=monster?6:30;
    var spots=monster?CAT_SPOTS_MONSTER:CAT_SPOTS;
    G.cat.spot=(G.cat.spot+1+Math.floor(Math.random()*4))%spots.length;
    if(G.cat.spot===G.cat.lastSpot)G.cat.spot=(G.cat.spot+1)%spots.length;
    G.cat.lastSpot=G.cat.spot;
  }
  var spots2=monster?CAT_SPOTS_MONSTER:CAT_SPOTS;
  var spot=spots2[G.cat.spot%spots2.length];
  var targetX=RW*spot.x,targetY=RH*spot.y;
  G.cat.x=lerp(G.cat.x||targetX,targetX,dt*3);
  G.cat.y=lerp(G.cat.y||targetY,targetY,dt*3);
}

/* ====== ПОГОДА ====== */
var WEATHERS=['sunny','rain','snow'];
function setWeather(w){
  G.weather=w;G.weatherT=0;G.weatherDur=rnd(24,40);
  updateTint();
}
function updateWeather(dt){
  G.weatherT+=dt;
  if(G.weatherT>G.weatherDur)setWeather(pick(WEATHERS.filter(function(w){return w!==G.weather;})));
}
function updateTint(){
  var el=document.getElementById('tint');
  if(!el)return;
  if(G.weather==='sunny'){
    el.style.background='radial-gradient(circle at 72% 6%, rgba(255,205,120,.32), rgba(255,170,70,.13) 40%, rgba(255,150,50,0) 72%)';
  } else if(G.weather==='rain'){
    el.style.background='linear-gradient(180deg, rgba(60,92,152,.30), rgba(38,58,110,.22))';
  } else {
    el.style.background='linear-gradient(180deg, rgba(202,222,255,.30), rgba(170,196,232,.20))';
  }
}
function updateWeatherParticles(dt){
  var target=G.weather==='rain'?(LOW_GFX?55:110):G.weather==='snow'?(LOW_GFX?40:80):0;
  var wxL=RW*(WIN_X-WIN_W/2);
  var wxR=RW*(WIN_X+WIN_W/2);
  var wyT=RH*(WIN_Y-WIN_H/2);
  var wyB=RH*(WIN_Y+WIN_H/2);
  while(G.wparts.length<target){
    G.wparts.push({
      x:rnd(wxL,wxR),y:rnd(wyT-40,wyB),
      vx:G.weather==='rain'?rnd(-38,-14):rnd(-14,14),
      vy:G.weather==='rain'?rnd(320,440):rnd(38,72),
      len:G.weather==='rain'?rnd(8,16):0,
      r:G.weather==='snow'?rnd(1.5,3):0,
      ph:rnd(0,TAU)
    });
  }
  while(G.wparts.length>target)G.wparts.pop();
  for(var i=0;i<G.wparts.length;i++){
    var p=G.wparts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.y>wyB+5||p.x<wxL-20||p.x>wxR+20){
      p.y=wyT-rnd(0,40);p.x=rnd(wxL,wxR);
    }
    if(G.weather==='snow')p.x+=Math.sin(G.t*2+p.ph)*8*dt;
  }
}

/* ====== FX ====== */
function drawFX(dt){
  fxG.clearRect(0,0,FW,FH);
  for(var i=G.particles.length-1;i>=0;i--){
    var p=G.particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;
    p.life-=dt;p.rot+=p.vr*dt;
    if(p.life<=0){G.particles.splice(i,1);continue;}
    var a=clamp(p.life/p.max,0,1);
    fxG.save();fxG.globalAlpha=a;fxG.translate(p.x,p.y);fxG.rotate(p.rot);
    if(p.type==='heart')drawHeartFX(p.size);
    else if(p.type==='tear')drawTearFX(p.size);
    else if(p.type==='spark')drawSparkFX(p.size);
    fxG.restore();
  }
  for(var j=G.bubbles.length-1;j>=0;j--){
    var b=G.bubbles[j];
    b.life-=dt;b.y+=b.vy*dt;
    if(b.life<=0){G.bubbles.splice(j,1);continue;}
    var a2=clamp(b.life/b.max,0,1);
    var fadeIn=clamp((b.max-b.life)*4,0,1);
    var scale=0.6+0.4*fadeIn;
    var bx=b.x,by=b.y;
    if(b.shake){bx+=rnd(-b.shake,b.shake);by+=rnd(-b.shake,b.shake);}
    fxG.save();fxG.globalAlpha=a2*0.98;fxG.translate(bx,by);fxG.scale(scale,scale);
    var fontWeight='900';
    fxG.font=fontWeight+' '+b.size+'px "Arial Black", "Segoe UI", sans-serif';
    var rawText=b.text;
    var drawText=rawText;
    var tw=fxG.measureText(drawText).width;
    var pad=20,w=Math.min(tw+pad*2,FW-40),h=b.size+24;

    var isJagged = (b.color==='rage'||b.color==='yell'||b.color==='mon');
    var bg,fg;
    if(b.color==='happy'){bg='#ffffff';fg='#2a6a4a';}
    else if(b.color==='sad'){bg='#eaf2ff';fg='#2a4a8a';}
    else if(b.color==='yell'){bg='#fff5e0';fg='#0a0a0a';}
    else if(b.color==='rage'){bg='#0a0a0a';fg='#fff5c0';}
    else if(b.color==='mon'){bg='#3a0040';fg='#ffd000';}
    else {bg='#ffffff';fg='#0a0a0a';}

    fxG.fillStyle=bg;
    fxG.strokeStyle='#0a0a0a';
    fxG.lineWidth=4;
    fxG.lineJoin='round';

    if(isJagged){
      var points=14;
      fxG.beginPath();
      for(var pi3=0;pi3<points;pi3++){
        var ang=(pi3/points)*Math.PI*2;
        var rx=w/2*1.18,ry=h/2*1.4;
        var jitter=0.78+((pi3*7)%10)/40;
        var px=Math.cos(ang)*rx*jitter;
        var py=Math.sin(ang)*ry*jitter;
        if(pi3===0)fxG.moveTo(px,py);else fxG.lineTo(px,py);
      }
      fxG.closePath();
      fxG.fill();fxG.stroke();
      fxG.beginPath();
      fxG.moveTo(-14,h/2-2);
      fxG.lineTo(-4,h/2+14);
      fxG.lineTo(4,h/2+2);
      fxG.lineTo(14,h/2+18);
      fxG.lineTo(20,h/2-2);
      fxG.closePath();
      fxG.fill();fxG.stroke();
    } else {
      roundRectOn(fxG,-w/2,-h/2,w,h,16);
      fxG.fill();fxG.stroke();
      fxG.beginPath();
      fxG.moveTo(-12,h/2-2);
      fxG.lineTo(0,h/2+18);
      fxG.lineTo(12,h/2-2);
      fxG.closePath();
      fxG.fill();fxG.stroke();
    }

    fxG.fillStyle=fg;
    fxG.textAlign='center';fxG.textBaseline='middle';
    fxG.lineWidth=4;
    fxG.strokeStyle=bg;
    fxG.strokeText(drawText,0,2);
    fxG.fillText(drawText,0,2);
    fxG.restore();
  }
}
function drawHeartFX(s){
  fxG.save();
  fxG.strokeStyle='#0a0a0a';fxG.lineWidth=3;fxG.lineJoin='round';
  var gr=fxG.createRadialGradient(-s*0.3,-s*0.2,0,0,0,s*1.6);
  gr.addColorStop(0,'#ffd0e0');gr.addColorStop(1,'#ff2a6a');
  fxG.fillStyle=gr;
  fxG.beginPath();
  fxG.moveTo(0,s*0.35);
  fxG.bezierCurveTo(s,s-s*0.6,s*1.5,s+s*0.9,0,s*1.5);
  fxG.bezierCurveTo(-s*1.5,s+s*0.9,-s,s-s*0.6,0,s*0.35);
  fxG.fill();fxG.stroke();
  fxG.fillStyle='#fff';
  fxG.beginPath();fxG.arc(-s*0.4,-s*0.1,s*0.22,0,TAU);fxG.fill();
  fxG.restore();
}
function drawTearFX(s){
  fxG.save();
  fxG.strokeStyle='#0a0a0a';fxG.lineWidth=3;
  var gr=fxG.createRadialGradient(-s*0.3,-s*0.3,0,0,0,s);
  gr.addColorStop(0,'#c0e8ff');gr.addColorStop(1,'#5a9aff');
  fxG.fillStyle=gr;
  fxG.beginPath();
  fxG.moveTo(0,-s);fxG.quadraticCurveTo(s,s*0.3,0,s);fxG.quadraticCurveTo(-s,s*0.3,0,-s);
  fxG.fill();fxG.stroke();
  fxG.fillStyle='#fff';
  fxG.beginPath();fxG.arc(-s*0.25,-s*0.1,s*0.22,0,TAU);fxG.fill();
  fxG.restore();
}
function drawSparkFX(s){
  fxG.save();
  fxG.strokeStyle='#0a0a0a';fxG.lineWidth=3;fxG.lineJoin='round';
  var gr=fxG.createRadialGradient(0,0,0,0,0,s);
  gr.addColorStop(0,'#fff5b0');gr.addColorStop(0.5,'#a0e8b8');gr.addColorStop(1,'#7fd0a0');
  fxG.fillStyle=gr;
  fxG.beginPath();
  for(var i=0;i<4;i++){
    var a=i*Math.PI/2;
    var x1=Math.cos(a)*s*2.0,y1=Math.sin(a)*s*2.0;
    var x2=Math.cos(a+Math.PI/4)*s*0.5,y2=Math.sin(a+Math.PI/4)*s*0.5;
    if(i===0)fxG.moveTo(x1,y1);else fxG.lineTo(x1,y1);
    fxG.lineTo(x2,y2);
  }
  fxG.closePath();
  fxG.fill();fxG.stroke();
  fxG.fillStyle='#fff';
  fxG.beginPath();fxG.arc(0,0,s*0.5,0,TAU);fxG.fill();
  fxG.restore();
}

/* ====== ЦИКЛ ====== */
var lastT=performance.now();
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;
  G.t+=dt;
  updateWeather(dt);
  updateWeatherParticles(dt);
  var needRender=false;
  for(var i=0;i<5;i++){
    if(G.slotLock[i]>0){G.slotLock[i]=Math.max(0,G.slotLock[i]-dt);needRender=true;}
  }
  if(needRender)renderCards();
  if(G.girl&&G.girl.siblingBornAt>0&&!G.sibling&&G.t>=G.girl.siblingBornAt){
    G.girl.siblingBornAt=0;
    spawnSibling();
  }
  for(var ci=0;ci<G.chars.length;ci++)updateChar(G.chars[ci],dt);
  drawRoom();
  updateCatState();
  drawPetLayer();
  drawFX(dt);
  checkWin(dt);
  if(!loop._hudT||G.t-loop._hudT>0.25){loop._hudT=G.t;updateHUD();}
  requestAnimationFrame(loop);
}

document.getElementById('babyBtn').addEventListener('click',function(){
  if(G.sibling&&G.sibling.siblingStage==='grown')petSibling(G.sibling);
});

function init(){
  resizeRoom();
  resizeFX();
  var girl=makeCharState(false,false);
  G.girl=girl;G.chars.push(girl);
  createCharDOM(girl);
  positionChars();
  updateSelectionUI();
  rebuildAllSlots();
  renderCards();updateHUD();
  setWeather('sunny');
  G.cat.x=window.innerWidth*0.72;
  G.cat.y=window.innerHeight*0.86;
  G.cat.spot=0;
  G.cat.lastSpot=0;
  requestAnimationFrame(loop);
  window.addEventListener('pointerdown',function(){var a=ac();if(a&&a.state==='suspended')a.resume();},{once:true});
}
window.addEventListener('load',function(){resizeRoom();resizeFX();positionChars();});
init();
})();
</script>
