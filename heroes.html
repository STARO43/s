<style>
/* ============================================================
   УНИКАЛЬНЫЕ СТИЛИ СТРАНИЦЫ «ВЕЛИКИЕ»
   ============================================================ */

/* ---------- ТАЙМЛАЙН ВЕЛИКИХ ---------- */
.heroes-timeline {
    position: relative;
    z-index: 10;
    max-width: 1300px;
    margin: 0 auto;
    padding: 3rem 5vw 6rem;
}

/* Заголовок века: линия сверху, крупный заголовок */
.century-header {
    position: relative;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    padding: 28px 0 18px;
    margin: 0 0 28px;
    border-top: 2px solid var(--text);
    background: none;
    color: var(--text);
}
.century-header:not(:first-child) {
    margin-top: 72px;
}
.century-header::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 64px;
    height: 4px;
    background: var(--red);
}
.century-title {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 5.2vw, 3rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
    line-height: 1;
}

/* Советская полоса — тонкая, с точками-звёздами */
.soviet-band {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 0;
    margin: 20px 0 32px;
    background: none;
    color: var(--red);
    font-family: var(--font-display);
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    justify-content: center;
    border-top: 1px solid rgba(217, 4, 41, 0.25);
    border-bottom: 1px solid rgba(217, 4, 41, 0.25);
}
.soviet-band::before,
.soviet-band::after {
    content: '★';
    color: var(--red);
    font-size: 0.85em;
    letter-spacing: 0;
    opacity: 0.8;
}

/* ---------- СЕТКА КАРТОЧЕК ---------- */
.heroes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 20px;
    margin-bottom: 26px;
}

/* ---------- КАРТОЧКА ГЕРОЯ ---------- */
.hero-item {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid rgba(10, 10, 10, 0.14);
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
    transition:
        transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.28s ease,
        box-shadow 0.28s ease;
    -webkit-tap-highlight-color: transparent;
    isolation: isolate;
}
.hero-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    height: 3px;
    width: 0;
    background: var(--red);
    transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 3;
}
.hero-item:hover {
    transform: translateY(-4px);
    border-color: rgba(10, 10, 10, 0.28);
    box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.05),
        0 14px 32px -10px rgba(0, 0, 0, 0.16);
}
.hero-item:hover::before {
    width: 100%;
}

.hero-photo {
    position: relative;
    aspect-ratio: 1 / 1;
    background: linear-gradient(180deg, #E9E3D6 0%, #F4F1EA 100%);
    overflow: hidden;
}
.hero-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: contrast(1.05) saturate(0.92);
    transition: filter 0.4s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.hero-item:hover .hero-photo img {
    filter: contrast(1.08) saturate(1.05);
    transform: scale(1.03);
}

.hero-info {
    position: relative;
    padding: 16px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg);
}
.hero-name {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text);
}
.hero-years {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: rgba(10, 10, 10, 0.55);
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-top: 6px;
    border-top: 1px solid rgba(10, 10, 10, 0.08);
}
.hero-years > span:first-child {
    color: rgba(10, 10, 10, 0.75);
}
.hero-age {
    color: var(--red);
    font-weight: 700;
    margin-left: auto;
    letter-spacing: 0.04em;
}
.hero-age::before {
    content: '· ';
    color: rgba(10, 10, 10, 0.3);
    font-weight: 400;
}

/* ---------- МОБИЛЬНАЯ АДАПТАЦИЯ ---------- */
@media (max-width: 640px) {
    .heroes-timeline { padding: 2rem 4vw 5rem; }
    .heroes-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
    }
    .hero-item { border-radius: 2px; }
    .hero-item:hover { transform: none; }
    .hero-item::before { display: none; }
    .hero-name { font-size: 0.98rem; letter-spacing: 0.01em; }
    .hero-info { padding: 12px 12px 14px; gap: 6px; }
    .hero-years { font-size: 0.62rem; padding-top: 5px; gap: 8px; }

    .century-header {
        padding: 20px 0 14px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .century-header:not(:first-child) { margin-top: 48px; }
    .century-title { font-size: 1.5rem; }
    .century-header::after { width: 48px; height: 3px; }

    .soviet-band {
        padding: 12px 0;
        font-size: 0.88rem;
        letter-spacing: 0.22em;
        margin: 16px 0 22px;
        gap: 12px;
    }

    /* лёгкий fade карточек на мобиле */
    .hero-item { opacity: 0; }
    .hero-item.is-visible {
        opacity: 1;
        transition: opacity 0.35s ease !important;
    }
    .century-header,
    .soviet-band { opacity: 0; }
    .century-header.is-visible,
    .soviet-band.is-visible {
        opacity: 1;
        transition: opacity 0.4s ease !important;
    }
}

/* ---------- МОДАЛЬНОЕ ОКНО ГЕРОЯ ---------- */
.hero-modal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    z-index: 5000;
    display: flex;
    flex-direction: column;
    padding: 62px 8px 14px;
    gap: 8px;
    overflow-y: auto;
    overflow-x: hidden;
    box-sizing: border-box;
}

.hero-modal-close,
.hero-modal-repeat {
    position: fixed;
    top: 10px;
    width: 52px;
    height: 52px;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, color 0.15s ease;
    z-index: 100;
    padding: 0;
    line-height: 1;
    border-radius: 50%;
    font-family: var(--font-display);
    -webkit-tap-highlight-color: transparent;
}
.hero-modal-close {
    right: 10px;
    font-size: 2.6rem;
    font-weight: 300;
}
.hero-modal-repeat {
    left: 10px;
    font-size: 1.6rem;
}
.hero-modal-close:hover,
.hero-modal-repeat:hover {
    color: var(--red);
    transform: scale(1.12);
}

.hero-modal-portrait-wrap {
    flex-shrink: 0;
    width: 100%;
    height: 78vh;
    min-height: 280px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.hero-modal-portrait {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
}
.hero-portrait-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-family: var(--font-display);
    font-size: clamp(6rem, 24vw, 16rem);
    font-weight: 700;
    color: var(--text);
    background: rgba(10, 10, 10, 0.05);
    text-transform: uppercase;
    user-select: none;
    letter-spacing: 0.04em;
}

.hero-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg);
    border: 2px solid var(--text);
    color: var(--text);
    width: 46px;
    height: 46px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-family: var(--font-display);
    transition: all 0.15s ease;
    z-index: 20;
    padding: 0;
    line-height: 1;
}
.hero-nav.prev { left: 8px; }
.hero-nav.next { right: 8px; }
.hero-nav:hover {
    background: var(--text);
    color: var(--bg);
}

.hero-modal-info {
    text-align: center;
    padding: 10px 0 4px;
    flex-shrink: 0;
}
.hero-modal-info h3 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 6.5vw, 3.4rem);
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text);
    line-height: 1;
}
.hero-modal-years {
    font-family: var(--font-mono);
    font-size: clamp(0.95rem, 2.3vw, 1.15rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--red);
    margin-top: 10px;
    user-select: none;
}

/* ---------- ТАЙМЛАЙН ВНУТРИ МОДАЛКИ ---------- */
.hero-modal-timeline {
    flex-shrink: 0;
    width: 100%;
    margin-top: 10px;
    padding-bottom: 24px;
}
.htl-panel {
    border: 2px solid var(--text);
    background: var(--bg);
}
.htl-head {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 2px solid var(--text);
    background: rgba(10, 10, 10, 0.05);
}
.htl-head-cell {
    padding: 10px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
}
.htl-head-cell:last-child {
    border-left: 2px solid var(--text);
    text-align: right;
    align-items: flex-end;
}
.htl-head-label {
    font-family: var(--font-mono);
    font-size: 0.56rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(10, 10, 10, 0.55);
}
.htl-head-value {
    font-family: var(--font-mono);
    font-size: clamp(0.85rem, 2.2vw, 1.05rem);
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
}
.htl-head-cell:last-child .htl-head-value {
    color: var(--red);
}
.htl-body {
    padding: 24px 20px 16px;
    position: relative;
}
.htl {
    position: relative;
    width: 100%;
    height: 310px;
}
.htl-axis {
    position: absolute;
    left: 0; right: 0;
    top: 148px;
    height: 1.5px;
    background: var(--text);
    z-index: 1;
}
.htl-life {
    position: absolute;
    top: 133px;
    height: 31px;
    background: var(--red);
    border: 1.5px solid var(--text);
    box-sizing: border-box;
    z-index: 6;
}
.htl-life::before,
.htl-life::after {
    content: '';
    position: absolute;
    top: -5px; bottom: -5px;
    width: 0.5px;
    background: var(--text);
}
.htl-life::before { left: -1px; }
.htl-life::after { right: -1px; }
.htl-dtick {
    position: absolute;
    top: 148px;
    width: 1px;
    height: 4px;
    background: var(--text);
    transform: translateX(-50%);
    opacity: 0.22;
    z-index: 2;
}
.htl-htick {
    position: absolute;
    top: 148px;
    width: 1px;
    height: 9px;
    background: var(--text);
    transform: translateX(-50%);
    opacity: 0.5;
    z-index: 2;
}
.htl-ctick {
    position: absolute;
    top: 148px;
    width: 2px;
    height: 30px;
    background: var(--text);
    transform: translateX(-50%);
    z-index: 3;
}
.htl-war {
    position: absolute;
    top: 0;
    height: 148px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 4;
    padding: 0 2px;
}
.htl-war-label {
    flex-shrink: 0;
    text-align: center;
    margin-bottom: 5px;
    max-width: 100px;
}
.htl-war-year {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 0.02em;
    line-height: 1;
    margin-bottom: 3px;
}
.htl-war-name {
    font-family: var(--font-display);
    font-size: 0.54rem;
    font-weight: 600;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1.14;
}
.htl-war-tick {
    flex: 1 1 auto;
    width: 2px;
    background: var(--text);
    opacity: 0.7;
    min-height: 4px;
}
.htl-other {
    position: absolute;
    top: 148px;
    height: 100px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 4;
    padding: 0 2px;
}
.htl-other-tick {
    flex: 1 1 auto;
    width: 2px;
    background: var(--text);
    opacity: 0.7;
    min-height: 4px;
    margin-bottom: 5px;
}
.htl-other-label {
    flex-shrink: 0;
    text-align: center;
    max-width: 100px;
}
.htl-other-year {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 0.02em;
    line-height: 1;
    margin-bottom: 3px;
}
.htl-other-name {
    font-family: var(--font-display);
    font-size: 0.54rem;
    font-weight: 600;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1.14;
}
.htl-cnum {
    position: absolute;
    top: 262px;
    transform: translateX(-50%);
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--text);
    background: var(--bg);
    padding: 0 6px;
    z-index: 7;
    line-height: 1;
}

@media (max-width: 640px) {
    .hero-modal { padding: 62px 6px 14px; gap: 4px; }
    .hero-modal-close { right: 8px; width: 46px; height: 46px; font-size: 2.3rem; }
    .hero-modal-repeat { left: 8px; width: 46px; height: 46px; font-size: 1.5rem; }
    .hero-nav { width: 40px; height: 40px; font-size: 1.3rem; }
    .hero-nav.prev { left: 5px; }
    .hero-nav.next { right: 5px; }
    .hero-modal-portrait-wrap { height: 72vh; min-height: 300px; }
    .hero-modal-info h3 { font-size: 1.75rem; }
    .hero-modal-years { font-size: 0.88rem; margin-top: 6px; }
    .hero-modal-timeline { display: none; }
}
</style>

const TL_START = 1650, TL_END = 2010, TL_RANGE = TL_END - TL_START;
const tlPos = y => ((y - TL_START) / TL_RANGE) * 100;
const TL_CENTURIES = [1700, 1800, 1900, 2000];
const TL_HALVES = [1750, 1850, 1950];
const TL_WARS = [
    { year: 1721, name: 'Победа в<br>Северной<br>войне' },
    { year: 1812, name: 'Отечественная<br>война' },
    { year: 1914, name: 'Первая<br>мировая' },
    { year: 1945, name: 'Победа<br>в Великой<br>Отечественной' }
];
const TL_OTHERS = [
    { year: 1825, name: 'Восстание<br>декабристов' },
    { year: 1861, name: 'Отмена<br>крепостного<br>права' },
    { year: 1917, name: 'Октябрьская<br>революция' },
    { year: 1991, name: 'Разрушение<br>СССР' }
];

function buildTimelineHTML(b, d) {
    const bY = Math.max(b, TL_START), dY = Math.min(d, TL_END);
    const l = tlPos(bY), w = tlPos(dY) - l;
    let h = '<div class="htl-panel"><div class="htl-head"><div class="htl-head-cell"><div class="htl-head-label">ХРОНОЛОГИЯ ИСТОРИИ</div></div><div class="htl-head-cell"></div></div><div class="htl-body"><div class="htl">';

    for (let y = 1700; y <= 2000; y += 10) {
        if (y % 100 === 0 || y % 50 === 0) continue;
        h += `<div class="htl-dtick" style="left:${tlPos(y)}%"></div>`;
    }
    TL_HALVES.forEach(y => { h += `<div class="htl-htick" style="left:${tlPos(y)}%"></div>`; });
    h += '<div class="htl-axis"></div>';
    TL_CENTURIES.forEach(y => { h += `<div class="htl-ctick" style="left:${tlPos(y)}%"></div>`; });
    h += `<div class="htl-life" style="left:${l}%;width:${w}%"></div>`;

    TL_WARS.forEach(e => {
        h += `<div class="htl-war" style="left:${tlPos(e.year)}%"><div class="htl-war-label"><div class="htl-war-year">${e.year}</div><div class="htl-war-name">${e.name}</div></div><div class="htl-war-tick"></div></div>`;
    });
    TL_OTHERS.forEach(e => {
        h += `<div class="htl-other" style="left:${tlPos(e.year)}%"><div class="htl-other-tick"></div><div class="htl-other-label"><div class="htl-other-year">${e.year}</div><div class="htl-other-name">${e.name}</div></div></div>`;
    });
    TL_CENTURIES.forEach(y => { h += `<div class="htl-cnum" style="left:${tlPos(y)}%">${y}</div>`; });

    h += '</div></div></div>';
    return h;
}

function encodePath(p) {
    return p.split('/').map(s => encodeURIComponent(s)).join('/');
}

/* ---------- РЕНДЕР ТАЙМЛАЙНА ---------- */
function renderHeroesTimeline() {
    const timeline = document.getElementById('heroesTimeline');
    if (!timeline) return;

    const centuries = [
        { name: "XVIII век", filter: h => h.overrideCentury === 18 || (!h.overrideCentury && h.deathYear < 1801) },
        { name: "XIX век", filter: h => h.overrideCentury === 19 || (!h.overrideCentury && h.deathYear >= 1801 && h.deathYear <= 1921) },
        { name: "XX век", filter: h => h.overrideCentury === 20 || (!h.overrideCentury && h.deathYear > 1921) }
    ];

    let html = '';

    centuries.forEach(c => {
        const heroes = heroesData.filter(c.filter).sort((a, b) => a.deathYear - b.deathYear);
        if (heroes.length === 0) return;

        html += `<div class="century-header"><span class="century-title">${c.name}</span></div><div class="heroes-grid">`;
        let sovietBandInserted = false;

        heroes.forEach(hero => {
            if (!sovietBandInserted && hero.name === "Ленин") {
                html += `</div><div class="soviet-band">СОВЕТСКИЙ ПЕРИОД</div><div class="heroes-grid">`;
                sovietBandInserted = true;
            }

            const imgPath = encodePath('Great Rus/' + hero.images[0]);
            const age = hero.deathYear - hero.birthYear;
            const imagesJson = JSON.stringify(hero.images.map(i => encodePath('Great Rus/' + i)));
            const audioPath = encodePath('Great Rus/' + hero.audio);

            html += `<div class="hero-item" data-name="${hero.name}" data-birth="${hero.birthYear}" data-death="${hero.deathYear}" data-audio="${audioPath}" data-images='${imagesJson}'>
                <div class="hero-photo"><img src="${imgPath}" alt="${hero.name}" loading="lazy" decoding="async"></div>
                <div class="hero-info">
                    <div class="hero-name">${hero.name}</div>
                    <div class="hero-years"><span>${hero.birthYear}—${hero.deathYear}</span><span class="hero-age">${age}</span></div>
                </div>
            </div>`;
        });

        html += `</div>`;
    });

    timeline.innerHTML = html;

    timeline.querySelectorAll('.hero-item').forEach(item => {
        item.addEventListener('click', function () {
            openHeroModal(
                this.dataset.name,
                JSON.parse(this.dataset.images),
                this.dataset.audio,
                parseInt(this.dataset.birth, 10),
                parseInt(this.dataset.death, 10)
            );
        });
    });

    /* Мобильный лёгкий fade появления карточек */
    if (window.matchMedia('(max-width: 640px)').matches) {
        const fadeEls = timeline.querySelectorAll('.century-header, .soviet-band, .hero-item');
        fadeEls.forEach((el, i) => {
            setTimeout(() => el.classList.add('is-visible'), i * 10);
        });
    }
}

/* ---------- МОДАЛЬНОЕ ОКНО ---------- */
let heroModal = null;
let heroAudio = new Audio();
let currentImageIndex = 0;
let currentImages = [];

function openHeroModal(name, images, audioSrc, birthYear, deathYear) {
    if (heroModal) heroModal.remove();

    currentImages = images;
    currentImageIndex = 0;

    const navHTML = images.length > 1
        ? `<button class="hero-nav prev" type="button" aria-label="Предыдущий">‹</button><button class="hero-nav next" type="button" aria-label="Следующий">›</button>`
        : '';

    const initials = name.split(/\s+/).map(w => w.charAt(0)).join('').slice(0, 2).toUpperCase();

    heroModal = document.createElement('div');
    heroModal.className = 'hero-modal';
    heroModal.innerHTML = `
        <button class="hero-modal-repeat" type="button" aria-label="Повторить звук">♪</button>
        <button class="hero-modal-close" type="button" aria-label="Закрыть">×</button>
        <div class="hero-modal-portrait-wrap">
            ${navHTML}
            <img class="hero-modal-portrait" src="${images[0]}" alt="${name}" decoding="async">
        </div>
        <div class="hero-modal-info">
            <h3>${name}</h3>
            <div class="hero-modal-years">${birthYear} — ${deathYear}</div>
        </div>
        <div class="hero-modal-timeline">${buildTimelineHTML(birthYear, deathYear)}</div>
    `;

    const imgEl = heroModal.querySelector('.hero-modal-portrait');
    imgEl.addEventListener('error', () => {
        const placeholder = document.createElement('div');
        placeholder.className = 'hero-portrait-placeholder';
        placeholder.textContent = initials;
        imgEl.replaceWith(placeholder);
    });

    document.body.appendChild(heroModal);

    playHeroAudio(audioSrc);

    heroModal.querySelector('.hero-modal-close').addEventListener('click', () => {
        heroModal.remove();
        heroAudio.pause();
        heroAudio.currentTime = 0;
    });

    heroModal.querySelector('.hero-modal-repeat').addEventListener('click', () => playHeroAudio(audioSrc));

    const prevBtn = heroModal.querySelector('.hero-nav.prev');
    const nextBtn = heroModal.querySelector('.hero-nav.next');

    if (prevBtn) {
        prevBtn.addEventListener('click', () => {
            currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
            const im = heroModal.querySelector('.hero-modal-portrait');
            if (im) im.src = currentImages[currentImageIndex];
        });
    }
    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            currentImageIndex = (currentImageIndex + 1) % currentImages.length;
            const im = heroModal.querySelector('.hero-modal-portrait');
            if (im) im.src = currentImages[currentImageIndex];
        });
    }
}

function playHeroAudio(src) {
    heroAudio.pause();
    heroAudio.src = src;
    heroAudio.currentTime = 0;
    heroAudio.play().catch(e => console.log('Ошибка воспроизведения', e));
}

/* ---------- СТАРТ ---------- */
document.addEventListener('DOMContentLoaded', () => {
    renderHeroesTimeline();
    /* Стартовая анимация появления страницы уже запускается из shared.js */
});
</script>
