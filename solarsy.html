<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СОЛНЕЧНАЯ СИСТЕМА · Пульт наблюдения ЦУП</title>
<meta name="description" content="Десять объектов Солнечной системы в движении: интерактивная схема в стиле ЦУП. Визир наведён — поехали!">
<meta name="keywords" content="Солнечная система, ЦУП, космос, планеты, интерактив, three.js">
<meta name="theme-color" content="#070605">
<link rel="icon" href="star.svg">
<style>
/* ---------- шрифты ---------- */
/* Локальные шрифты (self-hosted) */
@font-face {
  font-family: 'Russo One';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("fonts/russo-one-cyrillic.woff2") format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}
@font-face {
  font-family: 'Russo One';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("fonts/russo-one-latin.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("fonts/jetbrains-mono-cyrillic.woff2") format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("fonts/jetbrains-mono-latin.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root {
  --font-display: "Russo One", "Arial Narrow", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

/* ---------- стили приложения ---------- */
/* ============================================================
   СОЛНЕЧНАЯ СИСТЕМА · Пульт наблюдения ЦУП
   Палитра: тёплый чёрный, кремовый, советский красный, золото
   Экран чистый: сцена, метки, строка состояния и кнопка настроек.
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #070605;
  --panel: rgba(9, 8, 7, 0.96);
  --ink: #f3efe7;
  --ink-2: #a8a29a;
  --ink-3: #6e6a63;
  --line: rgba(243, 239, 231, 0.14);
  --line-2: rgba(243, 239, 231, 0.30);
  --red: #c53a24;
  --red-2: #e0492f;
  --gold: #d9a441;
  --mono: var(--font-mono), ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --display: var(--font-display), var(--mono);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sp-1: 6px; --sp-2: 12px; --sp-3: 20px; --sp-4: 32px;
  --z-canvas: 0; --z-ui: 10; --z-panel: 20; --z-error: 30;
  --dur-fast: 0.18s; --dur-mid: 0.24s;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.75;
}
canvas { display: block; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
button:hover { text-decoration: underline; text-underline-offset: 4px; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
  outline: 1px solid var(--gold); outline-offset: 3px;
}
button:active { opacity: 0.6; }
button[disabled] { opacity: 0.35; cursor: not-allowed; text-decoration: none; }
::selection { background: rgba(197, 58, 36, 0.4); }

#experience, #viewport { position: fixed; inset: 0; z-index: var(--z-canvas); }

/* События проходят сквозь общий слой; активны только интерактивные зоны */
#ui { position: fixed; inset: 0; z-index: var(--z-ui); pointer-events: none; }
#ui button, #ui select, #ui input, #ui a, #ui .lbl,
#panel, #gearBtn { pointer-events: auto; }

/* ---------- Статус и ошибки ---------- */
#load-status { position: fixed; left: var(--sp-3); top: 18px; color: var(--ink-3);
               font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; pointer-events: none; }
#load-error { position: fixed; left: var(--sp-3); top: 44px; z-index: var(--z-error);
              color: #ffb9b9; font-family: var(--mono); font-size: 12px; letter-spacing: 1px; }
#load-error button { border: 1px solid #7a3b3b; color: #ffd7d7; border-radius: 6px;
                     padding: 2px 10px; margin-left: 8px; font-size: 11.5px; }

/* ---------- Кнопка настроек ---------- */
#gearBtn { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom));
           z-index: 12; display: inline-flex; align-items: center; gap: 8px;
           color: var(--ink-2); font-family: var(--mono); font-size: 10px; letter-spacing: 2.5px;
           border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px;
           background: rgba(9, 8, 7, 0.72); backdrop-filter: blur(6px); }
#gearBtn:hover { color: var(--ink); border-color: var(--line-2); text-decoration: none; }
#gearBtn.on { opacity: 0; pointer-events: none; }

/* ---------- Панель пульта ---------- */
#panel { position: fixed; right: 0; top: 0; bottom: 0; z-index: var(--z-panel); width: min(400px, 92vw);
         background: var(--panel); border-left: 1px solid var(--line);
         display: flex; flex-direction: column;
         opacity: 0; transform: translateX(12px); pointer-events: none;
         transition: opacity var(--dur-mid) ease, transform var(--dur-mid) ease; }
#panel.open { opacity: 1; transform: translateX(0); pointer-events: auto; }
#panel[hidden] { display: none; }
.panel-head { display: flex; align-items: center; justify-content: space-between;
              padding: 18px 22px 14px; border-bottom: 1px solid var(--line); position: relative; }
.panel-head h2 { margin: 0; font-family: var(--display); font-size: 13px; font-weight: 400; letter-spacing: 3px; }
.panel-head button { color: var(--ink-3); font-size: 18px; }
.panel-head button:hover { color: var(--ink); }
#panel-body { position: relative; padding: 14px 22px 26px; overflow-y: auto; flex: 1; scrollbar-width: thin; }
#panel-body h3 { margin: 18px 0 8px; font-size: 11.5px; font-weight: 500; letter-spacing: 2px;
                 color: var(--gold); font-family: var(--mono); }
#panel-body h3.sec { margin: 24px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
#panel-body p, #panel-body li { color: var(--ink-2); font-size: 12.5px; }
#panel-body ul { margin: 0; padding-left: 18px; }
#panel-body .kv { color: var(--ink-3); font-size: 11px; }
.kbd { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); line-height: 2.1; margin: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
.row > span:first-child { color: var(--ink-2); font-size: 12.5px; }
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { border: 1px solid var(--line); color: var(--ink-2); border-radius: 999px;
        padding: 3px 12px; font-size: 11.5px; letter-spacing: 1px; font-family: var(--mono); }
.chip:hover { color: var(--ink); border-color: var(--ink-2); text-decoration: none; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--red); }
.chip[aria-pressed="false"] { opacity: 0.5; }
select { background: var(--bg); color: var(--ink); border: 1px solid var(--line);
         border-radius: 6px; padding: 4px 10px; font-family: var(--mono); font-size: 12px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; letter-spacing: 1px; }
details a { color: var(--ink); }

/* ---------- Каталог объектов (в панели) ---------- */
#planet-list button { display: flex; align-items: baseline; gap: 10px; color: var(--ink-3);
                      font-size: 12.5px; letter-spacing: 1px; padding: 3px 0; text-align: left; }
#planet-list button .no { font-family: var(--mono); font-size: 10px; color: var(--ink-3); min-width: 2.2em; }
#planet-list button:hover { color: var(--ink); }
#planet-list button.on { color: var(--ink); }
#planet-list button.on::after { content: "·"; margin-left: 2px; color: var(--red); font-weight: 700; }
#planet-list .group { color: var(--gold); font-family: var(--mono); font-size: 10px;
                      letter-spacing: 2.5px; margin: 12px 0 6px; }
#planet-list .group:first-child { margin-top: 0; }
.navrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.stepinfo { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--gold); margin-top: 10px; }

/* ---------- Паспорт объекта (в панели) ---------- */
#passport { min-height: 20px; }
#passport .pass-hint { color: var(--ink-3); font-size: 12px; }
#passport .pass-index { font-family: var(--mono); font-size: 10px; letter-spacing: 2.5px;
                        color: var(--gold); margin-bottom: 8px; }
#passport .pass-name { font-family: var(--display); font-size: 26px; letter-spacing: 2px; line-height: 1.25; }
#passport .pass-kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.2px;
                       color: var(--ink-3); margin-top: 4px; }
#passport .pass-poem { color: var(--ink-2); font-size: 12.5px; margin: 10px 0 2px; }

.hl { display: flex; flex-direction: column; gap: 8px; }
.hlbtn { text-align: left; border: 1px solid var(--line); border-radius: 10px;
         padding: 10px 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 2px; }
.hlbtn b { color: var(--ink); font-weight: 500; font-size: 12.5px; letter-spacing: 1px; }
.hlbtn span { font-size: 11px; color: var(--ink-3); }
.hlbtn:hover { border-color: var(--ink-2); text-decoration: none; }
.hlbtn[aria-pressed="true"] { border-color: var(--red); }
.hlbtn[aria-pressed="true"] b::after { content: " · текущая"; font-size: 10px; color: var(--gold); }

/* Пиксельное проявление заголовка панели */
.pxreveal { position: absolute; inset: 0; display: grid; pointer-events: none; z-index: 5; }
.pxreveal > div { background: var(--panel); opacity: 1; transition: opacity 0.16s steps(2); }
.pxreveal.go > div { opacity: 0; }

/* ---------- Метки объектов ---------- */
.lbl { position: fixed; color: var(--ink-2); font-family: var(--mono); font-size: 10.5px;
       letter-spacing: 1.5px; text-shadow: 0 1px 2px #000; transform: translate(-50%, -160%);
       z-index: 4; padding: 4px; }
.lbl:hover { color: var(--ink); }

/* ---------- Журнал наблюдений (в панели) ---------- */
#obslog { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--ink-3); }
#obslog div { margin-top: 3px; }
#obslog div:first-child { color: var(--ink-2); }

/* ---------- Перекрестие и координаты ---------- */
#crosshair { position: fixed; z-index: 5; width: 18px; height: 18px; margin: -9px 0 0 -9px;
             pointer-events: none; display: none; }
#crosshair i { position: absolute; background: rgba(217, 164, 65, 0.6); }
#crosshair i:first-child { left: 8px; top: 0; width: 1px; height: 18px; }
#crosshair i:last-child { left: 0; top: 8px; width: 18px; height: 1px; }
#surf-readout { position: fixed; right: 18px; top: 18px; z-index: 6; pointer-events: none;
                font-family: var(--mono); font-size: 10.5px; letter-spacing: 1px;
                color: var(--gold); display: none; }

/* ---------- Схема системы (в панели) ---------- */
#minimap-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#minimap { border: 1px solid var(--line); border-radius: 50%; background: rgba(9, 8, 7, 0.72);
           cursor: crosshair; }
.mini-note { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; color: var(--ink-3);
             text-align: center; }

/* ---------- Предстартовая заставка ---------- */
#intro { position: fixed; inset: 0; z-index: 60; background: var(--bg);
         display: grid; place-items: center; transition: opacity 0.45s ease; }
#intro.bye { opacity: 0; pointer-events: none; }
#introBg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.92;
           image-rendering: pixelated; }
.intro-center { position: relative; z-index: 2; text-align: center; padding: 48px 64px;
                background: radial-gradient(ellipse at center, rgba(7,6,5,0.85) 0%, rgba(7,6,5,0.55) 55%, transparent 78%); }
.intro-brand { font-family: var(--mono); font-size: 11px; letter-spacing: 4px;
               color: var(--gold); margin-bottom: 18px; }
.intro-star { color: var(--red); margin-right: 8px; }
.intro-title { margin: 0 0 10px; font-family: var(--display); font-weight: 400;
               font-size: clamp(28px, 5vw, 52px); letter-spacing: 6px; }
.intro-poem { color: var(--ink-2); font-size: 13px; letter-spacing: 3px; margin: 0 0 34px; }
#introGo { background: var(--red); color: #f7f2e6; font-family: var(--display); font-size: 13px;
           letter-spacing: 3px; padding: 12px 30px; border-radius: 3px;
           opacity: 0; transform: translateY(8px);
           transition: opacity 0.4s ease, transform 0.4s ease, background 0.2s ease;
           pointer-events: none; }
#introGo.show { opacity: 1; transform: none; pointer-events: auto; }
#introGo:hover { background: var(--red-2); text-decoration: none; }
.intro-foot { position: absolute; left: 26px; bottom: 22px; z-index: 2;
              font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; color: var(--ink-3); }

/* ---------- Мобильная вёрстка ---------- */
@media (max-width: 720px) {
  #load-status { left: 16px; top: 14px; font-size: 10px; }
  #surf-readout { right: 16px; top: 14px; font-size: 9.5px; }
  #gearBtn { right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); padding: 10px 14px; }
  #panel { width: 100%; top: auto; bottom: 0; max-height: 68%; border-left: none;
           border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
           transform: translateY(12px); }
  #panel.open { transform: translateY(0); }
  #panel-body { padding: 12px 16px 24px; }
  #passport .pass-name { font-size: 22px; }
  .intro-title { letter-spacing: 3px; }
  .intro-center { padding: 32px 24px; }
}

body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
</style>
</head>
