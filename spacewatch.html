<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космос и часы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            background: black; height: 100%; width: 100%;
            font-family: 'Orbitron', 'Segoe UI', 'Arial', sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; cursor: default; }

        /* ===== Полупрозрачные часы в стиле «Космос» ===== */
        #clock {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: rgba(242, 239, 232, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(60, 50, 35, 0.35);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.08);
            z-index: 50;
            touch-action: none;
            cursor: default;
            opacity: 0.9;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }
        #clock:hover { opacity: 1; }
        #clock:active { cursor: default; transform: translateX(-50%) scale(1.02); }
        #clock svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .min-tick { stroke: rgba(58, 48, 38, 0.45); stroke-width: 0.5; stroke-linecap: round; }
        .hour-tick { stroke: rgba(31, 24, 16, 0.85); stroke-width: 1; stroke-linecap: round; }
        .hour-tick.qtr { stroke: rgba(31, 24, 16, 0.95); stroke-width: 1.4; }

        .numeral {
            fill: rgba(31, 24, 16, 0.9);
            font-family: 'Orbitron', 'Arial', sans-serif;
            font-size: 11px;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: central;
            letter-spacing: 0.5px;
        }

        .hand { stroke-linecap: round; stroke-linejoin: round; }
        #hourHand   { stroke: rgba(31, 24, 16, 0.9); stroke-width: 3; }
        #minuteHand { stroke: rgba(31, 24, 16, 0.9); stroke-width: 1.6; }

        #secondHandGroup {
            pointer-events: none;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
        }

        .center-ring { fill: none; stroke: rgba(31, 24, 16, 0.9); stroke-width: 0.9; }
        .center-dot  { fill: rgba(31, 24, 16, 0.9); }

        .brand {
            fill: rgba(58, 48, 38, 0.7);
            font-family: 'Orbitron', sans-serif;
            font-size: 4px;
            font-weight: 600;
            text-anchor: middle;
            letter-spacing: 2px;
        }

        /* ===== Плашка с датой (та же прозрачность, что и у часов) ===== */
        #datePlate {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 10px 18px 12px;
            border-radius: 16px;
            background: rgba(242, 239, 232, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(60, 50, 35, 0.35);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.08);
            z-index: 50;
            opacity: 0.9;
            text-align: center;
            line-height: 1.15;
            pointer-events: none;
            white-space: nowrap;
        }
        #dpDate {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(58, 48, 38, 0.85);
            text-transform: lowercase;
        }
        #dpYear {
            margin-top: 4px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            color: rgba(31, 24, 16, 0.9);
        }
    </style>
</head>
<body>

    <div id="clock">
        <svg viewBox="0 0 130 130">
            <g id="ticks"></g>
            <g id="numerals"></g>

            <line id="hourHand"   class="hand" x1="65" y1="65" x2="65" y2="36" />
            <line id="minuteHand" class="hand" x1="65" y1="65" x2="65" y2="18" />

            <g id="secondHandGroup">
                <line x1="65" y1="65" x2="65" y2="74" stroke="#e63946" stroke-width="1.5" stroke-linecap="round" />
                <line x1="65" y1="65" x2="65" y2="22" stroke="#e63946" stroke-width="1" stroke-linecap="round" />
                <circle cx="65" cy="65" r="2.2" fill="#e63946" />
                <circle cx="65" cy="65" r="0.8" fill="#ffffff" />
            </g>

            <circle class="center-ring" cx="65" cy="65" r="2.8" />
            <circle class="center-dot"  cx="65" cy="65" r="1.2" />
            <text class="brand" x="65" y="44">КОСМОС</text>
        </svg>
    </div>

    <div id="datePlate">
        <div id="dpDate">—</div>
        <div id="dpYear">—</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const SIDEREAL_MONTH_HOURS = 27 * 24 + 7 + 43 / 60;
        const SIDEREAL_MONTH_MINUTES = SIDEREAL_MONTH_HOURS * 60;
        const EARTH_DAY_HOURS = 24;
        const EARTH_YEAR_MINUTES = 365.25 * 24 * 60;
        const TIME_SCALE = 1;
        const DEG = Math.PI / 180;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x03040a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 8000);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.15;
        document.body.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.6, 0.85);
        bloomPass.threshold = 0.1; bloomPass.strength = 0.7; bloomPass.radius = 0.6;
        composer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableRotate = true;
        controls.enablePan = true;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.1;
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 20;
        controls.maxDistance = 800;

        const SUN_X = 0, SUN_Y = 0, SUN_Z = 0;
        const SUN_RADIUS = 40;

        // =====================================================================
        // 1. ИСПРАВЛЕНИЕ СВЕТА И ТЕНИ
        //    Направленный свет теперь размещается МЕЖДУ Солнцем и Землёй
        //    и светит точно на Землю. Это даёт правильное направление лучей
        //    (как от Солнца) и при этом позволяет использовать очень плотную
        //    ортографическую камеру теней — тень от Луны становится чёткой.
        // =====================================================================
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.6);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(4096, 4096);
        sunLight.shadow.camera.near = 120;
        sunLight.shadow.camera.far = 300;
        sunLight.shadow.camera.left = -32;
        sunLight.shadow.camera.right = 32;
        sunLight.shadow.camera.top = 32;
        sunLight.shadow.camera.bottom = -32;
        sunLight.shadow.camera.updateProjectionMatrix();
        sunLight.shadow.bias = -0.0004;
        sunLight.shadow.normalBias = 0.05;
        scene.add(sunLight);
        scene.add(sunLight.target);

        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(SUN_RADIUS, 64, 64),
            new THREE.MeshStandardMaterial({ color: 0xffbb44, emissive: 0xff7722, emissiveIntensity: 4.5, roughness: 0.4 })
        );
        sunMesh.position.set(SUN_X, SUN_Y, SUN_Z);
        scene.add(sunMesh);

        function makeGlowTexture(inner, mid, outer) {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            g.addColorStop(0.0, inner); g.addColorStop(0.35, mid); g.addColorStop(1.0, outer);
            ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(c);
        }

        const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
            map: makeGlowTexture('rgba(255,255,255,1)', 'rgba(255,190,110,0.65)', 'rgba(255,110,40,0)'),
            color: 0xffcc88, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.9
        }));
        sunGlow.scale.set(300, 300, 1); sunGlow.position.set(SUN_X, SUN_Y, SUN_Z); scene.add(sunGlow);
        scene.add(new THREE.AmbientLight(0x404060, 0.35));

        function createStarLayer(count, minR, maxR, size, color) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const r = minR + Math.random() * (maxR - minR);
                const t = Math.random() * Math.PI * 2;
                const p = Math.acos(Math.random() * 2 - 1);
                pos[i * 3] = r * Math.sin(p) * Math.cos(t);
                pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
                pos[i * 3 + 2] = r * Math.cos(p);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({
                size, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
            }));
        }
        scene.add(createStarLayer(9000, 800, 2500, 2.5, 0xffffff));
        scene.add(createStarLayer(4500, 1500, 3500, 1.5, 0xaaccff));

        function loadTexture(url, fallbackColor) {
            return new Promise((resolve) => {
                const loader = new THREE.TextureLoader();
                loader.setCrossOrigin('anonymous');
                loader.load(url, (tex) => { tex.colorSpace = THREE.SRGBColorSpace; resolve(tex); },
                    undefined, () => {
                        const c = document.createElement('canvas'); c.width = c.height = 512;
                        const ctx = c.getContext('2d'); ctx.fillStyle = fallbackColor; ctx.fillRect(0, 0, 512, 512);
                        resolve(new THREE.CanvasTexture(c));
                    });
            });
        }

        const EARTH_ORBIT_RADIUS = 220;
        const earthOrbitPivot = new THREE.Group();
        earthOrbitPivot.position.set(SUN_X, SUN_Y, SUN_Z);
        scene.add(earthOrbitPivot);

        const earthGroup = new THREE.Group();
        earthGroup.position.set(EARTH_ORBIT_RADIUS, 0, 0);
        earthOrbitPivot.add(earthGroup);

        const earthOrbitPts = [];
        for (let i = 0; i <= 128; i++) {
            const a = (i / 128) * Math.PI * 2;
            earthOrbitPts.push(new THREE.Vector3(Math.cos(a) * EARTH_ORBIT_RADIUS, 0, Math.sin(a) * EARTH_ORBIT_RADIUS));
        }
        scene.add(new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(earthOrbitPts),
            new THREE.LineBasicMaterial({ color: 0x4466aa, opacity: 0.15, transparent: true })
        ));

        let earthMeshRef = null;
        let cloudMesh = null;

        Promise.all([
            loadTexture('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', '#2a4a7a'),
            loadTexture('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg', '#000000'),
            loadTexture('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg', '#8080ff'),
            loadTexture('https://threejs.org/examples/textures/planets/earth_clouds_1024.png', '#ffffff')
        ]).then(([earthMap, earthSpecular, earthNormal, cloudMap]) => {
            const earthMat = new THREE.MeshPhongMaterial({
                map: earthMap, specularMap: earthSpecular, normalMap: earthNormal,
                normalScale: new THREE.Vector2(0.85, 0.85), shininess: 12,
                emissive: new THREE.Color(0x000022), emissiveIntensity: 0.12
            });
            const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(8, 128, 128), earthMat);
            earthMesh.castShadow = true; earthMesh.receiveShadow = true;
            earthGroup.add(earthMesh);
            earthMeshRef = earthMesh;

            cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(8.08, 128, 128), new THREE.MeshPhongMaterial({
                map: cloudMap, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            }));
            earthGroup.add(cloudMesh);

            const atmoTex = makeGlowTexture('rgba(200,220,255,0)', 'rgba(150,200,255,0.35)', 'rgba(50,100,200,0)');
            const atmo1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: atmoTex, color: 0x88aaff, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.25 }));
            atmo1.scale.set(22, 22, 1); earthGroup.add(atmo1);
        });

        const moonGroup = new THREE.Group();
        earthGroup.add(moonGroup);
        const orbitRadius = 18;
        let moonMesh = null;

        loadTexture('https://threejs.org/examples/textures/planets/moon_1024.jpg', '#888888').then((moonMap) => {
            moonMesh = new THREE.Mesh(new THREE.SphereGeometry(2.2, 64, 64), new THREE.MeshStandardMaterial({
                map: moonMap, roughness: 0.95, metalness: 0.03, emissive: new THREE.Color(0x111111), emissiveIntensity: 0.12
            }));
            moonMesh.castShadow = true; moonMesh.receiveShadow = true;
            moonMesh.position.set(orbitRadius, 0, 0);
            moonGroup.add(moonMesh);
        });

        const moonOrbitPts = [];
        for (let i = 0; i <= 64; i++) {
            const a = (i / 64) * Math.PI * 2;
            moonOrbitPts.push(new THREE.Vector3(Math.cos(a) * orbitRadius, 0, Math.sin(a) * orbitRadius));
        }
        earthGroup.add(new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(moonOrbitPts),
            new THREE.LineBasicMaterial({ color: 0x8899bb, opacity: 0.2, transparent: true })
        ));

        const CX = 65, CY = 65;
        const ticksGroup = document.getElementById('ticks');
        const numeralsGroup = document.getElementById('numerals');

        for (let i = 0; i < 60; i++) {
            const a = (i * 6 - 90) * Math.PI / 180;
            const isHour = i % 5 === 0;
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            if (isHour) {
                line.setAttribute('x1', (CX + 50 * Math.cos(a)).toFixed(2));
                line.setAttribute('y1', (CY + 50 * Math.sin(a)).toFixed(2));
                line.setAttribute('x2', (CX + 56 * Math.cos(a)).toFixed(2));
                line.setAttribute('y2', (CY + 56 * Math.sin(a)).toFixed(2));
                line.setAttribute('class', 'hour-tick' + (i % 15 === 0 ? ' qtr' : ''));
            } else {
                line.setAttribute('x1', (CX + 53.5 * Math.cos(a)).toFixed(2));
                line.setAttribute('y1', (CY + 53.5 * Math.sin(a)).toFixed(2));
                line.setAttribute('x2', (CX + 56 * Math.cos(a)).toFixed(2));
                line.setAttribute('y2', (CY + 56 * Math.sin(a)).toFixed(2));
                line.setAttribute('class', 'min-tick');
            }
            ticksGroup.appendChild(line);
        }
        for (let n = 1; n <= 12; n++) {
            const a = (n * 30 - 90) * Math.PI / 180;
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', (CX + 41 * Math.cos(a)).toFixed(2));
            text.setAttribute('y', (CY + 41 * Math.sin(a)).toFixed(2));
            text.setAttribute('class', 'numeral');
            text.textContent = n;
            numeralsGroup.appendChild(text);
        }

        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const secondHandGroup = document.getElementById('secondHandGroup');
        const clockEl = document.getElementById('clock');

        // =====================================================================
        // 2. ПРИВЯЗКА К РЕАЛЬНОМУ ВРЕМЕНИ
        //    Положение Земли, Луны и ориентация Земли вычисляются
        //    по реальной дате и времени на момент загрузки страницы.
        //    Дальше всё живёт в переменной totalMinutes, которую
        //    можно крутить в обе стороны.
        // =====================================================================
        const J2000_MS = Date.UTC(2000, 0, 1, 12, 0, 0);

        function sunEclipticLongitude(d) {
            const L = 280.460 + 0.9856474 * d;
            const g = (357.528 + 0.9856003 * d) * DEG;
            return L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g);
        }
        function moonEclipticLongitude(d) {
            const Lm = 218.316 + 13.176396 * d;
            const Mm = (134.963 + 13.064993 * d) * DEG;
            const Ls = 280.460 + 0.9856474 * d;
            const D  = (Lm - Ls) * DEG;
            return Lm
                + 6.289 * Math.sin(Mm)
                + 1.274 * Math.sin(2 * D - Mm)
                + 0.658 * Math.sin(2 * D);
        }

        const startDate = new Date();
        const localMinutes = startDate.getHours() * 60 + startDate.getMinutes()
                           + startDate.getSeconds() / 60 + startDate.getMilliseconds() / 60000;
        const minutesSinceJ2000 = (startDate.getTime() - J2000_MS) / 60000;

        let totalMinutes = localMinutes + 1440 * Math.round((minutesSinceJ2000 - localMinutes) / 1440);

        const d0 = totalMinutes / 1440;
        const lambdaSun0   = sunEclipticLongitude(d0);
        const lambdaMoon0  = moonEclipticLongitude(d0);
        const lambdaEarth0 = lambdaSun0 - 180;

        const ORBIT_PHASE = -lambdaEarth0 * DEG
                          + (totalMinutes / EARTH_YEAR_MINUTES) * Math.PI * 2;
        const MOON_PHASE  = lambdaMoon0 * DEG
                          - (totalMinutes / SIDEREAL_MONTH_MINUTES) * Math.PI * 2;

        const utcHours = startDate.getUTCHours() + startDate.getUTCMinutes() / 60 + startDate.getUTCSeconds() / 3600;
        const subsolarLon = 180 - 15 * utcHours;
        const earthRot0 = (subsolarLon - lambdaSun0) * DEG;
        const t0h = ((totalMinutes / 60) % 24 + 24) % 24;
        const EARTH_ROT_PHASE = earthRot0 + (t0h / EARTH_DAY_HOURS) * Math.PI * 2;

        let hour = 3, minute = 0;

        const MONTHS_RU = ['января','февраля','марта','апреля','мая','июня',
                           'июля','августа','сентября','октября','ноября','декабря'];
        const dpDateEl = document.getElementById('dpDate');
        const dpYearEl = document.getElementById('dpYear');
        let lastDateKey = null;

        function updateDatePlate() {
            const key = Math.round(totalMinutes);
            if (key === lastDateKey) return;
            lastDateKey = key;
            const dt = new Date(J2000_MS + key * 60000);
            dpDateEl.textContent = dt.getDate() + ' ' + MONTHS_RU[dt.getMonth()];
            dpYearEl.textContent = String(dt.getFullYear());
        }

        function render() {
            const hourDeg = (hour % 12) * 30 + minute * 0.5;
            const minuteDeg = minute * 6;
            const totalSeconds = totalMinutes * 60;
            const secondDeg = (totalSeconds * 6) % 360;

            hourHand.setAttribute('transform', `rotate(${hourDeg} ${CX} ${CY})`);
            minuteHand.setAttribute('transform', `rotate(${minuteDeg} ${CX} ${CY})`);
            secondHandGroup.setAttribute('transform', `rotate(${secondDeg} ${CX} ${CY})`);

            const tH = ((totalMinutes / 60) % 24 + 24) % 24;
            const earthRot = EARTH_ROT_PHASE - (tH / EARTH_DAY_HOURS) * Math.PI * 2;
            const orbitRot = ORBIT_PHASE - (totalMinutes / EARTH_YEAR_MINUTES) * Math.PI * 2;

            earthGroup.rotation.y = earthRot;
            if (cloudMesh) cloudMesh.rotation.y = -(tH / EARTH_DAY_HOURS) * Math.PI * 2 * 0.15;
            earthOrbitPivot.rotation.y = orbitRot;

            const moonWorldAngle = MOON_PHASE + (totalMinutes / SIDEREAL_MONTH_MINUTES) * Math.PI * 2;
            const moonLocalAngle = moonWorldAngle + earthRot + orbitRot;
            if (moonMesh) {
                moonMesh.position.set(
                    Math.cos(moonLocalAngle) * orbitRadius, 0,
                    Math.sin(moonLocalAngle) * orbitRadius
                );
                moonMesh.rotation.y = -moonLocalAngle + Math.PI;
            }

            updateDatePlate();
        }

        function applyTotal() {
            const rounded = Math.round(totalMinutes);
            minute = ((rounded % 60) + 60) % 60;
            let h = Math.floor(rounded / 60) % 12;
            h = ((h % 12) + 12) % 12;
            hour = h === 0 ? 12 : h;
        }

        const MOVE_THRESHOLD = 4;
        let gesture = null, dragging = false, dragMode = null, lastAngle = 0, autoAdvance = true;

        function getPoint(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function angleFromPoint(p) {
            const rect = clockEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            let a = Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI + 90;
            return (a % 360 + 360) % 360;
        }

        function angleDiff(a, b) {
            const d = Math.abs(a - b) % 360;
            return d > 180 ? 360 - d : d;
        }

        function isPointInsideClock(p) {
            const rect = clockEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            return Math.hypot(p.x - cx, p.y - cy) <= (rect.width / 2) * 0.95;
        }

        function startGesture(point, source) {
            if (gesture) return;
            autoAdvance = false;
            gesture = { startX: point.x, startY: point.y, mode: null, source };
        }

        function moveGesture(e, point) {
            if (!gesture) return;
            const adx = Math.abs(point.x - gesture.startX), ady = Math.abs(point.y - gesture.startY);

            if (!gesture.mode) {
                if (adx < MOVE_THRESHOLD && ady < MOVE_THRESHOLD) return;
                if (isPointInsideClock(point)) {
                    gesture.mode = 'drag';
                    const ang = angleFromPoint(point);
                    const rect = clockEl.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
                    const relR = Math.hypot(point.x - cx, point.y - cy) / (rect.width / 2);
                    const hourAng = ((hour % 12) * 30 + minute * 0.5 + 360) % 360;
                    const minAng = (minute * 6 + 360) % 360;

                    if (relR < 0.35) dragMode = 'hour';
                    else if (relR > 0.55) dragMode = 'minute';
                    else dragMode = angleDiff(ang, minAng) <= angleDiff(ang, hourAng) ? 'minute' : 'hour';

                    lastAngle = ang; dragging = true;
                } else {
                    gesture.mode = 'other';
                }
            }

            if (gesture.mode === 'drag') {
                if (e.cancelable !== false) { try { e.preventDefault(); } catch (err) {} }
                const ang = angleFromPoint(point);
                let delta = ang - lastAngle;
                if (delta > 180) delta -= 360;
                if (delta < -180) delta += 360;

                if (dragMode === 'minute') {
                    totalMinutes += delta / 6;
                    applyTotal();
                } else {
                    const h = (ang - minute * 0.5) / 30;
                    const newHour12 = ((Math.round(h) % 12) + 12) % 12;
                    const curHour12 = ((Math.floor(totalMinutes / 60) % 12) + 12) % 12;
                    let diff = newHour12 - curHour12;
                    if (diff > 6) diff -= 12;
                    if (diff < -6) diff += 12;
                    if (diff !== 0) {
                        totalMinutes += diff * 60;
                        applyTotal();
                    }
                }
                lastAngle = ang;
                render();
            }
        }

        function endGesture() {
            if (!gesture) return;
            gesture = null; dragging = false; dragMode = null;
            autoAdvance = true;
        }

        clockEl.addEventListener('touchstart', e => { if (e.touches.length === 1) startGesture(getPoint(e), 'touch'); }, { passive: true });
        clockEl.addEventListener('touchmove', e => { if (gesture?.source === 'touch' && e.touches.length === 1) moveGesture(e, getPoint(e)); }, { passive: false });
        clockEl.addEventListener('touchend', () => { if (gesture?.source === 'touch') endGesture(); }, { passive: true });
        clockEl.addEventListener('mousedown', e => { if (e.button === 0) { e.preventDefault(); startGesture(getPoint(e), 'mouse'); } });
        window.addEventListener('mousemove', e => { if (gesture?.source === 'mouse') moveGesture(e, getPoint(e)); });
        window.addEventListener('mouseup', () => { if (gesture?.source === 'mouse') endGesture(); });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let earthDragActive = false;
        let lastEarthDragX = 0;

        function handleEarthStart(e) {
            if (gesture) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (earthMeshRef) {
                const intersects = raycaster.intersectObject(earthMeshRef);
                if (intersects.length > 0) {
                    earthDragActive = true;
                    autoAdvance = false;
                    lastEarthDragX = clientX;
                    controls.enabled = false;
                    if (e.cancelable !== false) e.preventDefault();
                }
            }
        }

        function handleEarthMove(e) {
            if (!earthDragActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const deltaX = clientX - lastEarthDragX;
            lastEarthDragX = clientX;

            totalMinutes += deltaX * 0.6;
            applyTotal();
            render();
            if (e.cancelable !== false) e.preventDefault();
        }

        function handleEarthEnd() {
            if (earthDragActive) {
                earthDragActive = false;
                autoAdvance = true;
                controls.enabled = true;
            }
        }

        renderer.domElement.addEventListener('mousedown', handleEarthStart);
        window.addEventListener('mousemove', handleEarthMove);
        window.addEventListener('mouseup', handleEarthEnd);
        renderer.domElement.addEventListener('touchstart', handleEarthStart, { passive: false });
        window.addEventListener('touchmove', handleEarthMove, { passive: false });
        window.addEventListener('touchend', handleEarthEnd);

        let lastTime = performance.now();
        const earthWorldPos = new THREE.Vector3();
        const sunDir = new THREE.Vector3();

        function tickAuto(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            if (autoAdvance && !dragging && !earthDragActive) {
                totalMinutes += (dt * TIME_SCALE) / 60;
                applyTotal();
                render();
            }

            if (sunGlow) sunGlow.material.opacity = 0.82 + Math.sin(now * 0.002) * 0.08;
        }

        function animate(now) {
            requestAnimationFrame(animate);
            tickAuto(now || performance.now());

            earthGroup.getWorldPosition(earthWorldPos);
            controls.target.lerp(earthWorldPos, 0.05);

            // =================================================================
            // ИСПРАВЛЕНИЕ: свет размещается МЕЖДУ Солнцем и Землёй,
            // чтобы направление лучей совпадало с реальным (от Солнца).
            // =================================================================
            sunDir.copy(earthWorldPos).normalize(); // вектор от Солнца (0,0,0) к Земле
            sunLight.position.copy(earthWorldPos).addScaledVector(sunDir, -150); // ставим свет на линии Солнце–Земля, ближе к Земле
            sunLight.target.position.copy(earthWorldPos); // светим точно на Землю

            controls.update();
            composer.render();
        }

        // ===== Старт: сразу ставим камеру и свет к текущему положению Земли =====
        applyTotal();
        render();

        earthGroup.getWorldPosition(earthWorldPos);
        camera.position.copy(earthWorldPos).add(new THREE.Vector3(60, 40, 80));
        controls.target.copy(earthWorldPos);
        sunDir.copy(earthWorldPos).normalize();
        sunLight.position.copy(earthWorldPos).addScaledVector(sunDir, -150);
        sunLight.target.position.copy(earthWorldPos);
        controls.update();

        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
