<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея Ли Чжэ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background-color: #e5c8c8;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    height: 100vh; width: 100vw;
    touch-action: none;
    overscroll-behavior: none;
  }
  #webgl { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
  #loader {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #e5c8c8; color: #8b2a2a;
    font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase;
    transition: opacity 0.6s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader .dot { animation: pulse 1.2s infinite ease-in-out; }
  #loader .dot:nth-child(2) { animation-delay: 0.15s; }
  #loader .dot:nth-child(3) { animation-delay: 0.30s; }
  @keyframes pulse { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
</style>
</head>
<body>

  <canvas id="webgl"></canvas>
  <div id="loader">Loading <span class="dot">·</span><span class="dot">·</span><span class="dot">·</span></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    window.addEventListener('load', function() {
      if (typeof THREE === 'undefined') return;

      // ============================================================
      // 📁 ИСТОЧНИК: папка galery/ с файлами 1.jpg … 35.jpg
      // ============================================================
      const IMAGE_FOLDER = 'galery/';
      const FROM = 1;
      const TO   = 35;
      const EXT  = 'jpg';

      const SHUFFLE = true;   // true = случайный порядок
      const SEED    = null;   // число = фиксированный порядок, null = каждый раз новый

      const IMAGE_FILES = [];
      for (let i = FROM; i <= TO; i++) IMAGE_FILES.push(`${i}.${EXT}`);

      // ============================================================
      //  SEEDED RNG
      // ============================================================
      function mulberry32(seed) {
        return function() {
          seed |= 0; seed = seed + 0x6D2B79F5 | 0;
          let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      function shuffle(arr, seed) {
        const rnd = seed == null ? Math.random : mulberry32(seed);
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(rnd() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // ============================================================
      //  ЗАГРУЗКА ИЗОБРАЖЕНИЙ
      // ============================================================
      function loadImage(url) {
        return new Promise((resolve) => {
          const img = new Image();
          if (new URL(url, location.href).origin !== location.origin) {
            img.crossOrigin = 'anonymous';
          }
          img.onload  = () => resolve(img);
          img.onerror = () => { console.warn('[gallery] not found:', url); resolve(null); };
          img.src = url;
        });
      }

      async function loadAll(urls, batchSize = 8) {
        const out = [];
        for (let i = 0; i < urls.length; i += batchSize) {
          out.push(...await Promise.all(urls.slice(i, i + batchSize).map(loadImage)));
        }
        return out;
      }

      // ============================================================
      //  THREE.JS СЦЕНА
      // ============================================================
      const canvas = document.getElementById('webgl');
      const clamp  = THREE.MathUtils.clamp;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
      camera.position.z = 60;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      const maxAniso = renderer.capabilities.getMaxAnisotropy();

      // ============================================================
      //  ФОН — MARBLE FLOW
      // ============================================================
      const BG  = '#e5c8c8';
      const INK = '139, 42, 42';

      function drawMarble(ctx, W, H) {
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, W, H);

        const rand = mulberry32(42);
        const layers = [
          { w: 2.5, a: 0.10, n: 18 },
          { w: 1.2, a: 0.06, n: 28 },
          { w: 0.7, a: 0.04, n: 40 }
        ];
        for (const layer of layers) {
          ctx.lineWidth   = layer.w;
          ctx.strokeStyle = `rgba(${INK}, ${layer.a})`;
          for (let i = 0; i < layer.n; i++) {
            ctx.beginPath();
            let x = -100, y = rand() * H;
            ctx.moveTo(x, y);
            while (x < W + 100) {
              const nx = x + 120 + rand() * 100;
              const ny = y + (rand() - 0.5) * 140;
              ctx.bezierCurveTo(
                x + 40 + rand() * 30,  y + (rand() - 0.5) * 90,
                nx - 40 - rand() * 30, ny + (rand() - 0.5) * 90,
                nx, ny
              );
              x = nx; y = ny;
            }
            ctx.stroke();
          }
        }
        ctx.fillStyle = `rgba(${INK}, 0.055)`;
        for (let i = 0; i < 60; i++) {
          ctx.beginPath();
          ctx.arc(rand() * W, rand() * H, 2 + rand() * 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const bgCanvas = document.createElement('canvas');
      bgCanvas.width = 2048; bgCanvas.height = 2048;
      drawMarble(bgCanvas.getContext('2d'), 2048, 2048);

      const bgTexture = new THREE.CanvasTexture(bgCanvas);
      bgTexture.wrapS = bgTexture.wrapT = THREE.RepeatWrapping;
      bgTexture.repeat.set(3, 3);
      bgTexture.anisotropy = maxAniso;

      const bgMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(300, 200),
        new THREE.MeshBasicMaterial({ map: bgTexture })
      );
      bgMesh.position.z = -10;
      scene.add(bgMesh);

      // ============================================================
      //  ГАЛЕРЕЯ
      // ============================================================
      const galleryGroup = new THREE.Group();
      scene.add(galleryGroup);

      const cardH   = 46;
      const cardW   = cardH / 0.65;
      const gap     = 15;
      const pitch   = cardW + gap;
      const cardGeo = new THREE.PlaneGeometry(cardW, cardH);

      const cards = [];
      let startX    = 0;
      let maxScroll = 0;

      function buildGallery(imgs) {
        let i = 0;
        for (const img of imgs) {
          if (!img) continue;

          const mat = new THREE.MeshBasicMaterial({
            color: 0xcfaeae,
            transparent: true,
            opacity: 0.35
          });
          const mesh = new THREE.Mesh(cardGeo, mat);
          mesh.position.set(i * pitch, 0, 0);
          mesh.userData = { fade: 0, ready: false };
          galleryGroup.add(mesh);
          cards.push(mesh);

          const tex = new THREE.Texture(img);
          tex.needsUpdate = true;
          tex.anisotropy  = maxAniso;

          mat.map         = tex;
          mat.color.set(0xffffff);
          mat.opacity     = 0;
          mat.needsUpdate = true;
          mesh.userData.ready = true;

          i++;
        }
        startX    = 0;
        maxScroll = Math.max(0, (cards.length - 1) * pitch);
      }

      // ============================================================
      //  ВВОД
      // ============================================================
      let targetScroll  = 0;
      let currentScroll = 0;

      const EASE      = 0.02;
      const SENS      = 0.35;
      const MAX_DELTA = 90;
      const MAX_SPEED = 240;

      const addScroll = (v) => { targetScroll = clamp(targetScroll + v, 0, maxScroll); };

      function normWheel(e) {
        let dx = e.deltaX, dy = e.deltaY;
        if (e.deltaMode === 1)      { dx *= 16; dy *= 16; }
        else if (e.deltaMode === 2) { dx *= innerWidth; dy *= innerHeight; }
        return clamp(Math.abs(dx) > Math.abs(dy) ? dx : dy, -MAX_DELTA, MAX_DELTA);
      }

      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        addScroll(normWheel(e) * SENS);
      }, { passive: false });

      let touchX = null;
      window.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (touchX === null) return;
        addScroll((touchX - e.touches[0].clientX) * 1.2);
        touchX = e.touches[0].clientX;
      }, { passive: true });
      window.addEventListener('touchend', () => { touchX = null; }, { passive: true });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') addScroll(pitch);
        if (e.key === 'ArrowLeft')  addScroll(-pitch);
      });

      // ============================================================
      //  АНИМАЦИЯ
      // ============================================================
      let lastTime = performance.now();
      let running  = false;

      function animate(time) {
        requestAnimationFrame(animate);
        if (!running) return;

        const dt = Math.min((time - lastTime) / 1000, 1 / 20);
        lastTime = time;
        if (dt <= 0) return;

        const k = 1 - Math.pow(1 - EASE, dt * 60);

        let step = (targetScroll - currentScroll) * k;
        const maxStep = MAX_SPEED * dt;
        if (Math.abs(step) > maxStep) step = Math.sign(step) * maxStep;
        currentScroll += step;

        if (Math.abs(targetScroll - currentScroll) < 0.01) currentScroll = targetScroll;

        for (const c of cards) {
          if (c.userData.ready && c.userData.fade < 1) {
            c.userData.fade = Math.min(1, c.userData.fade + dt * 2.5);
            c.material.opacity = c.userData.fade;
          }
        }

        galleryGroup.position.x = startX - currentScroll;
        bgMesh.position.x       = currentScroll * 0.3;
        galleryGroup.rotation.y = clamp((targetScroll - currentScroll) * 0.0004, -0.04, 0.04);

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // ============================================================
      //  INIT
      // ============================================================
      async function init() {
        const urls    = IMAGE_FILES.map(name => IMAGE_FOLDER + name);
        const ordered = SHUFFLE ? shuffle(urls, SEED) : urls;
        const imgs    = await loadAll(ordered);

        buildGallery(imgs);

        running  = true;
        lastTime = performance.now();
        document.getElementById('loader').classList.add('hidden');
      }

      requestAnimationFrame(animate);
      init();
    });
  </script>
</body>
</html>
