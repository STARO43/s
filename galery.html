<body>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // ============================================================
    //  КОНФИГ
    // ============================================================
    const IMAGE_FOLDER = 'galery/';
    const FROM = 1;
    const TO   = 35;
    const EXT  = 'jpg';
    const SHUFFLE = true;
    const SEED    = null;

    const UA = navigator.userAgent || '';
    const IS_IPHONE = /iPhone|iPod/.test(UA);
    const IS_IPAD   = /iPad/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const IS_TOUCH  = IS_IPHONE || IS_IPAD || 'ontouchstart' in window;

    const CONCURRENCY   = IS_IPHONE ? 1 : (IS_IPAD ? 3 : 6);
    const DPR_CAP       = IS_IPHONE ? 1.0 : (IS_IPAD ? 1.75 : 2);
    const PREVIEW_MAX   = IS_IPHONE ? 480 : (IS_IPAD ? 880 : 1024);
    const USE_COMPOSER  = !IS_IPHONE;

    const ACTIVITY_MIN    = 0.08;
    const ACTIVITY_MAX    = 1.0;
    const ACTIVITY_RISE   = 8.0;
    const ACTIVITY_DECAY  = 1.5;

    // ============================================================
    //  EASE — Lusion cubic-bezier
    // ============================================================
    const ease = {
      cubicBezier(t, p0, p1, p2, p3) {
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        if (p0 === p1 && p2 === p3) return t;
        const A = 1 - 3 * p2 + 3 * p0;
        const B = 3 * p2 - 6 * p0;
        const C = 3 * p0;
        const E = 1 - 3 * p3 + 3 * p1;
        const F = 3 * p3 - 6 * p1;
        const G = 3 * p1;
        const poly = (v, a, b, c) => a * v * v * v + b * v * v + c * v;
        const dpoly = (v, a, b, c) => 3 * a * v * v + 2 * b * v + c;
        let v = t;
        for (let i = 0; i < 8; i++) {
          const x = poly(v, A, B, C);
          const dx = dpoly(v, A, B, C);
          if (dx === 0) break;
          v -= (x - t) / dx;
          v = Math.min(Math.max(v, 0), 1);
        }
        return poly(v, E, F, G);
      },
      lusion(t)      { return ease.cubicBezier(t, .35, 0, 0, 1); },
      expoOut(t)     { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); },
      expoIn(t)      { return t === 0 ? 0 : Math.pow(2, 10 * (t - 1)); },
      expoInOut(t)   { return t === 0 ? 0 : t === 1 ? 1 : (t *= 2) < 1 ? 0.5 * Math.pow(2, 10 * (t - 1)) : 0.5 * (-Math.pow(2, -10 * (t - 1)) + 2); },
      cubicOut(t)    { return 1 - Math.pow(1 - t, 3); },
      cubicInOut(t)  { return (t *= 2) < 1 ? 0.5 * t * t * t : 0.5 * ((t -= 2) * t * t + 2); },
      backOut(t)     { const c = 1.70158; return --t * t * ((c + 1) * t + c) + 1; }
    };

    // ============================================================
    //  УТИЛИТЫ
    // ============================================================
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function shuffle(arr, seed) {
      const rnd = seed == null ? Math.random : mulberry32(seed);
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ============================================================
    //  ЗАГРУЗКА
    // ============================================================
    const ALT_EXTS = ['jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG', 'WEBP'];

    function loadAndResize(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.decoding = 'async';
        try {
          const u = new URL(url, location.href);
          if (u.origin !== location.origin) img.crossOrigin = 'anonymous';
        } catch (_) {}
        img.onload = () => {
          try {
            const w0 = img.naturalWidth || img.width;
            const h0 = img.naturalHeight || img.height;
            const scale = Math.min(1, PREVIEW_MAX / Math.max(w0, h0));
            const w = Math.max(1, Math.round(w0 * scale));
            const h = Math.max(1, Math.round(h0 * scale));
            const cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            const ctx = cv.getContext('2d', { alpha: false });
            if (ctx) {
              ctx.drawImage(img, 0, 0, w, h);
              img.src = '';
              resolve({ source: cv, naturalWidth: w, naturalHeight: h, src: url });
              return;
            }
            resolve({ source: img, naturalWidth: w0, naturalHeight: h0, src: url });
          } catch (e) { resolve(null); }
        };
        img.onerror = () => resolve(null);
        img.src = url;
        setTimeout(() => { if (!img.complete) resolve(null); }, 15000);
      });
    }

    async function loadSmart(url) {
      try {
        const slash = url.lastIndexOf('/');
        const dot   = url.lastIndexOf('.');
        const base  = (dot > slash) ? url.slice(0, dot) : url;
        let r = await loadAndResize(`${base}.${EXT}`);
        if (r) return r;
        for (const ext of ALT_EXTS) {
          if (ext === EXT) continue;
          r = await loadAndResize(`${base}.${ext}`);
          if (r) return r;
        }
        return null;
      } catch (e) { return null; }
    }

    async function loadAll(urls, onProgress) {
      const results = new Array(urls.length).fill(null);
      let index = 0, done = 0;
      async function worker() {
        while (true) {
          const i = index++;
          if (i >= urls.length) return;
          try { results[i] = await loadSmart(urls[i]); }
          catch (e) { results[i] = null; }
          done++;
          onProgress?.(done, urls.length);
        }
      }
      const n = Math.min(CONCURRENCY, urls.length);
      await Promise.all(Array.from({ length: n }, () => worker()));
      return results;
    }

    // ============================================================
    //  THREE.JS
    // ============================================================
    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: true, alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, DPR_CAP));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.10;
    renderer.setClearColor(0x1a0f08, 1);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 70);
    camera.lookAt(0, 0, 0);

    const maxAniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());

    // ============================================================
    //  SKY
    // ============================================================
    const sky = new Sky();
    sky.scale.setScalar(450000);
    scene.add(sky);

    const su = sky.material.uniforms;
    su.turbidity.value       = 8;
    su.rayleigh.value        = 1.4;
    su.mieCoefficient.value  = 0.010;
    su.mieDirectionalG.value = 0.78;

    const sunDir = new THREE.Vector3();
    sunDir.setFromSphericalCoords(
      1,
      THREE.MathUtils.degToRad(90 - 1.2),
      THREE.MathUtils.degToRad(160)
    );
    su.sunPosition.value.copy(sunDir);

    const SUN_COLOR = new THREE.Color(1.0, 0.88, 0.68);

    // ============================================================
    //  ГАЛЕРЕЯ
    // ============================================================
    const galleryGroup = new THREE.Group();
    scene.add(galleryGroup);

    const BASE_CARD_H = 46;
    const MAX_CARD_W  = 160;
    const GAP         = 8;

    const cards = [];
    let totalWidth   = 0;
    let visibleWidth = 0;

    const cardShared = {
      uTime:     { value: 0 },
      uActivity: { value: ACTIVITY_MIN }
    };

    const lensVertex = /* glsl */`
      varying vec2 vUv;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    // ============================================================
    //  Fragment shader
    //  → Полностью восстановленный "лупа-стекло" эффект из оригинала
    //    с видимым движением картинки внутри при скролле (activity)
    //  + солнечные блики
    //  + reveal (плавное проявление, без масштаба при hover)
    // ============================================================
    const lensFragment = /* glsl */`
      precision highp float;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      uniform sampler2D uMap;
      uniform float uOpacity;
      uniform float uActivity;
      uniform float uTime;
      uniform float uHover;
      uniform float uShowRatio;
      uniform vec3  uSunDir;
      uniform vec3  uSunColor;
      uniform vec2  uCardSize;
      uniform float uRadius;

      float hash1(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash1(i), hash1(i + vec2(1,0)), u.x),
                   mix(hash1(i + vec2(0,1)), hash1(i + vec2(1,1)), u.x), u.y);
      }
      float fbm(vec2 p) {
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 2; i++) {
          v += a * noise(p);
          p = p * 2.03 + 11.7;
          a *= 0.5;
        }
        return v;
      }

      // Купол-лупа + жидкостная рябь, амплитуда которой прямо управляется activity.
      // Когда скроллим — activity = 1 — картинка внутри сильно "плывёт".
      // Когда стоит — activity = 0.08 — почти статичная линза.
      vec3 liquidNormal(vec2 uv, float t, float activity) {
        vec2 c = uv - 0.5;
        float r2 = dot(c, c);
        vec3 nDome = normalize(vec3(c.x * 1.44, c.y * 1.44, 1.0 - r2 * 1.6));

        float wobbleAmp = 0.08 + 0.72 * activity;
        float eps = 0.02;
        vec2 q = uv * 6.0 + vec2(t * 0.10);
        float h  = fbm(q);
        float hx = fbm(q + vec2(eps, 0.0));
        float hy = fbm(q + vec2(0.0, eps));
        vec3 nRough = normalize(vec3(
          (hx - h) * wobbleAmp * 3.2,
          (hy - h) * wobbleAmp * 3.2,
          1.0
        ));

        return normalize(mix(nDome, nRough, 0.28));
      }

      float roundedRectSDF(vec2 uv, vec2 size, float r) {
        vec2 p = (uv - 0.5) * size;
        vec2 halfSize = size * 0.5;
        vec2 d = abs(p) - halfSize + vec2(r);
        return length(max(d, 0.0)) - r + min(max(d.x, d.y), 0.0);
      }

      void main() {
        vec2 uv = vUv;
        float t  = uTime;

        vec2 cardSize = uCardSize;
        float sdf = roundedRectSDF(uv, cardSize, uRadius);

        float aa = 1.2 / max(cardSize.x, cardSize.y);
        float cornerMask = 1.0 - smoothstep(-aa, aa, sdf);

        if (cornerMask <= 0.001) discard;

        // --- НОРМАЛЬ ЛУПЫ (двигается от activity) ---
        vec3 Nview = liquidNormal(uv, t, uActivity);
        vec3 Vview = normalize(cameraPosition - vWorldPos);

        // --- ПРЕЛОМЛЕНИЕ ---
        // В оригинале был жёсткий 0.064. Здесь оставляем ту же базу,
        // но добавляем небольшой буст от activity, чтобы движение
        // картинки внутри было заметнее при скролле.
        vec3 refr = refract(Vview, Nview, 1.0 / 1.5);

        float refrBase = 0.064;
        float refrBoost = 1.0 + uActivity * 0.55;    // при скролле → до 1.55×
        float refrStrength = refrBase * refrBoost;

        vec2 uvRefr = uv + refr.xy * refrStrength;

        // Одиночная выборка (без chroma-сплита) — именно она даёт
        // чёткое "движение картинки внутри плашки"
        vec3 col = texture2D(uMap, uvRefr).rgb;

        // --- СОЛНЕЧНЫЙ БЛИК ---
        vec3 N = Nview;
        vec3 V = Vview;
        vec3 L = uSunDir;

        vec3 R = reflect(-V, N);
        float sunDot = max(dot(R, L), 0.0);

        float core = pow(sunDot, 512.0);
        float halo = pow(sunDot, 32.0);
        float spec = core * 0.9 + halo * 0.25;

        float lensMask = smoothstep(0.05, 0.75, Nview.z);
        spec *= lensMask;

        // Блик проявляется вместе с карточкой
        float sunFade = smoothstep(0.25, 0.85, uShowRatio);
        spec *= sunFade;

        col += uSunColor * spec;

        // Второй — объёмный блик от искажённой нормали
        vec3 N2 = normalize(vec3(Nview.x * 0.85, Nview.y * 0.85, Nview.z));
        vec3 R2 = reflect(-V, N2);
        float spec2 = pow(max(dot(R2, L), 0.0), 256.0) * 0.4 * lensMask;
        spec2 *= sunFade;
        col += uSunColor * spec2;

        // --- FRESNEL (краевое свечение стекла) ---
        float fresnel = pow(1.0 - max(dot(N, V), 0.0), 4.0);
        col += uSunColor * fresnel * 0.08;

        // --- ВНУТРЕННЯЯ ТЕНЬ (SDF edge) ---
        float edgeShadow = smoothstep(-0.08, 0.0, sdf) * 0.35;
        col *= (1.0 - edgeShadow);

        gl_FragColor = vec4(col, uOpacity * cornerMask);
      }
    `;

    function computeCardSize(item) {
      const aspect = item.naturalWidth / item.naturalHeight;
      let h = BASE_CARD_H;
      let w = h * aspect;
      if (w > MAX_CARD_W) { w = MAX_CARD_W; h = w / aspect; }
      if (h > 130)        { h = 130;        w = h * aspect; }
      return { w, h };
    }

    const sharedGeometry = new THREE.PlaneGeometry(1, 1);

    function buildGallery(items) {
      const cardData = [];
      let x = 0;
      for (const item of items) {
        if (!item) continue;
        const { w, h } = computeCardSize(item);
        cardData.push({ item, w, h, x });
        x += w + GAP;
      }
      totalWidth = Math.max(0, x - GAP);
      const startX = -totalWidth / 2;

      for (const c of cards) {
        galleryGroup.remove(c);
        if (c.material.uniforms?.uMap?.value) c.material.uniforms.uMap.value.dispose();
        c.material.dispose();
      }
      cards.length = 0;

      for (let i = 0; i < cardData.length; i++) {
        try {
          const d = cardData[i];
          const tex = new THREE.Texture(d.item.source);
          tex.needsUpdate = true;
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = maxAniso;
          tex.minFilter  = THREE.LinearFilter;
          tex.magFilter  = THREE.LinearFilter;
          tex.generateMipmaps = false;

          const radius = Math.min(d.w, d.h) * 0.09;

          const mat = new THREE.ShaderMaterial({
            uniforms: {
              uMap:       { value: tex },
              uOpacity:   { value: 0 },
              uHover:     { value: 0 },
              uShowRatio: { value: 0 },
              uActivity:  cardShared.uActivity,
              uTime:      cardShared.uTime,
              uSunDir:    { value: new THREE.Vector3(0, 0.02, -1) },
              uSunColor:  { value: SUN_COLOR.clone() },
              uCardSize:  { value: new THREE.Vector2(d.w, d.h) },
              uRadius:    { value: radius }
            },
            vertexShader:   lensVertex,
            fragmentShader: lensFragment,
            transparent: true,
            depthWrite: false,
            depthTest:  false
          });

          const mesh = new THREE.Mesh(sharedGeometry, mat);
          // Начальное состояние для reveal (визуально скрыт)
          mesh.scale.set(d.w * 0.72, d.h * 0.72, 1);
          mesh.position.set(startX + d.x + d.w / 2, -25, 0);
          mesh.rotation.z = 0.12 * (i % 2 === 0 ? 1 : -1);
          mesh.renderOrder = i + 1;

          mesh.userData = {
            baseX: startX + d.x + d.w / 2,
            baseW: d.w,
            baseH: d.h,
            revealStart: 0.35 + i * 0.028,
            revealDuration: 1.5,
            revealed: false,
            parity: (i % 2 === 0) ? 1 : -1,
            src: d.item.src
          };
          galleryGroup.add(mesh);
          cards.push(mesh);
        } catch (e) {
          console.warn('[gallery] не удалось создать карточку', e);
        }
      }
    }

    // ============================================================
    //  ПОСТОБРАБОТКА
    // ============================================================
    let composer = null;
    let finalPass = null;

    if (USE_COMPOSER) {
      composer = new EffectComposer(renderer);
      composer.setPixelRatio(Math.min(devicePixelRatio, DPR_CAP));
      composer.setSize(innerWidth, innerHeight);

      composer.addPass(new RenderPass(scene, camera));

      finalPass = new ShaderPass({
        uniforms: {
          tDiffuse:    { value: null },
          uTime:       { value: 0 },
          uRes:        { value: new THREE.Vector2(innerWidth, innerHeight) },
          uAberration: { value: 0.00144 },
          uGrain:      { value: 0.032 },
          uVignette:   { value: 0.40 }
        },
        vertexShader: /* glsl */`
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */`
          precision highp float;
          varying vec2 vUv;
          uniform sampler2D tDiffuse;
          uniform float uTime;
          uniform vec2  uRes;
          uniform float uAberration;
          uniform float uGrain;
          uniform float uVignette;
          float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
          void main() {
            vec2 uv = vUv;
            vec2 d  = uv - 0.5;
            float r2 = dot(d, d);
            vec2 off = d * r2 * uAberration * 5.0;
            vec3 col;
            col.r = texture2D(tDiffuse, uv + off).r;
            col.g = texture2D(tDiffuse, uv).g;
            col.b = texture2D(tDiffuse, uv - off).b;
            float g = hash(uv * uRes + fract(uTime * 10.0) * 10.0) - 0.5;
            col += g * uGrain;
            col *= 1.0 - smoothstep(0.35, 1.0, r2 * 1.5) * uVignette;
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      composer.addPass(finalPass);
    }

    // ============================================================
    //  СКРОЛЛ — оригинальная физика
    // ============================================================
    let targetScroll  = 0;
    let currentScroll = 0;
    let maxScroll     = 0;

    const MODE_WHEEL = 0, MODE_DRAG = 1;
    let inputMode = MODE_WHEEL;

    const EASE_WHEEL = IS_TOUCH ? 0.030 : 0.024;
    const EASE_DRAG  = IS_TOUCH ? 0.080 : 0.060;
    const SENS_WHEEL = 0.20;
    const SENS_DRAG  = IS_TOUCH ? 0.18  : 0.13;
    const MAX_DELTA       = 50;
    const MAX_SPEED_WHEEL = 45;
    const MAX_SPEED_DRAG  = IS_TOUCH ? 70 : 45;
    const INERTIA_MULT    = IS_TOUCH ? 32 : 30;
    const INERTIA_CLAMP   = IS_TOUCH ? 120 : 100;
    const INERTIA_DECAY   = IS_TOUCH ? 0.965 : 0.96;

    let inertiaVel = 0;
    let dragTilt = 0, dragTiltTarget = 0;
    let dragStretch = 0, dragStretchTarget = 0;
    let dragVelocityX = 0;
    let isDragging = false;
    const velocityEMA = { v: 0 };

    let isLightboxOpen = false;
    const lightboxEl = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    function openLightbox(src) {
      if (!src) return;
      lightboxImg.src = src;
      lightboxEl.classList.add('open');
      isLightboxOpen = true;
      inertiaVel = 0;
    }
    function closeLightbox() {
      lightboxEl.classList.remove('open');
      isLightboxOpen = false;
      setTimeout(() => { lightboxImg.src = ''; }, 400);
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxEl.addEventListener('click', (e) => { if (e.target === lightboxEl) closeLightbox(); });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isLightboxOpen) closeLightbox();
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function handleCardDoubleTap(clientX, clientY) {
      if (isLightboxOpen) return;
      mouse.x = (clientX / innerWidth) * 2 - 1;
      mouse.y = -(clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cards, false);
      if (intersects.length > 0) {
        const hitCard = intersects[0].object;
        if (hitCard.userData.src) openLightbox(hitCard.userData.src);
      }
    }
    window.addEventListener('dblclick', (e) => handleCardDoubleTap(e.clientX, e.clientY));

    const addScroll = v => {
      if (isLightboxOpen) return;
      targetScroll = clamp(targetScroll + v, 0, maxScroll);
    };

    function normWheel(e) {
      let dx = e.deltaX, dy = e.deltaY;
      if (e.deltaMode === 1)      { dx *= 16; dy *= 16; }
      else if (e.deltaMode === 2) { dx *= innerWidth; dy *= innerHeight; }
      return clamp(Math.abs(dx) > Math.abs(dy) ? dx : dy, -MAX_DELTA, MAX_DELTA);
    }

    window.addEventListener('wheel', e => {
      if (isLightboxOpen) return;
      e.preventDefault();
      inputMode = MODE_WHEEL;
      inertiaVel = 0;
      addScroll(normWheel(e) * SENS_WHEEL);
    }, { passive: false });

    let pointerId = null;
    let lastPointerX = 0, lastPointerT = 0;
    let lastTapT = 0, lastTapX = 0, lastTapY = 0;

    window.addEventListener('pointerdown', e => {
      if (isLightboxOpen) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (pointerId !== null) return;

      const now = performance.now();
      if (e.pointerType !== 'mouse' && (now - lastTapT < 300) &&
          Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 30) {
        handleCardDoubleTap(e.clientX, e.clientY);
        lastTapT = 0;
        return;
      }
      lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;

      pointerId = e.pointerId;
      isDragging = true;
      inputMode = MODE_DRAG;
      inertiaVel = 0;
      lastPointerX = e.clientX;
      lastPointerT = now;
      dragVelocityX = 0;
      velocityEMA.v = 0;
      dragTiltTarget = 0; dragStretchTarget = 0;

      try { canvas.setPointerCapture?.(e.pointerId); } catch (_) {}
    }, { passive: true });

    window.addEventListener('pointermove', e => {
      if (pointerId === null || e.pointerId !== pointerId || isLightboxOpen) return;
      const now = performance.now();
      const dt  = Math.max(1, now - lastPointerT);
      const dx  = e.clientX - lastPointerX;
      dragVelocityX = dx / dt;
      velocityEMA.v = velocityEMA.v * 0.7 + dragVelocityX * 0.3;
      addScroll(-dx * SENS_DRAG);
      lastPointerX = e.clientX; lastPointerT = now;
      const norm = clamp(dx / 80, -1, 1);
      dragTiltTarget    = norm * 0.04;
      dragStretchTarget = clamp(Math.abs(dx) / 300, 0, 0.04);
    }, { passive: true });

    function endPointer() {
      if (pointerId === null) return;
      const v = velocityEMA.v;
      inertiaVel = clamp(-v * 1000 * INERTIA_MULT / 60, -INERTIA_CLAMP, INERTIA_CLAMP);
      pointerId = null;
      isDragging = false;
      dragTiltTarget = 0; dragStretchTarget = 0;
      dragVelocityX = 0;
      velocityEMA.v = 0;
    }
    window.addEventListener('pointerup', endPointer, { passive: true });
    window.addEventListener('pointercancel', endPointer, { passive: true });

    window.addEventListener('keydown', e => {
      if (isLightboxOpen) return;
      inputMode = MODE_WHEEL; inertiaVel = 0;
      if (e.key === 'ArrowRight') addScroll(60);
      if (e.key === 'ArrowLeft')  addScroll(-60);
    });

    // Hover (только курсор, никакого scale/lift)
    let hoveredCard = null;
    window.addEventListener('pointermove', e => {
      if (isLightboxOpen) return;
      if (pointerId !== null) return;
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(cards, false);
      const newHover = hits.length > 0 ? hits[0].object : null;
      if (newHover !== hoveredCard) {
        hoveredCard = newHover;
        document.body.style.cursor = hoveredCard ? 'pointer' : '';
      }
    }, { passive: true });

    // ============================================================
    //  АНИМАЦИЯ
    // ============================================================
    let lastTime  = performance.now();
    let running   = false;
    let elapsed   = 0;
    const hintEl  = document.getElementById('hint');
    let hintHidden = false;
    let activity = ACTIVITY_MAX;

    function animate(time) {
      requestAnimationFrame(animate);
      if (!running) return;

      const dt = Math.min((time - lastTime) / 1000, 1 / 20);
      lastTime = time;
      if (dt <= 0) return;

      elapsed += dt;
      const t = elapsed;

      // -------- SCROLL (оригинальная формула) --------
      if (!isDragging && Math.abs(inertiaVel) > 0.01) {
        addScroll(inertiaVel * dt);
        inertiaVel *= Math.pow(INERTIA_DECAY, dt * 60);
        if (Math.abs(inertiaVel) < 0.05) inertiaVel = 0;
      }

      const easeV  = inputMode === MODE_DRAG ? EASE_DRAG : EASE_WHEEL;
      const maxSp  = inputMode === MODE_DRAG ? MAX_SPEED_DRAG : MAX_SPEED_WHEEL;

      const k = 1 - Math.pow(1 - easeV, dt * 60);
      let step = (targetScroll - currentScroll) * k;
      const maxStep = maxSp * dt;
      if (Math.abs(step) > maxStep) step = Math.sign(step) * maxStep;

      currentScroll = clamp(currentScroll + step, 0, maxScroll);
      if (Math.abs(targetScroll - currentScroll) < 0.005) currentScroll = targetScroll;

      dragTilt    += (dragTiltTarget    - dragTilt)    * Math.min(1, dt * 10);
      dragStretch += (dragStretchTarget - dragStretch) * Math.min(1, dt * 10);

      // Activity driven by scroll speed / inertia — это топливо для "плывущей" картинки
      const scrollActive =
        isDragging ||
        Math.abs(inertiaVel) > 0.2 ||
        Math.abs(targetScroll - currentScroll) > 0.5;
      const targetActivity = scrollActive ? ACTIVITY_MAX : ACTIVITY_MIN;
      const speed = targetActivity > activity ? ACTIVITY_RISE : ACTIVITY_DECAY;
      activity += (targetActivity - activity) * Math.min(1, dt * speed);

      galleryGroup.position.x = maxScroll / 2 - currentScroll;

      const velocity = targetScroll - currentScroll;
      const velocityTilt = clamp(velocity * 0.00015, -0.015, 0.015);

      if (inputMode === MODE_DRAG) {
        galleryGroup.rotation.y = velocityTilt * 0.5 + dragTilt * 0.5;
        galleryGroup.rotation.x = dragTilt * -0.15;
        galleryGroup.rotation.z = dragTilt * 0.05;
        galleryGroup.scale.set(1 + dragStretch * 0.25, 1 - dragStretch * 0.08, 1);
      } else {
        galleryGroup.rotation.y = velocityTilt;
        galleryGroup.rotation.x += (0 - galleryGroup.rotation.x) * Math.min(1, dt * 6);
        galleryGroup.rotation.z += (0 - galleryGroup.rotation.z) * Math.min(1, dt * 6);
        galleryGroup.scale.x += (1 - galleryGroup.scale.x) * Math.min(1, dt * 6);
        galleryGroup.scale.y += (1 - galleryGroup.scale.y) * Math.min(1, dt * 6);
      }

      // -------- КАРТОЧКИ: reveal + hover glint (без scale/lift) --------
      for (let i = 0, l = cards.length; i < l; i++) {
        const c = cards[i];
        const ud = c.userData;

        // Hover влияет ТОЛЬКО на блик в шейдере, без трансформации
        const targetHover = (c === hoveredCard) ? 1 : 0;
        const hoverCurrent = c.material.uniforms.uHover.value;
        c.material.uniforms.uHover.value = hoverCurrent + (targetHover - hoverCurrent) * Math.min(1, dt * 10);

        if (!ud.revealed) {
          const raw = (t - ud.revealStart) / ud.revealDuration;

          if (raw <= 0) {
            c.material.uniforms.uOpacity.value = 0;
            c.material.uniforms.uShowRatio.value = 0;
            c.position.x = ud.baseX;
            c.position.y = -25;
            c.position.z = 0;
            c.scale.set(ud.baseW * 0.72, ud.baseH * 0.72, 1);
            c.rotation.z = 0.12 * ud.parity;
          } else if (raw >= 1) {
            ud.revealed = true;
            c.material.uniforms.uOpacity.value = 1;
            c.material.uniforms.uShowRatio.value = 1;
            c.position.x = ud.baseX;
            c.position.y = 0;
            c.position.z = 0;
            c.scale.set(ud.baseW, ud.baseH, 1);
            c.rotation.z = 0;
          } else {
            const showRatio = ease.expoOut(raw);
            const opacity   = ease.expoOut(clamp(raw / 0.4, 0, 1));

            const y  = -25 * (1 - showRatio);
            const s  = 0.72 + showRatio * 0.28;
            const rz = (1 - showRatio) * 0.12 * ud.parity;

            c.material.uniforms.uOpacity.value = opacity;
            c.material.uniforms.uShowRatio.value = showRatio;

            c.position.x = ud.baseX;
            c.position.y = y;
            c.position.z = 0;
            c.scale.set(ud.baseW * s, ud.baseH * s, 1);
            c.rotation.z = rz;
          }
        } else {
          // После reveal — статика. Никакого увеличения/поднятия при hover.
          c.position.x = ud.baseX;
          c.position.y = 0;
          c.position.z = 0;
          c.scale.set(ud.baseW, ud.baseH, 1);
          c.rotation.z = 0;
        }
      }

      cardShared.uTime.value = t;
      cardShared.uActivity.value = activity;

      const sunLocal = su.sunPosition.value.clone().normalize()
        .applyQuaternion(galleryGroup.quaternion.clone().invert());
      for (let i = 0, l = cards.length; i < l; i++) {
        cards[i].material.uniforms.uSunDir.value.copy(sunLocal);
      }

      renderer.toneMappingExposure = 1.10 + Math.sin(t * 0.25) * 0.03;

      if (composer) {
        finalPass.uniforms.uTime.value = t;
        composer.render();
      } else {
        renderer.render(scene, camera);
      }

      if (!hintHidden && (currentScroll > 10 || isDragging)) {
        hintHidden = true;
        hintEl.classList.add('fade');
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      if (composer) composer.setSize(innerWidth, innerHeight);
      if (finalPass) finalPass.uniforms.uRes.value.set(innerWidth, innerHeight);
    });

    // ============================================================
    //  INIT
    // ============================================================
    async function init() {
      const statusEl = document.getElementById('loader-status');
      const loaderEl = document.getElementById('loader');
      try {
        const files = [];
        for (let i = FROM; i <= TO; i++) files.push(`${IMAGE_FOLDER}${i}.${EXT}`);

        const ordered = SHUFFLE ? shuffle(files, SEED) : files;

        const results = await loadAll(ordered, (done, total) => {
          if (statusEl) statusEl.textContent = `${done} / ${total}`;
        });

        const items = results.filter(Boolean);

        if (items.length === 0) {
          if (statusEl) statusEl.textContent = 'Не удалось загрузить картинки';
          setTimeout(() => loaderEl.classList.add('hidden'), 1200);
          return;
        }

        buildGallery(items);

        const vFOV = camera.fov * Math.PI / 180;
        const worldHeight = 2 * Math.tan(vFOV / 2) * camera.position.z;
        const worldWidth  = worldHeight * camera.aspect;
        visibleWidth = worldWidth * 0.95;

        maxScroll     = Math.max(0, totalWidth - visibleWidth);
        currentScroll = 0;
        targetScroll  = 0;

        running = true;
        lastTime = performance.now();
        elapsed = 0;

        loaderEl.classList.add('hidden');
      } catch (e) {
        console.error('[init] ошибка:', e);
        if (statusEl) statusEl.textContent = 'Ошибка загрузки';
        setTimeout(() => loaderEl.classList.add('hidden'), 1200);
        running = true;
      }
    }

    requestAnimationFrame(animate);
    init();
  </script>
</body>
</html>
