<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Грамотиньо</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:        #f2ecdf;
            --bg-2:      #e8e0ce;
            --bg-3:      #ddd3bd;
            --fg:        #141414;
            --fg-2:      #3a3a3a;
            --fg-3:      #8a8060;
            --rule-soft: rgba(20, 20, 20, 0.16);

            --accent:    #e30613;
            --accent-fg: #ffffff;

            /* Шрифты в стиле советских газет, документов, пишущей машинки */
            --font-display: 'Oswald', 'Arial Narrow', sans-serif; /* плакатный гротеск */
            --font-doc:     'IBM Plex Mono', 'Courier New', monospace; /* машинопись/документ */
            --font-ui:      'Inter', system-ui, sans-serif;

            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --snap: cubic-bezier(0.4, 0, 0.2, 1);
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-ui);
            font-size: 16px;
            min-height: 100vh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            overscroll-behavior-x: none;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--rule-soft) 1px, transparent 1px),
                linear-gradient(90deg, var(--rule-soft) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: -1px -1px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }
        body > * { position: relative; z-index: 1; }

        /* ================= ШАПКА ================= */

        .header { padding: 16px 20px 0; }

        .header-kicker {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-top: 3px solid var(--fg);
            border-bottom: 3px solid var(--fg);
            font-family: var(--font-doc);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--fg);
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.35;
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: clamp(3.6rem, 18vw, 10.5rem);
            font-weight: 700;
            line-height: 0.85;
            letter-spacing: -0.005em;
            text-transform: uppercase;
            color: var(--fg);
            margin: 20px 0 28px;
        }
        .header h1::after { content: '.'; color: var(--accent); }

        .section-switch {
            display: flex;
            margin: 0 -20px;
            border-top: 3px solid var(--fg);
            border-bottom: 3px solid var(--fg);
        }

        .section-switch-btn {
            flex: 1 1 0;
            background: transparent;
            border: none;
            border-right: 3px solid var(--fg);
            color: var(--fg);
            padding: 20px 10px;
            cursor: pointer;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            transition: all 0.1s linear;
            white-space: nowrap;
        }
        .section-switch-btn:last-child { border-right: none; }
        .section-switch-btn.active { background: var(--fg); color: var(--bg); }
        .section-switch-btn:hover:not(.active) { background: var(--bg-2); }

        .section-subtitles {
            display: flex;
            margin: 0 -20px;
            border-bottom: 2px solid var(--fg);
            background: var(--bg-2);
            min-height: 44px;
        }

        .section-subtitle {
            flex: 1 1 0;
            padding: 12px 14px;
            text-align: center;
            font-family: var(--font-doc);
            font-size: 0.64rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--fg);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 3em;
            line-height: 1.35;
        }
        .section-subtitle.active { opacity: 1; visibility: visible; }

        .digital-clock-inline {
            font-family: var(--font-doc);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            color: var(--accent);
            background: transparent;
            border: none;
            padding: 0;
            text-transform: none;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* ================= КОНТЕНТ ================= */

        .content-wrapper {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        .tab-section { display: none; }
        .tab-section.active { display: block; animation: tabIn 0.35s var(--snap) forwards; }

        @keyframes tabIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ================= ПРОГРЕСС ================= */

        .progress-container {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            background: var(--fg);
            color: var(--bg);
            padding: 16px 24px 20px;
            z-index: 900;
            transform: translateY(101%);
            transition: transform 0.4s var(--ease);
            border-top: 6px solid var(--accent);
            pointer-events: none;
        }
        .progress-container.show { transform: translateY(0); pointer-events: auto; }

        .progress-label {
            font-family: var(--font-doc);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.18);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s linear;
        }

        /* ================= КНОПКИ УПРАВЛЕНИЯ ================= */

        .controls {
            display: flex;
            justify-content: center;
            gap: 0;
            padding: 32px 20px 26px;
            flex-wrap: wrap;
        }

        .controls button {
            background: var(--bg);
            border: 2px solid var(--fg);
            color: var(--fg);
            width: 58px;
            height: 58px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 1.45rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s linear;
            position: relative;
            margin-left: -2px;
        }
        .controls button:first-child { margin-left: 0; }
        .controls button:hover { background: var(--fg); color: var(--bg); z-index: 3; }
        .controls button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); z-index: 2; }
        .controls button.active:hover { background: var(--accent); color: var(--accent-fg); }

        .controls button::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: var(--fg);
            color: var(--bg);
            padding: 6px 10px;
            font-family: var(--font-doc);
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.12s linear, transform 0.12s linear, visibility 0.12s;
            z-index: 10;
        }
        .controls button:hover::after { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

        /* ================= СЕТКА СЛОГОВ ================= */

        .grid-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px 100px;
            width: 100%;
        }

        .syllable-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            border-top: 2px solid var(--fg);
            border-left: 2px solid var(--fg);
        }
        .syllable-grid.hide-learned .syllable-card.learned { display: none; }

        .syllable-card {
            background: var(--bg);
            border-right: 2px solid var(--fg);
            border-bottom: 2px solid var(--fg);
            padding: 22px 8px;
            min-height: 78px;
            text-align: center;
            cursor: pointer;
            font-family: var(--font-display);
            font-size: clamp(1.05rem, 2vw, 1.35rem);
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--fg);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.08s linear, color 0.08s linear;
            position: relative;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .syllable-card:not(.learned):hover { background: var(--fg); color: var(--bg); }
        .syllable-card.playing {
            background: var(--accent);
            color: var(--accent-fg);
            animation: pulsePlay 0.5s var(--snap);
        }
        @keyframes pulsePlay {
            0%, 100% { transform: scale(1); }
            35%      { transform: scale(0.94); }
        }
        .syllable-card.learned { background: var(--bg-2); color: var(--fg-3); }
        .syllable-card.learned .syllable-text {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            text-decoration-color: var(--accent);
            opacity: 0.8;
        }
        .syllable-text { pointer-events: none; }

        .learn-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 15px;
            height: 15px;
            background: transparent;
            border: 2px solid var(--fg);
            cursor: pointer;
            transition: all 0.12s linear;
            opacity: 0.55;
        }
        .syllable-card:not(.learned):hover .learn-dot { border-color: var(--bg); opacity: 1; }
        .learn-dot:hover { opacity: 1; }
        .syllable-card.learned .learn-dot {
            background: var(--accent);
            border-color: var(--accent);
            opacity: 1;
        }

        /* ================= КНОПКА НАВЕРХ ================= */

        .scroll-top-btn {
            position: fixed;
            bottom: 24px; right: 24px;
            width: 52px; height: 52px;
            background: var(--bg);
            border: 2px solid var(--fg);
            color: var(--fg);
            font-size: 1.25rem;
            font-family: var(--font-ui);
            font-weight: 900;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.1s linear;
            z-index: 1001;
        }
        .scroll-top-btn.visible { display: flex; }
        .scroll-top-btn:hover {
            background: var(--fg);
            color: var(--bg);
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0 var(--accent);
        }

        /* ================= ЭКЗАМЕН ================= */

        .exam-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            gap: 32px;
        }
        .exam-overlay.show { display: flex; animation: tabIn 0.25s var(--snap); }

        .exam-header { display: flex; align-items: center; gap: 14px; }

        .exam-question {
            font-family: var(--font-doc);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--fg-2);
        }

        .exam-repeat-btn,
        .exam-next-btn {
            background: var(--bg);
            border: 2px solid var(--fg);
            color: var(--fg);
            width: 48px; height: 48px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s linear;
        }
        .exam-repeat-btn:hover { background: var(--fg); color: var(--bg); }
        .exam-next-btn {
            display: none;
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
            font-size: 1.3rem;
        }
        .exam-next-btn.show { display: flex; }
        .exam-next-btn:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--fg); }

        .exam-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            max-width: 660px;
            width: 100%;
        }

        .exam-option {
            padding: 22px 12px;
            background: var(--bg);
            border: 2px solid var(--fg);
            cursor: pointer;
            text-align: center;
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--fg);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.1s linear;
        }
        .exam-option:hover:not(:disabled) {
            background: var(--fg);
            color: var(--bg);
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0 var(--accent);
        }
        .exam-option.correct { background: #2a6b3f; border-color: #2a6b3f; color: #ffffff; }
        .exam-option.wrong { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

        .exam-result {
            font-size: 2.6rem;
            text-align: center;
            min-height: 2.6rem;
            line-height: 1;
        }

        .exam-exit-btn {
            position: absolute;
            top: 24px; left: 24px;
            background: var(--bg);
            border: 2px solid var(--fg);
            color: var(--fg);
            width: 48px; height: 48px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s linear;
            z-index: 10;
        }
        .exam-exit-btn:hover { background: var(--fg); color: var(--bg); }

        /* ================= ПОЗДРАВЛЕНИЕ ================= */

        .celebration-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.82);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .celebration-overlay.show { display: flex; }

        .celebration-box {
            background: var(--bg);
            border: 4px solid var(--fg);
            padding: 32px;
            text-align: center;
            max-width: 90vw;
            max-height: 90vh;
            box-shadow: 12px 12px 0 var(--accent);
        }
        .celebration-box h2 {
            font-family: var(--font-display);
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .celebration-box img {
            max-width: 300px;
            max-height: 240px;
            border: 3px solid var(--fg);
        }

        .celebration-close {
            margin-top: 22px;
            padding: 14px 36px;
            background: var(--fg);
            color: var(--bg);
            border: 2px solid var(--fg);
            cursor: pointer;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            transition: all 0.1s linear;
        }
        .celebration-close:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

        /* ================= ТОСТЫ ================= */

        .toast-container {
            position: fixed;
            bottom: 100px; left: 50%;
            transform: translateX(-50%);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--fg);
            color: var(--bg);
            padding: 13px 24px;
            font-family: var(--font-doc);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            animation: toastIn 0.18s linear, toastOut 0.18s linear 2.5s forwards;
            pointer-events: auto;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        /* ================= ПОДВАЛ ================= */

        .footer {
            text-align: center;
            padding: 26px 20px;
            color: var(--fg-3);
            font-family: var(--font-doc);
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border-top: 3px solid var(--fg);
        }

        /* ============================================================
           ЛИЧНОСТИ
           ============================================================ */

        .heroes-timeline {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 0 80px;
        }

        .century-header {
            background: var(--fg);
            color: var(--bg);
            padding: 18px 22px;
            margin: 0 0 24px;
            text-align: center;
        }
        .century-header:not(:first-child) { margin-top: 56px; }

        .century-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4.2vw, 2.15rem);
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        .soviet-band {
            background: var(--accent);
            color: #ffffff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            margin: 12px 0 24px;
        }

        .hero-item {
            border: 2px solid var(--fg);
            background: var(--bg);
            cursor: pointer;
            transition: all 0.14s linear;
            display: flex;
            flex-direction: column;
        }
        .hero-item:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0 var(--accent);
        }

        .hero-photo {
            position: relative;
            aspect-ratio: 1 / 1;
            border-bottom: 2px solid var(--fg);
            overflow: hidden;
            background: var(--bg-2);
            flex-shrink: 0;
        }
        .hero-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(1) contrast(1.15);
            transition: filter 0.22s linear;
        }
        .hero-item:hover .hero-photo img { filter: grayscale(0) contrast(1.15); }

        .hero-info {
            padding: 12px 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .hero-name {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--fg);
        }
        .hero-years {
            font-family: var(--font-doc);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--fg-2);
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .hero-age { color: var(--accent); font-weight: 700; }

        /* ============================================================
           МОДАЛКА ГЕРОЯ — БОЛЬШОЙ портрет
           ============================================================ */

        .hero-modal {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            padding: 52px 8px 14px;
            gap: 6px;
            box-sizing: border-box;
            overflow-y: auto;
            overflow-x: hidden;
            animation: tabIn 0.22s var(--snap);
        }

        .hero-modal-close,
        .hero-modal-repeat {
            position: fixed;
            top: 8px;
            background: var(--bg);
            border: 2px solid var(--fg);
            color: var(--fg);
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s linear;
            z-index: 60;
            font-family: var(--font-ui);
            line-height: 1;
            padding: 0;
        }
        .hero-modal-close { right: 8px; }
        .hero-modal-repeat { left: 8px; font-size: 1rem; }
        .hero-modal-close:hover,
        .hero-modal-repeat:hover { background: var(--fg); color: var(--bg); }

        .hero-modal-portrait-wrap {
            flex-shrink: 0;
            width: 100%;
            height: 80vh;
            min-height: 280px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-modal-portrait {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .hero-portrait-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            font-family: var(--font-display);
            font-size: clamp(6rem, 24vw, 16rem);
            font-weight: 700;
            color: var(--fg);
            background: var(--bg-2);
            text-transform: uppercase;
            user-select: none;
            letter-spacing: 0.04em;
        }

        .hero-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg);
            border: 2px solid var(--fg);
            color: var(--fg);
            width: 42px;
            height: 42px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-family: var(--font-ui);
            transition: all 0.1s linear;
            z-index: 20;
            padding: 0;
            line-height: 1;
            opacity: 0.9;
        }
        .hero-nav.prev { left: 6px; }
        .hero-nav.next { right: 6px; }
        .hero-nav:hover { background: var(--fg); color: var(--bg); opacity: 1; }

        .hero-modal-info {
            text-align: center;
            padding: 8px 0 4px;
            flex-shrink: 0;
        }
        .hero-modal-info h3 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 6.5vw, 3.4rem);
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--fg);
            line-height: 1;
        }

        .hero-modal-years {
            font-family: var(--font-doc);
            font-size: clamp(0.95rem, 2.3vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-top: 8px;
            user-select: none;
        }

        /* ============================================================
           ШКАЛА ВРЕМЕНИ — панель-документ
           ============================================================ */

        .hero-modal-timeline {
            flex-shrink: 0;
            width: 100%;
            margin-top: 8px;
        }

        .htl-panel {
            border: 2px solid var(--fg);
            background: var(--bg);
        }

        /* ---------- Шапка панели (как в технической форме) ---------- */

        .htl-head {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 2px solid var(--fg);
            background: var(--bg-2);
        }

        .htl-head-cell {
            padding: 9px 14px 11px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }
        .htl-head-cell:last-child {
            border-left: 2px solid var(--fg);
            text-align: right;
            align-items: flex-end;
        }

        .htl-head-label {
            font-family: var(--font-doc);
            font-size: 0.56rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--fg-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .htl-head-value {
            font-family: var(--font-doc);
            font-size: clamp(0.85rem, 2.2vw, 1.05rem);
            font-weight: 700;
            color: var(--fg);
            letter-spacing: 0.05em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .htl-head-cell:last-child .htl-head-value { color: var(--accent); }

        /* ---------- Тело панели с осью ---------- */

        .htl-body {
            padding: 22px 18px 14px;
            position: relative;
        }

        .htl {
            position: relative;
            width: 100%;
            height: 310px;
        }

        /* Главная ось */
        .htl-axis {
            position: absolute;
            left: 0; right: 0;
            top: 148px;
            height: 1.5px;
            background: var(--fg);
            z-index: 1;
        }

        /* Красная полоса жизни — центрируется на оси, БЕЗ текста */
        .htl-life {
            position: absolute;
            top: 133px;
            height: 31px;
            background: var(--accent);
            border: 1.5px solid var(--fg);
            box-sizing: border-box;
            z-index: 6;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.35) inset;
        }
        /* Маленькие "флажки" на концах полосы */
        .htl-life::before,
        .htl-life::after {
            content: '';
            position: absolute;
            top: -5px;
            bottom: -5px;
            width: 0.5px;
            background: var(--fg);
        }
        .htl-life::before { left: -1px; }
        .htl-life::after  { right: -1px; }

        /* Засечки */
        .htl-dtick {
            position: absolute;
            top: 148px;
            width: 1px;
            height: 4px;
            background: var(--fg);
            transform: translateX(-50%);
            opacity: 0.22;
            z-index: 2;
        }
        .htl-htick {
            position: absolute;
            top: 148px;
            width: 1px;
            height: 9px;
            background: var(--fg);
            transform: translateX(-50%);
            opacity: 0.5;
            z-index: 2;
        }
        .htl-ctick {
            position: absolute;
            top: 148px;
            width: 2px;
            height: 30px;
            background: var(--fg);
            transform: translateX(-50%);
            z-index: 3;
        }

        /* ---------- Войны сверху ---------- */

        .htl-war {
            position: absolute;
            top: 0;
            height: 148px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 4;
            padding: 0 2px;
        }

        .htl-war-label {
            flex-shrink: 0;
            text-align: center;
            margin-bottom: 5px;
            max-width: 100px;
        }

        .htl-war-year {
            font-family: var(--font-doc);
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.02em;
            line-height: 1;
            margin-bottom: 3px;
        }

        .htl-war-name {
            font-family: var(--font-display);
            font-size: 0.54rem;
            font-weight: 600;
            color: var(--fg);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1.14;
        }

        .htl-war-tick {
            flex: 1 1 auto;
            width: 2px;
            background: var(--fg);
            opacity: 0.7;
            min-height: 4px;
        }

        /* ---------- Прочие события снизу ---------- */

        .htl-other {
            position: absolute;
            top: 148px;
            height: 100px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 4;
            padding: 0 2px;
        }

        .htl-other-tick {
            flex: 1 1 auto;
            width: 2px;
            background: var(--fg);
            opacity: 0.7;
            min-height: 4px;
            margin-bottom: 5px;
        }

        .htl-other-label {
            flex-shrink: 0;
            text-align: center;
            max-width: 100px;
        }

        .htl-other-year {
            font-family: var(--font-doc);
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.02em;
            line-height: 1;
            margin-bottom: 3px;
        }

        .htl-other-name {
            font-family: var(--font-display);
            font-size: 0.54rem;
            font-weight: 600;
            color: var(--fg);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1.14;
        }

        /* ---------- Вековые числа ---------- */

        .htl-cnum {
            position: absolute;
            top: 262px;
            transform: translateX(-50%);
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--fg);
            background: var(--bg);
            padding: 0 6px;
            z-index: 7;
            line-height: 1;
        }

        /* ============================================================
           ЧАСЫ
           ============================================================ */

        .clock-wrapper {
            padding: 40px 0 90px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .clock-frame {
            border: 3px solid var(--fg);
            padding: 18px;
            background: var(--bg);
            box-shadow: 10px 10px 0 var(--accent);
            width: min(520px, 94vw);
        }

        /* ============ Title block ============ */

        .frame-head {
            border: 2px solid var(--fg);
            margin-bottom: 18px;
            background: var(--bg);
        }

        .frame-head-top,
        .frame-head-bot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            font-family: var(--font-doc);
            font-size: 0.56rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--fg);
            background: var(--bg-2);
        }
        .frame-head-top { border-bottom: 1px solid var(--fg); }
        .frame-head-bot { border-top: 1px solid var(--fg); }

        .frame-head-tag {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .frame-head-top > .frame-head-tag:first-child { flex: 0 0 auto; }
        .frame-head-top > .frame-head-tag:nth-child(2) { flex: 1 1 auto; text-align: center; }
        .frame-head-top > .frame-head-tag:last-child { flex: 0 0 auto; }
        .frame-head-bot  > .frame-head-tag:first-child { flex: 1 1 auto; }
        .frame-head-bot  > .frame-head-tag:last-child { flex: 0 0 auto; }

        .frame-head-title {
            padding: 11px 14px;
            text-align: center;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: clamp(0.72rem, 2.5vw, 1.05rem);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            color: var(--fg);
            text-overflow: ellipsis;
        }

        .clock-stack {
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .clock-view {
            width: 100%;
            aspect-ratio: 440 / 520;
            position: relative;
            cursor: pointer;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            transform: translateZ(0);
        }

        .clock-view.view-watch { cursor: grab; }
        .clock-view.view-watch.dragging { cursor: grabbing; }
        .clock-view.view-scheme { cursor: pointer; }

        .watch-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .watch-container svg { width: 100%; height: 100%; display: block; overflow: visible; }

        #clk-hourHand, #clk-minuteHand { will-change: transform; }

        .scheme-view {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--fg);
        }
        .scheme-view.active { display: flex; }
        .scheme-view svg {
            width: 100%; height: auto; max-height: 100%;
            display: block; overflow: visible;
        }
        .clock-view .watch-container.hidden { display: none; }

        /* ============================================================
           АДАПТИВ
           ============================================================ */

        @media (max-width: 1024px) {
            .syllable-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 640px) {
            .header { padding: 12px 14px 0; }
            .header-kicker {
                margin-bottom: 22px;
                font-size: 0.6rem;
                letter-spacing: 0.16em;
                padding: 12px 14px;
            }
            .header h1 { margin: 16px 0 22px; letter-spacing: 0.005em; }

            .section-switch { margin: 0 -14px; }
            .section-switch-btn {
                font-size: 0.68rem;
                padding: 16px 4px;
                letter-spacing: 0.1em;
                white-space: normal;
            }

            .section-subtitles { margin: 0 -14px; min-height: 40px; }
            .section-subtitle {
                font-size: 0.56rem;
                padding: 10px 6px;
                letter-spacing: 0.12em;
                min-height: 3.2em;
            }
            .digital-clock-inline { font-size: 0.9rem; letter-spacing: 0.1em; }

            .content-wrapper { padding: 0 14px; }
            .grid-container { padding: 0 14px 90px; }

            .syllable-grid { grid-template-columns: repeat(2, 1fr); }
            .syllable-card {
                font-size: 1.15rem;
                min-height: 62px;
                padding: 16px 4px;
            }
            .learn-dot { width: 12px; height: 12px; top: 6px; right: 6px; border-width: 1.6px; }

            .controls { padding: 22px 14px 16px; }
            .controls button { width: 48px; height: 48px; font-size: 1.2rem; }
            .controls button::after { display: none; }

            .exam-exit-btn { top: auto; bottom: 20px; left: 20px; width: 42px; height: 42px; font-size: 1rem; }
            .exam-options { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .exam-option { padding: 18px 8px; font-size: 1.1rem; }

            .heroes-timeline { padding: 24px 0 70px; }
            .century-header { padding: 14px 16px; margin-bottom: 18px; }
            .century-header:not(:first-child) { margin-top: 40px; }

            .heroes-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .hero-info { padding: 10px 10px 12px; }
            .hero-name { font-size: 1rem; }
            .hero-years { font-size: 0.62rem; }

            .soviet-band { font-size: 0.95rem; padding: 10px 14px; letter-spacing: 0.18em; gap: 12px; }

            .hero-modal { padding: 50px 6px 12px; gap: 4px; }
            .hero-modal-close,
            .hero-modal-repeat { width: 36px; height: 36px; top: 6px; }
            .hero-modal-close { right: 6px; font-size: 1.25rem; }
            .hero-modal-repeat { left: 6px; font-size: 0.9rem; }
            .hero-nav { width: 38px; height: 38px; font-size: 1.2rem; }
            .hero-nav.prev { left: 4px; }
            .hero-nav.next { right: 4px; }

            .hero-modal-portrait-wrap {
                height: 72vh;
                min-height: 260px;
            }

            .hero-modal-info { padding: 6px 0 2px; }
            .hero-modal-info h3 { font-size: 1.75rem; }
            .hero-modal-years { font-size: 0.88rem; margin-top: 6px; }

            /* Шкала на мобиле */
            .htl-body { padding: 18px 12px 12px; }
            .htl { height: 268px; }
            .htl-axis     { top: 122px; }
            .htl-life     { top: 109px; height: 27px; }
            .htl-dtick    { top: 122px; height: 4px; }
            .htl-htick    { top: 122px; height: 8px; }
            .htl-ctick    { top: 122px; height: 13px; }
            .htl-cnum     { top: 224px; font-size: 0.95rem; padding: 0 4px; }

            .htl-war      { height: 122px; }
            .htl-war-label { max-width: 74px; }
            .htl-war-year { font-size: 0.62rem; }
            .htl-war-name { font-size: 0.48rem; letter-spacing: 0.01em; }

            .htl-other    { top: 122px; height: 88px; }
            .htl-other-label { max-width: 74px; }
            .htl-other-year { font-size: 0.62rem; }
            .htl-other-name { font-size: 0.48rem; letter-spacing: 0.01em; }

            .htl-head-cell { padding: 8px 10px 10px; }
            .htl-head-label { font-size: 0.5rem; letter-spacing: 0.15em; }
            .htl-head-value { font-size: 0.82rem; letter-spacing: 0.03em; }

            /* Часы */
            .clock-wrapper { padding: 26px 0 70px; }
            .clock-frame { padding: 12px; box-shadow: 7px 7px 0 var(--accent); }
            .frame-head { margin-bottom: 14px; }
            .frame-head-title {
                padding: 9px 10px;
                font-size: clamp(0.6rem, 2.9vw, 0.82rem);
                letter-spacing: 0.06em;
            }
            .frame-head-top, .frame-head-bot {
                font-size: 0.5rem;
                padding: 5px 8px;
                letter-spacing: 0.1em;
            }

            .progress-container { padding: 14px 18px 16px; }
        }

        @media (max-width: 420px) {
            .frame-head-top > .frame-head-tag:nth-child(2) { display: none; }
            .frame-head-top { justify-content: space-between; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-kicker">УЧИТЬСЯ, УЧИТЬСЯ И ЕЩЁ РАЗ УЧИТЬСЯ</div>

        <h1>Грамотиньо</h1>

        <div class="section-switch">
            <button class="section-switch-btn active" data-section="syllables">Учи слоги</button>
            <button class="section-switch-btn" data-section="clock">Знай время</button>
            <button class="section-switch-btn" data-section="heroes">Чти великих</button>
        </div>

        <div class="section-subtitles">
            <div class="section-subtitle active" data-section="syllables">Жми · Слушай · Запоминай</div>
            <div class="section-subtitle" data-section="clock">
                <span class="digital-clock-inline" id="clockDigital24">03:00</span>
            </div>
            <div class="section-subtitle" data-section="heroes">Великие личности Отечества</div>
        </div>
    </header>

    <div class="content-wrapper">
        <section id="syllablesSection" class="tab-section active">
            <div class="controls">
                <button id="normalBtn" class="active" data-tooltip="Все">▦</button>
                <button id="randomBtn" data-tooltip="Случайно">⇄</button>
                <button id="hideLearnedBtn" data-tooltip="Скрыть/показать">◐</button>
                <button id="clearLearnedBtn" data-tooltip="Очистить">✕</button>
                <button id="examBtn" data-tooltip="Викторина">✎</button>
            </div>

            <div class="grid-container">
                <div class="syllable-grid" id="syllableGrid"></div>
            </div>
        </section>

        <section id="clockSection" class="tab-section">
            <div class="clock-wrapper">
                <div class="clock-frame">
                    <div class="frame-head">
                        <div class="frame-head-top">
                            <span class="frame-head-tag"> </span>
                            <span class="frame-head-tag">СХЕМА</span>
                            <span class="frame-head-tag"> </span>
                        </div>
                        <div class="frame-head-title">АУДИОВИЗУАЛЬНОГО ИЗУЧЕНИЯ ЧАСОВ</div>
                        <div class="frame-head-bot">
                                                   </div>
                    </div>
                    <div class="clock-stack">
                        <div class="clock-view view-watch" id="clockView">
                            <div class="watch-container" id="watchView">
                                <svg viewBox="-20 0 440 520" xmlns="http://www.w3.org/2000/svg">
                                    <defs>
                                        <radialGradient id="clk-caseGrad" cx="0.35" cy="0.28" r="0.9">
                                            <stop offset="0"    stop-color="#f5f5f5"/>
                                            <stop offset="0.15" stop-color="#d8d8d8"/>
                                            <stop offset="0.4"  stop-color="#a8a8a8"/>
                                            <stop offset="0.7"  stop-color="#787878"/>
                                            <stop offset="0.9"  stop-color="#585858"/>
                                            <stop offset="1"    stop-color="#3a3a3a"/>
                                        </radialGradient>
                                        <linearGradient id="clk-caseShine" x1="0.15" y1="0" x2="0.85" y2="1">
                                            <stop offset="0"    stop-color="#ffffff" stop-opacity="0.5"/>
                                            <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.1"/>
                                            <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0"/>
                                            <stop offset="0.75" stop-color="#000000" stop-opacity="0.05"/>
                                            <stop offset="1"    stop-color="#000000" stop-opacity="0.3"/>
                                        </linearGradient>
                                        <linearGradient id="clk-bezelGrad" x1="0" y1="0" x2="0.25" y2="1">
                                            <stop offset="0"    stop-color="#ffffff"/>
                                            <stop offset="0.1"  stop-color="#e8e8e8"/>
                                            <stop offset="0.25" stop-color="#b0b0b0"/>
                                            <stop offset="0.4"  stop-color="#e0e0e0"/>
                                            <stop offset="0.55" stop-color="#888888"/>
                                            <stop offset="0.75" stop-color="#c0c0c0"/>
                                            <stop offset="0.9"  stop-color="#606060"/>
                                            <stop offset="1"    stop-color="#404040"/>
                                        </linearGradient>
                                        <linearGradient id="clk-bezelHighlight" x1="0.2" y1="0" x2="0.8" y2="1">
                                            <stop offset="0"   stop-color="#ffffff" stop-opacity="0.65"/>
                                            <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
                                            <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
                                            <stop offset="1"   stop-color="#ffffff" stop-opacity="0.25"/>
                                        </linearGradient>
                                        <radialGradient id="clk-dialGrad" cx="0.45" cy="0.38" r="0.78">
                                            <stop offset="0"    stop-color="#fefdf8"/>
                                            <stop offset="0.55" stop-color="#f8f2e2"/>
                                            <stop offset="1"    stop-color="#e9dec3"/>
                                        </radialGradient>
                                        <radialGradient id="clk-dialVignette" cx="0.5" cy="0.5" r="0.5">
                                            <stop offset="0.6"  stop-color="#000000" stop-opacity="0"/>
                                            <stop offset="0.88" stop-color="#000000" stop-opacity="0.06"/>
                                            <stop offset="1"    stop-color="#000000" stop-opacity="0.2"/>
                                        </radialGradient>
                                        <linearGradient id="clk-crystalGrad" x1="0" y1="0" x2="0.6" y2="0.6">
                                            <stop offset="0"    stop-color="#ffffff" stop-opacity="0.4"/>
                                            <stop offset="0.2"  stop-color="#ffffff" stop-opacity="0"/>
                                            <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0"/>
                                            <stop offset="0.85" stop-color="#ffffff" stop-opacity="0"/>
                                            <stop offset="1"    stop-color="#ffffff" stop-opacity="0.15"/>
                                        </linearGradient>
                                        <linearGradient id="clk-handGrad" x1="0" y1="0" x2="1" y2="0">
                                            <stop offset="0"   stop-color="#4a4a4a"/>
                                            <stop offset="0.5" stop-color="#0d0d0d"/>
                                            <stop offset="1"   stop-color="#4a4a4a"/>
                                        </linearGradient>
                                        <linearGradient id="clk-strapGrad" x1="0" y1="0" x2="1" y2="0">
                                            <stop offset="0"    stop-color="#2a1508"/>
                                            <stop offset="0.18" stop-color="#4a2410"/>
                                            <stop offset="0.5"  stop-color="#6b3a18"/>
                                            <stop offset="0.82" stop-color="#4a2410"/>
                                            <stop offset="1"    stop-color="#2a1508"/>
                                        </linearGradient>
                                        <linearGradient id="clk-strapShine" x1="0" y1="0" x2="1" y2="0">
                                            <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
                                            <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.16"/>
                                            <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.16"/>
                                            <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
                                        </linearGradient>
                                        <filter id="clk-strapShadow" x="-30%" y="-30%" width="160%" height="160%">
                                            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
                                            <feOffset dx="0" dy="3"/>
                                            <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>

            ];

            const syllables = rawItems.sort((a, b) => {
                const lenDiff = a.length - b.length;
                if (lenDiff !== 0) return lenDiff;
                return a.localeCompare(b, 'ru', { sensitivity: 'base' });
            });

            const grid = document.getElementById('syllableGrid');
            const toastContainer = document.getElementById('toastContainer');
            const normalBtn = document.getElementById('normalBtn');
            const randomBtn = document.getElementById('randomBtn');
            const hideLearnedBtn = document.getElementById('hideLearnedBtn');
            const clearLearnedBtn = document.getElementById('clearLearnedBtn');
            const examBtn = document.getElementById('examBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressLabel = document.getElementById('progressLabel');
            const progressFill = document.getElementById('progressFill');
            const scrollTopBtn = document.getElementById('scrollTopBtn');
            const examOverlay = document.getElementById('examOverlay');
            const examQuestion = document.getElementById('examQuestion');
            const examOptions = document.getElementById('examOptions');
            const examResult = document.getElementById('examResult');
            const examRepeatBtn = document.getElementById('examRepeatBtn');
            const examNextBtn = document.getElementById('examNextBtn');
            const examExitBtn = document.getElementById('examExitBtn');
            const celebrationOverlay = document.getElementById('celebrationOverlay');
            const celebrationGif = document.getElementById('celebrationGif');
            const celebrationClose = document.getElementById('celebrationClose');
            const sectionBtns = document.querySelectorAll('.section-switch-btn');
            const sectionSubtitleEls = document.querySelectorAll('.section-subtitle');
            const syllablesSection = document.getElementById('syllablesSection');
            const clockSection = document.getElementById('clockSection');
            const heroesSection = document.getElementById('heroesSection');
            const heroesTimeline = document.getElementById('heroesTimeline');

            let currentMode = 'all';
            let randomItems = [];
            let currentAudio = null;
            let examQuestions = [];
            let examIndex = 0;
            let examScore = 0;
            let currentExamCorrect = '';
            let currentSection = 'syllables';
            let progressTimer = null;

            function loadLearnedSet() {
                try { return new Set(JSON.parse(localStorage.getItem('learned_syllables') || '[]')); }
                catch { return new Set(); }
            }
            function saveLearnedSet(set) {
                localStorage.setItem('learned_syllables', JSON.stringify(Array.from(set)));
            }
            let learnedSet = loadLearnedSet();

            function switchSection(section) {
                if (section === currentSection) return;
                currentSection = section;
                syllablesSection.classList.toggle('active', section === 'syllables');
                clockSection.classList.toggle('active', section === 'clock');
                heroesSection.classList.toggle('active', section === 'heroes');
                sectionBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.section === section);
                });
                sectionSubtitleEls.forEach(el => {
                    el.classList.toggle('active', el.dataset.section === section);
                });
                if (section !== 'clock' && window.clockSpeakCancel) {
                    window.clockSpeakCancel();
                }
                if (section !== 'syllables') {
                    progressContainer.classList.remove('show');
                }
            }

            sectionBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    switchSection(btn.dataset.section);
                });
            });

            window.addEventListener('scroll', () => {
                scrollTopBtn.classList.toggle('visible', window.scrollY > 300);
            });
            scrollTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            function refreshProgressData() {
                const total = syllables.length;
                const marked = [...syllables].filter(s => learnedSet.has(s)).length;
                const percent = total ? Math.round((marked / total) * 100) : 0;
                progressLabel.textContent = `Отмечено: ${marked} из ${total}`;
                progressFill.style.width = percent + '%';
            }

            function flashProgress() {
                refreshProgressData();
                progressContainer.classList.add('show');
                clearTimeout(progressTimer);
                progressTimer = setTimeout(() => {
                    progressContainer.classList.remove('show');
                }, 2400);
            }

            function renderGrid() {
                grid.innerHTML = '';
                const items = currentMode === 'random' ? randomItems : syllables;
                items.forEach(syllable => {
                    const card = document.createElement('div');
                    card.className = 'syllable-card';
                    card.dataset.syllable = syllable;
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    const textSpan = document.createElement('span');
                    textSpan.className = 'syllable-text';
                    textSpan.textContent = syllable;
                    textSpan.style.pointerEvents = 'none';
                    card.appendChild(textSpan);
                    const dot = document.createElement('div');
                    dot.className = 'learn-dot';
                    dot.title = 'Отметить';
                    dot.setAttribute('role', 'checkbox');
                    dot.setAttribute('aria-checked', learnedSet.has(syllable));
                    card.appendChild(dot);
                    if (learnedSet.has(syllable)) card.classList.add('learned');
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleLearned(syllable, card);
                    });
                    card.addEventListener('click', () => handleSyllableClick(syllable, card));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleSyllableClick(syllable, card);
                        }
                    });
                    grid.appendChild(card);
                });
                refreshProgressData();
            }

            function toggleLearned(syllable, card) {
                if (learnedSet.has(syllable)) {
                    learnedSet.delete(syllable);
                } else {
                    learnedSet.add(syllable);
                }
                saveLearnedSet(learnedSet);
                card.classList.toggle('learned', learnedSet.has(syllable));
                flashProgress();
            }

            function playAudio(syllable) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                }
                const audio = new Audio('audio/' + syllable + '.mp3');
                audio.volume = 1;
                currentAudio = audio;
                audio.addEventListener('ended', () => { currentAudio = null; });
                audio.play().catch(() => {});
            }

            function handleSyllableClick(syllable, card) {
                card.classList.add('playing');
                setTimeout(() => card.classList.remove('playing'), 500);
                playAudio(syllable);
            }

            normalBtn.addEventListener('click', () => {
                currentMode = 'all';
                normalBtn.classList.add('active');
                randomBtn.classList.remove('active');
                renderGrid();
            });
            randomBtn.addEventListener('click', () => {
                currentMode = 'random';
                generateRandomItems();
                randomBtn.classList.add('active');
                normalBtn.classList.remove('active');
                renderGrid();
            });
            function generateRandomItems() {
                const shuffled = syllables.slice().sort(() => Math.random() - 0.5);
                randomItems = shuffled.slice(0, Math.min(10, shuffled.length));
            }
            hideLearnedBtn.addEventListener('click', () => {
                hideLearnedBtn.classList.toggle('active');
                grid.classList.toggle('hide-learned', hideLearnedBtn.classList.contains('active'));
            });
            clearLearnedBtn.addEventListener('click', () => {
                learnedSet.clear();
                saveLearnedSet(learnedSet);
                renderGrid();
                flashProgress();
                showToast('Очищено', 'success');
            });

            examBtn.addEventListener('click', startExam);
            function startExam() {
                examOverlay.classList.add('show');
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';
                examQuestions = getRandomExamQuestions(10);
                examIndex = 0;
                examScore = 0;
                showNextExamQuestion();
            }
            function getRandomExamQuestions(count) {
                const shuffled = syllables.slice().sort(() => Math.random() - 0.5);
                return shuffled.slice(0, Math.min(count, shuffled.length));
            }
            function showNextExamQuestion() {
                if (examIndex >= examQuestions.length) {
                    examOverlay.classList.remove('show');
                    if (examScore === 10) {
                        showCelebration();
                    } else {
                        showToast(`Верно ${examScore} из 10`, 'info');
                    }
                    return;
                }
                const correct = examQuestions[examIndex];
                currentExamCorrect = correct;
                examQuestion.textContent = `Вопрос ${examIndex+1} из ${examQuestions.length}`;
                examResult.textContent = '';
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';

                const variants = new Set([correct]);
                const firstLetter = correct.charAt(0).toUpperCase();
                const sameLetterPool = syllables.filter(item =>
                    item !== correct && item.charAt(0).toUpperCase() === firstLetter
                );
                const maxSameLetter = Math.min(5, sameLetterPool.length);
                const shuffledSame = sameLetterPool.sort(() => Math.random() - 0.5).slice(0, maxSameLetter);
                shuffledSame.forEach(item => variants.add(item));
                const fallbackPool = syllables.filter(item => !variants.has(item));
                while (variants.size < 6 && fallbackPool.length > 0) {
                    const randomItem = fallbackPool[Math.floor(Math.random() * fallbackPool.length)];
                    variants.add(randomItem);
                    fallbackPool.splice(fallbackPool.indexOf(randomItem), 1);
                }
                const variantsArray = [...variants].sort(() => Math.random() - 0.5);

                examOptions.innerHTML = '';
                variantsArray.forEach(variant => {
                    const btn = document.createElement('button');
                    btn.className = 'exam-option';
                    btn.textContent = variant.toUpperCase();
                    btn.addEventListener('click', () => handleExamAnswer(btn, variant, correct));
                    examOptions.appendChild(btn);
                });
                playAudio(correct);
            }
            function handleExamAnswer(btn, selected, correct) {
                const allOptions = examOptions.querySelectorAll('.exam-option');
                allOptions.forEach(opt => opt.disabled = true);
                if (selected === correct) {
                    btn.classList.add('correct');
                    examScore++;
                    examResult.textContent = '✓';
                } else {
                    btn.classList.add('wrong');
                    allOptions.forEach(opt => {
                        if (opt.textContent === correct.toUpperCase()) opt.classList.add('correct');
                    });
                    examResult.textContent = '✕';
                }
                examRepeatBtn.style.display = 'none';
                examNextBtn.classList.add('show');
                examNextBtn.focus();
            }
            examNextBtn.addEventListener('click', () => {
                examIndex++;
                showNextExamQuestion();
            });
            examExitBtn.addEventListener('click', () => {
                examOverlay.classList.remove('show');
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                    currentAudio = null;
                }
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';
                showToast('Прервано', 'info');
            });
            examRepeatBtn.addEventListener('click', () => {
                if (currentExamCorrect) playAudio(currentExamCorrect);
            });

            const gifUrls = [
                'https://media.gifs.ru/2158157ec6a1788936055b9e9911600c84c63e85_300.webp',
                'https://media.gifs.ru/2771cc0c57b56e4c6cfa23d2d9d3f4eb1aab5aaa_300.webp',

            const TL_START = 1650;
            const TL_END   = 2010;
            const TL_RANGE = TL_END - TL_START;
            const tlPos = (year) => ((year - TL_START) / TL_RANGE) * 100;

            const TL_CENTURIES = [1700, 1800, 1900, 2000];
            const TL_HALVES    = [1750, 1850, 1950];

            const TL_WARS = [
                { year: 1721, name: 'Победа в<br>Северной<br>войне' },
                { year: 1812, name: 'Отечественная<br>война' },
                { year: 1914, name: 'Первая<br>мировая' },
                { year: 1945, name: 'Победа<br>в Великой Отечественной' }
            ];

            const TL_OTHERS = [
                { year: 1825, name: 'Восстание<br>декабристов' },
                { year: 1861, name: 'Отмена<br>крепостного<br>права' },
                { year: 1917, name: 'Октябрьская<br>революция' },
                { year: 1991, name: 'Разрушение<br>СССР' }
            ];

            function plural(n, forms) {
                const n100 = n % 100;
                const n10 = n % 10;
                if (n100 >= 11 && n100 <= 19) return forms[2];
                if (n10 === 1) return forms[0];
                if (n10 >= 2 && n10 <= 4) return forms[1];
                return forms[2];
            }

            function buildTimelineHTML(birthYear, deathYear) {
                const b = Math.max(birthYear, TL_START);
                const d = Math.min(deathYear, TL_END);
                const left = tlPos(b);
                const width = tlPos(d) - left;
                const age = deathYear - birthYear;
                const ageWord = plural(age, ['год', 'года', 'лет']);

                let html = '<div class="htl-panel">';

                /* Шапка панели — как в технической форме */
                html += `
                    <div class="htl-head">
                        <div class="htl-head-cell">
                            <div class="htl-head-label">ПЕРИОД ЖИЗНИ И ХРОНОЛОГИЯ ИСТОРИИ</div>
                                                    </div>
                        <div class="htl-head-cell">
                                                    </div>
                    </div>
                `;

                html += '<div class="htl-body"><div class="htl">';

                /* Мелкие декадные засечки */
                for (let y = 1700; y <= 2000; y += 10) {
                    if (y % 100 === 0) continue;
                    if (y % 50 === 0) continue;
                    html += `<div class="htl-dtick" style="left: ${tlPos(y)}%"></div>`;
                }

                /* Полувековые */
                TL_HALVES.forEach(y => {
                    html += `<div class="htl-htick" style="left: ${tlPos(y)}%"></div>`;
                });

                /* Ось */
                html += '<div class="htl-axis"></div>';

                /* Вековые засечки */
                TL_CENTURIES.forEach(y => {
                    html += `<div class="htl-ctick" style="left: ${tlPos(y)}%"></div>`;
                });

                /* Красная полоса жизни — БЕЗ текста */
                html += `<div class="htl-life" style="left: ${left}%; width: ${width}%"></div>`;

                /* Войны сверху */
                TL_WARS.forEach(e => {
                    html += `
                        <div class="htl-war" style="left: ${tlPos(e.year)}%">
                            <div class="htl-war-label">
                                <div class="htl-war-year">${e.year}</div>
                                <div class="htl-war-name">${e.name}</div>
                            </div>
                            <div class="htl-war-tick"></div>
                        </div>
                    `;
                });

                /* Прочие события снизу */
                TL_OTHERS.forEach(e => {
                    html += `
                        <div class="htl-other" style="left: ${tlPos(e.year)}%">
                            <div class="htl-other-tick"></div>
                            <div class="htl-other-label">
                                <div class="htl-other-year">${e.year}</div>
                                <div class="htl-other-name">${e.name}</div>
                            </div>
                        </div>
                    `;
                });

                /* Вековые числа */
                TL_CENTURIES.forEach(y => {
                    html += `<div class="htl-cnum" style="left: ${tlPos(y)}%">${y}</div>`;
                });

                html += '</div></div>'; /* .htl, .htl-body */
                html += '</div>'; /* .htl-panel */
                return html;
            }

            function encodePath(p) {
                return p.split('/').map(seg => encodeURIComponent(seg)).join('/');
            }

            function renderHeroesTimeline() {
                if (!heroesTimeline) return;

                const centuries = [
                    { name: "XVIII век", filter: h => h.overrideCentury === 18 || (!h.overrideCentury && h.deathYear < 1801) },
                    { name: "XIX век",   filter: h => h.overrideCentury === 19 || (!h.overrideCentury && h.deathYear >= 1801 && h.deathYear <= 1921) },
                    { name: "XX век",    filter: h => h.overrideCentury === 20 || (!h.overrideCentury && h.deathYear > 1921) }
                ];

                let html = '';

                centuries.forEach(c => {
                    const heroes = heroesData.filter(c.filter).sort((a, b) => a.deathYear - b.deathYear);
                    if (heroes.length === 0) return;

                    html += `<div class="century-header"><span class="century-title">${c.name}</span></div>`;

                    html += `<div class="heroes-grid">`;
                    let sovietStarted = false;

                    heroes.forEach(hero => {
                        if (!sovietStarted && hero.name === "Ленин") {
                            html += `</div>
                            <div class="soviet-band"><span>★</span> Советский период <span>★</span></div>
                            <div class="heroes-grid">`;
                            sovietStarted = true;
                        }

                        const imagePath = encodePath('Great Rus/' + hero.images[0]);
                        const age = hero.deathYear - hero.birthYear;
                        const imagesJson = JSON.stringify(
                            hero.images.map(img => encodePath('Great Rus/' + img))
                        );

                        html += `
                            <div class="hero-item" 
                                 data-name="${hero.name}" 
                                 data-birth="${hero.birthYear}"
                                 data-death="${hero.deathYear}"
                                 data-audio="${encodePath('Great Rus/' + hero.audio)}" 
                                 data-images='${imagesJson}'>
                                <div class="hero-photo">
                                    <img src="${imagePath}" alt="${hero.name}" loading="lazy">
                                </div>
                                <div class="hero-info">
                                    <div class="hero-name">${hero.name}</div>
                                    <div class="hero-years">${hero.birthYear}—${hero.deathYear} <span class="hero-age">${age}</span></div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                });

                heroesTimeline.innerHTML = html;

                heroesTimeline.querySelectorAll('.hero-item').forEach(item => {
                    item.addEventListener('click', function() {
                        openHeroModal(
                            this.dataset.name,
                            JSON.parse(this.dataset.images),
                            this.dataset.audio,
                            parseInt(this.dataset.birth, 10),
                            parseInt(this.dataset.death, 10)
                        );
                    });
                });
            }

            let heroModal = null;
            let heroAudio = new Audio();
            let currentImageIndex = 0;
            let currentImages = [];

            function openHeroModal(name, images, audioSrc, birthYear, deathYear) {
                if (heroModal) heroModal.remove();

                currentImages = images;
                currentImageIndex = 0;

                const navHTML = images.length > 1
                    ? `<button class="hero-nav prev" type="button" aria-label="Предыдущий">‹</button>
                       <button class="hero-nav next" type="button" aria-label="Следующий">›</button>`
                    : '';

                const initials = name.split(/\s+/).map(w => w.charAt(0)).join('').slice(0, 2).toUpperCase();

                heroModal = document.createElement('div');
                heroModal.className = 'hero-modal';
                heroModal.innerHTML = `
                    <button class="hero-modal-close" type="button" aria-label="Закрыть">×</button>
                    <button class="hero-modal-repeat" type="button" aria-label="Повторить звук">♪</button>
                    <div class="hero-modal-portrait-wrap">
                        ${navHTML}
                        <img class="hero-modal-portrait" src="${images[0]}" alt="${name}">
                    </div>
                    <div class="hero-modal-info">
                        <h3>${name}</h3>
                        <div class="hero-modal-years">${birthYear} — ${deathYear}</div>
                    </div>
                    <div class="hero-modal-timeline">
                        ${buildTimelineHTML(birthYear, deathYear)}
                    </div>
                `;

                const imgEl = heroModal.querySelector('.hero-modal-portrait');
                imgEl.addEventListener('error', () => {
                    console.warn('Не удалось загрузить изображение:', imgEl.src);
                    const placeholder = document.createElement('div');
                    placeholder.className = 'hero-portrait-placeholder';
                    placeholder.textContent = initials;
                    imgEl.replaceWith(placeholder);
                });

                document.body.appendChild(heroModal);

                playHeroAudio(audioSrc);

                heroModal.querySelector('.hero-modal-close').addEventListener('click', () => {
                    heroModal.remove();
                    heroAudio.pause();
                    heroAudio.currentTime = 0;
                });

                heroModal.querySelector('.hero-modal-repeat').addEventListener('click', () => {
                    playHeroAudio(audioSrc);
                });

                const prevBtn = heroModal.querySelector('.hero-nav.prev');
                const nextBtn = heroModal.querySelector('.hero-nav.next');
                if (prevBtn) {
                    prevBtn.addEventListener('click', () => {
                        currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
                        const im = heroModal.querySelector('.hero-modal-portrait');
                        if (im) im.src = currentImages[currentImageIndex];
                    });
                }
                if (nextBtn) {
                    nextBtn.addEventListener('click', () => {
                        currentImageIndex = (currentImageIndex + 1) % currentImages.length;
                        const im = heroModal.querySelector('.hero-modal-portrait');
                        if (im) im.src = currentImages[currentImageIndex];
                    });
                }
            }

            function playHeroAudio(src) {
                heroAudio.src = src;
                heroAudio.play().catch(e => console.log('Ошибка воспроизведения', e));
            }

            renderHeroesTimeline();
            renderGrid();

        })();
    </script>
