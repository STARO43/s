<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>Грамотиньо</title>
    <style>
        :root {
            --bg: #f9fafb;
            --bg-card: #ffffff;
            --bg-card-hover: #f3f4f6;
            --border: #e5e7eb;
            --text: #111827;
            --text-secondary: #6b7280;
            --accent: #4f6ef7;
            --accent-soft: rgba(79, 110, 247, 0.08);
            --learned: #10b981;
            --learned-bg: rgba(16, 185, 129, 0.08);
            --danger: #ef4444;
            --danger-soft: rgba(239, 68, 68, 0.08);
            --radius: 16px;
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
            --font-display: 'PT Serif', serif;
            --font-ui: 'PT Sans', sans-serif;
        }

        body.dark-mode {
            --bg: #0b0f17;
            --bg-card: #151c28;
            --bg-card-hover: #1e2735;
            --border: #2d3748;
            --text: #e5e7eb;
            --text-secondary: #9ca3af;
            --accent: #818cf8;
            --accent-soft: rgba(129, 140, 248, 0.12);
            --learned: #34d399;
            --learned-bg: rgba(52, 211, 153, 0.12);
            --danger: #f87171;
            --danger-soft: rgba(248, 113, 113, 0.12);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.25);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .header {
            padding: 1.5rem 1.5rem 1rem;
            text-align: center;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-sm);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .theme-toggle,
        .theme-cycle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.2rem;
            padding: 0.5rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-radius: 50%;
        }
        .theme-toggle:hover,
        .theme-cycle:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .color-indicator {
            width: 0.7rem;
            height: 0.7rem;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        .header h1 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            letter-spacing: -0.02em;
            color: var(--text);
            margin: 0.5rem 0 0.25rem;
        }

        .section-switch {
            display: inline-flex;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 0.25rem;
            margin-top: 0.75rem;
            box-shadow: var(--shadow-sm);
        }
        .section-switch-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 100px;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .section-switch-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: var(--shadow-md);
        }
        .section-switch-btn:hover:not(.active) {
            background: var(--bg-card-hover);
            color: var(--text);
        }

        #sectionSubtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 0.6rem;
            min-height: 1.2em;
        }

        .content-wrapper {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .tab-section {
            display: none;
        }
        .tab-section.active {
            display: block;
            animation: tabEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes tabEnter {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-container {
            max-width: 900px;
            margin: 1rem auto 0;
            padding: 0 1.5rem;
            text-align: center;
        }
        .progress-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--learned);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            padding: 1rem 1.5rem;
            flex-wrap: wrap;
        }
        .controls button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .controls button:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
            transform: translateY(-1px);
        }
        .controls button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: var(--shadow-md);
        }
        .controls button::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: var(--text);
            color: var(--bg);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 10;
        }
        .controls button:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .grid-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0.5rem 1.5rem 3rem;
            width: 100%;
        }
        .syllable-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
        }
        .syllable-grid.hide-learned .syllable-card.learned {
            display: none;
        }

        .syllable-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 0.5rem;
            text-align: center;
            cursor: pointer;
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            font-weight: 600;
            color: var(--text);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s ease;
            position: relative;
            font-family: var(--font-display);
            letter-spacing: 0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            box-shadow: var(--shadow-sm);
            animation: cardAppear 0.4s ease backwards;
            animation-delay: calc(var(--index, 0) * 0.02s);
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .syllable-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .syllable-card.playing {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .syllable-card.learned {
            background: var(--learned-bg);
            border-color: var(--learned);
            box-shadow: none;
        }
        .syllable-card.learned .syllable-text {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .learn-dot {
            position: absolute;
            bottom: 6px;
            right: 8px;
            width: 12px;
            height: 12px;
            background: var(--border);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .learn-dot:hover {
            transform: scale(1.2);
            background: var(--text-secondary);
        }
        .syllable-card.learned .learn-dot {
            background: var(--learned);
        }

        .scroll-top-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            transition: all 0.2s;
            z-index: 1000;
        }
        .scroll-top-btn.visible {
            display: flex;
        }
        .scroll-top-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .exam-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            gap: 1.5rem;
        }
        .exam-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        .exam-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .exam-question {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            color: var(--text);
        }
        .exam-repeat-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .exam-repeat-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .exam-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.8rem;
            max-width: 500px;
            width: 100%;
        }
        .exam-option {
            padding: 0.8rem 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.2s;
        }
        .exam-option:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }
        .exam-option.correct {
            border-color: var(--learned);
            background: var(--learned-bg);
            color: var(--learned);
        }
        .exam-option.wrong {
            border-color: var(--danger);
            background: var(--danger-soft);
            color: var(--danger);
        }
        .exam-result {
            font-size: 2rem;
            text-align: center;
            min-height: 2rem;
        }
        .exam-next-btn {
            display: none;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            font-size: 1.5rem;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: var(--shadow-md);
        }
        .exam-next-btn.show {
            display: flex;
        }
        .exam-next-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }
        .exam-exit-btn {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
        }
        .exam-exit-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: var(--danger-soft);
        }

        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .celebration-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        .celebration-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            max-width: 90vw;
            max-height: 90vh;
            box-shadow: var(--shadow-lg);
            animation: scaleIn 0.4s ease;
        }
        .celebration-box h2 {
            margin-bottom: 0.8rem;
            font-family: var(--font-display);
            font-size: 1.5rem;
        }
        .celebration-box img {
            max-width: 280px;
            max-height: 240px;
            border-radius: 12px;
        }
        .celebration-close {
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-weight: 600;
            transition: background 0.2s;
        }
        .celebration-close:hover {
            background: var(--accent);
            filter: brightness(1.1);
        }

        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
            color: var(--text);
            box-shadow: var(--shadow-md);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
            pointer-events: auto;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.7rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .heroes-timeline {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            position: relative;
        }
        .timeline-container {
            position: relative;
            padding-left: 2.5rem;
        }
        .timeline-line {
            position: absolute;
            left: 1.1rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
            z-index: 0;
        }
        .century-sentinel {
            height: 1px;
            margin: 3rem 0 2rem;
            position: relative;
        }
        .century-sentinel::before {
            content: '';
            position: absolute;
            left: -2.15rem;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            z-index: 1;
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .hero-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .hero-item:hover {
            background: var(--bg-card-hover);
        }
        .hero-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }
        .hero-item:hover .hero-circle {
            transform: scale(1.1);
            box-shadow: var(--shadow-md);
        }
        .hero-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .hero-name {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }
        .hero-years {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
        }
        .hero-age {
            font-size: 0.7rem;
            opacity: 0.7;
        }
        .soviet-era {
            background: rgba(239, 68, 68, 0.04);
            margin: 1.5rem -1rem 1.5rem -0.8rem;
            padding: 1.5rem 1.5rem 1.5rem 2rem;
            position: relative;
            border-radius: 0 16px 16px 0;
            border-left: 3px solid #ef4444;
        }
        .soviet-era::before {
            content: '☭';
            position: absolute;
            top: 50%;
            right: 1.5rem;
            transform: translateY(-50%);
            font-size: 5rem;
            font-weight: 900;
            color: rgba(239, 68, 68, 0.08);
            pointer-events: none;
        }
        .century-popup {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 0.5rem 1.5rem;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            backdrop-filter: blur(8px);
        }
        .century-popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .hero-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .hero-modal-content {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .hero-modal-close {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2.5rem;
            cursor: pointer;
            z-index: 20;
            transition: color 0.2s;
        }
        .hero-modal-close:hover {
            color: var(--danger);
        }
        .hero-modal-repeat {
            position: absolute;
            top: 1.2rem;
            left: 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 20;
        }
        .hero-modal-repeat:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .hero-modal-portrait {
            max-width: 90%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
        }
        .hero-modal h3 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            margin: 1rem 0;
            color: var(--accent);
        }
        .hero-modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 1rem;
            z-index: 10;
            pointer-events: none;
        }
        .hero-modal-nav button {

<body>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {

                'ЛЁ', 'Лёва', 'Лёша', 'ЛАК', 'ЛЕ', 'ЛЕВ', 'Лена', 'ЛЕС', 'ЛЕЩ', 'ЛИ', 'ЛИФТ', 'ЛО', 'ЛОМ', 'ЛУ', 'ЛЫ', 'ЛЫЖИ', 'ЛЭ', 'ЛЮ', 'Люба', 'Люда', 'ЛЮК', 'ЛЯ',

                'ФА', 'ФЕ', 'Федя', 'ФИ', 'ФО', 'ФУ', 'ФЫ', 'ФЭ',
                'ХА', 'ХЕ', 'ХО', 'ХУ', 'ХЫ', 'ХЭ',
                'ЦА', 'ЦЕ', 'ЦИ', 'ЦО', 'ЦУ', 'ЦЭ',
                'ЧА', 'ЧАЙ', 'ЧЕК', 'ЧИ', 'ЧУ', 'ЧЭ',
                'ША', 'ШАГ', 'ШЕ', 'ШИ', 'ШОВ', 'ШУ', 'ШЭ',
                'ЩИ', 'ЩИТ',
                'ЫВ', 'ЫК', 'ЫМ', 'ЫН', 'ЫС', 'ЫТ', 'ЫХ',
                'ЭБ', 'ЭК', 'ЭЛ', 'ЭМ', 'ЭН', 'ЭП', 'ЭР', 'ЭС', 'ЭТ', 'ЭФ', 'ЭХ', 'ЭЦ',
                'юбка', 'ЮГ', 'юнга', 'ЯБ', 'ЯВ', 'ЯД', 'ЯК', 'ЯЛ', 'ЯМ', 'ЯН', 'ЯП', 'ЯР', 'ЯС', 'ЯТ', 'ЯХ', 'яхта', 'ЯЦ'
            ];

            const syllables = rawItems.sort((a, b) => {
                const lenDiff = a.length - b.length;
                if (lenDiff !== 0) return lenDiff;
                return a.localeCompare(b, 'ru', { sensitivity: 'base' });
            });

            const grid = document.getElementById('syllableGrid');
            const toastContainer = document.getElementById('toastContainer');
            const themeToggle = document.getElementById('themeToggle');
            const themeCycleBtn = document.getElementById('themeCycleBtn');
            const colorIndicator = document.getElementById('colorIndicator');
            const normalBtn = document.getElementById('normalBtn');
            const randomBtn = document.getElementById('randomBtn');
            const hideLearnedBtn = document.getElementById('hideLearnedBtn');
            const clearLearnedBtn = document.getElementById('clearLearnedBtn');
            const examBtn = document.getElementById('examBtn');
            const progressLabel = document.getElementById('progressLabel');
            const progressFill = document.getElementById('progressFill');
            const scrollTopBtn = document.getElementById('scrollTopBtn');
            const examOverlay = document.getElementById('examOverlay');
            const examQuestion = document.getElementById('examQuestion');
            const examOptions = document.getElementById('examOptions');
            const examResult = document.getElementById('examResult');
            const examRepeatBtn = document.getElementById('examRepeatBtn');
            const examNextBtn = document.getElementById('examNextBtn');
            const examExitBtn = document.getElementById('examExitBtn');
            const celebrationOverlay = document.getElementById('celebrationOverlay');
            const celebrationGif = document.getElementById('celebrationGif');
            const celebrationClose = document.getElementById('celebrationClose');
            const sectionBtns = document.querySelectorAll('.section-switch-btn');
            const sectionSubtitle = document.getElementById('sectionSubtitle');
            const syllablesSection = document.getElementById('syllablesSection');
            const heroesSection = document.getElementById('heroesSection');
            const heroesTimeline = document.getElementById('heroesTimeline');
            const centuryPopup = document.getElementById('centuryPopup');

            let currentMode = 'all';
            let randomItems = [];
            let currentAudio = null;
            let examQuestions = [];
            let examIndex = 0;
            let examScore = 0;
            let currentExamCorrect = '';
            let currentSection = 'syllables';
            let popupTimeout;
            let popupShowTimeout;

            const themeList = [
                'theme-blue', 'theme-green', 'theme-red', 'theme-orange',
                'theme-purple', 'theme-pink', 'theme-cyan', 'theme-yellow',
                'theme-teal', 'theme-indigo'
            ];

            function loadLearnedSet() {
                try { return new Set(JSON.parse(localStorage.getItem('learned_syllables') || '[]')); }
                catch { return new Set(); }
            }
            function saveLearnedSet(set) {
                localStorage.setItem('learned_syllables', JSON.stringify(Array.from(set)));
            }
            let learnedSet = loadLearnedSet();

            function applyTheme(themeClass) {
                document.body.className = '';
                document.body.classList.add(themeClass);
                if (localStorage.getItem('theme') === 'dark') {
                    document.body.classList.add('dark-mode');
                }
                localStorage.setItem('accentTheme', themeClass);
                const accent = getComputedStyle(document.body).getPropertyValue('--accent').trim();
                colorIndicator.style.background = accent;
            }

            let currentThemeIndex = 0;
            const savedTheme = localStorage.getItem('accentTheme') || 'theme-blue';
            currentThemeIndex = themeList.indexOf(savedTheme);
            if (currentThemeIndex === -1) currentThemeIndex = 0;
            applyTheme(themeList[currentThemeIndex]);

            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }

            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            });

            themeCycleBtn.addEventListener('click', () => {
                currentThemeIndex = (currentThemeIndex + 1) % themeList.length;
                applyTheme(themeList[currentThemeIndex]);
            });

            function switchSection(section) {
                if (section === currentSection) return;
                currentSection = section;
                if (section === 'syllables') {
                    syllablesSection.classList.add('active');
                    heroesSection.classList.remove('active');
                    sectionSubtitle.textContent = 'Учим слоги. Жми, слушай, запоминай';
                } else {
                    heroesSection.classList.add('active');
                    syllablesSection.classList.remove('active');
                    sectionSubtitle.textContent = 'Великие личности Отечества';
                }
                sectionBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.section === section);
                });
            }

            sectionBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    switchSection(btn.dataset.section);
                });
            });

            window.addEventListener('scroll', () => {
                scrollTopBtn.classList.toggle('visible', window.scrollY > 300);
            });
            scrollTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            function updateProgress() {
                const total = syllables.length;
                const marked = [...syllables].filter(s => learnedSet.has(s)).length;
                const percent = total ? Math.round((marked / total) * 100) : 0;
                progressLabel.textContent = `Отмечено: ${marked} из ${total}`;
                progressFill.style.width = percent + '%';
            }

            function renderGrid() {
                grid.innerHTML = '';
                const items = currentMode === 'random' ? randomItems : syllables;
                items.forEach((syllable, index) => {
                    const card = document.createElement('div');
                    card.className = 'syllable-card';
                    card.dataset.syllable = syllable;
                    card.style.setProperty('--index', index);
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    const textSpan = document.createElement('span');
                    textSpan.className = 'syllable-text';
                    textSpan.textContent = syllable;
                    textSpan.style.pointerEvents = 'none';
                    card.appendChild(textSpan);
                    const dot = document.createElement('div');
                    dot.className = 'learn-dot';
                    dot.title = 'Отметить';
                    dot.setAttribute('role', 'checkbox');
                    dot.setAttribute('aria-checked', learnedSet.has(syllable));
                    card.appendChild(dot);
                    if (learnedSet.has(syllable)) card.classList.add('learned');
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleLearned(syllable, card);
                    });
                    card.addEventListener('click', () => handleSyllableClick(syllable, card));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleSyllableClick(syllable, card);
                        }
                    });
                    grid.appendChild(card);
                });
                updateProgress();
            }

            function toggleLearned(syllable, card) {
                if (learnedSet.has(syllable)) {
                    learnedSet.delete(syllable);
                } else {
                    learnedSet.add(syllable);
                }
                saveLearnedSet(learnedSet);
                card.classList.toggle('learned', learnedSet.has(syllable));
                updateProgress();
            }

            function playAudio(syllable) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                }
                const audio = new Audio('audio/' + syllable + '.mp3');
                audio.volume = 1;
                currentAudio = audio;
                audio.addEventListener('ended', () => { currentAudio = null; });
                audio.play().catch(() => {});
            }

            function handleSyllableClick(syllable, card) {
                card.classList.add('playing');
                setTimeout(() => card.classList.remove('playing'), 700);
                playAudio(syllable);
            }

            normalBtn.addEventListener('click', () => {
                currentMode = 'all';
                normalBtn.classList.add('active');
                randomBtn.classList.remove('active');
                renderGrid();
            });
            randomBtn.addEventListener('click', () => {
                currentMode = 'random';
                generateRandomItems();
                randomBtn.classList.add('active');
                normalBtn.classList.remove('active');
                renderGrid();
            });
            function generateRandomItems() {
                const shuffled = syllables.slice().sort(() => Math.random() - 0.5);
                randomItems = shuffled.slice(0, Math.min(10, shuffled.length));
            }
            hideLearnedBtn.addEventListener('click', () => {
                hideLearnedBtn.classList.toggle('active');
                grid.classList.toggle('hide-learned', hideLearnedBtn.classList.contains('active'));
            });
            clearLearnedBtn.addEventListener('click', () => {
                learnedSet.clear();
                saveLearnedSet(learnedSet);
                renderGrid();
                showToast('Очищено', 'success');
            });

            examBtn.addEventListener('click', startExam);
            function startExam() {
                examOverlay.classList.add('show');
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';
                examQuestions = getRandomExamQuestions(10);
                examIndex = 0;
                examScore = 0;
                showNextExamQuestion();
            }
            function getRandomExamQuestions(count) {
                const shuffled = syllables.slice().sort(() => Math.random() - 0.5);
                return shuffled.slice(0, Math.min(count, shuffled.length));
            }
            function showNextExamQuestion() {
                if (examIndex >= examQuestions.length) {
                    examOverlay.classList.remove('show');
                    if (examScore === 10) {
                        showCelebration();
                    } else {
                        showToast(`Верно ${examScore} из 10`, 'info');
                    }
                    return;
                }
                const correct = examQuestions[examIndex];
                currentExamCorrect = correct;
                examQuestion.textContent = `Вопрос ${examIndex+1} из ${examQuestions.length}`;
                examResult.textContent = '';
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';

                const variants = new Set([correct]);
                const firstLetter = correct.charAt(0).toUpperCase();
                const sameLetterPool = syllables.filter(item =>
                    item !== correct && item.charAt(0).toUpperCase() === firstLetter
                );
                const maxSameLetter = Math.min(5, sameLetterPool.length);
                const shuffledSame = sameLetterPool.sort(() => Math.random() - 0.5).slice(0, maxSameLetter);
                shuffledSame.forEach(item => variants.add(item));
                const fallbackPool = syllables.filter(item => !variants.has(item));
                while (variants.size < 6 && fallbackPool.length > 0) {
                    const randomItem = fallbackPool[Math.floor(Math.random() * fallbackPool.length)];
                    variants.add(randomItem);
                    fallbackPool.splice(fallbackPool.indexOf(randomItem), 1);
                }
                const variantsArray = [...variants].sort(() => Math.random() - 0.5);

                examOptions.innerHTML = '';
                variantsArray.forEach(variant => {
                    const btn = document.createElement('button');
                    btn.className = 'exam-option';
                    btn.textContent = variant.toUpperCase();
                    btn.addEventListener('click', () => handleExamAnswer(btn, variant, correct));
                    examOptions.appendChild(btn);
                });
                playAudio(correct);
            }
            function handleExamAnswer(btn, selected, correct) {
                const allOptions = examOptions.querySelectorAll('.exam-option');
                allOptions.forEach(opt => opt.disabled = true);
                if (selected === correct) {
                    btn.classList.add('correct');
                    examScore++;
                    examResult.textContent = '👍';
                } else {
                    btn.classList.add('wrong');
                    allOptions.forEach(opt => {
                        if (opt.textContent === correct.toUpperCase()) opt.classList.add('correct');
                    });
                    examResult.textContent = '❌';
                }
                examRepeatBtn.style.display = 'none';
                examNextBtn.classList.add('show');
                examNextBtn.focus();
            }
            examNextBtn.addEventListener('click', () => {
                examIndex++;
                showNextExamQuestion();
            });
            examExitBtn.addEventListener('click', () => {
                examOverlay.classList.remove('show');
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                    currentAudio = null;
                }
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';
                showToast('💔', 'info');
            });
            examRepeatBtn.addEventListener('click', () => {
                if (currentExamCorrect) playAudio(currentExamCorrect);
            });

            const gifUrls = [
                'https://media.gifs.ru/2158157ec6a1788936055b9e9911600c84c63e85_300.webp',
                'https://media.gifs.ru/2771cc0c57b56e4c6cfa23d2d9d3f4eb1aab5aaa_300.webp',
                'https://media.gifs.ru/2d609cd63a3ae5874298b500f9ab4b5871aabd16_300.webp',
                'https://media.gifs.ru/3f25bc7fbec4825f63f6e619e0bd3c8819d80aa9_300.webp',
                'https://media.gifs.ru/cbaddb0c4d7bea31ff48e153877a7cec628dcd22_300.webp',
                'https://media.gifs.ru/a8e88e80cbecdfc6f34d261a843c82f8f6c2e42b_300.webp',
                'https://media.gifs.ru/2640e63683ecae76864a3b8cc40cfe569bb188de_300.webp',
                'https://media.gifs.ru/dea46c4e68cbe967d1044828093869737c0697391d7011fc3094a163248f53ff_300.webp',
                'https://media.gifs.ru/e6eeccd12fe0d671a5e0f134daafcd7068cef5cf3c99affb72ca341eb9f43157_300.webp',
                'https://media.gifs.ru/45256be700bbfc9f441b0ea62ed7069989ac7cda44f5ecdf2399deaf60954a58_300.webp',
                'https://media.gifs.ru/f3e3b39148c45df671a433372b8b3cf4bdc997fa799bf8406d281ef593e97b10_300.webp'
            ];
            function showCelebration() {
                const randomGif = gifUrls[Math.floor(Math.random() * gifUrls.length)];
                celebrationGif.src = randomGif;
                celebrationOverlay.classList.add('show');
            }
            celebrationClose.addEventListener('click', () => {
                celebrationOverlay.classList.remove('show');
            });
            celebrationOverlay.addEventListener('click', (e) => {
                if (e.target === celebrationOverlay) {
                    celebrationOverlay.classList.remove('show');
                }
            });

            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                if (type === 'error') toast.classList.add('error');
                if (type === 'success') toast.classList.add('success');
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 2200);
            }

            function renderHeroesTimeline() {
                if (!heroesTimeline) return;

                const centuries = [
                    { 
                        name: "XVIII век", 
                        filter: h => h.overrideCentury === 18 || (!h.overrideCentury && h.deathYear < 1801) 
                    },
                    { 
                        name: "XIX век", 
                        filter: h => h.overrideCentury === 19 || (!h.overrideCentury && h.deathYear >= 1801 && h.deathYear <= 1921) 
                    },
                    { 
                        name: "XX век", 
                        filter: h => h.overrideCentury === 20 || (!h.overrideCentury && h.deathYear > 1921) 
                    }
                ];

                let html = '<div class="timeline-container">';
                html += '<div class="timeline-line"></div>';

                centuries.forEach(c => {
                    const heroes = heroesData.filter(c.filter).sort((a, b) => a.deathYear - b.deathYear);
                    if (heroes.length === 0) return;

                    html += `<div class="century-sentinel" data-century="${c.name}"></div>`;

                    let sovietStarted = false;

                    heroes.forEach(hero => {
                        if (!sovietStarted && hero.name === "Ленин") {
                            html += `<div class="soviet-era">`;
                            sovietStarted = true;
                        }

                        const imagePath = `Great Rus/${hero.images[0]}`;
                        const age = hero.deathYear - hero.birthYear;

                        html += `
                            <div class="hero-item" 
                                 data-name="${hero.name}" 
                                 data-audio="Great Rus/${hero.audio}" 
                                 data-images='${JSON.stringify(hero.images.map(img => "Great Rus/" + img))}'>
                                <div class="hero-circle">
                                    <img src="${imagePath}" alt="${hero.name}" loading="lazy">
                                </div>
                                <div class="hero-info">
                                    <div class="hero-name">${hero.name}</div>
                                    <div class="hero-years">${hero.birthYear} — ${hero.deathYear} <span class="hero-age">(${age})</span></div>
                                </div>
                            </div>
                        `;
                    });
                    if (sovietStarted) {
                        html += `</div>`;
                    }
                });
                html += '</div>';

                heroesTimeline.innerHTML = html;

                heroesTimeline.querySelectorAll('.hero-item').forEach(item => {
                    item.addEventListener('click', function() {
                        openHeroModal(this.dataset.name, JSON.parse(this.dataset.images), this.dataset.audio);
                    });
                });

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const century = entry.target.dataset.century;

                            clearTimeout(popupShowTimeout);
                            clearTimeout(popupTimeout);

                            popupShowTimeout = setTimeout(() => {
                                centuryPopup.textContent = century;
                                centuryPopup.classList.add('show');

                                popupTimeout = setTimeout(() => {
                                    centuryPopup.classList.remove('show');
                                }, 2500);
                            }, 800);
                        } else {
                            clearTimeout(popupShowTimeout);
                        }
                    });
                }, { threshold: 0.3 });

                document.querySelectorAll('.century-sentinel').forEach(sentinel => {
                    observer.observe(sentinel);
                });
            }

            let heroModal = null;
            let heroAudio = new Audio();
            let currentImageIndex = 0;
            let currentImages = [];

            function openHeroModal(name, images, audioSrc) {
                if (heroModal) heroModal.remove();

                currentImages = images;
                currentImageIndex = 0;

                heroModal = document.createElement('div');
                heroModal.className = 'hero-modal';
                heroModal.innerHTML = `
                    <div class="hero-modal-content">
                        <button class="hero-modal-close">&times;</button>
                        <button class="hero-modal-repeat">🔊</button>
                        <img class="hero-modal-portrait" src="${images[0]}" alt="${name}">
                        <h3>${name}</h3>
                        <div class="hero-modal-nav">
                            <button class="prev-image" style="${images.length <= 1 ? 'display:none;' : ''}">&#10094;</button>
                            <button class="next-image" style="${images.length <= 1 ? 'display:none;' : ''}">&#10095;</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(heroModal);

                playHeroAudio(audioSrc);

                heroModal.querySelector('.hero-modal-close').addEventListener('click', () => {
                    heroModal.remove();
                    heroAudio.pause();
                    heroAudio.currentTime = 0;
                });

                heroModal.addEventListener('click', (e) => {
                    if (e.target === heroModal) {
                        heroModal.remove();
                        heroAudio.pause();
                        heroAudio.currentTime = 0;
                    }
                });

                const prevBtn = heroModal.querySelector('.prev-image');
                const nextBtn = heroModal.querySelector('.next-image');
                if (prevBtn) {
                    prevBtn.addEventListener('click', () => {
                        currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
                        heroModal.querySelector('.hero-modal-portrait').src = currentImages[currentImageIndex];
                    });
                }
                if (nextBtn) {
                    nextBtn.addEventListener('click', () => {
                        currentImageIndex = (currentImageIndex + 1) % currentImages.length;
                        heroModal.querySelector('.hero-modal-portrait').src = currentImages[currentImageIndex];
                    });
                }

                heroModal.querySelector('.hero-modal-repeat').addEventListener('click', () => {
                    playHeroAudio(audioSrc);
                });
            }

            function playHeroAudio(src) {
                heroAudio.src = src;
                heroAudio.play().catch(e => console.log('Ошибка воспроизведения', e));
            }

            renderHeroesTimeline();
            renderGrid();

        })();
    </script>
