<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грамотиньо — студия речи</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* ========== БАЗА ========== */
        :root {
            --bg: #0c0f14;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f2f5;
            --text-secondary: #8b95a7;
            --accent: #a78bfa;
            --accent2: #60a5fa;
            --accent3: #f472b6;
            --learned: #34d399;
            --danger: #f87171;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-sans: 'Manrope', sans-serif;
            --font-display: 'Playfair Display', serif;
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.25);
            --shadow-glow: 0 0 40px rgba(167, 139, 250, 0.15);
            --transition: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== АНИМИРОВАННЫЙ ФОН ========== */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .aurora-bg::before,
        .aurora-bg::after {
            content: '';
            position: absolute;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatAurora 20s ease-in-out infinite;
        }
        .aurora-bg::before {
            background: var(--accent);
            top: -20%;
            left: -10%;
        }
        .aurora-bg::after {
            background: var(--accent2);
            bottom: -20%;
            right: -10%;
            animation-delay: -7s;
        }
        .aurora-bg .aurora-3 {
            position: absolute;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: var(--accent3);
            filter: blur(80px);
            opacity: 0.3;
            top: 40%;
            left: 40%;
            animation: floatAurora 25s ease-in-out infinite reverse;
        }
        @keyframes floatAurora {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5vw, -3vw) scale(1.1); }
            66% { transform: translate(-3vw, 4vw) scale(0.9); }
        }

        /* ========== КОНТЕЙНЕР ========== */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* ========== ШАПКА ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 0.5rem 0;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            box-shadow: 0 4px 16px rgba(167, 139, 250, 0.4);
        }
        .logo-text {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .icon-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
        }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            transition: background 0.3s;
        }

        /* ========== ПЕРЕКЛЮЧАТЕЛЬ СЕКЦИЙ ========== */
        .section-nav {
            display: flex;
            gap: 0.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 0.3rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-self: center;
        }
        .section-btn {
            padding: 0.7rem 1.8rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 100px;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.02em;
        }
        .section-btn.active {
            background: rgba(167, 139, 250, 0.2);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
        }
        .section-btn:hover:not(.active) {
            color: var(--text);
        }

        /* ========== ПОДЗАГОЛОВОК ========== */
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 1.2em;
            letter-spacing: 0.03em;
        }

        /* ========== КАРТОЧКИ СЛОГОВ ========== */
        .syllables-section {
            display: none;
            animation: sectionFade 0.5s ease;
        }
        .syllables-section.active {
            display: block;
        }
        @keyframes sectionFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 0 0.5rem;
        }
        .progress-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            font-weight: 500;
        }
        .progress-track {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 2px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .controls-row {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .control-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
        }
        .control-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
        }
        .control-btn.active {
            background: rgba(167, 139, 250, 0.2);
            border-color: rgba(167, 139, 250, 0.4);
            color: var(--accent);
        }
        .control-btn[data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.35rem 0.7rem;
            border-radius: 8px;
            font-size: 0.7rem;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .syllable-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.8rem;
        }
        .syllable-grid.hide-learned .syllable-card.learned {
            display: none;
        }
        .syllable-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.2rem 0.5rem;
            text-align: center;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: all var(--transition);
            position: relative;
            font-family: var(--font-sans);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: cardIn 0.4s ease backwards;
            animation-delay: calc(var(--i, 0) * 0.015s);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .syllable-card:hover {
            background: var(--surface-hover);
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 4px 20px rgba(167, 139, 250, 0.2);
            transform: translateY(-3px);
        }
        .syllable-card.playing {
            background: rgba(167, 139, 250, 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
        }
        .syllable-card.learned {
            background: rgba(52, 211, 153, 0.08);
            border-color: rgba(52, 211, 153, 0.3);
        }
        .syllable-card.learned .syllable-text {
            text-decoration: line-through;
            opacity: 0.5;
        }
        .learn-dot {
            position: absolute;
            bottom: 6px;
            right: 8px;
            width: 10px;
            height: 10px;
            background: var(--border);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .learn-dot:hover {
            transform: scale(1.3);
            background: var(--text-secondary);
        }
        .syllable-card.learned .learn-dot {
            background: var(--learned);
        }

        /* ========== СЕКЦИЯ ГЕРОЕВ ========== */
        .heroes-section {
            display: none;
            animation: sectionFade 0.5s ease;
        }
        .heroes-section.active {
            display: block;
        }
        .timeline-wrapper {
            position: relative;
            padding-left: 2.5rem;
            margin-top: 1rem;
        }
        .timeline-line {
            position: absolute;
            left: 1.1rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
            z-index: 0;
        }
        .century-marker {
            height: 1px;
            margin: 2.5rem 0 1.5rem;
            position: relative;
        }
        .century-marker::before {
            content: '';
            position: absolute;
            left: -2.1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
        }
        .hero-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.9rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }
        .hero-card:hover {
            background: var(--surface-hover);
        }
        .hero-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid var(--accent);
            background: var(--surface);
            transition: all 0.3s;
        }
        .hero-card:hover .hero-avatar {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.4);
        }
        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-info h4 {
            font-weight: 600;
            font-size: 1rem;
        }
        .hero-info span {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* ========== ЭКЗАМЕН ========== */
        .exam-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 15, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            gap: 1.5rem;
        }
        .exam-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        .exam-exit-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .exam-exit-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        .exam-question {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
        }
        .exam-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.7rem;
            max-width: 480px;
            width: 100%;
        }
        .exam-option {
            padding: 0.8rem 0.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.2s;
        }
        .exam-option:hover {
            background: var(--surface-hover);
            border-color: rgba(167,139,250,0.5);
        }
        .exam-option.correct {
            border-color: var(--learned);
            background: rgba(52,211,153,0.15);
            color: var(--learned);
        }
        .exam-option.wrong {
            border-color: var(--danger);
            background: rgba(248,113,113,0.15);
            color: var(--danger);
        }
        .exam-result {
            font-size: 2.5rem;
            text-align: center;
            min-height: 2.5rem;
        }
        .exam-repeat-btn, .exam-next-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .exam-repeat-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .exam-next-btn {
            display: none;
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .exam-next-btn.show {
            display: flex;
        }

        /* ========== ВСПЛЫВАЮЩИЕ УВЕДОМЛЕНИЯ ========== */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }
        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.7rem 1.5rem;
            font-size: 0.85rem;
            color: var(--text);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(10px);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ========== МОДАЛКА ГЕРОЯ ========== */
        .hero-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 15, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .hero-modal-content {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .hero-modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2.5rem;
            cursor: pointer;
            z-index: 20;
            transition: color 0.2s;
        }
        .hero-modal-close:hover {
            color: var(--danger);
        }
        .hero-modal-repeat {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 20;
        }
        .hero-modal-repeat:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .hero-modal-portrait {
            max-width: 85%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-glow);
        }
        .hero-modal h3 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            margin: 1rem 0;
            color: var(--accent);
        }
        .hero-modal-nav {
            position: absolute;
            top: 50%;
            left: 1rem;
            right: 1rem;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }
        .hero-modal-nav button {
            pointer-events: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.8rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hero-modal-nav button:hover {
            background: var(--surface-hover);
            color: var(--accent);
        }

        /* ========== АДАПТИВ ========== */
        @media (max-width: 600px) {
            .app-container { padding: 1rem; gap: 1.5rem; }
            .syllable-grid { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
            .syllable-card { font-size: 0.9rem; padding: 0.8rem 0.3rem; min-height: 42px; border-radius: 12px; }
            .section-btn { padding: 0.5rem 1rem; font-size: 0.75rem; }
            .hero-avatar { width: 40px; height: 40px; }
        }
        @media (max-width: 400px) {
            .syllable-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* ========== КНОПКА НАВЕРХ ========== */
        .scroll-top {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .scroll-top.visible { display: flex; }
        .scroll-top:hover { color: var(--accent); border-color: var(--accent); }

        .footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.7rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="aurora-bg">
        <div class="aurora-3"></div>
    </div>

    <div class="app-container">
        <!-- ШАПКА -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">📖</div>
                <span class="logo-text">Грамотиньо</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="themeCycleBtn" title="Сменить акцент">
                    <span class="color-dot" id="colorDot"></span>
                </button>
                <button class="icon-btn" id="themeToggle" title="Тема">🌓</button>
            </div>
        </header>

            const syllables = rawItems.sort((a, b) => {
                const lenDiff = a.length - b.length;
                if (lenDiff !== 0) return lenDiff;
                return a.localeCompare(b, 'ru', { sensitivity: 'base' });
            });

            // DOM элементы
            const grid = document.getElementById('syllableGrid');
            const toastContainer = document.getElementById('toastContainer');

            const themeCycleBtn = document.getElementById('themeCycleBtn');

            const clearLearnedBtn = document.getElementById('clearLearnedBtn');
            const examBtn = document.getElementById('examBtn');
            const progressLabel = document.getElementById('progressLabel');
            const progressFill = document.getElementById('progressFill');
            const scrollTopBtn = document.getElementById('scrollTopBtn');
            const examOverlay = document.getElementById('examOverlay');
            const examQuestion = document.getElementById('examQuestion');
            const examOptions = document.getElementById('examOptions');
            const examResult = document.getElementById('examResult');
            const examRepeatBtn = document.getElementById('examRepeatBtn');
            const examNextBtn = document.getElementById('examNextBtn');
            const examExitBtn = document.getElementById('examExitBtn');
            const celebrationOverlay = document.getElementById('celebrationOverlay');
            const celebrationGif = document.getElementById('celebrationGif');
            const celebrationClose = document.getElementById('celebrationClose');
            const sectionBtns = document.querySelectorAll('.section-btn');
            const subtitle = document.getElementById('subtitle');
            const syllablesSection = document.getElementById('syllablesSection');
            const heroesSection = document.getElementById('heroesSection');
            const timelineWrapper = document.getElementById('timelineWrapper');
            const centuryPopup = document.getElementById('centuryPopup');

            let currentMode = 'all';
            let randomItems = [];
            let currentAudio = null;
            let examQuestions = [];
            let examIndex = 0;
            let examScore = 0;
            let currentExamCorrect = '';
            let currentSection = 'syllables';
            let popupTimeout, popupShowTimeout;

            // ТЕМЫ
            const themes = [
                { accent: '#a78bfa', accent2: '#60a5fa', accent3: '#f472b6' },
                { accent: '#f472b6', accent2: '#fb923c', accent3: '#a78bfa' },
                { accent: '#34d399', accent2: '#22d3ee', accent3: '#a78bfa' },
                { accent: '#fbbf24', accent2: '#f472b6', accent3: '#60a5fa' },
                { accent: '#60a5fa', accent2: '#a78bfa', accent3: '#34d399' }
            ];
            let themeIndex = 0;

            function applyTheme() {
                const t = themes[themeIndex];
                document.documentElement.style.setProperty('--accent', t.accent);
                document.documentElement.style.setProperty('--accent2', t.accent2);
                document.documentElement.style.setProperty('--accent3', t.accent3);
                colorDot.style.background = t.accent;
                localStorage.setItem('accentIndex', themeIndex);
            }

            const savedTheme = localStorage.getItem('accentIndex');
            if (savedTheme !== null) themeIndex = parseInt(savedTheme) % themes.length;
            applyTheme();

            themeCycleBtn.addEventListener('click', () => {
                themeIndex = (themeIndex + 1) % themes.length;
                applyTheme();
            });

            // ТЁМНАЯ/СВЕТЛАЯ (всегда тёмная, но оставим переключатель для вида)
            themeToggle.addEventListener('click', () => {
                // Это просто заглушка — можно добавить светлую тему отдельно
                showToast('Тёмная тема — единственно верная 😎');
            });

            // ПЕРЕКЛЮЧЕНИЕ СЕКЦИЙ
            sectionBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const section = btn.dataset.section;
                    if (section === currentSection) return;
                    currentSection = section;
                    sectionBtns.forEach(b => b.classList.toggle('active', b.dataset.section === section));
                    if (section === 'syllables') {
                        syllablesSection.classList.add('active');
                        heroesSection.classList.remove('active');
                        subtitle.textContent = 'Жми на карточку — слушай и запоминай';
                    } else {
                        heroesSection.classList.add('active');
                        syllablesSection.classList.remove('active');
                        subtitle.textContent = 'Великие личности Отечества';
                    }
                });
            });

            // СКРОЛЛ
            window.addEventListener('scroll', () => {
                scrollTopBtn.classList.toggle('visible', window.scrollY > 300);
            });
            scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            // ХРАНЕНИЕ ВЫУЧЕННОГО
            function loadLearned() {
                try { return new Set(JSON.parse(localStorage.getItem('learned_syllables') || '[]')); }
                catch { return new Set(); }
            }
            function saveLearned() {
                localStorage.setItem('learned_syllables', JSON.stringify([...learnedSet]));
            }
            let learnedSet = loadLearned();

            function updateProgress() {
                const total = syllables.length;
                const marked = [...syllables].filter(s => learnedSet.has(s)).length;
                const percent = total ? Math.round((marked / total) * 100) : 0;
                progressLabel.textContent = `${marked} из ${total}`;
                progressFill.style.width = percent + '%';
            }

            function renderGrid() {
                grid.innerHTML = '';
                const items = currentMode === 'random' ? randomItems : syllables;
                items.forEach((syllable, index) => {
                    const card = document.createElement('div');
                    card.className = 'syllable-card';
                    card.dataset.syllable = syllable;
                    card.style.setProperty('--i', index);
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    const textSpan = document.createElement('span');
                    textSpan.className = 'syllable-text';
                    textSpan.textContent = syllable;
                    textSpan.style.pointerEvents = 'none';
                    card.appendChild(textSpan);
                    const dot = document.createElement('div');
                    dot.className = 'learn-dot';
                    dot.title = 'Отметить';
                    card.appendChild(dot);
                    if (learnedSet.has(syllable)) card.classList.add('learned');
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleLearned(syllable, card);
                    });
                    card.addEventListener('click', () => handleSyllableClick(syllable, card));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleSyllableClick(syllable, card);
                        }
                    });
                    grid.appendChild(card);
                });
                updateProgress();
            }

            function toggleLearned(syllable, card) {
                if (learnedSet.has(syllable)) learnedSet.delete(syllable);
                else learnedSet.add(syllable);
                saveLearned();
                card.classList.toggle('learned', learnedSet.has(syllable));
                updateProgress();
            }

            function playAudio(syllable) {
                if (currentAudio) { currentAudio.pause(); currentAudio.src = ''; }
                const audio = new Audio('audio/' + syllable + '.mp3');
                audio.volume = 1;
                currentAudio = audio;
                audio.addEventListener('ended', () => currentAudio = null);
                audio.play().catch(() => {});
            }

            function handleSyllableClick(syllable, card) {
                card.classList.add('playing');
                setTimeout(() => card.classList.remove('playing'), 700);
                playAudio(syllable);
            }

            normalBtn.addEventListener('click', () => {
                currentMode = 'all';
                normalBtn.classList.add('active');
                randomBtn.classList.remove('active');
                renderGrid();
            });
            randomBtn.addEventListener('click', () => {
                currentMode = 'random';
                const shuffled = [...syllables].sort(() => Math.random() - 0.5);
                randomItems = shuffled.slice(0, 10);
                randomBtn.classList.add('active');
                normalBtn.classList.remove('active');
                renderGrid();
            });
            hideLearnedBtn.addEventListener('click', () => {
                hideLearnedBtn.classList.toggle('active');
                grid.classList.toggle('hide-learned', hideLearnedBtn.classList.contains('active'));
            });
            clearLearnedBtn.addEventListener('click', () => {
                learnedSet.clear();
                saveLearned();
                renderGrid();
                showToast('Прогресс очищен');
            });

            // ЭКЗАМЕН
            examBtn.addEventListener('click', startExam);
            function startExam() {
                examOverlay.classList.add('show');
                examQuestions = [...syllables].sort(() => Math.random() - 0.5).slice(0, 10);
                examIndex = 0;
                examScore = 0;
                showNextExam();
            }
            function showNextExam() {
                if (examIndex >= examQuestions.length) {
                    examOverlay.classList.remove('show');
                    if (examScore === 10) showCelebration();
                    else showToast(`Верно ${examScore} из 10`);
                    return;
                }
                const correct = examQuestions[examIndex];
                currentExamCorrect = correct;
                examQuestion.textContent = `Вопрос ${examIndex+1} из ${examQuestions.length}`;
                examResult.textContent = '';
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';
                const variants = new Set([correct]);
                const pool = syllables.filter(s => s !== correct);
                while (variants.size < 6 && pool.length > 0) {
                    const r = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
                    variants.add(r);
                }
                const arr = [...variants].sort(() => Math.random() - 0.5);
                examOptions.innerHTML = '';
                arr.forEach(v => {
                    const b = document.createElement('button');
                    b.className = 'exam-option';
                    b.textContent = v.toUpperCase();
                    b.addEventListener('click', () => handleExamAnswer(b, v, correct));
                    examOptions.appendChild(b);
                });
                playAudio(correct);
            }
            function handleExamAnswer(btn, selected, correct) {
                const all = examOptions.querySelectorAll('.exam-option');
                all.forEach(o => o.disabled = true);
                if (selected === correct) {
                    btn.classList.add('correct');
                    examScore++;
                    examResult.textContent = '👍';
                } else {
                    btn.classList.add('wrong');
                    all.forEach(o => { if (o.textContent === correct.toUpperCase()) o.classList.add('correct'); });
                    examResult.textContent = '❌';
                }
                examRepeatBtn.style.display = 'none';
                examNextBtn.classList.add('show');
                examNextBtn.focus();
            }
            examNextBtn.addEventListener('click', () => { examIndex++; showNextExam(); });
            examExitBtn.addEventListener('click', () => {
                examOverlay.classList.remove('show');
                if (currentAudio) { currentAudio.pause(); currentAudio.src = ''; currentAudio = null; }
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';
            });
            examRepeatBtn.addEventListener('click', () => { if (currentExamCorrect) playAudio(currentExamCorrect); });

            const gifs = [
                'https://media.gifs.ru/2158157ec6a1788936055b9e9911600c84c63e85_300.webp',
                'https://media.gifs.ru/2771cc0c57b56e4c6cfa23d2d9d3f4eb1aab5aaa_300.webp',
                'https://media.gifs.ru/2d609cd63a3ae5874298b500f9ab4b5871aabd16_300.webp',
                'https://media.gifs.ru/3f25bc7fbec4825f63f6e619e0bd3c8819d80aa9_300.webp',
                'https://media.gifs.ru/cbaddb0c4d7bea31ff48e153877a7cec628dcd22_300.webp'

                { name: "Пётр I", birthYear: 1672, deathYear: 1725, images: ["Петр.jpg","Пётр2.jpg"], audio: "Первый.mp3" },

                { name: "Семашко", birthYear: 1874, deathYear: 1949, images: ["Семашко.jpg"], audio: "Семашко.mp3" },

                { name: "Сталин", birthYear: 1878, deathYear: 1953, images: ["Сталин.jpg","Сталин2.jpg","Сталин3.jpg","Сталин4.jpg","Сталин5.jpg","Сталин6.jpg","Сталин7.jpg","Сталин8.jpg","Сталин9.jpg"], audio: "Сталин.mp3" },

                { name: "Шолохов", birthYear: 1905, deathYear: 1984, images: ["Шолохов.jpg"], audio: "Шолохов.mp3" }
            ];

            function renderTimeline() {
                if (!timelineWrapper) return;
                const centuries = [
                    { name: "XVIII век", filter: h => h.overrideCentury === 18 || (!h.overrideCentury && h.deathYear < 1801) },
                    { name: "XIX век", filter: h => h.overrideCentury === 19 || (!h.overrideCentury && h.deathYear >= 1801 && h.deathYear <= 1921) },
                    { name: "XX век", filter: h => h.overrideCentury === 20 || (!h.overrideCentury && h.deathYear > 1921) }
                ];
                let html = '<div class="timeline-wrapper">';
                html += '<div class="timeline-line"></div>';
                centuries.forEach(c => {
                    const heroes = heroesData.filter(c.filter).sort((a,b) => a.deathYear - b.deathYear);
                    if (!heroes.length) return;
                    html += `<div class="century-marker" data-century="${c.name}"></div>`;
                    let soviet = false;
                    heroes.forEach(h => {
                        if (!soviet && h.name === "Ленин") { html += '<div style="border-left:3px solid #ef4444;margin-left:-1.5rem;padding-left:1.5rem;">'; soviet = true; }
                        const img = `Great Rus/${h.images[0]}`;
                        const age = h.deathYear - h.birthYear;
                        html += `
                            <div class="hero-card" data-name="${h.name}" data-audio="Great Rus/${h.audio}" data-images='${JSON.stringify(h.images.map(i => "Great Rus/" + i))}'>
                                <div class="hero-avatar"><img src="${img}" alt="${h.name}" loading="lazy"></div>
                                <div class="hero-info">
                                    <h4>${h.name}</h4>
                                    <span>${h.birthYear} — ${h.deathYear} (${age})</span>
                                </div>
                            </div>`;
                    });
                    if (soviet) html += '</div>';
                });
                html += '</div>';
                timelineWrapper.innerHTML = html;

                timelineWrapper.querySelectorAll('.hero-card').forEach(card => {
                    card.addEventListener('click', () => {
                        openHeroModal(card.dataset.name, JSON.parse(card.dataset.images), card.dataset.audio);
                    });
                });

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(e => {
                        if (e.isIntersecting) {
                            const c = e.target.dataset.century;
                            clearTimeout(popupShowTimeout);
                            clearTimeout(popupTimeout);
                            popupShowTimeout = setTimeout(() => {
                                centuryPopup.textContent = c;
                                centuryPopup.style.opacity = '1';
                                centuryPopup.style.transform = 'translateX(-50%) translateY(0)';
                                popupTimeout = setTimeout(() => {
                                    centuryPopup.style.opacity = '0';
                                    centuryPopup.style.transform = 'translateX(-50%) translateY(10px)';
                                }, 2500);
                            }, 800);
                        }
                    });
                }, { threshold: 0.3 });
                timelineWrapper.querySelectorAll('.century-marker').forEach(m => observer.observe(m));
            }

            let heroModal = null;
            let heroAudio = new Audio();
            let currentImages = [];
            let currentImageIndex = 0;

            function openHeroModal(name, images, audioSrc) {
                if (heroModal) heroModal.remove();
                currentImages = images;
                currentImageIndex = 0;
                heroModal = document.createElement('div');
                heroModal.className = 'hero-modal';
                heroModal.innerHTML = `
                    <div class="hero-modal-content">
                        <button class="hero-modal-close">&times;</button>
                        <button class="hero-modal-repeat">🔊</button>
                        <img class="hero-modal-portrait" src="${images[0]}" alt="${name}">
                        <h3>${name}</h3>
                        <div class="hero-modal-nav">
                            <button class="prev-image" style="${images.length <= 1 ? 'display:none;' : ''}">&#10094;</button>
                            <button class="next-image" style="${images.length <= 1 ? 'display:none;' : ''}">&#10095;</button>
                        </div>
                    </div>`;
                document.body.appendChild(heroModal);
                playHeroAudio(audioSrc);
                heroModal.querySelector('.hero-modal-close').addEventListener('click', () => { heroModal.remove(); heroAudio.pause(); });
                heroModal.addEventListener('click', (e) => { if (e.target === heroModal) { heroModal.remove(); heroAudio.pause(); } });
                const prevBtn = heroModal.querySelector('.prev-image');
                const nextBtn = heroModal.querySelector('.next-image');
                if (prevBtn) prevBtn.addEventListener('click', () => {
                    currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
                    heroModal.querySelector('.hero-modal-portrait').src = currentImages[currentImageIndex];
                });
                if (nextBtn) nextBtn.addEventListener('click', () => {
                    currentImageIndex = (currentImageIndex + 1) % currentImages.length;
                    heroModal.querySelector('.hero-modal-portrait').src = currentImages[currentImageIndex];
                });
                heroModal.querySelector('.hero-modal-repeat').addEventListener('click', () => playHeroAudio(audioSrc));
            }
            function playHeroAudio(src) {
                heroAudio.src = src;
                heroAudio.play().catch(() => {});
            }

            // ИНИЦИАЛИЗАЦИЯ
            renderGrid();
            renderTimeline();
        })();
    </script>
