<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грамотиньо — новое измерение</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f5f5f7;
            --text-dim: #8e8e9a;
            --accent: #ff4d6d;
            --accent2: #6c5ce7;
            --accent3: #00b894;
            --radius: 22px;
            --font: 'Inter', sans-serif;
            --font-display: 'Unbounded', cursive;
            --shadow: 0 20px 60px rgba(0,0,0,0.5);
            --transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 20% 30%, rgba(108, 92, 231, 0.15) 0%, transparent 30%),
                              radial-gradient(circle at 80% 70%, rgba(255, 77, 109, 0.1) 0%, transparent 30%);
        }

        /* ===== ШАПКА ===== */
        .app-header {
            padding: 1.8rem 2rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-badge {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 8px 24px rgba(255, 77, 109, 0.4);
            animation: pulseBadge 3s infinite;
        }
        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 8px 28px rgba(255, 77, 109, 0.6); }
        }
        .logo-text {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            gap: 0.8rem;
        }
        .action-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 44px;
            height: 44px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
        }
        .action-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        /* ===== НАВИГАЦИЯ ===== */
        .main-nav {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            justify-content: center;
            margin: 1.5rem auto 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 60px;
            padding: 0.4rem;
            width: fit-content;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .nav-item {
            padding: 0.8rem 2rem;
            border-radius: 40px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-family: var(--font);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.02em;
        }
        .nav-item.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
        }
        .nav-item:hover:not(.active) {
            color: var(--text);
            background: var(--surface-hover);
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem 2rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* ===== СЕКЦИЯ СЛОГОВ — ПУЗЫРЬКОВОЕ ОБЛАКО ===== */
        .syllables-view {
            display: none;
            flex: 1;
            position: relative;
        }
        .syllables-view.active {
            display: block;
            animation: viewFade 0.5s ease;
        }
        @keyframes viewFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble-cloud {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            padding: 2rem 0;
            position: relative;
            min-height: 60vh;
        }
        .bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: bubbleIn 0.6s ease backwards;
            animation-delay: calc(var(--i, 0) * 0.03s);
        }
        @keyframes bubbleIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        .bubble:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            transform: scale(1.15);
            box-shadow: 0 0 40px rgba(255, 77, 109, 0.4);
            z-index: 2;
        }
        .bubble.learned {
            background: rgba(0, 184, 148, 0.15);
            border-color: var(--accent3);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.3);
        }
        .bubble.learned .bubble-text {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .bubble.playing {
            background: rgba(255, 77, 109, 0.2);
            border-color: var(--accent);
            box-shadow: 0 0 60px rgba(255, 77, 109, 0.6);
            transform: scale(1.2);
        }
        .bubble .learn-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 10px;
            height: 10px;
            background: var(--border);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .bubble .learn-dot:hover {
            transform: scale(1.3);
            background: var(--text-dim);
        }
        .bubble.learned .learn-dot {
            background: var(--accent3);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .control-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.7rem 1.2rem;
            border-radius: 40px;
            cursor: pointer;
            font-family: var(--font);
            font-weight: 600;
            font-size: 0.8rem;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .control-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
            transform: translateY(-2px);
        }
        .control-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
        }

        .progress-mini {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        /* ===== СЕКЦИЯ ГЕРОЕВ — ГОРИЗОНТАЛЬНАЯ ЛЕНТА ===== */
        .heroes-view {
            display: none;
            flex: 1;
        }
        .heroes-view.active {
            display: block;
            animation: viewFade 0.5s ease;
        }

        .heroes-horizontal {
            display: flex;
            gap: 1.2rem;
            overflow-x: auto;
            padding: 2rem 0.5rem;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .heroes-horizontal::-webkit-scrollbar {
            display: none;
        }
        .hero-slide {
            flex: 0 0 200px;
            scroll-snap-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }
        .hero-slide:hover {
            background: var(--surface-hover);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border-color: var(--accent);
        }
        .hero-slide .hero-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent);
            background: var(--surface);
            transition: all 0.3s;
        }
        .hero-slide:hover .hero-avatar {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.5);
        }
        .hero-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-slide h4 {
            font-weight: 700;
            font-size: 1rem;
        }
        .hero-slide span {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        /* ===== ЭКЗАМЕН — ПОЛНОЭКРАННЫЙ ОВЕРЛЕЙ ===== */
        .exam-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            gap: 2rem;
        }
        .exam-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        .exam-exit {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .exam-exit:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .exam-question {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .exam-options {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            max-width: 600px;
        }
        .exam-option {
            padding: 1rem 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        .exam-option:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .exam-option.correct {
            background: rgba(0, 184, 148, 0.2);
            border-color: var(--accent3);
            color: var(--accent3);
        }
        .exam-option.wrong {
            background: rgba(255, 77, 109, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }
        .exam-result {
            font-size: 2.5rem;
            min-height: 2.5rem;
        }
        .exam-actions {
            display: flex;
            gap: 0.8rem;
        }
        .exam-actions button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.2s;
        }
        .exam-actions button:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .exam-next {
            display: none;
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: #fff !important;
        }
        .exam-next.show { display: flex; }

        /* ===== МОДАЛКА ГЕРОЯ ===== */
        .hero-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .hero-modal-content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            max-width: 90vw;
            max-height: 90vh;
        }
        .hero-modal-close {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.2s;
        }
        .hero-modal-close:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .hero-modal-repeat {
            position: absolute;
            top: -10px;
            left: -10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .hero-modal-repeat:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .hero-modal-portrait {
            max-width: 300px;
            max-height: 50vh;
            object-fit: contain;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .hero-modal h3 {
            font-family: var(--font-display);
            font-size: 2rem;
            margin-top: 1.5rem;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-modal-nav {
            position: absolute;
            top: 50%;
            left: -40px;
            right: -40px;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }
        .hero-modal-nav button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.2s;
        }
        .hero-modal-nav button:hover {
            background: var(--surface-hover);
            color: var(--accent);
        }

        /* ===== ВСПЛЫВАЮЩИЕ УВЕДОМЛЕНИЯ ===== */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }
        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.8rem 1.8rem;
            font-size: 0.9rem;
            color: var(--text);
            backdrop-filter: blur(10px);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-dim);
            font-size: 0.7rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        /* ===== КНОПКА НАВЕРХ ===== */
        .scroll-top {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .scroll-top.visible { display: flex; }
        .scroll-top:hover { color: var(--accent); border-color: var(--accent); }

        @media (max-width: 768px) {
            .bubble { width: 60px; height: 60px; font-size: 0.8rem; }
            .hero-slide { flex: 0 0 150px; }
            .hero-modal-portrait { max-width: 80vw; }
            .hero-modal-nav { left: -10px; right: -10px; }
            .main-content { padding: 1rem 1rem 3rem; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo">
            <div class="logo-badge">📖</div>
            <span class="logo-text">Грамотиньо</span>
        </div>
        <div class="header-actions">
            <button class="action-btn" id="themeCycleBtn" title="Сменить акцент">
                <span class="color-dot" id="colorDot"></span>
            </button>
            <button class="action-btn" id="themeToggle" title="Тема">🌓</button>
        </div>
    </header>

    <nav class="main-nav">
        <button class="nav-item active" data-view="syllables">Слоги</button>
        <button class="nav-item" data-view="heroes">Великие</button>
    </nav>

    <p class="subtitle" id="subtitle">Погрузись в мир звуков и имён</p>

    <div class="main-content">
        <!-- ПУЗЫРЬКОВОЕ ОБЛАКО СЛОГОВ -->
        <section class="syllables-view active" id="syllablesView">
            <div class="progress-mini" id="progressMini">0 из 0</div>
            <div class="bubble-cloud" id="bubbleCloud"></div>
            <div class="controls-row">
                <button class="control-btn active" id="normalBtn">🅰 Все</button>
                <button class="control-btn" id="randomBtn">🎲 Случайно</button>
                <button class="control-btn" id="hideLearnedBtn">✂ Скрыть выученные</button>
                <button class="control-btn" id="clearLearnedBtn">↩ Очистить</button>
                <button class="control-btn" id="examBtn">🍓 Викторина</button>
            </div>
        </section>

        <!-- ГОРИЗОНТАЛЬНАЯ ЛЕНТА ГЕРОЕВ -->
        <section class="heroes-view" id="heroesView">
            <div class="heroes-horizontal" id="heroesHorizontal"></div>
        </section>
    </div>

    <!-- ЭКЗАМЕН -->
    <div class="exam-overlay" id="examOverlay">
        <button class="exam-exit" id="examExitBtn">✕</button>
        <div class="exam-question" id="examQuestion"></div>
        <div class="exam-options" id="examOptions"></div>
        <div class="exam-result" id="examResult"></div>
        <div class="exam-actions">
            <button id="examRepeatBtn">🔊</button>
            <button id="examNextBtn" class="exam-next">→</button>
        </div>
    </div>

    <!-- ПРАЗДНИК -->
    <div id="celebrationOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,15,0.7);backdrop-filter:blur(8px);z-index:3000;display:none;align-items:center;justify-content:center;">
        <div style="background:var(--surface);border-radius:24px;padding:2rem;text-align:center;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
            <h2 style="font-family:var(--font-display);margin-bottom:1rem;">Умница! 😻</h2>
            <img id="celebrationGif" src="" alt="Победа" style="max-width:280px;max-height:240px;border-radius:12px;">
            <button id="celebrationClose" style="margin-top:1rem;padding:0.6rem 2rem;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;">Закрыть</button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <button class="scroll-top" id="scrollTopBtn">↑</button>

    <footer class="footer">Спасибо за вайбкодинг в тегешечку @vnvax</footer>

    <script>
        (function() {
            const rawItems = [

            function showNextExam() {
                if (examIndex >= examQuestions.length) {
                    examOverlay.classList.remove('show');
                    if (examScore === 10) showCelebration(); else showToast(`Верно ${examScore} из 10`);
                    return;
                }
                const correct = examQuestions[examIndex];
                currentExamCorrect = correct;
                examQuestion.textContent = `Вопрос ${examIndex+1} из ${examQuestions.length}`;
                examResult.textContent = '';
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';
                const variants = new Set([correct]);
                const pool = syllables.filter(s => s !== correct);
                while (variants.size < 6 && pool.length > 0) {
                    variants.add(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
                }
                const arr = [...variants].sort(() => Math.random() - 0.5);
                examOptions.innerHTML = '';
                arr.forEach(v => {

                    btn.className = 'exam-option';
                    btn.textContent = v.toUpperCase();
                    btn.addEventListener('click', () => handleExamAnswer(btn, v, correct));
                    examOptions.appendChild(btn);
                });
                playAudio(correct);
            }
            function handleExamAnswer(btn, selected, correct) {
                const all = examOptions.querySelectorAll('.exam-option');
                all.forEach(o => o.disabled = true);
                if (selected === correct) {
                    btn.classList.add('correct'); examScore++; examResult.textContent = '👍';
                } else {

                    all.forEach(o => { if (o.textContent === correct.toUpperCase()) o.classList.add('correct'); });

                examRepeatBtn.style.display = 'none';

                document.body.appendChild(heroModal);
                playHeroAudio(audioSrc);
                heroModal.querySelector('.hero-modal-close').addEventListener('click', () => { heroModal.remove(); heroAudio.pause(); });
                heroModal.addEventListener('click', (e) => { if (e.target === heroModal) { heroModal.remove(); heroAudio.pause(); } });
                const prevBtn = heroModal.querySelector('.prev-image');
                const nextBtn = heroModal.querySelector('.next-image');
                if (prevBtn) prevBtn.addEventListener('click', () => {
                    currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
                    heroModal.querySelector('.hero-modal-portrait').src = currentImages[currentImageIndex];
                });
                if (nextBtn) nextBtn.addEventListener('click', () => {
                    currentImageIndex = (currentImageIndex + 1) % currentImages.length;
                    heroModal.querySelector('.hero-modal-portrait').src = currentImages[currentImageIndex];
                });
                heroModal.querySelector('.hero-modal-repeat').addEventListener('click', () => playHeroAudio(audioSrc));
            }
            function playHeroAudio(src) {
                heroAudio.src = src;
                heroAudio.play().catch(() => {});
            }

            // Инициализация
            renderBubbles();
            renderHeroes();
        })();
    </script>
</body>
</html>
