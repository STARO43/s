    <!-- ==================== ЛОГИКА ЧАСОВ + ПЕРЕКЛЮЧЕНИЕ ВИДА ==================== -->
    <script>
    (function () {
        const clockView   = document.getElementById('clockView');
        const watchView   = document.getElementById('watchView');
        const schemeView  = document.getElementById('schemeView');
        const minuteScheme= document.getElementById('minuteScheme');
        if (!clockView || !watchView || !schemeView) return;

        const hourHandEl   = document.getElementById('clk-hourHand');
        const minuteHandEl = document.getElementById('clk-minuteHand');
        const ticksGroup   = document.getElementById('clk-ticksGroup');
        const numbersGroup = document.getElementById('clk-numbersGroup');
        const digital24El  = document.getElementById('clockDigital24');

        const NS = 'http://www.w3.org/2000/svg';
        const CX = 200, CY = 260;
        const VIEWBOX_W = 440;

        const MOVE_THRESHOLD    = 8;    // px до классификации жеста
        const TAP_MIN_DURATION  = 400;  // мс — минимальная длительность удержания
        const TAP_MAX_DURATION  = 1200; // мс — максимальная длительность тапа
        const TAP_MAX_MOVE      = 10;   // px — максимум смещения для тапа

        /* ============================================================
           СХЕМА-ЦИФЕРБЛАТ МИНУТ (60, 5, 10, ..., 55)
           ============================================================ */
        function buildMinuteScheme() {
            if (!minuteScheme) return;
            minuteScheme.innerHTML = '';
            const SCX = 100, SCY = 100;

            const outer = document.createElementNS(NS, 'circle');
            outer.setAttribute('cx', SCX);
            outer.setAttribute('cy', SCY);
            outer.setAttribute('r', 94);
            outer.setAttribute('fill', 'none');
            outer.setAttribute('stroke', 'currentColor');
            outer.setAttribute('stroke-width', '2');
            minuteScheme.appendChild(outer);

            const inner = document.createElementNS(NS, 'circle');
            inner.setAttribute('cx', SCX);
            inner.setAttribute('cy', SCY);
            inner.setAttribute('r', 86);
            inner.setAttribute('fill', 'none');
            inner.setAttribute('stroke', 'currentColor');
            inner.setAttribute('stroke-width', '0.6');
            inner.setAttribute('opacity', '0.35');
            minuteScheme.appendChild(inner);

            for (let i = 0; i < 12; i++) {
                const a = (i * 30 - 90) * Math.PI / 180;
                const line = document.createElementNS(NS, 'line');
                line.setAttribute('x1', SCX + 82 * Math.cos(a));
                line.setAttribute('y1', SCY + 82 * Math.sin(a));
                line.setAttribute('x2', SCX + 92 * Math.cos(a));
                line.setAttribute('y2', SCY + 92 * Math.sin(a));
                line.setAttribute('stroke', 'currentColor');
                line.setAttribute('stroke-width', '2');
                line.setAttribute('stroke-linecap', 'round');
                minuteScheme.appendChild(line);
            }

            for (let i = 0; i < 60; i++) {
                if (i % 5 === 0) continue;
                const a = (i * 6 - 90) * Math.PI / 180;
                const line = document.createElementNS(NS, 'line');
                line.setAttribute('x1', SCX + 88 * Math.cos(a));
                line.setAttribute('y1', SCY + 88 * Math.sin(a));
                line.setAttribute('x2', SCX + 92 * Math.cos(a));
                line.setAttribute('y2', SCY + 92 * Math.sin(a));
                line.setAttribute('stroke', 'currentColor');
                line.setAttribute('stroke-width', '0.7');
                line.setAttribute('opacity', '0.4');
                minuteScheme.appendChild(line);
            }

            for (let i = 0; i < 12; i++) {
                const a = (i * 30 - 90) * Math.PI / 180;
                const val = i === 0 ? 60 : i * 5;
                const text = document.createElementNS(NS, 'text');
                text.setAttribute('x', SCX + 62 * Math.cos(a));
                text.setAttribute('y', SCY + 62 * Math.sin(a));
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'central');
                text.setAttribute('font-family', "'Helvetica Neue', Helvetica, Arial, sans-serif");
                text.setAttribute('font-size', '22');
                text.setAttribute('font-weight', '800');
                text.setAttribute('letter-spacing', '-0.03em');
                text.setAttribute('fill', 'currentColor');
                text.textContent = val;
                minuteScheme.appendChild(text);
            }
        }
        buildMinuteScheme();

        /* ===== Железная дорога и цифры настоящих часов ===== */
        const R_TRACK_IN  = 131;
        const R_TRACK_OUT = 138;

        const cOut = document.createElementNS(NS, 'circle');
        cOut.setAttribute('cx', CX);
        cOut.setAttribute('cy', CY);
        cOut.setAttribute('r', R_TRACK_OUT);
        cOut.setAttribute('fill', 'none');
        cOut.setAttribute('stroke', '#1a1a1a');
        cOut.setAttribute('stroke-width', '0.9');
        ticksGroup.appendChild(cOut);

        const cIn = document.createElementNS(NS, 'circle');
        cIn.setAttribute('cx', CX);
        cIn.setAttribute('cy', CY);
        cIn.setAttribute('r', R_TRACK_IN);
        cIn.setAttribute('fill', 'none');
        cIn.setAttribute('stroke', '#1a1a1a');
        cIn.setAttribute('stroke-width', '0.9');
        ticksGroup.appendChild(cIn);

        for (let i = 0; i < 60; i++) {
            const a = (i * 6 - 90) * Math.PI / 180;
            const isBig = i % 5 === 0;
            const line = document.createElementNS(NS, 'line');

            if (isBig) {
                const rOut = R_TRACK_OUT + 4;
                const rIn  = R_TRACK_IN  - 3;
                line.setAttribute('x1', CX + rIn  * Math.cos(a));
                line.setAttribute('y1', CY + rIn  * Math.sin(a));
                line.setAttribute('x2', CX + rOut * Math.cos(a));
                line.setAttribute('y2', CY + rOut * Math.sin(a));
                line.setAttribute('stroke', '#1a1a1a');
                line.setAttribute('stroke-width', '1.6');
            } else {
                line.setAttribute('x1', CX + R_TRACK_IN  * Math.cos(a));
                line.setAttribute('y1', CY + R_TRACK_IN  * Math.sin(a));
                line.setAttribute('x2', CX + R_TRACK_OUT * Math.cos(a));
                line.setAttribute('y2', CY + R_TRACK_OUT * Math.sin(a));
                line.setAttribute('stroke', '#1a1a1a');
                line.setAttribute('stroke-width', '0.55');
            }
            line.setAttribute('stroke-linecap', 'round');
            ticksGroup.appendChild(line);
        }

        const R_NUM = 110;
        for (let i = 1; i <= 12; i++) {
            const a = (i * 30 - 90) * Math.PI / 180;
            const text = document.createElementNS(NS, 'text');
            text.setAttribute('x', CX + R_NUM * Math.cos(a));
            text.setAttribute('y', CY + R_NUM * Math.sin(a));
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'central');
            text.setAttribute('font-family', "'Old Standard TT', 'Playfair Display', Georgia, 'Times New Roman', serif");
            text.setAttribute('font-size', '26');
            text.setAttribute('font-weight', '700');
            text.setAttribute('fill', i === 12 ? '#b81e1e' : '#1a1a1a');
            text.textContent = i;
            numbersGroup.appendChild(text);
        }

        /* ============================================================
           СОСТОЯНИЕ ЧАСОВ
           ============================================================ */
        let hour = 3;
        let minute = 0;
        let totalMinutes = (hour % 12) * 60 + minute;
        let currentView = 'watch';

        /* ============================================================
           ОЗВУЧКА (iOS-friendly)
           ============================================================ */
        let speechUnlockedOnce = false;
        let cachedVoice = null;

        // На iOS getVoices() сначала пустой и заполняется асинхронно.
        // Обновляем кеш каждый раз, когда браузер сообщает о новых голосах.
        function refreshVoice() {
            if (!('speechSynthesis' in window)) return;
            try {
                const voices = speechSynthesis.getVoices() || [];
                if (!voices.length) return;
                cachedVoice = voices.find(v =>
                    v && v.lang && v.lang.toLowerCase().indexOf('ru') === 0
                ) || null;
            } catch (e) {}
        }
        if ('speechSynthesis' in window) {
            refreshVoice();
            speechSynthesis.onvoiceschanged = refreshVoice;
        }

        // Однократная «разблокировка» синтезатора внутри первого жеста.
        // ВАЖНО: НЕ вызывать speechSynthesis.cancel() сразу после speak —
        // иначе unlock-фраза отменяется и iOS не разблокирует движок.
        function unlockSpeech() {
            if (speechUnlockedOnce) return;
            if (!('speechSynthesis' in window)) return;
            speechUnlockedOnce = true;
            try {
                const u = new SpeechSynthesisUtterance('раз');
                u.lang   = 'ru-RU';
                u.rate   = 3;
                u.pitch  = 1;
                u.volume = 0.05;   // почти неслышно, но > 0 — иначе iOS игнорирует
                if (cachedVoice) u.voice = cachedVoice;
                speechSynthesis.speak(u);
            } catch (e) {}
        }

        const HOURS = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть',
                       'семь', 'восемь', 'девять', 'десять', 'одиннадцать', 'двенадцать'];

        function hourForm(h) {
            if (h === 1) return 'час';
            if (h >= 2 && h <= 4) return 'часа';
            return 'часов';
        }
        function minuteForm(m) {
            const t = m % 100, n = m % 10;
            if (t >= 11 && t <= 14) return 'минут';
            if (n === 1) return 'минута';
            if (n >= 2 && n <= 4) return 'минуты';
            return 'минут';
        }

        // Вызывается ТОЛЬКО из touchend/pointerup (внутри пользовательского жеста).
        // Никаких setTimeout — иначе iOS не пропустит.
        function speakTime() {
            if (!('speechSynthesis' in window)) return;
            try {
                refreshVoice();

                const text = minute === 0
                    ? `${HOURS[hour]} ${hourForm(hour)} ровно`
                    : `${HOURS[hour]} ${hourForm(hour)} ${minute} ${minuteForm(minute)}`;

                const u = new SpeechSynthesisUtterance(text);
                u.lang   = 'ru-RU';
                u.rate   = 0.9;
                u.pitch  = 1;
                u.volume = 1;
                if (cachedVoice) u.voice = cachedVoice;

                // Иногда на iOS очередь залипает в "paused" — пробуем разбудить
                try { speechSynthesis.resume(); } catch (e) {}

                speechSynthesis.speak(u);
            } catch (e) {}
        }

        /* ============================================================
           УТИЛИТЫ
           ============================================================ */
        function setView(view) {
            currentView = view;
            if (view === 'watch') {
                watchView.classList.remove('hidden');
                schemeView.classList.remove('active');
                clockView.classList.remove('view-scheme');
                clockView.classList.add('view-watch');
            } else {
                watchView.classList.add('hidden');
                schemeView.classList.add('active');
                clockView.classList.remove('view-watch');
                clockView.classList.add('view-scheme');
            }
        }

        function toggleView() {
            setView(currentView === 'watch' ? 'scheme' : 'watch');
        }

        function applyTotal() {
            const rounded = Math.round(totalMinutes);
            minute = ((rounded % 60) + 60) % 60;
            let h = Math.floor(rounded / 60) % 12;
            h = ((h % 12) + 12) % 12;
            hour = h === 0 ? 12 : h;
        }

        let renderQueued = false;
        function render() {
            if (renderQueued) return;
            renderQueued = true;
            requestAnimationFrame(() => {
                renderQueued = false;
                const hourDeg   = (hour % 12) * 30 + minute * 0.5;
                const minuteDeg = minute * 6;
                hourHandEl  .setAttribute('transform', `rotate(${hourDeg} ${CX} ${CY})`);
                minuteHandEl.setAttribute('transform', `rotate(${minuteDeg} ${CX} ${CY})`);

                const hh = String(hour).padStart(2, '0');
                const mm = String(minute).padStart(2, '0');
                digital24El.textContent = `${hh}:${mm}`;
            });
        }

        function getPoint(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            if (e.changedTouches && e.changedTouches.length > 0) {
                return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function angleFromPoint(p) {
            const rect  = clockView.getBoundingClientRect();
            const scale = rect.width / VIEWBOX_W;
            const cx = rect.left + CX * scale;
            const cy = rect.top  + CY * scale;
            let a = Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI + 90;
            return (a % 360 + 360) % 360;
        }

        function angleDiff(a, b) {
            const d = Math.abs(a - b) % 360;
            return d > 180 ? 360 - d : d;
        }

        function isPointInsideWatch(p) {
            const rect  = clockView.getBoundingClientRect();
            const scale = rect.width / VIEWBOX_W;
            const cx = rect.left + CX * scale;
            const cy = rect.top  + CY * scale;
            const dist = Math.hypot(p.x - cx, p.y - cy);
            return dist <= 170 * scale;
        }

        /* ============================================================
           ЖЕСТЫ
           ============================================================ */
        let gesture = null;

        function startGesture(point, source) {
            if (gesture) return;

            // Отменяем предыдущую озвучку — но ТОЛЬКО если она не является
            // свежей unlock-фразой (её отменять нельзя).
            if (speechUnlockedOnce && 'speechSynthesis' in window) {
                try {
                    if (speechSynthesis.speaking || speechSynthesis.pending) {
                        speechSynthesis.cancel();
                    }
                } catch (e) {}
            }

            // Разблокировка синтезатора — только один раз за сессию.
            // Никакого cancel после этой строки!
            unlockSpeech();

            gesture = {
                startX: point.x,
                startY: point.y,
                startTime: Date.now(),
                mode: null,
                pointer: null,
                angle: 0,
                source: source
            };
        }

        function moveGesture(e, point) {
            if (!gesture) return;
            const dx = point.x - gesture.startX;
            const dy = point.y - gesture.startY;
            const adx = Math.abs(dx);
            const ady = Math.abs(dy);

            if (!gesture.mode) {
                if (adx < MOVE_THRESHOLD && ady < MOVE_THRESHOLD) return;

                // Вертикальное движение → отдаём скроллу страницы
                if (ady > adx * 1.5) {
                    gesture.mode = 'scroll';
                    return;
                }

                if (currentView === 'watch' && isPointInsideWatch(point)) {
                    gesture.mode = 'drag';
                    const ang = angleFromPoint(point);
                    const hourAng = ((hour % 12) * 30 + minute * 0.5 + 360) % 360;
                    const minAng  = (minute * 6 + 360) % 360;
                    gesture.pointer = angleDiff(ang, minAng) <= angleDiff(ang, hourAng) ? 'minute' : 'hour';
                    gesture.angle = ang;
                    clockView.classList.add('dragging');
                } else {
                    gesture.mode = 'other';
                }
            }

            if (gesture.mode === 'drag') {
                if (e.cancelable !== false) {
                    try { e.preventDefault(); } catch (err) {}
                }
                const ang = angleFromPoint(point);
                if (gesture.pointer === 'minute') {
                    let delta = ang - gesture.angle;
                    if (delta > 180) delta -= 360;
                    if (delta < -180) delta += 360;
                    totalMinutes += delta / 6;
                    applyTotal();
                } else {
                    let h = (ang - minute * 0.5) / 30;
                    h = ((Math.round(h) % 12) + 12) % 12;
                    hour = h === 0 ? 12 : h;
                    totalMinutes = (hour % 12) * 60 + minute;
                }
                gesture.angle = ang;
                render();
            }
        }

        function endGesture(point) {
            if (!gesture) return;
            const duration  = Date.now() - gesture.startTime;
            const wasDrag   = gesture.mode === 'drag';
            const wasScroll = gesture.mode === 'scroll';
            const wasOther  = gesture.mode === 'other';

            if (wasDrag) {
                clockView.classList.remove('dragging');
                // Речь синхронно внутри touchend — iOS это требует.
                speakTime();
            } else if (!wasScroll && !wasOther && point &&
                       duration >= TAP_MIN_DURATION &&
                       duration <  TAP_MAX_DURATION) {
                // Удержание длилось достаточно для осознанного «тапа»,
                // но не превратилось в длинный press.
                const ddx = Math.abs(point.x - gesture.startX);
                const ddy = Math.abs(point.y - gesture.startY);
                if (ddx < TAP_MAX_MOVE && ddy < TAP_MAX_MOVE) {
                    if (currentView === 'scheme' || isPointInsideWatch(point)) {
                        toggleView();
                    }
                }
            }

            gesture = null;
        }

        function cancelGesture() {
            if (!gesture) return;
            if (gesture.mode === 'drag') {
                clockView.classList.remove('dragging');
            }
            gesture = null;
        }

        /* ---------- Touch events (iOS / Android) ---------- */
        clockView.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            startGesture(getPoint(e), 'touch');
        }, { passive: true });

        clockView.addEventListener('touchmove', (e) => {
            if (!gesture || gesture.source !== 'touch') return;
            if (e.touches.length !== 1) { cancelGesture(); return; }
            moveGesture(e, getPoint(e));
        }, { passive: false });

        clockView.addEventListener('touchend', (e) => {
            if (!gesture || gesture.source !== 'touch') return;
            endGesture(getPoint(e));
        }, { passive: true });

        clockView.addEventListener('touchcancel', () => {
            if (!gesture || gesture.source !== 'touch') return;
            cancelGesture();
        }, { passive: true });

        /* ---------- Mouse events (desktop) ---------- */
        clockView.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            startGesture(getPoint(e), 'mouse');
        });

        window.addEventListener('mousemove', (e) => {
            if (!gesture || gesture.source !== 'mouse') return;
            moveGesture(e, getPoint(e));
        });

        window.addEventListener('mouseup', (e) => {
            if (!gesture || gesture.source !== 'mouse') return;
            endGesture(getPoint(e));
        });

        window.clockSpeakCancel = function () {
            if ('speechSynthesis' in window) {
                try { speechSynthesis.cancel(); } catch (e) {}
            }
        };

        render();
        setView('watch');
    })();
    </script>
