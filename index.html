<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>Грамотиньо</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --bg-card: #0d0d0d;
            --bg-card-hover: #1a1a1a;
            --border: #ffffff;
            --text: #ffffff;
            --text-secondary: #8a8a8a;
            --accent: #e30613;
            --learned-bg: #1c1c1c;
            --learned-fg: #6a6a6a;
            --radius: 0px;
            --transition: 0.15s linear;
            --font: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif;
            --mono: 'Courier New', Courier, monospace;
        }

        body.light-mode {
            --bg: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f0;
            --border: #000000;
            --text: #000000;
            --text-secondary: #767676;
            --learned-bg: #e4e4e4;
            --learned-fg: #9a9a9a;
        }

        body.theme-blue   { --accent: #0033ff; }
        body.theme-green  { --accent: #00a300; }
        body.theme-red    { --accent: #e30613; }
        body.theme-orange { --accent: #ff6a00; }
        body.theme-purple { --accent: #7b00ff; }
        body.theme-pink   { --accent: #ff0080; }
        body.theme-cyan   { --accent: #00b3c7; }
        body.theme-yellow { --accent: #ffc700; }
        body.theme-teal   { --accent: #009688; }
        body.theme-indigo { --accent: #3f51b5; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            min-height: 100vh;
            line-height: 1.35;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            transition: background 0.2s linear, color 0.2s linear;
        }

        /* ================= ШАПКА ================= */

        .header {
            padding: 22px 20px 0;
            text-align: center;
            border-bottom: 3px solid var(--border);
            position: relative;
            background: var(--bg);
        }

        .theme-toggle,
        .theme-cycle { position: absolute; top: 18px; }

        .theme-toggle { right: 20px; }
        .theme-cycle  { left: 20px; }

        .theme-toggle button,
        .theme-cycle button {
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 0;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .theme-toggle button:hover,
        .theme-cycle button:hover {
            background: var(--text);
            color: var(--bg);
        }

        .theme-cycle .color-indicator {
            width: 16px;
            height: 16px;
            border-radius: 0;
            background: var(--accent);
            transition: background 0.2s linear;
        }

        .theme-toggle .theme-ball {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffd400;
            transition: background 0.2s linear;
        }
        body.light-mode .theme-toggle .theme-ball {
            background: #000000;
        }

        .header h1 {
            font-size: clamp(2.2rem, 8.5vw, 4.6rem);
            font-weight: 800;
            letter-spacing: 0.015em;
            text-transform: uppercase;
            line-height: 0.92;
            color: var(--text);
            margin: 30px 0 14px;
        }

        .header h1::after {
            content: '.';
            color: var(--accent);
        }

        /* ================= ПЕРЕКЛЮЧАТЕЛЬ РАЗДЕЛОВ ================= */

        .section-switch {
            display: flex;
            margin: 0 -20px;
            border-top: 2px solid var(--border);
            background: var(--bg);
        }

        .section-switch-btn {
            flex: 1 1 0;
            background: transparent;
            border: none;
            border-right: 2px solid var(--border);
            color: var(--text-secondary);
            padding: 15px 8px;
            cursor: pointer;
            font-family: var(--font);
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: var(--transition);
            white-space: nowrap;
        }

        .section-switch-btn:last-child { border-right: none; }

        .section-switch-btn.active {
            background: var(--text);
            color: var(--bg);
        }

        .section-switch-btn:hover:not(.active) {
            background: var(--bg-card-hover);
            color: var(--text);
        }

        /* ================= ПОДПИСИ ПОД КНОПКАМИ ================= */

        .section-subtitles {
            display: flex;
            margin: 0 -20px;
            background: var(--bg);
        }

        .section-subtitle {
            flex: 1 1 0;
            border-right: 2px solid var(--border);
            padding: 12px 10px;
            text-align: center;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s linear, visibility 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 3.2em;
            line-height: 1.35;
        }

        .section-subtitle:last-child { border-right: none; }

        .section-subtitle.active {
            opacity: 1;
            visibility: visible;
        }

        .digital-clock-inline {
            font-family: var(--mono);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            color: var(--text);
            background: transparent;
            border: none;
            padding: 0;
            text-transform: none;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* ================= КОНТЕНТ ================= */

        .content-wrapper {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        .tab-section { display: none; }
        .tab-section.active { display: block; animation: tabEnter 0.25s linear forwards; }

        @keyframes tabEnter {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ================= ПРОГРЕСС ================= */

        .progress-container {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--text);
            color: var(--bg);
            padding: 16px 20px 18px;
            z-index: 900;
            transform: translateY(101%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 4px solid var(--accent);
            pointer-events: none;
        }

        .progress-container.show {
            transform: translateY(0);
            pointer-events: auto;
        }

        .progress-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: left;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(128, 128, 128, 0.35);
            border-radius: 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            border-radius: 0;
            transition: width 0.3s linear;
        }

        /* ================= КНОПКИ УПРАВЛЕНИЯ ================= */

        .controls {
            display: flex;
            justify-content: center;
            gap: 0;
            padding: 24px 20px 20px;
            flex-wrap: wrap;
        }

        .controls button {
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 0;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
            margin-left: -2px;
            font-family: var(--font);
        }

        .controls button:first-child { margin-left: 0; }

        .controls button:hover {
            background: var(--text);
            color: var(--bg);
            z-index: 3;
        }

        .controls button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            z-index: 2;
        }

        .controls button.active:hover {
            background: var(--accent);
            color: #ffffff;
        }

        .controls button::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: var(--text);
            color: var(--bg);
            padding: 7px 11px;
            border-radius: 0;
            font-family: var(--font);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            white-space: nowrap;
            border: none;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s linear, transform 0.15s linear, visibility 0.15s;
            z-index: 10;
        }

        .controls button:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* ================= СЕТКА СЛОГОВ ================= */

        .grid-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 60px;
            width: 100%;
        }

        .syllable-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            border-top: 2px solid var(--border);
            border-left: 2px solid var(--border);
        }

        .syllable-grid.hide-learned .syllable-card.learned { display: none; }

        .syllable-card {
            background: var(--bg);
            border-right: 2px solid var(--border);
            border-bottom: 2px solid var(--border);
            border-radius: 0;
            padding: 18px 8px;
            text-align: center;
            cursor: pointer;
            font-size: clamp(0.9rem, 1.7vw, 1.05rem);
            font-weight: 700;
            color: var(--text);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.12s linear, color 0.12s linear;
            position: relative;
            font-family: var(--font);
            letter-spacing: 0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 68px;
        }

        .syllable-card:not(.learned):hover {
            background: var(--text);
            color: var(--bg);
        }

        .syllable-card.playing {
            background: var(--accent);
            color: #ffffff;
        }

        .syllable-card.learned {
            background: var(--learned-bg);
            color: var(--learned-fg);
        }

        .syllable-card.learned .syllable-text {
            text-decoration: line-through;
            opacity: 0.55;
        }

        .learn-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 13px;
            height: 13px;
            background: transparent;
            border: 2px solid var(--border);
            border-radius: 0;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0.3;
        }

        .syllable-card:not(.learned):hover .learn-dot {
            border-color: var(--bg);
            opacity: 1;
        }

        .learn-dot:hover { opacity: 1; }

        .syllable-card.learned .learn-dot {
            background: var(--accent);
            border-color: var(--accent);
            opacity: 1;
        }

        /* ================= КНОПКА НАВЕРХ ================= */

        .scroll-top-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 0;
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            font-size: 1.3rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 1001;
        }

        .scroll-top-btn.visible { display: flex; }
        .scroll-top-btn:hover { background: var(--text); color: var(--bg); }

        /* ================= ЭКЗАМЕН ================= */

        .exam-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 34px;
        }

        .exam-overlay.show { display: flex; }

        .exam-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .exam-question {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .exam-repeat-btn,
        .exam-next-btn {
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 0;
            width: 46px;
            height: 46px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .exam-repeat-btn:hover {
            background: var(--text);
            color: var(--bg);
        }

        .exam-next-btn {
            display: none;
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            font-size: 1.4rem;
        }

        .exam-next-btn.show { display: flex; }
        .exam-next-btn:hover { opacity: 0.8; }

        .exam-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            max-width: 620px;
            width: 100%;
        }

        .exam-option {
            padding: 20px 12px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 0;
            cursor: pointer;
            text-align: center;
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: var(--transition);
        }

        .exam-option:hover:not(:disabled) {
            background: var(--text);
            color: var(--bg);
        }

        .exam-option.correct {
            background: #00a300;
            border-color: #00a300;
            color: #ffffff;
        }

        .exam-option.wrong {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .exam-result {
            font-size: 2.4rem;
            text-align: center;
            min-height: 2.4rem;
            line-height: 1;
        }

        .exam-exit-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 0;
            width: 46px;
            height: 46px;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 10;
        }

        .exam-exit-btn:hover {
            background: var(--text);
            color: var(--bg);
        }

        /* ================= ПОЗДРАВЛЕНИЕ ================= */

        .celebration-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .celebration-overlay.show { display: flex; }

        .celebration-box {
            background: var(--bg);
            border: 3px solid var(--border);
            border-radius: 0;
            padding: 28px;
            text-align: center;
            max-width: 90vw;
            max-height: 90vh;
        }

        .celebration-box h2 {
            margin-bottom: 18px;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .celebration-box img {
            max-width: 300px;
            max-height: 250px;
            border-radius: 0;
            border: 2px solid var(--border);
        }

        .celebration-close {
            margin-top: 20px;
            padding: 12px 34px;
            background: var(--text);
            color: var(--bg);
            border: 2px solid var(--text);
            border-radius: 0;
            cursor: pointer;
            font-family: var(--font);
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .celebration-close:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        /* ================= ТОСТЫ ================= */

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 0;
            padding: 13px 22px;
            font-family: var(--font);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            animation: toastIn 0.2s linear, toastOut 0.2s linear 2.5s forwards;
            pointer-events: auto;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; }
            to   { opacity: 0; }
        }

        /* ================= ПОДВАЛ ================= */

        .footer {
            text-align: center;
            padding: 22px 20px;
            color: var(--text-secondary);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            border-top: 3px solid var(--border);
        }

        /* ============================================================
           ЛИЧНОСТИ
           ============================================================ */

        .heroes-timeline {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            position: relative;
        }

        .timeline-container {
            position: relative;
            padding-left: 60px;
        }

        .timeline-line {
            position: absolute;
            left: 30px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
            z-index: 0;
        }

        .century-sentinel {
            height: 1px;
            margin: 60px 0 40px;
            position: relative;
        }

        .century-sentinel:first-child { margin-top: 0; }

        .century-sentinel::before {
            content: '';
            position: absolute;
            left: -37px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 0;
            z-index: 1;
        }

        .hero-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 26px;
            cursor: pointer;
            padding: 0;
            border-radius: 0;
        }

        .hero-circle {
            width: 82px;
            height: 82px;
            border-radius: 0;
            border: 2px solid var(--border);
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-card);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.2s linear,
                        box-shadow 0.3s linear;
            position: relative;
            z-index: 1;
            transform-origin: center center;
        }

        .hero-item:hover .hero-circle {
            transform: scale(1.45);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 5;
        }

        .hero-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.1);
            transition: filter 0.3s linear;
        }

        .hero-item:hover .hero-circle img {
            filter: grayscale(0) contrast(1);
        }

        .hero-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
            z-index: 2;
        }

        .hero-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        .hero-years {
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.08em;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .hero-age {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
        }

        .soviet-era {
            background: rgba(227, 6, 19, 0.07);
            margin: 40px 0 40px -60px;
            padding: 44px 30px 44px 60px;
            position: relative;
            border-left: 6px solid #e30613;
            border-radius: 0;
        }

        body.light-mode .soviet-era { background: rgba(227, 6, 19, 0.05); }

        .soviet-era::before {
            content: '☭';
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            font-size: 7rem;
            font-weight: 900;
            color: rgba(227, 6, 19, 0.09);
            pointer-events: none;
            line-height: 1;
        }

        .soviet-era::after {
            content: 'СССР';
            position: absolute;
            top: 18px;
            right: 24px;
            font-size: 0.8rem;
            font-weight: 800;
            color: #e30613;
            letter-spacing: 0.3em;
            pointer-events: none;
        }

        .century-popup {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 15px 34px;
            border-radius: 0;
            font-family: var(--font);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .century-popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .hero-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: tabEnter 0.2s linear;
        }

        .hero-modal-content {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            font-size: 1.6rem;
            width: 48px;
            height: 48px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-family: var(--font);
            line-height: 1;
        }

        .hero-modal-close:hover {
            background: var(--text);
            color: var(--bg);
        }

        .hero-modal-repeat {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 0;
            width: 48px;
            height: 48px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 20;
        }

        .hero-modal-repeat:hover {
            background: var(--text);
            color: var(--bg);
        }

        .hero-modal-portrait {
            max-width: 88%;
            max-height: 62vh;
            object-fit: contain;
            border-radius: 0;
            border: 3px solid var(--border);
        }

        .hero-modal h3 {
            font-size: clamp(1.4rem, 5vw, 2.4rem);
            margin: 24px 0 0;
            color: var(--text);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .hero-modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .hero-modal-nav button {
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            font-size: 1.6rem;
            width: 52px;
            height: 52px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            border-radius: 0;
            font-family: var(--font);
        }

        .hero-modal-nav button:hover {
            background: var(--text);
            color: var(--bg);
        }

        /* ============================================================
           ЧАСЫ — часы и схема в одном блоке, переключаются кликом
           ============================================================ */

        .clock-wrapper {
            padding: 50px 0 80px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .clock-stack {
            width: min(400px, 88vw);
            margin: 0 auto;
        }

        .clock-view {
            width: 100%;
            aspect-ratio: 440 / 520;
            position: relative;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.35));
        }

        body.light-mode .clock-view {
            filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.18));
        }

        .clock-view.view-watch { cursor: grab; }
        .clock-view.view-watch.dragging { cursor: grabbing; }
        .clock-view.view-scheme { cursor: pointer; }

        .watch-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .watch-container svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .scheme-view {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .scheme-view.active { display: flex; }

        .scheme-view svg {
            width: 100%;
            height: auto;
            max-height: 100%;
            display: block;
            overflow: visible;
        }

        .clock-view .watch-container.hidden { display: none; }

        /* ============================================================
           АДАПТИВ
           ============================================================ */

        @media (max-width: 1024px) {
            .syllable-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 640px) {
            .header { padding: 16px 14px 0; }
            .header h1 { margin: 34px 0 10px; letter-spacing: 0.01em; }

            .theme-toggle { top: 12px; right: 14px; }
            .theme-cycle  { top: 12px; left: 14px; }
            .theme-toggle button,
            .theme-cycle button { width: 32px; height: 32px; font-size: 0.85rem; }
            .theme-cycle .color-indicator { width: 13px; height: 13px; }
            .theme-toggle .theme-ball { width: 13px; height: 13px; }

            .section-switch { margin: 0 -14px; }
            .section-switch-btn {
                font-size: 0.6rem;
                padding: 13px 4px;
                letter-spacing: 0.04em;
                white-space: normal;
            }

            .section-subtitles { margin: 0 -14px; }
            .section-subtitle {
                font-size: 0.52rem;
                padding: 10px 4px;
                letter-spacing: 0.08em;
                min-height: 3.2em;
            }

            .digital-clock-inline { font-size: 0.9rem; letter-spacing: 0.1em; }

            .content-wrapper { padding: 0 14px; }
            .grid-container { padding: 0 14px 50px; }

            .syllable-grid { grid-template-columns: repeat(2, 1fr); }
            .syllable-card {
                font-size: 0.82rem;
                min-height: 54px;
                padding: 12px 4px;
            }
            .learn-dot { width: 10px; height: 10px; bottom: 4px; right: 4px; border-width: 1px; }

            .controls { padding: 18px 14px 14px; }
            .controls button { width: 42px; height: 42px; font-size: 1.15rem; }
            .controls button::after { display: none; }

            .exam-exit-btn { top: auto; bottom: 14px; left: 14px; width: 40px; height: 40px; font-size: 1.1rem; }
            .exam-options { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .exam-option { padding: 16px 8px; font-size: 0.9rem; }

            .heroes-timeline { padding: 0 14px; }
            .timeline-container { padding-left: 46px; }
            .timeline-line { left: 22px; }
            .century-sentinel::before { left: -29px; width: 14px; height: 14px; }
            .hero-circle { width: 64px; height: 64px; }
            .hero-item { gap: 14px; margin-bottom: 20px; }
            .hero-name { font-size: 0.9rem; }
            .hero-years { font-size: 0.68rem; }
            .hero-age { font-size: 0.6rem; }
            .hero-item:hover .hero-circle { transform: scale(1.25); }

            .soviet-era { margin-left: -46px; padding: 30px 16px 30px 46px; }
            .soviet-era::before { font-size: 4.5rem; right: 8px; }
            .soviet-era::after { font-size: 0.6rem; right: 12px; top: 12px; letter-spacing: 0.2em; }

            .century-popup { font-size: 0.65rem; padding: 11px 22px; bottom: 24px; letter-spacing: 0.14em; }

            .hero-modal-nav button { width: 44px; height: 44px; font-size: 1.3rem; }
            .hero-modal-portrait { max-height: 52vh; }

            .clock-wrapper { padding: 30px 0 60px; }
            .clock-stack { width: min(340px, 94vw); }

            .progress-container { padding: 12px 14px 14px; }
        }

            function loadLearnedSet() {
                try { return new Set(JSON.parse(localStorage.getItem('learned_syllables') || '[]')); }
                catch { return new Set(); }

            function applyTheme(themeClass) {
                document.body.className = '';
                document.body.classList.add(themeClass);
                if (localStorage.getItem('theme') !== 'dark') {
                    document.body.classList.add('light-mode');
                }
                localStorage.setItem('accentTheme', themeClass);
                const accent = getComputedStyle(document.body).getPropertyValue('--accent').trim();
                colorIndicator.style.background = accent;
            }

            let currentThemeIndex = 0;
            const savedTheme = localStorage.getItem('accentTheme') || 'theme-blue';
            currentThemeIndex = themeList.indexOf(savedTheme);
            if (currentThemeIndex === -1) currentThemeIndex = 0;
            applyTheme(themeList[currentThemeIndex]);

                document.body.classList.add('light-mode');
            }

                if (section === currentSection) return;

                heroesSection.classList.toggle('active', section === 'heroes');

                    btn.classList.toggle('active', btn.dataset.section === section);
                });
                sectionSubtitleEls.forEach(el => {
                    el.classList.toggle('active', el.dataset.section === section);

                if (section !== 'clock' && window.clockSpeakCancel) {

            function refreshProgressData() {
                const total = syllables.length;
                const marked = [...syllables].filter(s => learnedSet.has(s)).length;
                const percent = total ? Math.round((marked / total) * 100) : 0;
                progressLabel.textContent = `Отмечено: ${marked} из ${total}`;
                progressFill.style.width = percent + '%';
            }

            function flashProgress() {
                refreshProgressData();
                progressContainer.classList.add('show');
                clearTimeout(progressTimer);
                progressTimer = setTimeout(() => {
                    progressContainer.classList.remove('show');
                }, 2400);
            }

            function renderGrid() {
                grid.innerHTML = '';
                const items = currentMode === 'random' ? randomItems : syllables;
                items.forEach(syllable => {
                    const card = document.createElement('div');
                    card.className = 'syllable-card';
                    card.dataset.syllable = syllable;
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    const textSpan = document.createElement('span');
                    textSpan.className = 'syllable-text';
                    textSpan.textContent = syllable;
                    textSpan.style.pointerEvents = 'none';
                    card.appendChild(textSpan);
                    const dot = document.createElement('div');
                    dot.className = 'learn-dot';
                    dot.title = 'Отметить';
                    dot.setAttribute('role', 'checkbox');
                    dot.setAttribute('aria-checked', learnedSet.has(syllable));
                    card.appendChild(dot);
                    if (learnedSet.has(syllable)) card.classList.add('learned');
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleLearned(syllable, card);
                    });
                    card.addEventListener('click', () => handleSyllableClick(syllable, card));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleSyllableClick(syllable, card);
                        }
                    });
                    grid.appendChild(card);
                });
                refreshProgressData();
            }

            function toggleLearned(syllable, card) {
                if (learnedSet.has(syllable)) {
                    learnedSet.delete(syllable);
                } else {
                    learnedSet.add(syllable);
                }
                saveLearnedSet(learnedSet);
                card.classList.toggle('learned', learnedSet.has(syllable));
                flashProgress();
            }

            function playAudio(syllable) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                }
                const audio = new Audio('audio/' + syllable + '.mp3');
                audio.volume = 1;
                currentAudio = audio;
                audio.addEventListener('ended', () => { currentAudio = null; });
                audio.play().catch(() => {});
            }

            function handleSyllableClick(syllable, card) {
                card.classList.add('playing');
                setTimeout(() => card.classList.remove('playing'), 700);
                playAudio(syllable);
            }

            examBtn.addEventListener('click', startExam);
            function startExam() {
                examOverlay.classList.add('show');
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';
                examQuestions = getRandomExamQuestions(10);
                examIndex = 0;
                examScore = 0;
                showNextExamQuestion();
            }
            function getRandomExamQuestions(count) {
                const shuffled = syllables.slice().sort(() => Math.random() - 0.5);
                return shuffled.slice(0, Math.min(count, shuffled.length));
            }
            function showNextExamQuestion() {
                if (examIndex >= examQuestions.length) {
                    examOverlay.classList.remove('show');
                    if (examScore === 10) {
                        showCelebration();
                    } else {
                        showToast(`Верно ${examScore} из 10`, 'info');
                    }
                    return;
                }
                const correct = examQuestions[examIndex];
                currentExamCorrect = correct;
                examQuestion.textContent = `Вопрос ${examIndex+1} из ${examQuestions.length}`;
                examResult.textContent = '';
                examNextBtn.classList.remove('show');
                examRepeatBtn.style.display = 'flex';

                const variants = new Set([correct]);
                const firstLetter = correct.charAt(0).toUpperCase();
                const sameLetterPool = syllables.filter(item =>
                    item !== correct && item.charAt(0).toUpperCase() === firstLetter
                );
                const maxSameLetter = Math.min(5, sameLetterPool.length);
                const shuffledSame = sameLetterPool.sort(() => Math.random() - 0.5).slice(0, maxSameLetter);
                shuffledSame.forEach(item => variants.add(item));
                const fallbackPool = syllables.filter(item => !variants.has(item));
                while (variants.size < 6 && fallbackPool.length > 0) {
                    const randomItem = fallbackPool[Math.floor(Math.random() * fallbackPool.length)];
                    variants.add(randomItem);
                    fallbackPool.splice(fallbackPool.indexOf(randomItem), 1);
                }
                const variantsArray = [...variants].sort(() => Math.random() - 0.5);

                examOptions.innerHTML = '';
                variantsArray.forEach(variant => {
                    const btn = document.createElement('button');
                    btn.className = 'exam-option';
                    btn.textContent = variant.toUpperCase();
                    btn.addEventListener('click', () => handleExamAnswer(btn, variant, correct));
                    examOptions.appendChild(btn);
                });
                playAudio(correct);
            }
            function handleExamAnswer(btn, selected, correct) {
                const allOptions = examOptions.querySelectorAll('.exam-option');
                allOptions.forEach(opt => opt.disabled = true);
                if (selected === correct) {
                    btn.classList.add('correct');
                    examScore++;
                    examResult.textContent = '👍';
                } else {
                    btn.classList.add('wrong');
                    allOptions.forEach(opt => {
                        if (opt.textContent === correct.toUpperCase()) opt.classList.add('correct');
                    });
                    examResult.textContent = '❌';
                }
                examRepeatBtn.style.display = 'none';
                examNextBtn.classList.add('show');
                examNextBtn.focus();
            }
            examNextBtn.addEventListener('click', () => {
                examIndex++;
                showNextExamQuestion();
            });

                examOverlay.classList.remove('show');

                { name: "Сталин", birthYear: 1878, deathYear: 1953, images: ["Сталин.jpg","Сталин2.jpg","Сталин3.jpg","Сталин4.jpg","Сталин5.jpg","Сталин6.jpg","Сталин7.jpg","Сталин8.jpg","Сталин9.jpg"], audio: "Сталин.mp3" },
                { name: "Суворов", birthYear: 1729, deathYear: 1800, images: ["Суворов.jpg"], audio: "Суворов.mp3" },
                { name: "Толстой", birthYear: 1828, deathYear: 1910, images: ["Толстой.jpg","Толстой2.jpg","Толстой3.jpg","Толстой4.jpg"], audio: "Толстой.mp3" },
                { name: "Тургенев", birthYear: 1818, deathYear: 1883, images: ["Тургенев.jpg"], audio: "Тургенев.mp3" },
                { name: "Фрунзе", birthYear: 1885, deathYear: 1925, images: ["Фрунзе.jpg"], audio: "Фрунзе.mp3" },
                { name: "Циолковский", birthYear: 1857, deathYear: 1935, images: ["Циолковский.jpg"], audio: "Циолковский.mp3" },
                { name: "Чайковский", birthYear: 1840, deathYear: 1893, images: ["Чайковский.jpg"], audio: "Чайковский.mp3" },
                { name: "Чернышевский", birthYear: 1828, deathYear: 1889, images: ["Чернышевский.jpg"], audio: "Чернышевский.mp3" },
                { name: "Чехов", birthYear: 1860, deathYear: 1904, images: ["Чехов.jpg"], audio: "Чехов.mp3" },
                { name: "Шишкин", birthYear: 1832, deathYear: 1898, images: ["Шишкин.jpg"], audio: "Шишкин.mp3" },
                { name: "Шолохов", birthYear: 1905, deathYear: 1984, images: ["Шолохов.jpg"], audio: "Шолохов.mp3" }
            ];

            function renderHeroesTimeline() {
                if (!heroesTimeline) return;

                const centuries = [
                    { name: "XVIII век", filter: h => h.overrideCentury === 18 || (!h.overrideCentury && h.deathYear < 1801) },
                    { name: "XIX век",   filter: h => h.overrideCentury === 19 || (!h.overrideCentury && h.deathYear >= 1801 && h.deathYear <= 1921) },
                    { name: "XX век",    filter: h => h.overrideCentury === 20 || (!h.overrideCentury && h.deathYear > 1921) }
                ];

                let html = '<div class="timeline-container">';
                html += '<div class="timeline-line"></div>';

                centuries.forEach(c => {
                    const heroes = heroesData.filter(c.filter).sort((a, b) => a.deathYear - b.deathYear);
                    if (heroes.length === 0) return;

                    html += `<div class="century-sentinel" data-century="${c.name}"></div>`;

                    let sovietStarted = false;

                    heroes.forEach(hero => {
                        if (!sovietStarted && hero.name === "Ленин") {
                            html += `<div class="soviet-era">`;
                            sovietStarted = true;
                        }

                        const imagePath = `Great Rus/${hero.images[0]}`;
                        const age = hero.deathYear - hero.birthYear;

                        html += `
                            <div class="hero-item" 
                                 data-name="${hero.name}" 
                                 data-audio="Great Rus/${hero.audio}" 
                                 data-images='${JSON.stringify(hero.images.map(img => "Great Rus/" + img))}'>
                                <div class="hero-circle">
                                    <img src="${imagePath}" alt="${hero.name}" loading="lazy">
                                </div>
                                <div class="hero-info">
                                    <div class="hero-name">${hero.name}</div>
                                    <div class="hero-years">${hero.birthYear} — ${hero.deathYear} <span class="hero-age">(${age})</span></div>
                                </div>
                            </div>
                        `;
                    });
                    if (sovietStarted) {
                        html += `</div>`;
                    }
                });
                html += '</div>';

                heroesTimeline.innerHTML = html;

                heroesTimeline.querySelectorAll('.hero-item').forEach(item => {
                    item.addEventListener('click', function() {
                        openHeroModal(this.dataset.name, JSON.parse(this.dataset.images), this.dataset.audio);
                    });
                });

                const centuryObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const text = entry.target.dataset.century;
                            centuryPopup.textContent = text;
                            centuryPopup.classList.add('show');
                            clearTimeout(popupHideTimer);
                            popupHideTimer = setTimeout(() => {
                                centuryPopup.classList.remove('show');
                            }, 2200);
                        }
                    });
                }, {
                    threshold: 0,
                    rootMargin: '-15% 0px -75% 0px'
                });

                heroesTimeline.querySelectorAll('.century-sentinel').forEach(sentinel => {
                    centuryObserver.observe(sentinel);
                });
            }

            let heroModal = null;
            let heroAudio = new Audio();
            let currentImageIndex = 0;
            let currentImages = [];

            function openHeroModal(name, images, audioSrc) {
                if (heroModal) heroModal.remove();

                currentImages = images;
                currentImageIndex = 0;

                heroModal = document.createElement('div');
                heroModal.className = 'hero-modal';
                heroModal.innerHTML = `
                    <div class="hero-modal-content">
                        <button class="hero-modal-close">&times;</button>
                        <button class="hero-modal-repeat">🔊</button>
                        <img class="hero-modal-portrait" src="${images[0]}" alt="${name}">
                        <h3>${name}</h3>
                        <div class="hero-modal-nav">
                            <button class="prev-image" style="${images.length <= 1 ? 'display:none;' : ''}">&#10094;</button>
                            <button class="next-image" style="${images.length <= 1 ? 'display:none;' : ''}">&#10095;</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(heroModal);

                playHeroAudio(audioSrc);

                heroModal.querySelector('.hero-modal-close').addEventListener('click', () => {
                    heroModal.remove();
                    heroAudio.pause();
                    heroAudio.currentTime = 0;
                });

                heroModal.addEventListener('click', (e) => {
                    if (e.target === heroModal) {
                        heroModal.remove();
                        heroAudio.pause();
                        heroAudio.currentTime = 0;
                    }
                });

                const prevBtn = heroModal.querySelector('.prev-image');
                const nextBtn = heroModal.querySelector('.next-image');
                if (prevBtn) {
                    prevBtn.addEventListener('click', () => {
                        currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
                        heroModal.querySelector('.hero-modal-portrait').src = currentImages[currentImageIndex];
                    });
                }
                if (nextBtn) {
                    nextBtn.addEventListener('click', () => {
                        currentImageIndex = (currentImageIndex + 1) % currentImages.length;
                        heroModal.querySelector('.hero-modal-portrait').src = currentImages[currentImageIndex];
                    });
                }

                heroModal.querySelector('.hero-modal-repeat').addEventListener('click', () => {
                    playHeroAudio(audioSrc);
                });
            }

            function playHeroAudio(src) {
                heroAudio.src = src;
                heroAudio.play().catch(e => console.log('Ошибка воспроизведения', e));
            }

            renderHeroesTimeline();
            renderGrid();

        })();
    </script>

    <!-- ==================== ЛОГИКА ЧАСОВ + ПЕРЕКЛЮЧЕНИЕ ВИДА ==================== -->
    <script>
    (function () {
        const clockView   = document.getElementById('clockView');
        const watchView   = document.getElementById('watchView');
        const schemeView  = document.getElementById('schemeView');
        const minuteScheme= document.getElementById('minuteScheme');
        if (!clockView || !watchView || !schemeView) return;

        const hourHandEl   = document.getElementById('clk-hourHand');
        const minuteHandEl = document.getElementById('clk-minuteHand');
        const ticksGroup   = document.getElementById('clk-ticksGroup');
        const numbersGroup = document.getElementById('clk-numbersGroup');
        const digital24El  = document.getElementById('clockDigital24');

        const NS = 'http://www.w3.org/2000/svg';
        const CX = 200, CY = 260;
        const VIEWBOX_W = 440;

        /* ============================================================
           СХЕМА-ЦИФЕРБЛАТ МИНУТ (60, 5, 10, ..., 55)
           ============================================================ */
        function buildMinuteScheme() {
            if (!minuteScheme) return;
            minuteScheme.innerHTML = '';

            const SCX = 100, SCY = 100;

            const outer = document.createElementNS(NS, 'circle');
            outer.setAttribute('cx', SCX);
            outer.setAttribute('cy', SCY);
            outer.setAttribute('r', 94);
            outer.setAttribute('fill', 'none');
            outer.setAttribute('stroke', 'currentColor');
            outer.setAttribute('stroke-width', '2');
            minuteScheme.appendChild(outer);

            const inner = document.createElementNS(NS, 'circle');
            inner.setAttribute('cx', SCX);
            inner.setAttribute('cy', SCY);
            inner.setAttribute('r', 86);
            inner.setAttribute('fill', 'none');
            inner.setAttribute('stroke', 'currentColor');
            inner.setAttribute('stroke-width', '0.6');
            inner.setAttribute('opacity', '0.35');
            minuteScheme.appendChild(inner);

            // 12 крупных рисок
            for (let i = 0; i < 12; i++) {
                const a = (i * 30 - 90) * Math.PI / 180;
                const line = document.createElementNS(NS, 'line');
                line.setAttribute('x1', SCX + 82 * Math.cos(a));
                line.setAttribute('y1', SCY + 82 * Math.sin(a));
                line.setAttribute('x2', SCX + 92 * Math.cos(a));
                line.setAttribute('y2', SCY + 92 * Math.sin(a));
                line.setAttribute('stroke', 'currentColor');
                line.setAttribute('stroke-width', '2');
                line.setAttribute('stroke-linecap', 'round');
                minuteScheme.appendChild(line);
            }

            // 60 мелких рисок
            for (let i = 0; i < 60; i++) {
                if (i % 5 === 0) continue;
                const a = (i * 6 - 90) * Math.PI / 180;
                const line = document.createElementNS(NS, 'line');
                line.setAttribute('x1', SCX + 88 * Math.cos(a));
                line.setAttribute('y1', SCY + 88 * Math.sin(a));
                line.setAttribute('x2', SCX + 92 * Math.cos(a));
                line.setAttribute('y2', SCY + 92 * Math.sin(a));
                line.setAttribute('stroke', 'currentColor');
                line.setAttribute('stroke-width', '0.7');
                line.setAttribute('opacity', '0.4');
                minuteScheme.appendChild(line);
            }

            // Числа минут: 60, 5, 10, ..., 55
            for (let i = 0; i < 12; i++) {
                const a = (i * 30 - 90) * Math.PI / 180;
                const val = i === 0 ? 60 : i * 5;

                const text = document.createElementNS(NS, 'text');
                text.setAttribute('x', SCX + 62 * Math.cos(a));
                text.setAttribute('y', SCY + 62 * Math.sin(a));
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'central');
                text.setAttribute('font-family', "'Helvetica Neue', Helvetica, Arial, sans-serif");
                text.setAttribute('font-size', '22');
                text.setAttribute('font-weight', '800');
                text.setAttribute('letter-spacing', '-0.03em');
                text.setAttribute('fill', 'currentColor');
                text.textContent = val;
                minuteScheme.appendChild(text);
            }
        }
        buildMinuteScheme();

        /* ===== Железная дорога и цифры настоящих часов ===== */
        const R_TRACK_IN  = 131;
        const R_TRACK_OUT = 138;

        const cOut = document.createElementNS(NS, 'circle');
        cOut.setAttribute('cx', CX);
        cOut.setAttribute('cy', CY);
        cOut.setAttribute('r', R_TRACK_OUT);
        cOut.setAttribute('fill', 'none');
        cOut.setAttribute('stroke', '#1a1a1a');
        cOut.setAttribute('stroke-width', '0.9');
        ticksGroup.appendChild(cOut);

        const cIn = document.createElementNS(NS, 'circle');
        cIn.setAttribute('cx', CX);
        cIn.setAttribute('cy', CY);
        cIn.setAttribute('r', R_TRACK_IN);
        cIn.setAttribute('fill', 'none');
        cIn.setAttribute('stroke', '#1a1a1a');
        cIn.setAttribute('stroke-width', '0.9');
        ticksGroup.appendChild(cIn);

        for (let i = 0; i < 60; i++) {
            const a = (i * 6 - 90) * Math.PI / 180;
            const isBig = i % 5 === 0;
            const line = document.createElementNS(NS, 'line');

            if (isBig) {
                const rOut = R_TRACK_OUT + 4;
                const rIn  = R_TRACK_IN  - 3;
                line.setAttribute('x1', CX + rIn  * Math.cos(a));
                line.setAttribute('y1', CY + rIn  * Math.sin(a));
                line.setAttribute('x2', CX + rOut * Math.cos(a));
                line.setAttribute('y2', CY + rOut * Math.sin(a));
                line.setAttribute('stroke', '#1a1a1a');
                line.setAttribute('stroke-width', '1.6');
            } else {
                line.setAttribute('x1', CX + R_TRACK_IN  * Math.cos(a));
                line.setAttribute('y1', CY + R_TRACK_IN  * Math.sin(a));
                line.setAttribute('x2', CX + R_TRACK_OUT * Math.cos(a));
                line.setAttribute('y2', CY + R_TRACK_OUT * Math.sin(a));
                line.setAttribute('stroke', '#1a1a1a');
                line.setAttribute('stroke-width', '0.55');
            }
            line.setAttribute('stroke-linecap', 'round');
            ticksGroup.appendChild(line);
        }

        const R_NUM = 110;
        for (let i = 1; i <= 12; i++) {
            const a = (i * 30 - 90) * Math.PI / 180;
            const text = document.createElementNS(NS, 'text');
            text.setAttribute('x', CX + R_NUM * Math.cos(a));
            text.setAttribute('y', CY + R_NUM * Math.sin(a));
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'central');
            text.setAttribute('font-family', "'Old Standard TT', 'Playfair Display', Georgia, 'Times New Roman', serif");
            text.setAttribute('font-size', '26');
            text.setAttribute('font-weight', '700');
            text.setAttribute('fill', i === 12 ? '#b81e1e' : '#1a1a1a');
            text.textContent = i;
            numbersGroup.appendChild(text);
        }

        /* ============================================================
           СОСТОЯНИЕ ЧАСОВ + ПЕРЕКЛЮЧЕНИЕ ВИДА
           ============================================================ */
        let hour = 3;
        let minute = 0;
        let totalMinutes = (hour % 12) * 60 + minute;
        let dragging = null;
        let prevAngle = null;

        // Отслеживание клика vs драга
        let clickStartTime = 0;
        let clickStartX = 0;
        let clickStartY = 0;
        let wasDrag = false;
        let currentView = 'watch';

        function setView(view) {
            currentView = view;
            if (view === 'watch') {
                watchView.classList.remove('hidden');
                schemeView.classList.remove('active');
                clockView.classList.remove('view-scheme');
                clockView.classList.add('view-watch');
            } else {
                watchView.classList.add('hidden');
                schemeView.classList.add('active');
                clockView.classList.remove('view-watch');
                clockView.classList.add('view-scheme');
            }
        }

        function toggleView() {
            setView(currentView === 'watch' ? 'scheme' : 'watch');
        }

        function applyTotal() {
            const rounded = Math.round(totalMinutes);
            minute = ((rounded % 60) + 60) % 60;
            let h = Math.floor(rounded / 60) % 12;
            h = ((h % 12) + 12) % 12;
            hour = h === 0 ? 12 : h;
        }

        function render() {
            const hourDeg   = (hour % 12) * 30 + minute * 0.5;
            const minuteDeg = minute * 6;
            hourHandEl  .setAttribute('transform', `rotate(${hourDeg} ${CX} ${CY})`);
            minuteHandEl.setAttribute('transform', `rotate(${minuteDeg} ${CX} ${CY})`);

            const hh = String(hour).padStart(2, '0');
            const mm = String(minute).padStart(2, '0');
            digital24El.textContent = `${hh}:${mm}`;
        }

        function angleFromEvent(e) {
            const rect  = clockView.getBoundingClientRect();
            const scale = rect.width / VIEWBOX_W;
            const cx = rect.left + CX * scale;
            const cy = rect.top  + CY * scale;
            let a = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI + 90;
            return (a % 360 + 360) % 360;
        }

        function angleDiff(a, b) {
            const d = Math.abs(a - b) % 360;
            return d > 180 ? 360 - d : d;
        }

        function isInsideWatch(e) {
            const rect  = clockView.getBoundingClientRect();
            const scale = rect.width / VIEWBOX_W;
            const cx = rect.left + CX * scale;
            const cy = rect.top  + CY * scale;
            const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
            return dist <= 170 * scale;
        }

        clockView.addEventListener('pointerdown', e => {
            clickStartTime = Date.now();
            clickStartX = e.clientX;
            clickStartY = e.clientY;
            wasDrag = false;

            // Драг работает только в режиме часов
            if (currentView !== 'watch') return;
            if (!isInsideWatch(e)) return;

            e.preventDefault();
            if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
            if ('speechSynthesis' in window) speechSynthesis.cancel();

            const ang = angleFromEvent(e);
            const hourAng = ((hour % 12) * 30 + minute * 0.5 + 360) % 360;
            const minAng  = (minute * 6 + 360) % 360;

            dragging  = angleDiff(ang, minAng) <= angleDiff(ang, hourAng) ? 'minute' : 'hour';
            prevAngle = ang;

            clockView.setPointerCapture(e.pointerId);
            clockView.classList.add('dragging');
        });

        clockView.addEventListener('pointermove', e => {
            // Определение драга по смещению
            if (Math.abs(e.clientX - clickStartX) > 6 ||
                Math.abs(e.clientY - clickStartY) > 6) {
                wasDrag = true;
            }

            if (!dragging) return;
            e.preventDefault();
            const ang = angleFromEvent(e);

            if (dragging === 'minute') {
                let delta = ang - prevAngle;
                if (delta >  180) delta -= 360;
                if (delta < -180) delta += 360;
                totalMinutes += delta / 6;
                applyTotal();
            } else {
                let h = (ang - minute * 0.5) / 30;
                h = ((Math.round(h) % 12) + 12) % 12;
                hour = h === 0 ? 12 : h;
                totalMinutes = (hour % 12) * 60 + minute;
            }

            prevAngle = ang;
            render();
        });

        function endDrag(e) {
            const wasDragging = !!dragging;
            if (dragging) {
                dragging  = null;
                prevAngle = null;
                clockView.classList.remove('dragging');
                if (clockView.hasPointerCapture(e.pointerId)) {
                    clockView.releasePointerCapture(e.pointerId);
                }
                scheduleSpeak();
            }

            // Проверка на «чистый клик» — не драг и не слишком долго
            const duration = Date.now() - clickStartTime;
            if (!wasDrag && !wasDragging && duration < 400) {
                toggleView();
            }
        }
        clockView.addEventListener('pointerup',     endDrag);
        clockView.addEventListener('pointercancel', (e) => {
            // при отмене — не переключаем
            if (dragging) {
                dragging  = null;
                prevAngle = null;
                clockView.classList.remove('dragging');
                if (clockView.hasPointerCapture(e.pointerId)) {
                    clockView.releasePointerCapture(e.pointerId);
                }
            }
        });

        /* ===== Озвучка ===== */
        const HOURS = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть',
                       'семь', 'восемь', 'девять', 'десять', 'одиннадцать', 'двенадцать'];

        function hourForm(h) {
            if (h === 1) return 'час';
            if (h >= 2 && h <= 4) return 'часа';
            return 'часов';
        }
        function minuteForm(m) {
            const t = m % 100, n = m % 10;
            if (t >= 11 && t <= 14) return 'минут';
            if (n === 1) return 'минута';
            if (n >= 2 && n <= 4) return 'минуты';
            return 'минут';
        }

        let ruVoice = null;
        function pickVoice() {
            const v = speechSynthesis.getVoices();
            ruVoice = v.find(x => x.lang && x.lang.toLowerCase().startsWith('ru')) || null;
        }
        if ('speechSynthesis' in window) {
            pickVoice();
            speechSynthesis.onvoiceschanged = pickVoice;
        }

        let speakTimer = null;

        function speakTime() {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();

            const text = minute === 0
                ? `${HOURS[hour]} ${hourForm(hour)} ровно`
                : `${HOURS[hour]} ${hourForm(hour)} ${minute} ${minuteForm(minute)}`;

            const u = new SpeechSynthesisUtterance(text);
            u.lang  = 'ru-RU';
            u.rate  = 0.9;
            u.pitch = 1;
            if (ruVoice) u.voice = ruVoice;
            speechSynthesis.speak(u);
        }

        function scheduleSpeak() {
            if (speakTimer) clearTimeout(speakTimer);
            speakTimer = setTimeout(() => {
                speakTimer = null;
                speakTime();
            }, 2000);
        }

        window.clockSpeakCancel = function () {
            if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        };

        render();
        setView('watch');
    })();
    </script>
