<!-- Старый терминал — только пасхалка (двойной клик) -->
<div class="term-overlay" id="termOverlay">
    <div class="term-header">
        <button class="term-exit" id="termExit" aria-label="Выход">[=====]</button>
    </div>
    <div class="term-body" id="termBody"></div>
</div>

<!-- НОВЫЙ оверлей викторины/диктанта -->
<div class="qd-overlay" id="qdOverlay" aria-hidden="true">
    <button class="qd-close" id="qdClose" type="button" aria-label="Закрыть">×</button>
    <div class="qd-head">
        <div class="qd-label" id="qdLabel"><span class="dot"></span><span>ВИКТОРИНА</span></div>
        <div class="qd-title" id="qdTitle">ЧТО ЗВУЧАЛО?</div>
        <div class="qd-progress"><div class="qd-progress-fill" id="qdProgressFill"></div></div>
        <div class="qd-counter" id="qdCounter">ВОПРОС <b>1</b> ИЗ <b>10</b></div>
    </div>
    <div class="qd-body" id="qdBody"></div>
</div>

<header class="page-header">
    <div class="page-logo">
        <span class="l1">СЛОГИ.</span>
        <span class="l2">УЧИ ЧИТАТЬ</span>
    </div>
</header>

<div class="controls" id="controls">
    <div class="ibtn-wrap active">
        <button class="ibtn underline active" id="normalBtn" title="Все слоги">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="0.5"/><rect x="14" y="3" width="7" height="7" rx="0.5"/><rect x="3" y="14" width="7" height="7" rx="0.5"/><rect x="14" y="14" width="7" height="7" rx="0.5"/></svg>
        </button>
        <span class="ibtn-caption">ВСЕ</span>
    </div>

    <div class="ibtn-wrap">
        <button class="ibtn underline" id="randomBtn" title="Случайные">
            <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <span class="ibtn-caption">СЛУЧАЙНО</span>
    </div>

    <div class="ibtn-wrap">
        <button class="ibtn underline" id="hideLearnedBtn" title="Скрыть изученные">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <span class="ibtn-caption">СКРЫТЬ</span>
    </div>

    <div class="ibtn-wrap">
        <button class="ibtn underline" id="clearLearnedBtn" title="Очистить прогресс">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <span class="ibtn-caption">ОЧИСТИТЬ</span>
    </div>

    <div class="ctrl-sep"></div>

    <div class="ibtn-wrap">
        <button class="ibtn underline" id="examBtn" title="Викторина">
            <svg viewBox="0 0 24 24"><path d="M5 22V3"/><path d="M5 4h12l-2 4 2 4H5"/></svg>
        </button>
        <span class="ibtn-caption">ВИКТОРИНА</span>
    </div>

    <div class="ibtn-wrap">
        <button class="ibtn underline" id="dictationBtn" title="Диктант">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
        <span class="ibtn-caption">ДИКТАНТ</span>
    </div>
</div>

<div class="syllable-grid" id="syllableGrid"></div>

<div class="progress-container" id="progressContainer">
    <div class="progress-label">
        <span>ОТМЕЧЕНО</span>
        <span id="progressLabel">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
