<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <!-- Красное кольцо -->
        <radialGradient id="ringGrad" cx="0.35" cy="0.28" r="0.85">
            <stop offset="0"    stop-color="#FF2A4A"/>
            <stop offset="0.5"  stop-color="#D90429"/>
            <stop offset="1"    stop-color="#7A0116"/>
        </radialGradient>

        <!-- Тёмный фон внутри -->
        <radialGradient id="bgGrad" cx="0.5" cy="0.35" r="0.8">
            <stop offset="0"   stop-color="#1A1A1A"/>
            <stop offset="1"   stop-color="#050505"/>
        </radialGradient>

        <!-- Буква Г: золотисто-песочный градиент, как у Oswald -->
        <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"    stop-color="#F4F1EA"/>
            <stop offset="0.55" stop-color="#E4DDD0"/>
            <stop offset="1"    stop-color="#B8AE9A"/>
        </linearGradient>

        <!-- Внутренняя тень -->
        <radialGradient id="innerShadow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
            <stop offset="1"    stop-color="#000000" stop-opacity="0.35"/>
        </radialGradient>

        <!-- Глянцевый блик -->
        <linearGradient id="gloss" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.45"/>
            <stop offset="0.4"  stop-color="#FFFFFF" stop-opacity="0.05"/>
            <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>

        <!-- Маска портрета -->
        <clipPath id="avatarClip">
            <circle cx="32" cy="32" r="28"/>
        </clipPath>
    </defs>

    <!-- Внешнее кольцо -->
    <circle cx="32" cy="32" r="31" fill="url(#ringGrad)"/>
    <circle cx="32" cy="32" r="30" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.9"/>

    <!-- Чёрный ободок -->
    <circle cx="32" cy="32" r="29" fill="#0A0A0A"/>

    <!-- Внутренний портрет-диск -->
    <g clip-path="url(#avatarClip)">
        <circle cx="32" cy="32" r="28" fill="url(#bgGrad)"/>

        <!-- Тонкая гравировка: вертикальные "полосы" как на стали, очень слабые -->
        <g stroke="#FFFFFF" stroke-width="0.15" opacity="0.06">
            <line x1="8"  y1="0" x2="8"  y2="64"/>
            <line x1="16" y1="0" x2="16" y2="64"/>
            <line x1="24" y1="0" x2="24" y2="64"/>
            <line x1="32" y1="0" x2="32" y2="64"/>
            <line x1="40" y1="0" x2="40" y2="64"/>
            <line x1="48" y1="0" x2="48" y2="64"/>
            <line x1="56" y1="0" x2="56" y2="64"/>
        </g>

        <!-- Буква "Г" — стилизованная, геометрическая -->
        <path d="M 22 20 L 44 20 L 44 24 L 26 24 L 26 46 L 22 46 Z"
              fill="url(#letterGrad)"/>

        <!-- Красная точка-акцент справа от буквы -->
        <circle cx="47" cy="22" r="2.2" fill="#D90429"/>

        <!-- Тонкая линия под буквой, как подчерк -->
        <line x1="22" y1="50" x2="42" y2="50"
              stroke="#D90429" stroke-width="1.4" stroke-linecap="square"/>

        <!-- Тень внутри диска -->
        <circle cx="32" cy="32" r="28" fill="url(#innerShadow)"/>
    </g>

    <!-- Тонкая белая обводка портрета -->
    <circle cx="32" cy="32" r="28" fill="none"
            stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>

    <!-- Глянцевый блик -->
    <circle cx="32" cy="32" r="28" fill="url(#gloss)" pointer-events="none"/>
</svg>
