<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Compressed (JPEG)</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: sans-serif;
        }
        canvas {
            width: min(90vw, 90vh);
            height: min(90vw, 90vh);
            background: #000;
            border-radius: 8px;
        }
        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            background: #c41e3a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
        }
        button:hover { background: #a01830; }
    </style>
</head>
<body>
    <div class="controls">
        <button id="replay">↺ Replay</button>
        <span id="status">Загрузка...</span>
    </div>
    <canvas id="canvas" width="1024" height="1024"></canvas>

    <script>
    (function() {
        const WIDTH = 1024;
        const AREA_POWER = 0.25;
        const SCORE_THRESHOLD = 50;
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const replayBtn = document.getElementById('replay');
        
        // --- Min-heap based priority queue (аналог TinyQueue) ---
        class PriorityQueue {
            constructor(data = [], comparator = (a, b) => a - b) {
                this._data = data;
                this._comparator = comparator;
                this._build();
            }
            _build() {
                for (let i = (this._data.length >> 1) - 1; i >= 0; i--) this._down(i);
            }
            push(value) {
                this._data.push(value);
                this._up(this._data.length - 1);
            }
            pop() {
                if (this._data.length === 0) return undefined;
                const top = this._data[0];
                const bottom = this._data.pop();
                if (this._data.length > 0) {
                    this._data[0] = bottom;
                    this._down(0);
                }
                return top;
            }
            get length() { return this._data.length; }
            _up(i) {
                const data = this._data, comp = this._comparator;
                const node = data[i];
                while (i > 0) {
                    const parent = (i - 1) >> 1;
                    if (comp(node, data[parent]) >= 0) break;
                    data[i] = data[parent];
                    i = parent;
                }
                data[i] = node;
            }
            _down(i) {
                const data = this._data, comp = this._comparator;
                const length = data.length;
                const half = length >> 1;
                const node = data[i];
                while (i < half) {
                    let best = (i << 1) + 1;
                    const right = best + 1;
                    if (right < length && comp(data[right], data[best]) < 0) best = right;
                    if (comp(data[best], node) >= 0) break;
                    data[i] = data[best];
                    i = best;
                }
                data[i] = node;
            }
        }
        
        // --- Анализ изображения ---
        let imageContext = null;
        
        function computeHistogram(x, y, w, h) {
            const { data } = imageContext.getImageData(x, y, w, h);
            const histogram = new Uint32Array(1024);
            for (let i = 0, n = data.length; i < n; i += 4) {
                ++histogram[0 * 256 + data[i + 0]];
                ++histogram[1 * 256 + data[i + 1]];
                ++histogram[2 * 256 + data[i + 2]];
                ++histogram[3 * 256 + data[i + 3]];
            }
            return histogram;
        }
        
        function weightedAverage(histogram) {
            let total = 0, value = 0;
            for (let i = 0; i < 256; ++i) {
                total += histogram[i];
                value += histogram[i] * i;
            }
            value /= total;
            let error = 0;
            for (let i = 0; i < 256; ++i) error += (value - i) ** 2 * histogram[i];
            return [value, Math.sqrt(error / total)];
        }
        
        function colorFromHistogram(histogram) {
            const [r, re] = weightedAverage(histogram.subarray(0, 256));
            const [g, ge] = weightedAverage(histogram.subarray(256, 512));
            const [b, be] = weightedAverage(histogram.subarray(512, 768));
            return [
                Math.round(r), Math.round(g), Math.round(b),
                re * 0.2989 + ge * 0.5870 + be * 0.1140
            ];
        }
        
        // --- Класс Quad ---
        class Quad {
            constructor(x, y, w, h) {
                const [r, g, b, error] = colorFromHistogram(computeHistogram(x, y, w, h));
                this.x = x; this.y = y; this.w = w; this.h = h;
                this.color = `#${(0x1000000 + (r << 16) + (g << 8) + b).toString(16).substring(1)}`;
                this.score = error * Math.pow(w * h, AREA_POWER);
            }
            split() {
                const dx = this.w / 2, x1 = this.x, x2 = this.x + dx;
                const dy = this.h / 2, y1 = this.y, y2 = this.y + dy;
                return [
                    new Quad(x1, y1, dx, dy),
                    new Quad(x2, y1, dx, dy),
                    new Quad(x1, y2, dx, dy),
                    new Quad(x2, y2, dx, dy)
                ];
            }
        }
        
        // --- Вспомогательные функции ---
        function easeCubicInOut(t) {
            return ((t *= 2) <= 1 ? t * t * t : (t -= 2) * t * t + 2) / 2;
        }
        
        function lerp(a, b, t) { return a + (b - a) * t; }
        
        function interpolateQuad(parent, children, t) {
            return children.map((child, i) => ({
                x: lerp(parent.x, child.x, t),
                y: lerp(parent.y, child.y, t),
                w: lerp(parent.w, child.w, t),
                h: lerp(parent.h, child.h, t),
                color: child.color
            }));
        }
        
        function drawCircle(s) {
            ctx.fillStyle = s.color;
            ctx.beginPath();
            ctx.moveTo(s.x + s.w, s.y + s.h / 2);
            ctx.arc(s.x + s.w / 2, s.y + s.h / 2, s.w / 2, 0, 2 * Math.PI);
            ctx.fill();
        }
        
        // --- Главный цикл ---
        let running = false;
        
        async function run() {
            if (running) return;
            running = true;
            statusEl.textContent = 'Анимация...';
            
            const quads = new PriorityQueue(
                [new Quad(0, 0, WIDTH, WIDTH)],
                (a, b) => b.score - a.score
            );
            
            ctx.clearRect(0, 0, WIDTH, WIDTH);
            
            // Начальный круг
            const initial = quads._data[0];
            drawCircle(initial);
            
            await new Promise(r => setTimeout(r, 300));
            
            while (running) {
                const q = quads.pop();
                if (!q || q.score < SCORE_THRESHOLD) break;
                
                const children = q.split();
                children.forEach(c => quads.push(c));
                
                const steps = Math.max(1, Math.floor(q.w / 10));
                for (let j = 1; j <= steps; ++j) {
                    const t = easeCubicInOut(j / steps);
                    const interpolated = interpolateQuad(q, children, t);
                    
                    ctx.clearRect(q.x, q.y, q.w, q.h);
                    interpolated.forEach(drawCircle);
                    
                    await new Promise(r => requestAnimationFrame(() => r()));
                }
            }
            
            running = false;
            statusEl.textContent = 'Готово';
        }
        
        // --- Загрузка изображения ---
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const tmpCanvas = document.createElement('canvas');
                    tmpCanvas.width = WIDTH;
                    tmpCanvas.height = WIDTH;
                    const tmpCtx = tmpCanvas.getContext('2d');
                    tmpCtx.drawImage(img, 0, 0, WIDTH, WIDTH);
                    imageContext = tmpCtx;
                    resolve();
                };
                img.onerror = reject;
                img.src = src;
            });
        }
